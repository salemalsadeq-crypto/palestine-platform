<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>لوحة المدير | فلسطين بلاتفورم</title><link rel="stylesheet" href="app.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f3f7fb;color:#172033;font-family:Tajawal,Tahoma,Arial,sans-serif}
.adm-top{background:linear-gradient(135deg,#123b68,#2878bc);color:#fff}
.adm-top .in{max-width:1100px;margin:auto;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.adm-top b{font-size:18px;display:block}.adm-top small{display:block;opacity:.88;font-size:12.5px;margin-top:2px}
.adm-top a{color:#fff;background:#ffffff22;padding:9px 14px;border-radius:12px;text-decoration:none;font-weight:800;font-size:14px;white-space:nowrap}
.adm-wrap{max-width:1100px;margin:0 auto;padding:16px 16px 100px;display:grid;gap:16px}
.adm-stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.adm-stat{background:#fff;border:1px solid #e1e9f1;border-radius:16px;padding:12px;text-align:center;font-size:13px;color:#52667d;box-shadow:0 6px 18px #123b680a}
.adm-stat b{display:block;font-size:24px;color:#123b68;margin-top:2px}
.adm-links{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.adm-links a{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#fff;border:1px solid #dfe8f0;border-radius:16px;text-decoration:none;color:#173f69;font-weight:800;font-size:14.5px;box-shadow:0 6px 18px #14375510}
.adm-links a:active{transform:scale(.97)}.adm-links .ic{font-size:22px}.adm-links small{display:block;color:#718096;font-weight:600;font-size:11px;margin-top:1px}
.adm-panel{background:#fff;border:1px solid #e1e9f1;border-radius:18px;padding:14px;box-shadow:0 8px 25px #123b680b}
.adm-tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px}.adm-tabs::-webkit-scrollbar{display:none}
.adm-tabs button{flex:0 0 auto;border:0;border-radius:999px;padding:9px 16px;font:inherit;font-weight:800;font-size:14px;background:#e8eef4;color:#27445f;cursor:pointer}
.adm-tabs button.active{background:#174f86;color:#fff}
#q{width:100%;height:44px;padding:0 14px;border:1px solid #d9e3ee;border-radius:12px;font:inherit;margin-bottom:12px;background:#fff}
.adm-table{overflow-x:auto}.adm-table table{width:100%;border-collapse:collapse}
.adm-table th,.adm-table td{padding:11px;border-bottom:1px solid #edf1f5;text-align:right;font-size:14px}
.adm-table th{color:#52667d;font-size:13px;background:#f6f9fc}
.adm-table select{padding:7px 10px;border:1px solid #d9e3ee;border-radius:10px;font:inherit;background:#fff}
.adm-btn{border:0;border-radius:10px;padding:9px 14px;font:inherit;font-weight:800;font-size:14px;cursor:pointer;color:#fff}
.adm-btn.blue{background:#174f86}.adm-btn.red{background:#c62838}
.adm-badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800;background:#eef2f7;color:#52667d}
.b-active,.b-published{background:#e6f6ef;color:#087957}.b-suspended,.b-deleted,.b-rejected{background:#fdecee;color:#b51f2a}.b-pending{background:#fff4de;color:#9a6200}
.adm-empty{text-align:center;color:#718096;padding:28px 0}
.notice{padding:12px;border-radius:12px;margin:0 0 4px}.err{background:#fff0f1;color:#a51f2b}.success{background:#eaf8f2;color:#087957}
.muted{color:#718096;font-size:13px;line-height:1.8}
@media(max-width:950px){.adm-stats{grid-template-columns:repeat(3,1fr)}.adm-links{grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){.adm-table table{display:block}.adm-table thead{display:none}.adm-table tbody{display:grid;gap:10px}
.adm-table tr{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;padding:12px;border:1px solid #e1e9f1;border-radius:16px}
.adm-table td{display:block;border:0;padding:0}.adm-table td::before{content:attr(data-l);display:block;font-size:11px;color:#718096;margin-bottom:2px}
.adm-table td:first-child,.adm-table td:last-child{grid-column:1/-1}.adm-table td:last-child .adm-btn{width:100%}}
</style></head><body>
<div class="adm-top"><div class="in"><div><b>👑 لوحة المدير</b><small id="who">جاري التحقق من الصلاحية...</small></div><a href="index.html">الرئيسية</a></div></div>
<div class="adm-wrap"><div id="notice"></div>
<div class="adm-stats"><div class="adm-stat">👥 المستخدمون<b id="uc">—</b></div><div class="adm-stat">📢 الإعلانات<b id="ac">—</b></div><div class="adm-stat">📍 الأماكن<b id="pc">—</b></div><div class="adm-stat">🚩 البلاغات<b id="rc">—</b></div><div class="adm-stat">💳 الاشتراكات<b id="sc">—</b></div><div class="adm-stat">⏳ إلغاءات<b id="cc">—</b></div></div>
<div class="adm-links"><a href="admin-subscriptions.html"><span class="ic">💳</span><span>الاشتراكات<small>تفعيل وإلغاء</small></span></a><a href="orders-admin.html"><span class="ic">📦</span><span>الطلبات<small>المبيعات والتوصيل</small></span></a><a href="service-provider-browse.html"><span class="ic">🚕</span><span>الخدمات<small>مقدمو الخدمات</small></span></a><a href="notifications.html"><span class="ic">🔔</span><span>الإشعارات<small>التنبيهات</small></span></a><a href="moderation.html"><span class="ic">🛡️</span><span>الثقة والسلامة<small>البلاغات والتدقيق</small></span></a></div>
<div class="adm-panel"><div class="adm-tabs"><button class="active" data-tab="users">👥 المستخدمون</button><button data-tab="ads">📢 الإعلانات</button><button data-tab="places">📍 الأماكن</button><button data-tab="roles">🔐 الصلاحيات</button></div>
<input id="q" placeholder="🔎 ابحث بالاسم أو الهاتف أو المدينة..." autocomplete="off"><div id="content">جاري التحميل...</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><script src="platform.js"></script><script>
const db=ppClient,$=id=>document.getElementById(id),esc=ppEsc;let tab='users',users=[],ads=[],places=[],q='';
const roles=['admin','manager','editor','moderator','places_manager','ads_manager','member'];
const labels={admin:'مدير عام',manager:'مدير',editor:'محرر',moderator:'مشرف',places_manager:'مدير المواقع',ads_manager:'مدير الإعلانات',member:'عضو'};
const ST={active:'نشط',suspended:'موقوف',pending:'قيد المراجعة',published:'منشور',hidden:'مخفي',deleted:'محذوف',rejected:'مرفوض',sold:'مباع'};
const badge=s=>'<span class="adm-badge b-'+esc(s||'active')+'">'+esc(ST[s]||s||'—')+'</span>';
const flt=(a,k)=>q?a.filter(x=>k.some(c=>String(x[c]??'').toLowerCase().includes(q))):a;
const td=(l,v)=>'<td data-l="'+l+'">'+v+'</td>';
const tbl=(h,rows)=>rows.length?'<div class="adm-table"><table><thead><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>':'<div class="adm-empty">لا توجد نتائج.</div>';
function note(t,ok=false){$('notice').innerHTML='<div class="notice '+(ok?'success':'err')+'">'+esc(t)+'</div>';setTimeout(()=>{$('notice').innerHTML=''},3500)}
async function guard(){const u=await ppRequire('manage_users');if(!u)return null;const p=await ppProfile(u.id);if(!p||p.status!=='active')return null;$('who').textContent='مرحبًا '+(p.full_name||'مدير');return u}async function load(){if(!(await guard()))return;const [u,a,p,s,c]=await Promise.all([db.from('profiles').select('id,full_name,phone,city,role,status,created_at').order('created_at',{ascending:false}),db.from('ads').select('id,title,category,city,price,user_id,status,video_url,created_at').order('created_at',{ascending:false}),db.from('places').select('id,name,category,city,status,user_id,created_at').order('created_at',{ascending:false}),db.from('subscriptions').select('id,status').eq('status','active'),db.from('subscription_cancellation_requests').select('id,status').eq('status','pending')]);users=u.data||[];ads=a.data||[];places=p.data||[];$('uc').textContent=users.length;$('ac').textContent=ads.length;$('pc').textContent=places.length;$('sc').textContent=(s.data||[]).length;$('cc').textContent=(c.data||[]).length;const r=await db.from('ad_reports').select('id',{count:'exact',head:true}).eq('status','pending');$('rc').textContent=r.count??0;render()}function render(){$('q').style.display=tab==='roles'?'none':'';({users:renderUsers,ads:renderAds,places:renderPlaces,roles:renderRoles})[tab]()}
function renderUsers(){$('content').innerHTML=tbl(['الاسم','الهاتف','المدينة','الدور','الحالة','إجراء'],flt(users,['full_name','phone','city','role']).map(u=>'<tr>'+td('الاسم','<b>'+esc(u.full_name||'مستخدم')+'</b>')+td('الهاتف',esc(u.phone||'—'))+td('المدينة',esc(u.city||'—'))+td('الدور','<select data-act="role" data-id="'+esc(u.id)+'">'+roles.map(r=>'<option value="'+r+'" '+(r===u.role?'selected':'')+'>'+labels[r]+'</option>').join('')+'</select>')+td('الحالة',badge(u.status))+td('إجراء','<button class="adm-btn '+(u.status==='active'?'red':'blue')+'" data-act="status" data-id="'+esc(u.id)+'" data-v="'+(u.status==='active'?'suspended':'active')+'">'+(u.status==='active'?'إيقاف':'تفعيل')+'</button>')+'</tr>'))}
async function changeRole(id,role){if(!confirm('تأكيد تغيير الدور؟')){renderUsers();return}const r=await db.rpc('admin_set_user_role',{target_user_id:id,new_role:role});if(r.error){note(r.error.message);return}note('تم تغيير الدور',true);load()}async function changeStatus(id,status){if(!confirm(status==='suspended'?'إيقاف المستخدم؟':'تفعيل المستخدم؟'))return;const r=await db.rpc('admin_set_user_status',{target_user_id:id,new_status:status});if(r.error){note(r.error.message);return}note('تم تحديث الحالة',true);load()}function renderAds(){$('content').innerHTML=tbl(['الإعلان','التصنيف','المدينة','الحالة','فيديو'],flt(ads,['title','category','city','status']).map(a=>'<tr>'+td('الإعلان','<a href="ad-details.html?id='+encodeURIComponent(a.id)+'">'+esc(a.title)+'</a>')+td('التصنيف',esc(a.category||'—'))+td('المدينة',esc(a.city||'—'))+td('الحالة',badge(a.status))+td('فيديو',a.video_url?'🎬':'—')+'</tr>'))}
function renderPlaces(){$('content').innerHTML=tbl(['المكان','التصنيف','المدينة','الحالة'],flt(places,['name','category','city','status']).map(p=>'<tr>'+td('المكان','<b>'+esc(p.name)+'</b>')+td('التصنيف',esc(p.category||'—'))+td('المدينة',esc(p.city||'—'))+td('الحالة',badge(p.status))+'</tr>'))}
function renderRoles(){$('content').innerHTML=tbl(['الدور','الرمز'],roles.map(r=>'<tr>'+td('الدور','<b>'+labels[r]+'</b>')+td('الرمز',r)+'</tr>'))+'<p class="muted">الصلاحيات الفعلية محفوظة في قاعدة البيانات. إدارة الاشتراكات مخصصة للمدير العام.</p>'}
$('content').addEventListener('change',e=>{const t=e.target;if(t.dataset.act==='role')changeRole(t.dataset.id,t.value)});
$('content').addEventListener('click',e=>{const t=e.target.closest('[data-act="status"]');if(t)changeStatus(t.dataset.id,t.dataset.v)});
$('q').oninput=e=>{q=e.target.value.trim().toLowerCase();render()};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;render()});
load();
</script><script src="app-ui.js?v=84" defer></script></body></html>
