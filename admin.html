<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدير المشروع - فلسطين بلاتفورم</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma;background:#f4f6f9;color:#172033}header{background:#173b68;color:#fff;padding:14px 20px}.head{max-width:1200px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.logo{font-size:22px;font-weight:bold}.logo span{color:#b51f2a}nav a{color:#fff;text-decoration:none;margin:3px;padding:8px 10px;background:#234d7e;border-radius:8px;font-size:13px}.wrap{max-width:1200px;margin:25px auto;padding:0 15px}.box{background:#fff;border-radius:15px;padding:18px;box-shadow:0 3px 14px #0001;margin-bottom:18px}.title{margin-top:0}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:18px;border-radius:12px;background:#f7f9fc;border:1px solid #e5e9ef}.stat b{display:block;font-size:27px;margin-top:8px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.tabs button{border:0;padding:10px 14px;border-radius:9px;background:#e8edf4;cursor:pointer;font-weight:bold}.tabs button.active{background:#173b68;color:#fff}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select{padding:10px;border:1px solid #d8dee8;border-radius:8px;min-width:180px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:750px}th,td{padding:11px;border-bottom:1px solid #edf0f4;text-align:right;vertical-align:top}th{background:#f7f9fc}.badge{display:inline-block;padding:5px 8px;border-radius:7px;font-size:12px}.active{background:#e8f5e9;color:#237b2a}.suspended,.hidden,.dismissed{background:#ffebee;color:#b42318}.pending{background:#fff4d6;color:#8a5a00}.visible,.reviewed{background:#e8f5e9;color:#237b2a}.actions{display:flex;gap:6px;flex-wrap:wrap}.btn{border:0;border-radius:7px;padding:7px 10px;cursor:pointer;font-weight:bold}.blue{background:#173b68;color:#fff}.red{background:#b51f2a;color:#fff}.gray{background:#e9edf2;color:#222}.msg{text-align:center;padding:35px;color:#687386}.error{color:#b42318;background:#fff0f0;padding:12px;border-radius:8px;margin-bottom:12px}.success{color:#237b2a;background:#e8f5e9;padding:12px;border-radius:8px;margin-bottom:12px}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:50;padding:20px}.modalbox{max-width:600px;margin:40px auto;background:#fff;border-radius:15px;padding:20px}.modalbox textarea{width:100%;min-height:100px;padding:10px;border:1px solid #ddd;border-radius:8px}@media(max-width:850px){.cards{grid-template-columns:1fr 1fr}}@media(max-width:520px){.cards{grid-template-columns:1fr}.wrap{padding:0 10px}}
</style></head><body><header><div class="head"><div class="logo">فلسطين <span>بلاتفورم</span> — المدير</div><nav><a href="index.html">الرئيسية</a><a href="ads.html">الإعلانات</a><a href="account.html">حسابي</a><a href="#" id="logout">خروج</a></nav></div></header><main class="wrap"><div id="notice"></div><section class="box"><h1 class="title">🛡️ لوحة مدير المشروع</h1><p>إدارة المستخدمين والإعلانات والبلاغات والتقييمات من مكان واحد.</p><div class="cards"><div class="stat">👥 المستخدمون<b id="usersCount">—</b></div><div class="stat">📢 الإعلانات<b id="adsCount">—</b></div><div class="stat">🚩 البلاغات المعلقة<b id="reportsCount">—</b></div><div class="stat">⭐ التقييمات<b id="reviewsCount">—</b></div></div></section><section class="box"><div class="tabs"><button class="active" data-tab="users">👥 المستخدمون</button><button data-tab="ads">📢 الإعلانات</button><button data-tab="reports">🚩 البلاغات</button><button data-tab="reviews">⭐ التقييمات</button></div><div id="content"></div></section></main><div id="modal" class="modal"><div class="modalbox"><h3 id="modalTitle">تفاصيل</h3><div id="modalBody"></div><button class="btn gray" onclick="closeModal()">إغلاق</button></div></div><script>const SUPABASE_URL='https://sesbumfedusbjevbsyzl.supabase.co',KEY='sb_publishable_0sJrbh73jLip3O5OtJkc_A_9F6OPWqR',db=supabase.createClient(SUPABASE_URL,KEY);let tab='users',cache={users:[],ads:[],reports:[],reviews:[]};const $=id=>document.getElementById(id);function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function note(t,ok=false){$('notice').innerHTML='<div class="'+(ok?'success':'error')+'">'+esc(t)+'</div>';setTimeout(()=>$('notice').innerHTML='',3500)}function badge(s){return '<span class="badge '+esc(s)+'">'+esc(s)+'</span>'}function closeModal(){$('modal').style.display='none'}function openModal(title,html){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modal').style.display='block'}async function guard(){const g=await db.rpc('is_admin');if(g.error||g.data!==true){$('content').innerHTML='<div class="msg">⛔ هذه الصفحة مخصصة لمدير المشروع فقط.<br><br><a class="btn blue" href="index.html">العودة للرئيسية</a></div>';return false}return true}async function loadAll(){const [u,a,r,v]=await Promise.all([db.from('profiles').select('id,full_name,phone,city,role,status,created_at').order('created_at',{ascending:false}),db.from('ads').select('id,title,category,city,price,user_id,status,created_at').order('created_at',{ascending:false}),db.from('ad_reports').select('id,ad_id,reporter_id,reason,details,status,admin_note,created_at').order('created_at',{ascending:false}),db.from('ad_reviews').select('id,ad_id,reviewer_id,owner_id,rating,review,status,created_at').order('created_at',{ascending:false})]);cache.users=u.data||[];cache.ads=a.data||[];cache.reports=r.data||[];cache.reviews=v.data||[];$('usersCount').textContent=cache.users.length;$('adsCount').textContent=cache.ads.length;$('reportsCount').textContent=cache.reports.filter(x=>x.status==='pending').length;$('reviewsCount').textContent=cache.reviews.length;render()}function render(){if(tab==='users')renderUsers();if(tab==='ads')renderAds();if(tab==='reports')renderReports();if(tab==='reviews')renderReviews()}function renderUsers(){const rows=cache.users.map(u=>`<tr><td>${esc(u.full_name||'مستخدم')}</td><td>${esc(u.phone||'—')}</td><td>${esc(u.city||'—')}</td><td>${badge(u.role||'user')}</td><td>${badge(u.status||'active')}</td><td><div class="actions">${u.role!=='admin'?`<button class="btn blue" onclick="setRole('${u.id}','admin')">ترقية مدير</button>`:`<button class="btn gray" onclick="setRole('${u.id}','user')">إلغاء المدير</button>`}${u.status==='active'?`<button class="btn red" onclick="setStatus('${u.id}','suspended')">إيقاف</button>`:`<button class="btn blue" onclick="setStatus('${u.id}','active')">تفعيل</button>`}</div></td></tr>`).join('');$('content').innerHTML=`<div class="toolbar"><input id="userSearch" placeholder="بحث بالاسم أو الهاتف أو المدينة"><select id="userFilter"><option value="">كل المستخدمين</option><option value="active">نشطون</option><option value="suspended">موقوفون</option><option value="admin">مديرون</option></select></div><div class="table-wrap"><table><thead><tr><th>الاسم</th><th>الهاتف</th><th>المدينة</th><th>الدور</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody id="userRows">${rows}</tbody></table></div>`;['userSearch','userFilter'].forEach(id=>$(id).oninput=filterUsers)}function filterUsers(){const q=$('userSearch').value.trim().toLowerCase(),f=$('userFilter').value;document.querySelectorAll('#userRows tr').forEach(tr=>{const t=tr.textContent.toLowerCase();const okq=!q||t.includes(q),okf=!f||t.includes(f);tr.style.display=okq&&okf?'':'none'})}async function setRole(id,role){const r=await db.from('profiles').update({role}).eq('id',id);if(r.error)return note(r.error.message);await loadAll();note('تم تحديث دور المستخدم',true)}async function setStatus(id,status){const r=await db.from('profiles').update({status}).eq('id',id);if(r.error)return note(r.error.message);await loadAll();note(status==='suspended'?'تم إيقاف المستخدم':'تم تفعيل المستخدم',true)}function renderAds(){const rows=cache.ads.map(a=>`<tr><td>${esc(a.title)}</td><td>${esc(a.category)}</td><td>${esc(a.city||'—')}</td><td>${a.price==null?'—':Number(a.price).toLocaleString('ar-PS')}</td><td>${badge(a.status||'active')}</td><td><div class="actions"><a class="btn blue" href="ad-details.html?id=${encodeURIComponent(a.id)}">عرض</a>${a.status==='active'?`<button class="btn red" onclick="setAdStatus('${a.id}','hidden')">إخفاء</button>`:`<button class="btn blue" onclick="setAdStatus('${a.id}','active')">تفعيل</button>`}</div></td></tr>`).join('');$('content').innerHTML=`<div class="toolbar"><input id="adSearch" placeholder="بحث بعنوان الإعلان أو المدينة"><select id="adFilter"><option value="">كل الحالات</option><option>active</option><option>hidden</option><option>deleted</option></select></div><div class="table-wrap"><table><thead><tr><th>الإعلان</th><th>القسم</th><th>المدينة</th><th>السعر</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody id="adRows">${rows}</tbody></table></div>`;['adSearch','adFilter'].forEach(id=>$(id).oninput=filterAds)}function filterAds(){const q=$('adSearch').value.trim().toLowerCase(),f=$('adFilter').value;document.querySelectorAll('#adRows tr').forEach(tr=>{const t=tr.textContent.toLowerCase();tr.style.display=(!q||t.includes(q))&&(!f||t.includes(f))?'':'none'})}async function setAdStatus(id,status){const r=await db.from('ads').update({status}).eq('id',id);if(r.error)return note(r.error.message);await loadAll();note('تم تحديث حالة الإعلان',true)}function renderReports(){const rows=cache.reports.map(r=>`<tr><td>${esc(r.reason)}</td><td>${esc(r.details||'—')}</td><td>${esc(r.ad_id)}</td><td>${badge(r.status||'pending')}</td><td>${new Date(r.created_at).toLocaleDateString('ar-PS')}</td><td><div class="actions"><button class="btn blue" onclick="showReport('${r.id}')">تفاصيل</button>${r.status==='pending'?`<button class="btn gray" onclick="setReportStatus('${r.id}','dismissed')">رفض البلاغ</button><button class="btn blue" onclick="setReportStatus('${r.id}','reviewed')">تمت المراجعة</button>`:''}</div></td></tr>`).join('');$('content').innerHTML=`<div class="table-wrap"><table><thead><tr><th>السبب</th><th>التفاصيل</th><th>الإعلان</th><th>الحالة</th><th>التاريخ</th><th>إجراءات</th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="msg">لا توجد بلاغات.</td></tr>'}</tbody></table></div>`}function showReport(id){const r=cache.reports.find(x=>x.id===id);if(!r)return;openModal('تفاصيل البلاغ',`<p><b>السبب:</b> ${esc(r.reason)}</p><p><b>التفاصيل:</b> ${esc(r.details||'لا يوجد')}</p><p><b>الإعلان:</b> <a href="ad-details.html?id=${encodeURIComponent(r.ad_id)}">فتح الإعلان</a></p><p><b>الحالة:</b> ${badge(r.status)}</p>`)}async function setReportStatus(id,status){const r=await db.from('ad_reports').update({status,resolved_at:new Date().toISOString()}).eq('id',id);if(r.error)return note(r.error.message);await loadAll();note('تم تحديث البلاغ',true)}function renderReviews(){const rows=cache.reviews.map(r=>`<tr><td>${'★'.repeat(r.rating)+'☆'.repeat(5-r.rating)}</td><td>${esc(r.review||'بدون نص')}</td><td>${esc(r.ad_id)}</td><td>${badge(r.status||'visible')}</td><td>${new Date(r.created_at).toLocaleDateString('ar-PS')}</td><td>${r.status==='visible'?`<button class="btn red" onclick="setReviewStatus('${r.id}','hidden')">إخفاء</button>`:`<button class="btn blue" onclick="setReviewStatus('${r.id}','visible')">إظهار</button>`}</td></tr>`).join('');$('content').innerHTML=`<div class="table-wrap"><table><thead><tr><th>التقييم</th><th>المراجعة</th><th>الإعلان</th><th>الحالة</th><th>التاريخ</th><th>إجراءات</th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="msg">لا توجد تقييمات.</td></tr>'}</tbody></table></div>`}async function setReviewStatus(id,status){const r=await db.from('ad_reviews').update({status}).eq('id',id);if(r.error)return note(r.error.message);await loadAll();note('تم تحديث التقييم',true)}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=async()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;render()});$('logout').onclick=async e=>{e.preventDefault();await db.auth.signOut();location.href='index.html'};(async()=>{if(await guard())await loadAll()})();</script></body></html>
