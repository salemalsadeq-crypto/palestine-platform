<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة الإدارة | فلسطين بلاتفورم</title><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="theme-v47.css"><link rel="stylesheet" href="theme-v48.css">
<style>
.admin-page{max-width:1280px;margin:auto;padding:22px 14px 50px}.admin-hero{border-radius:26px;padding:24px;color:#fff;background:linear-gradient(135deg,#0b4b31,#12633f 55%,#2a9565);box-shadow:0 18px 45px rgba(12,84,53,.16)}.admin-hero h1{margin:0 0 6px;font-size:30px}.admin-hero p{margin:0;color:#e5f4eb}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:18px 0}.stat{padding:17px;border-radius:18px;background:#fff;border:1px solid #e8e2d6;box-shadow:0 10px 30px rgba(20,55,39,.07)}.stat span{display:block;color:#6e756f;font-size:12px}.stat b{display:block;font-size:26px;margin-top:7px;color:#12633f}.admin-tools{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.admin-tool{display:block;text-decoration:none;color:#1d2822;background:#fff;border:1px solid #e8e2d6;border-radius:18px;padding:16px;box-shadow:0 10px 30px rgba(20,55,39,.07)}.admin-tool:hover{transform:translateY(-2px);box-shadow:0 16px 38px rgba(20,55,39,.12)}.admin-tool strong{display:block;color:#12633f;font-size:15px}.admin-tool small{display:block;color:#6e756f;line-height:1.7;margin-top:5px}.panel{background:#fff;border:1px solid #e8e2d6;border-radius:22px;padding:16px;box-shadow:0 12px 34px rgba(20,55,39,.08)}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:4px;margin-bottom:14px}.tabs button{white-space:nowrap;border:1px solid #e8e2d6;background:#f7f5ef;color:#365143;padding:10px 14px;border-radius:12px;font-weight:900;cursor:pointer}.tabs button.active{background:#12633f;color:#fff;border-color:#12633f}.table{overflow:auto}table{width:100%;min-width:900px;border-collapse:collapse}th,td{padding:11px;text-align:right;border-bottom:1px solid #eeeae2;vertical-align:middle}th{background:#f5f7f3;color:#31503e}.btn{border:0;padding:9px 12px;border-radius:11px;font-weight:900;cursor:pointer}.btn.red{background:#b52b32;color:#fff}.btn.green{background:#12633f;color:#fff}.btn.soft{background:#edf6f0;color:#12633f}.notice{padding:12px;border-radius:13px;margin:12px 0}.success{background:#eaf7ef;color:#0a6a43}.err{background:#fff0f1;color:#a51f2b}.muted{color:#6e756f;font-size:12px;line-height:1.7}.role-select{min-width:145px;padding:8px;border:1px solid #ddd6c9;border-radius:10px;background:#fff}.blocked{opacity:.5;cursor:not-allowed}@media(max-width:1050px){.stats{grid-template-columns:repeat(3,1fr)}.admin-tools{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.stats{grid-template-columns:repeat(2,1fr)}.admin-tools{grid-template-columns:1fr}.admin-hero h1{font-size:25px}}
</style></head><body><header><div class="head"><a class="logo" href="index.html">فلسطين <span>بلاتفورم</span></a><div class="account"></div></div></header>
<main class="admin-page"><section class="admin-hero"><h1>👑 مركز الإدارة</h1><p id="who">جاري التحقق من الصلاحية...</p></section><div id="notice"></div>
<section class="stats"><div class="stat"><span>👥 المستخدمون</span><b id="uc">—</b></div><div class="stat"><span>📢 الإعلانات</span><b id="ac">—</b></div><div class="stat"><span>📍 الأماكن</span><b id="pc">—</b></div><div class="stat"><span>🚩 البلاغات</span><b id="rc">—</b></div><div class="stat"><span>💳 الاشتراكات</span><b id="sc">—</b></div><div class="stat"><span>⏳ الإلغاءات</span><b id="cc">—</b></div></section>
<section id="adminTools" class="admin-tools"></section>
<section class="panel"><div class="tabs"><button class="active" data-tab="users">👥 المستخدمون</button><button data-tab="ads">📢 الإعلانات</button><button data-tab="places">📍 الأماكن</button><button data-tab="roles">🔐 الصلاحيات</button></div><div id="content">جاري التحميل...</div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><script src="platform.js"></script><script>
const db=ppClient,$=id=>document.getElementById(id),esc=ppEsc;let tab='users',users=[],ads=[],places=[],actor=null,perms={};
const roles=['admin','manager','editor','moderator','places_manager','ads_manager','member','user'];
const labels={admin:'مدير عام',manager:'مدير',editor:'محرر',moderator:'مشرف',places_manager:'مدير المواقع',ads_manager:'مدير الإعلانات',member:'عضو',user:'مستخدم'};
function note(t,ok=false){$('notice').innerHTML='<div class="notice '+(ok?'success':'err')+'">'+esc(t)+'</div>';setTimeout(()=>{$('notice').innerHTML=''},3500)}
async function can(p){if(perms[p]!==undefined)return perms[p];perms[p]=await ppCan(p);return perms[p]}
async function guard(){const u=await ppRequire('manage_users');if(!u)return null;actor=await ppProfile(u.id);if(!actor||actor.status!=='active')return null;$('who').textContent='مرحبًا '+(actor.full_name||'مدير')+' • '+(labels[actor.role]||actor.role);return u}
function tool(h,icon,title,desc,ok=true){return ok?'<a class="admin-tool" href="'+h+'"><span style="font-size:25px">'+icon+'</span><strong>'+title+'</strong><small>'+desc+'</small></a>':''}
async function renderTools(){const [orders,reports,subs,ads,places]=await Promise.all([can('manage_orders'),can('manage_reports'),can('manage_subscriptions'),can('manage_ads'),can('manage_places')]);$('adminTools').innerHTML=tool('orders-admin.html','📦','إدارة الطلبات','الطلبات والتوصيل وتحديث الحالات',orders)+tool('moderation.html','🛡️','الثقة والسلامة','البلاغات والتدقيق والتوثيق',reports)+tool('admin-subscriptions.html','💳','إدارة الاشتراكات','طلبات الاشتراك والإلغاء',subs)+tool('ads.html','📢','الإعلانات','عرض ومراجعة الإعلانات',ads)+tool('places.html','📍','الأماكن','إدارة دليل الأماكن',places);}
async function load(){if(!(await guard()))return;await renderTools();const q=[];q.push(db.from('profiles').select('id,full_name,phone,city,role,status,created_at,is_verified,trust_score').order('created_at',{ascending:false}).limit(500));q.push(can('manage_ads').then(ok=>ok?db.from('ads').select('id,title,category,city,price,user_id,status,video_url,created_at').order('created_at',{ascending:false}).limit(500):{data:[]}));q.push(can('manage_places').then(ok=>ok?db.from('places').select('id,name,category,city,status,user_id,created_at').order('created_at',{ascending:false}).limit(500):{data:[]}));q.push(can('manage_subscriptions').then(ok=>ok?db.from('subscriptions').select('id,status').eq('status','active'): {data:[]}));q.push(can('manage_subscriptions').then(ok=>ok?db.from('subscription_cancellation_requests').select('id,status').eq('status','pending'):{data:[]}));const [u,a,p,s,c]=await Promise.all(q);if(u.error){note(u.error.message);return}users=u.data||[];ads=a.data||[];places=p.data||[];$('uc').textContent=users.length;$('ac').textContent=ads.length;$('pc').textContent=places.length;$('sc').textContent=(s.data||[]).length;$('cc').textContent=(c.data||[]).length;if(await can('manage_reports')){const r=await db.from('ad_reports').select('id',{count:'exact',head:true}).eq('status','pending');$('rc').textContent=r.count??0}else $('rc').textContent='—';render()}
function render(){if(tab==='users')renderUsers();if(tab==='ads')renderAds();if(tab==='places')renderPlaces();if(tab==='roles')renderRoles()}
function allowedRoles(){if(actor?.role==='admin')return roles;if(actor?.role==='manager')return roles.filter(r=>!['admin','manager'].includes(r));return roles.filter(r=>r==='member'||r==='user')}
function renderUsers(){if(!perms.manage_users){$('content').innerHTML='<div class="muted">لا تملك صلاحية إدارة المستخدمين.</div>';return}const opts=allowedRoles();const rows=users.map(u=>'<tr><td><b>'+esc(u.full_name||'مستخدم')+'</b>'+(u.is_verified?' <span class="badge">موثق</span>':'')+'</td><td>'+esc(u.phone||'—')+'</td><td>'+esc(u.city||'—')+'</td><td><select class="role-select" onchange="changeRole(\''+u.id+'\',this.value)" '+(actor?.role==='manager'&&['admin','manager'].includes(u.role)?'disabled':'')+'>'+opts.map(r=>'<option value="'+r+'" '+(r===u.role?'selected':'')+'>'+labels[r]+'</option>').join('')+'</select></td><td>'+esc(u.status||'active')+'</td><td><button class="btn '+(u.status==='active'?'red':'green')+'" onclick="changeStatus(\''+u.id+'\',\''+(u.status==='active'?'suspended':'active')+'\')">'+(u.status==='active'?'إيقاف':'تفعيل')+'</button></td></tr>').join('');$('content').innerHTML='<div class="table"><table><thead><tr><th>المستخدم</th><th>الهاتف</th><th>المدينة</th><th>الدور</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody>'+rows+'</tbody></table></div>'}
async function changeRole(id,role){if(!perms.manage_roles){note('لا تملك صلاحية إدارة الأدوار');renderUsers();return}if(!confirm('تأكيد تغيير الدور إلى '+(labels[role]||role)+'؟')){renderUsers();return}const r=await db.rpc('admin_set_user_role',{target_user_id:id,new_role:role});if(r.error){note(r.error.message);return}note('تم تغيير الدور بنجاح',true);load()}
async function changeStatus(id,status){if(!perms.manage_users)return;if(!confirm(status==='suspended'?'إيقاف المستخدم؟':'تفعيل المستخدم؟'))return;const r=await db.rpc('admin_set_user_status',{target_user_id:id,new_status:status});if(r.error){note(r.error.message);return}note('تم تحديث حالة المستخدم',true);load()}
function renderAds(){if(!perms.manage_ads&&!perms.moderate_ads){$('content').innerHTML='<div class="muted">لا تملك صلاحية إدارة الإعلانات.</div>';return}$('content').innerHTML='<div class="table"><table><thead><tr><th>الإعلان</th><th>التصنيف</th><th>المدينة</th><th>الحالة</th><th>فيديو</th></tr></thead><tbody>'+ads.map(a=>'<tr><td><a href="ad-details.html?id='+encodeURIComponent(a.id)+'">'+esc(a.title)+'</a></td><td>'+esc(a.category||'')+'</td><td>'+esc(a.city||'')+'</td><td>'+esc(a.status||'')+'</td><td>'+(a.video_url?'🎬':'—')+'</td></tr>').join('')+'</tbody></table></div>'}
function renderPlaces(){if(!perms.manage_places){$('content').innerHTML='<div class="muted">لا تملك صلاحية إدارة الأماكن.</div>';return}$('content').innerHTML='<div class="table"><table><thead><tr><th>المكان</th><th>التصنيف</th><th>المدينة</th><th>الحالة</th></tr></thead><tbody>'+places.map(p=>'<tr><td>'+esc(p.name)+'</td><td>'+esc(p.category||'')+'</td><td>'+esc(p.city||'')+'</td><td>'+esc(p.status||'')+'</td></tr>').join('')+'</tbody></table></div>'}
function renderRoles(){if(!perms.manage_roles){$('content').innerHTML='<div class="muted">لا تملك صلاحية إدارة الأدوار.</div>';return}const matrix={admin:['كل الصلاحيات'],manager:['المستخدمون','الأدوار','الإعلانات','الأماكن','البلاغات','الطلبات'],editor:['نشر ومراجعة الإعلانات'],moderator:['مراجعة الإعلانات والبلاغات'],places_manager:['الأماكن ونشرها'],ads_manager:['الإعلانات والفيديو'],member:['النشر الأساسي'],user:['حساب أساسي']};$('content').innerHTML='<div class="table"><table><thead><tr><th>الدور</th><th>النطاق</th></tr></thead><tbody>'+roles.map(r=>'<tr><td><b>'+labels[r]+'</b></td><td>'+esc(matrix[r].join(' • '))+'</td></tr>').join('')+'</tbody></table></div><p class="muted">الحماية الحقيقية موجودة في RLS وRPC داخل Supabase؛ هذه الصفحة تعرض وتضبط الواجهة فقط.</p>'}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;render()});load();
</script></body></html>
