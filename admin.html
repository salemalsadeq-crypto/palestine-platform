<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة الإدارة | فلسطين بلاتفورم</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f6f9;color:#172033}.head{background:#173b68;color:#fff;padding:14px}.headin{max-width:1250px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.head a{color:#fff;text-decoration:none;background:#234d7e;padding:8px;border-radius:8px}.wrap{max-width:1250px;margin:20px auto;padding:0 12px}.box{background:#fff;padding:18px;border-radius:14px;margin-bottom:16px;box-shadow:0 2px 12px #0001}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.stat{padding:15px;background:#f7f9fc;border-radius:10px;text-align:center}.stat b{display:block;font-size:25px;margin-top:6px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.tabs button,.btn{border:0;border-radius:8px;padding:9px 12px;cursor:pointer;font-weight:bold}.tabs button.active,.blue{background:#173b68;color:#fff}.red{background:#b51f2a;color:#fff}.gray{background:#e9edf2}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:800px}th,td{padding:10px;border-bottom:1px solid #eee;text-align:right}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.toolbar input,.toolbar select{padding:10px;border:1px solid #ddd;border-radius:8px}.msg{padding:20px;text-align:center}.ok{color:#237b2a}.err{color:#b42318}@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.stats{grid-template-columns:1fr}}</style><link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="theme-v47.css"><link rel="stylesheet" href="theme-v48.css"></head><body><header class="head"><div class="headin"><b>👑 فلسطين بلاتفورم — لوحة الإدارة</b><div><a href="index.html">الرئيسية</a> <a href="map.html">الخريطة</a></div></div></header><main class="wrap"><div id="notice"></div><section class="box"><h2>لوحة التحكم</h2><div class="stats"><div class="stat">👥 المستخدمون<b id="uc">—</b></div><div class="stat">📢 الإعلانات<b id="ac">—</b></div><div class="stat">📍 الأماكن<b id="pc">—</b></div><div class="stat">🚩 البلاغات<b id="rc">—</b></div><div class="stat">🎬 فيديوهات<b id="vc">—</b></div></div></section><section class="box"><div class="tabs"><button class="active" data-tab="users">👥 المستخدمون</button><button data-tab="ads">📢 الإعلانات</button><button data-tab="places">📍 الأماكن</button><button data-tab="roles">🔐 الصلاحيات</button></div><div id="content"><div class="msg">جاري التحميل...</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><script src="platform.js"></script><script>
const db=ppClient,$=id=>document.getElementById(id),esc=ppEsc;let tab='users',users=[],ads=[],places=[];const roles=['admin','manager','editor','moderator','places_manager','ads_manager','member'];const labels={admin:'مدير عام',manager:'مدير',editor:'محرر',moderator:'مشرف',places_manager:'مدير المواقع',ads_manager:'مدير الإعلانات',member:'عضو'};
function note(t,ok=false){$('notice').innerHTML='<div class="box '+(ok?'ok':'err')+'">'+esc(t)+'</div>';setTimeout(()=>$('notice').innerHTML='',3000)}
async function guard(){const u=await ppRequire('manage_users');if(!u)return false;const p=await ppProfile(u.id);if(p?.status!=='active')return false;return true}
async function load(){if(!(await guard()))return;const [u,a,p]=await Promise.all([db.from('profiles').select('id,full_name,phone,city,role,status,created_at').order('created_at',{ascending:false}),db.from('ads').select('id,title,category,city,price,user_id,status,video_url,created_at').order('created_at',{ascending:false}),db.from('places').select('id,name,category,city,status,user_id,created_at').order('created_at',{ascending:false})]);users=u.data||[];ads=a.data||[];places=p.data||[];$('uc').textContent=users.length;$('ac').textContent=ads.length;$('pc').textContent=places.length;const {count}=await db.from('ad_reports').select('id',{count:'exact',head:true}).eq('status','pending');$('rc').textContent=count??0;$('vc').textContent=ads.filter(x=>x.video_url).length;render()}
function render(){if(tab==='users')renderUsers();if(tab==='ads')renderAds();if(tab==='places')renderPlaces();if(tab==='roles')renderRoles()}
function renderUsers(){const rows=users.map(u=>`<tr><td>${esc(u.full_name||'مستخدم')}</td><td>${esc(u.phone||'—')}</td><td>${esc(u.city||'—')}</td><td><select onchange="changeRole('${u.id}',this.value)">${roles.map(r=>`<option value="${r}" ${r===u.role?'selected':''}>${labels[r]}</option>`).join('')}</select></td><td>${esc(u.status||'active')}</td><td><button class="btn ${u.status==='active'?'red':'blue'}" onclick="changeStatus('${u.id}','${u.status==='active'?'suspended':'active'}')">${u.status==='active'?'إيقاف':'تفعيل'}</button></td></tr>`).join('');$('content').innerHTML=`<div class="toolbar"><input id="q" placeholder="بحث"><select id="rf"><option value="">كل الأدوار</option>${roles.map(r=>`<option value="${r}">${labels[r]}</option>`).join('')}</select></div><div class="table"><table><thead><tr><th>الاسم</th><th>الهاتف</th><th>المدينة</th><th>الدور</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody>${rows}</tbody></table></div>`;$('q').oninput=filter;$('rf').onchange=filter}
function filter(){const q=$('q').value.toLowerCase(),r=$('rf').value;document.querySelectorAll('tbody tr').forEach(tr=>tr.style.display=(!q||tr.textContent.toLowerCase().includes(q))&&(!r||tr.querySelector('select')?.value===r)?'':'none')}
async function changeRole(id,role){if(!confirm('تأكيد تغيير الدور إلى '+labels[role]+'؟')){renderUsers();return}const {error}=await db.rpc('admin_set_user_role',{target_user_id:id,new_role:role});if(error){note(error.message);renderUsers();return}note('تم تغيير الدور',true);await load()}
async function changeStatus(id,status){if(!confirm(status==='suspended'?'إيقاف المستخدم؟':'تفعيل المستخدم؟'))return;const {error}=await db.rpc('admin_set_user_status',{target_user_id:id,new_status:status});if(error)return note(error.message);note('تم تحديث الحالة',true);load()}
function renderAds(){$('content').innerHTML='<div class="table"><table><thead><tr><th>الإعلان</th><th>التصنيف</th><th>المدينة</th><th>الحالة</th><th>فيديو</th></tr></thead><tbody>'+ads.map(a=>'<tr><td><a href="ad-details.html?id='+encodeURIComponent(a.id)+'">'+esc(a.title)+'</a></td><td>'+esc(a.category)+'</td><td>'+esc(a.city||'')+'</td><td>'+esc(a.status||'')+'</td><td>'+(a.video_url?'🎬 نعم':'—')+'</td></tr>').join('')+'</tbody></table></div>'}
function renderPlaces(){const rows=places.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.category||'')}</td><td>${esc(p.city||'')}</td><td>${esc(p.status||'')}</td><td>${p.status==='pending'?`<button class="btn blue" onclick="publishPlace('${p.id}')">نشر</button>`:''}</td></tr>`).join('');$('content').innerHTML=`<div class="table"><table><thead><tr><th>المكان</th><th>التصنيف</th><th>المدينة</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody>${rows}</tbody></table></div>`}
async function publishPlace(id){const {error}=await db.from('places').update({status:'published'}).eq('id',id);if(error)return note(error.message);note('تم نشر المكان',true);load()}
function renderRoles(){$('content').innerHTML='<h3>الأدوار المتاحة</h3>'+roles.map(r=>'<div class="box"><b>'+labels[r]+'</b><div style="color:#687386">'+r+'</div></div>').join('')+'<p>التفويض الحقيقي محفوظ في قاعدة البيانات وليس مجرد إخفاء أزرار الواجهة.</p>'}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;render()});load();
</script><script src="app-ui.js" defer></script>
</body></html>
