<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلباتي الخدمية</title><link rel="stylesheet" href="app.css"><style>body{background:#f5f8fc}.wrapx{max-width:900px;margin:24px auto;padding:0 15px}.card{background:#fff;border:1px solid #e1e9f1;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 8px 24px rgba(18,59,104,.06)}.top{display:flex;justify-content:space-between;gap:10px}.badge{padding:6px 10px;border-radius:999px;background:#eef5fc;color:#123b68;font-size:11px;font-weight:900}.status{font-weight:900}.muted{color:#708096;font-size:13px;line-height:1.8}.btn{display:inline-block;background:#123b68;color:#fff;text-decoration:none;padding:9px 12px;border-radius:10px;font-weight:800;margin-top:10px}.empty{text-align:center;padding:45px;background:#fff;border-radius:18px;color:#708096}</style><style>.v72-tools{background:#fff;border:1px solid #e1e9f1;border-radius:16px;padding:11px;margin:12px 0}.v72-tools input{width:100%;border:1px solid #d7e0ea;border-radius:11px;padding:11px;font:inherit}.v72-filters{display:flex;gap:6px;overflow:auto;padding:10px 0 2px}.v72-filter{white-space:nowrap;border:1px solid #dce4ed;background:#fff;color:#526176;border-radius:999px;padding:7px 10px;font-size:10px;font-weight:900;cursor:pointer}.v72-filter.active{background:#173b68;color:#fff;border-color:#173b68}</style><link rel="stylesheet" href="theme-v61.css">
</head><body><header><div style="padding:14px 16px;max-width:900px;margin:auto"><a href="services.html" style="color:#123b68;font-weight:900;text-decoration:none">← مركز الخدمات</a></div></header><main class="wrapx"><h1>📋 طلباتي الخدمية</h1><div class="v72-tools"><input id="serviceSearch" placeholder="🔎 ابحث بالمدينة أو الموقع..."><div class="v72-filters"><button class="v72-filter active" data-f="all">الكل</button><button class="v72-filter" data-f="pending">قيد الانتظار</button><button class="v72-filter" data-f="accepted">مقبول</button><button class="v72-filter" data-f="in_progress">جاري التنفيذ</button><button class="v72-filter" data-f="completed">مكتمل</button><button class="v72-filter" data-f="cancelled">ملغى</button></div></div><div id="box">جاري التحميل...</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><script src="platform.js"></script><script>
const labels={taxi:'🚕 تاكسي',delivery:'📦 توصيل',home:'🔧 خدمة منزلية',food:'🍔 طعام',transport:'🚚 نقل وشحن'};const st={pending:'قيد الانتظار',accepted:'تم قبول الطلب',in_progress:'جاري التنفيذ',completed:'مكتمل',cancelled:'ملغى'};const box=document.getElementById('box');let rows=[],filter='all',query='';
function render(){const list=rows.filter(r=>{const q=query.trim().toLowerCase();const txt=((r.city||'')+' '+(r.from_location||'')+' '+(r.to_location||'')+' '+(labels[r.type]||'')).toLowerCase();return (filter==='all'||r.status===filter)&&(!q||txt.includes(q));});if(!rows.length){box.innerHTML='<div class="empty">لا توجد طلبات خدمية بعد.<br><a class="btn" href="services.html">اطلب خدمة</a></div>';return}box.innerHTML=list.length?list.map(r=>'<article class="card"><div class="top"><b>'+labels[r.type]+'</b><span class="badge">'+(st[r.status]||r.status)+'</span></div><div class="muted">📍 '+(r.city||'')+'<br>من: '+(r.from_location||'—')+'<br>إلى: '+(r.to_location||'—')+'<br>تاريخ الطلب: '+new Date(r.created_at).toLocaleString('ar-PS')+(r.budget?' <br>💰 الميزانية: '+r.budget+' ₪':'')+'</div><a class="btn" href="'+(r.type==='taxi'?'taxi-trip.html':'service-request-trip.html')+'?id='+encodeURIComponent(r.id)+'">متابعة الحالة ←</a> '+(r.status==='pending'||r.status==='accepted'?'<button class="btn danger v72-cancel" data-id="'+r.id+'">إلغاء الطلب</button>':'')+'</article>').join(''):'<div class="empty">لا توجد طلبات بهذا التصنيف.</div>';document.querySelectorAll('.v72-cancel').forEach(b=>b.onclick=()=>cancelReq(b.dataset.id))}
async function load(){const u=await ppUser();if(!u){location.href='login.html';return}const {data,error}=await ppClient.from('service_requests').select('*').eq('requester_id',u.id).order('created_at',{ascending:false});if(error){box.textContent=error.message;return}rows=data||[];render()}
window.cancelReq=async id=>{const {error}=await ppClient.rpc('cancel_my_service_request',{p_request_id:id});if(error){alert(error.message);return}await load()};
document.getElementById('serviceSearch').oninput=e=>{query=e.target.value;render()};document.querySelectorAll('.v72-filter').forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll('.v72-filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});
load();setInterval(load,5000);
</script></body></html>
