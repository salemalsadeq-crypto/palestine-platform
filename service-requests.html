<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلباتي الخدمية</title><link rel="stylesheet" href="app.css"><style>body{background:#f5f8fc}.wrapx{max-width:900px;margin:24px auto;padding:0 15px}.card{background:#fff;border:1px solid #e1e9f1;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 8px 24px rgba(18,59,104,.06)}.top{display:flex;justify-content:space-between;gap:10px}.badge{padding:6px 10px;border-radius:999px;background:#eef5fc;color:#123b68;font-size:11px;font-weight:900}.status{font-weight:900}.muted{color:#708096;font-size:13px;line-height:1.8}.btn{display:inline-block;background:#123b68;color:#fff;text-decoration:none;padding:9px 12px;border-radius:10px;font-weight:800;margin-top:10px}.empty{text-align:center;padding:45px;background:#fff;border-radius:18px;color:#708096}</style><link rel="stylesheet" href="theme-v61.css">
</head><body><header><div style="padding:14px 16px;max-width:900px;margin:auto"><a href="services.html" style="color:#123b68;font-weight:900;text-decoration:none">← مركز الخدمات</a></div></header><main class="wrapx"><h1>📋 طلباتي الخدمية</h1><div id="box">جاري التحميل...</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><script src="platform.js"></script><script>
const labels={taxi:'🚕 تاكسي',delivery:'📦 توصيل',home:'🔧 خدمة منزلية',food:'🍔 طعام',transport:'🚚 نقل وشحن'};const st={pending:'قيد الانتظار',accepted:'تم قبول الطلب',in_progress:'جاري التنفيذ',completed:'مكتمل',cancelled:'ملغى'};const box=document.getElementById('box');(async()=>{const u=await ppUser();if(!u){location.href='login.html';return}const {data,error}=await ppClient.from('service_requests').select('*').eq('requester_id',u.id).order('created_at',{ascending:false});if(error){box.textContent=error.message;return}if(!data?.length){box.innerHTML='<div class="empty">لا توجد طلبات خدمية بعد.<br><a class="btn" href="services.html">اطلب خدمة</a></div>';return}box.innerHTML=data.map(r=>'<article class="card"><div class="top"><b>'+labels[r.type]+'</b><span class="badge">'+(st[r.status]||r.status)+'</span></div><div class="muted">📍 '+(r.city||'')+'<br>من: '+(r.from_location||'—')+'<br>إلى: '+(r.to_location||'—')+'<br>تاريخ الطلب: '+new Date(r.created_at).toLocaleString('ar-PS')+(r.budget?' <br>💰 الميزانية: '+r.budget+' ₪':'')+'</div><a class="btn" href="'+(r.type==='taxi'?'taxi-trip.html':'service-request-trip.html')+'?id='+encodeURIComponent(r.id)+'">متابعة الحالة ←</a> '+(r.status==='pending'||r.status==='accepted'?'<button class="btn danger" onclick="cancelReq(\''+r.id+'\')">إلغاء الطلب</button>':'')+'</article>').join('')})();window.cancelReq=async id=>{const {error}=await ppClient.rpc('cancel_my_service_request',{p_request_id:id});if(error){alert(error.message);return}location.reload()};
</script></body></html>
