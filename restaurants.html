<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المطاعم والمقاهي | فلسطين بلاتفورم</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#172033;font-family:Arial,Tahoma,sans-serif}a{text-decoration:none}header{background:#fff;padding:14px;box-shadow:0 2px 10px #0001}.head{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}.logo{font-size:22px;font-weight:bold;color:#173b68}.logo span{color:#b51f2a}.btn{padding:10px 13px;border-radius:9px;font-weight:bold;display:inline-block}.blue{background:#173b68;color:#fff}.red{background:#b51f2a;color:#fff}.hero{background:linear-gradient(135deg,#173b68,#255d8f);color:#fff;text-align:center;padding:38px 15px}.hero h1{margin:0 0 8px;font-size:31px}.container{max-width:1100px;margin:auto;padding:20px 15px}.tools{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:18px}.tools a{flex:1;min-width:150px;text-align:center}.filters{background:#fff;padding:15px;border-radius:14px;box-shadow:0 3px 15px #0000000d;margin-bottom:18px}.search{display:flex;gap:8px}input{flex:1;padding:12px;border:1px solid #ddd;border-radius:9px;font-size:15px}button{border:0;border-radius:9px;padding:0 20px;background:#b51f2a;color:#fff;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 3px 15px #0000000d}.pic,.empty{width:100%;height:190px}.pic{object-fit:cover}.empty{display:flex;align-items:center;justify-content:center;background:#eef1f5;font-size:55px}.body{padding:14px}.title{font-size:19px;font-weight:bold}.tag{display:inline-block;background:#edf2f8;color:#173b68;padding:5px 8px;border-radius:6px;font-size:12px;margin:7px 0}.desc{color:#687386;line-height:1.6;min-height:45px}.info{line-height:2;color:#4d5968;font-size:14px}.details{display:block;text-align:center;background:#173b68;color:#fff;padding:10px;border-radius:8px;margin-top:10px}.msg{background:#fff;padding:30px;text-align:center;border-radius:12px;grid-column:1/-1}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.head{flex-direction:column;align-items:stretch}.grid{grid-template-columns:1fr}.search{flex-direction:column}button{height:45px}}</style><link rel="stylesheet" href="app.css">
</head><body><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><script src="platform.js"></script><header><div class="head"><div class="logo">فلسطين <span>بلاتفورم</span></div><a class="btn blue" href="index.html">الرئيسية</a></div></header><section class="hero"><h1>🍔 المطاعم والمقاهي</h1><p>اكتشف المطاعم والمقاهي في فلسطين</p></section><main class="container"><div class="tools"><a class="btn red" href="add-ad.html?category=مطاعم">➕ أضف مطعمك أو مقهاك</a><a class="btn blue" href="ads.html?category=مطاعم">📢 جميع الإعلانات</a><a class="btn blue" href="reels.html">🎬 الفيديوهات</a></div><div class="filters"><div class="search"><input id="q" placeholder="ابحث بالاسم أو المدينة أو الوصف"><button id="go">بحث</button></div></div><div id="grid" class="grid"><div class="msg">جاري التحميل...</div></div></main><script>const db=window.ppClient;const esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));async function load(){const grid=document.getElementById('grid');try{const r=await db.from('ads').select('id,title,description,city,phone,image_urls,created_at,category').eq('category','مطاعم').eq('status','active').order('created_at',{ascending:false}).range(0,59);if(r.error)throw r.error;render(r.data||[])}catch(e){grid.innerHTML='<div class="msg">❌ '+esc(e.message)+'</div>'}}function render(data){const q=document.getElementById('q').value.trim().toLowerCase();data=data.filter(a=>!q||[a.title,a.description,a.city].filter(Boolean).join(' ').toLowerCase().includes(q));if(!data.length){document.getElementById('grid').innerHTML='<div class="msg">لا توجد نتائج حاليًا.</div>';return}document.getElementById('grid').innerHTML=data.map(a=>{let im=Array.isArray(a.image_urls)&&a.image_urls.length?a.image_urls[0]:null;let phone=a.phone?'<div>📞 '+esc(a.phone)+'</div>':'';let loc=a.city?'<div>📍 '+esc(a.city)+'</div>':'';return '<article class="card">'+(im?'<img class="pic" loading="lazy" src="'+esc(im)+'">':'<div class="empty">🍔</div>')+'<div class="body"><div class="title">'+esc(a.title)+'</div><span class="tag">مطاعم</span><div class="desc">'+esc((a.description||'لا يوجد وصف').slice(0,130))+'</div><div class="info">'+loc+phone+'</div><a class="details" href="ad-details.html?id='+encodeURIComponent(a.id)+'">عرض التفاصيل</a></div></article>'}).join('')}document.getElementById('go').onclick=load;document.getElementById('q').onkeydown=e=>{if(e.key==='Enter')load()};load();</script><script src="app-ui.js" defer></script>
</body></html>
