<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إحصائيات الريلز - فلسطين بلاتفورم</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#172033;font-family:Arial,Tahoma,sans-serif}.top{background:#183f6d;color:#fff;padding:18px 16px;display:flex;justify-content:space-between;align-items:center}.top a{color:#fff;text-decoration:none;background:#ffffff18;padding:9px 12px;border-radius:10px}.wrap{max-width:900px;margin:auto;padding:18px}.hero{background:#fff;border-radius:18px;padding:20px;box-shadow:0 4px 18px #0000000b;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 3px 14px #0000000a}.num{font-size:30px;font-weight:800;margin-top:7px}.muted{color:#667085;font-size:13px}.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #eee}.thumb{width:82px;height:60px;object-fit:cover;border-radius:10px;background:#ddd}.empty{text-align:center;padding:35px;background:#fff;border-radius:16px}@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}}button{border:0;background:#c21f2b;color:#fff;padding:11px 16px;border-radius:10px;font-weight:700}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><script src="platform.js"></script><link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="theme-v60.css">
</head><body><div class="top"><strong>📊 إحصائيات الريلز</strong><a href="reels.html">العودة للريلز</a></div><main class="wrap"><section class="hero"><h2>إحصائيات التفاعل على هذا الجهاز</h2><p class="muted">يتم احتساب الإحصائيات المحلية فورًا. الإعجابات والحفظ يمكن مزامنتهما مع حساب المستخدم عند توفر الجداول والصلاحيات.</p><button onclick="clearStats()">مسح الإحصائيات المحلية</button></section><section class="grid"><div class="card">👁️<div class="num" id="views">0</div><div class="muted">المشاهدات</div></div><div class="card">❤️<div class="num" id="likes">0</div><div class="muted">الإعجابات</div></div><div class="card">🔖<div class="num" id="saves">0</div><div class="muted">المحفوظات</div></div><div class="card">↗️<div class="num" id="shares">0</div><div class="muted">المشاركات</div></div></section><section style="margin-top:16px"><div id="list"></div></section></main><script>const prefix='pplat_';function keys(kind){return Object.keys(localStorage).filter(k=>k.startsWith(prefix+kind+'_'))}function val(kind,k){return parseInt(localStorage.getItem(k)||'0',10)||0}function total(kind){return keys(kind).reduce((s,k)=>s+val(kind,k),0)}function render(){views.textContent=total('views');likes.textContent=keys('like').length;saves.textContent=keys('save').length;shares.textContent=total('shares');const ids=new Set([...keys('views'),...keys('like'),...keys('save'),...keys('shares')].map(k=>k.split('_').slice(2).join('_')));list.innerHTML=ids.size?[...ids].map(id=>`<div class="item"><div style="flex:1"><b>إعلان ${id}</b><div class="muted">👁️ ${val('views',prefix+'views_'+id)} &nbsp; ❤️ ${localStorage.getItem(prefix+'like_'+id)==='1'?1:0} &nbsp; 🔖 ${localStorage.getItem(prefix+'save_'+id)==='1'?1:0} &nbsp; ↗️ ${val('shares',prefix+'shares_'+id)}</div></div></div>`).join(''):'<div class="empty">لا توجد تفاعلات محلية بعد.</div>'}function clearStats(){if(confirm('مسح الإحصائيات المحلية؟')){Object.keys(localStorage).filter(k=>k.startsWith(prefix)).forEach(k=>localStorage.removeItem(k));render()}}render();</script><script src="app-ui.js" defer></script>
</body></html>
