<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الأماكن القريبة - فلسطين بلاتفورم</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma;background:#f5f7fa;color:#172033}header{background:#173b68;color:#fff;padding:14px 16px}.head{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:8px}.logo{font-size:21px;font-weight:bold}.logo span{color:#e34b55}nav a{color:#fff;text-decoration:none;background:#234d7e;border-radius:9px;padding:8px 10px;font-size:12px;margin:2px}.wrap{max-width:1100px;margin:18px auto;padding:0 14px}.box{background:#fff;padding:16px;border-radius:16px;box-shadow:0 3px 14px #0001}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.actions button,.actions select{border:0;border-radius:10px;padding:11px 13px;font-weight:bold}.loc{background:#198754;color:#fff}.filter{background:#eef3f8;color:#173b68}.map{height:430px;border-radius:14px;overflow:hidden;margin:12px 0}.status{padding:10px;border-radius:10px;background:#f3f6fa;font-size:13px}.list{display:grid;gap:9px;margin-top:12px}.place{display:block;text-decoration:none;color:#172033;border:1px solid #e2e8f0;border-radius:12px;padding:12px}.place b{font-size:16px}.place small{display:block;color:#68778a;margin-top:5px}.dist{float:left;color:#198754;font-weight:bold}.empty{text-align:center;color:#68778a;padding:20px}@media(max-width:600px){.map{height:360px}nav a{padding:7px 8px}.logo{font-size:18px}}</style></head><body><header><div class="head"><div class="logo">فلسطين <span>بلاتفورم</span></div><nav><a href="index.html">الرئيسية</a><a href="map.html">الخريطة</a><a href="account.html">حسابي</a></nav></div></header><main class="wrap"><div class="box"><h1>📍 الأماكن القريبة</h1><p>اعثر على الإعلانات والأماكن التي تحتوي على موقع جغرافي قريب منك.</p><div class="actions"><button class="loc" id="locate">📍 تحديد موقعي</button><select class="filter" id="radius"><option value="5">ضمن 5 كم</option><option value="10" selected>ضمن 10 كم</option><option value="25">ضمن 25 كم</option><option value="50">ضمن 50 كم</option></select><select class="filter" id="category"><option value="">كل الأقسام</option><option>سيارات</option><option>عقارات</option><option>وظائف</option><option>خدمات</option><option>متاجر</option><option>مطاعم</option><option>ترفيه</option></select></div><div id="status" class="status">اضغط «تحديد موقعي» لعرض الأماكن القريبة.</div><div id="map" class="map"></div><div id="list" class="list"><div class="empty">لم يتم تحديد موقعك بعد.</div></div></div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const API='https://sesbumfedusbjevbsyzl.supabase.co/rest/v1/ads?select=id,title,category,city,price,latitude,longitude,location_name,image_urls,status&status=eq.active&latitude=not.is.null&longitude=not.is.null&order=created_at.desc';const KEY='sb_publishable_0sJrbh73jLip3O5OtJkc_A_9F6OPWqR';let map,me,markers=[],userPos=null,all=[];const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function km(a,b,c,d){const R=6371,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r;const h=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;return R*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h))}function initMap(){map=L.map('map').setView([31.9,35.2],9);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map)}async function load(){ $('status').textContent='جاري تحميل الأماكن...';try{const r=await fetch(API,{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});if(!r.ok)throw new Error('تعذر الاتصال بقاعدة البيانات');all=await r.json();render()}catch(e){$('status').textContent='❌ '+e.message}}function render(){markers.forEach(x=>map.removeLayer(x));markers=[];const cat=$('category').value,rad=Number($('radius').value);let data=all.filter(a=>!cat||a.category===cat);if(userPos)data=data.map(a=>({...a,distance:km(userPos.lat,userPos.lng,Number(a.latitude),Number(a.longitude))})).filter(a=>a.distance<=rad).sort((a,b)=>a.distance-b.distance);else data=data.sort((a,b)=>(a.city||'').localeCompare(b.city||''));$('status').textContent=userPos?'وجدنا '+data.length+' موقعًا ضمن '+rad+' كم.':'يوجد '+data.length+' موقعًا محددًا على الخريطة.';if(userPos){if(me)map.removeLayer(me);me=L.marker([userPos.lat,userPos.lng]).addTo(map).bindPopup('📍 موقعك الحالي').openPopup();markers.push(me)}data.forEach(a=>{const m=L.marker([Number(a.latitude),Number(a.longitude)]).addTo(map);m.bindPopup('<b>'+esc(a.title)+'</b><br>'+esc(a.city||'')+'<br><a href="ad-details.html?id='+encodeURIComponent(a.id)+'">عرض الإعلان</a>');markers.push(m)});const list=$('list');if(!data.length){list.innerHTML='<div class="empty">لا توجد نتائج ضمن النطاق المحدد.</div>';return}list.innerHTML=data.slice(0,30).map(a=>'<a class="place" href="ad-details.html?id='+encodeURIComponent(a.id)+'"><span class="dist">'+(userPos?a.distance.toFixed(1)+' كم':'موقع')+'</span><b>'+esc(a.title)+'</b><small>📍 '+esc(a.city||'فلسطين')+(a.location_name?' — '+esc(a.location_name):'')+'</small></a>').join('');if(data.length){const pts=data.map(a=>[Number(a.latitude),Number(a.longitude)]);if(userPos)pts.push([userPos.lat,userPos.lng]);map.fitBounds(L.latLngBounds(pts),{padding:[25,25],maxZoom:13})}}$('locate').onclick=()=>{if(!navigator.geolocation){$('status').textContent='المتصفح لا يدعم تحديد الموقع.';return}$('status').textContent='جاري تحديد موقعك...';navigator.geolocation.getCurrentPosition(p=>{userPos={lat:p.coords.latitude,lng:p.coords.longitude};render()},e=>{$('status').textContent='لم يتم السماح بتحديد الموقع. يمكنك استخدام الخريطة العامة.'},{enableHighAccuracy:true,timeout:10000,maximumAge:60000})};$('radius').onchange=render;$('category').onchange=render;initMap();load();</script></body></html>
