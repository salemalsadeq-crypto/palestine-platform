<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>الوظائف | فلسطين بلاتفورم</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0" crossorigin="anonymous"></script><script src="platform.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f5f7fa;color:#172033}a{text-decoration:none}header{background:#fff;padding:15px;box-shadow:0 2px 10px #0001}.head{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.logo{font-size:22px;font-weight:bold;color:#173b68}.logo span{color:#b51f2a}.account{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;display:none}.initial{width:40px;height:40px;border-radius:50%;background:#edf2f8;color:#173b68;display:none;align-items:center;justify-content:center;font-weight:bold}.btn{padding:9px 12px;border-radius:8px;font-weight:bold;font-size:13px}.blue{background:#173b68;color:white}.red{background:#b51f2a;color:white;border:0;cursor:pointer}.gray{background:#eee;color:#333}.hero{background:#173b68;color:#fff;text-align:center;padding:40px 15px}.hero h1{margin:0 0 10px;font-size:34px}.container{max-width:1100px;margin:auto;padding:25px 15px}.actions{display:flex;gap:10px;margin-bottom:20px}.actions a{flex:1;text-align:center;padding:14px;border-radius:10px;font-weight:bold}.filters{background:#fff;padding:18px;border-radius:14px;box-shadow:0 3px 15px #0000000d;margin-bottom:22px}.search{display:flex;gap:8px;margin-bottom:14px}.search input{flex:1;padding:13px;border:1px solid #ddd;border-radius:8px;font-size:16px}.search button{padding:0 22px;border:0;border-radius:8px;background:#b51f2a;color:#fff;font-weight:bold}.filtergrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.filtergrid>*{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;background:#fff}.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.bar select{padding:9px;border:1px solid #ddd;border-radius:8px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 3px 15px #0000000d}.pic,.nop{width:100%;height:205px}.pic{object-fit:cover}.nop{display:flex;align-items:center;justify-content:center;background:#eef1f5;font-size:50px}.body{padding:15px}.title{font-size:19px;font-weight:bold;margin-bottom:8px}.tag{display:inline-block;background:#edf2f8;color:#173b68;padding:5px 8px;border-radius:6px;font-size:12px}.desc{color:#687386;line-height:1.6;margin:9px 0;min-height:45px}.info{color:#555;font-size:14px;line-height:1.9}.details{display:block;text-align:center;background:#173b68;color:#fff;padding:11px;border-radius:8px;margin-top:12px}.msg{grid-column:1/-1;background:#fff;padding:35px;text-align:center;border-radius:12px;color:#697586}.error{color:#b51f2a}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.filtergrid{grid-template-columns:1fr 1fr}}@media(max-width:550px){.grid{grid-template-columns:1fr}.filtergrid{grid-template-columns:1fr}.actions{flex-direction:column}.hero h1{font-size:27px}}
</style>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header><div class="head">

  <div class="logo">فلسطين <span>بلاتفورم</span></div>
<div class="account">
<img id="avatar" class="avatar"><div id="initial" class="initial">س</div><span id="name"></span>
<a id="account" class="btn blue" href="account.html" style="display:none">حسابي</a>
<a id="myads" class="btn blue" href="my-ads.html" style="display:none">إعلاناتي</a>
<button id="logout" class="btn red" style="display:none">خروج</button>
<a id="login" class="btn gray" href="login.html">تسجيل الدخول</a>
<a class="btn blue" href="index.html">الرئيسية</a>
</div></div></header>

<section class="hero"><h1>💼 الوظائف</h1><p>أحدث فرص العمل والإعلانات الوظيفية في فلسطين</p></section>

<main class="container">
<div class="actions" data-main-actions="1">
<a href="ads.html?category=وظائف#add" class="red">➕ أضف إعلان وظيفة</a>
<a href="ads.html?category=وظائف" class="blue">📢 جميع الإعلانات</a>
</div>

<div class="filters">
<div class="search"><input id="search" placeholder="ابحث عن وظيفة، مهنة، شركة..."><button id="searchBtn">بحث</button></div>
<div class="filtergrid">
<select id="city"><option value="">كل المدن</option><option>نابلس</option><option>رام الله</option><option>القدس</option><option>الخليل</option><option>بيت لحم</option><option>جنين</option><option>طولكرم</option><option>قلقيلية</option><option>سلفيت</option><option>طوباس</option><option>أريحا</option><option>غزة</option></select>
<select id="jobType"><option value="">كل أنواع الوظائف</option><option>دوام كامل</option><option>دوام جزئي</option><option>عن بُعد</option><option>عمل حر</option><option>تدريب</option></select>
<input id="min" type="number" placeholder="أقل راتب">
</div></div>

<div class="bar"><b id="count">جاري التحميل...</b><select id="sort"><option value="new">الأحدث أولاً</option><option value="old">الأقدم أولاً</option><option value="high">الراتب الأعلى</option><option value="low">الراتب الأقل</option></select></div>
<div id="grid" class="grid"><div class="msg">جاري تحميل الوظائف...</div></div>
</main>
<script>
(function(){
'use strict';
const CATEGORY='وظائف', ICON='💼', DETAIL='الوظيفة', PRICE_LABEL='الراتب غير محدد';
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const db=window.ppClient, grid=$('grid'), count=$('count');
let ads=[];
function showError(e){const msg=e?.message||String(e||'خطأ غير متوقع');if(count)count.textContent='❌ خطأ';if(grid)grid.innerHTML='<div class="msg error">❌ '+esc(msg)+'</div>';}
window.addEventListener('error',e=>showError(e.error||e.message));
window.addEventListener('unhandledrejection',e=>showError(e.reason));
function money(x){if(x==null||x==='')return PRICE_LABEL;const n=Number(x);return Number.isFinite(n)?n.toLocaleString('ar-PS')+' شيكل':PRICE_LABEL;}
function date(x){if(!x)return '';try{return new Date(x).toLocaleDateString('ar-PS')}catch(e){return '';}}
function render(list){
 if(!grid)return;
 if(count)count.textContent='عدد النتائج: '+list.length;
 if(!list.length){grid.innerHTML='<div class="msg">'+ICON+' لا توجد نتائج مطابقة حاليًا.</div>';return;}
 grid.innerHTML=list.map(a=>{const im=Array.isArray(a.image_urls)&&a.image_urls.length?a.image_urls[0]:null;const image=im?'<img class="pic" loading="lazy" src="'+esc(im)+'" alt="'+esc(a.title||'')+'">':'<div class="nop">'+ICON+'</div>';const desc=String(a.description||'لا يوجد وصف');return '<article class="card">'+image+'<div class="body"><div class="title">'+esc(a.title||'إعلان')+'</div><span class="tag">'+esc(CATEGORY)+'</span><div class="desc">'+esc(desc.slice(0,130))+'</div><div class="info">💰 '+esc(money(a.price))+(a.city?'<br>📍 '+esc(a.city):'')+'<br>📅 '+esc(date(a.created_at))+'</div><a class="details" href="ad-details.html?id='+encodeURIComponent(a.id)+'">👁️ عرض تفاصيل '+DETAIL+'</a></div></article>';}).join('');
}
function filter(){
 const q=($('search')?.value||$('q')?.value||'').trim().toLowerCase();
 const city=($('city')?.value||'').trim().toLowerCase();
 const minEl=$('min'),maxEl=$('max');
 const min=minEl&&minEl.value!==''?Number(minEl.value):null,max=maxEl&&maxEl.value!==''?Number(maxEl.value):null;
 const type=($('type')?.value||$('jobType')?.value||'').trim().toLowerCase();
 let list=ads.filter(a=>{const text=[a.title,a.description,a.city].filter(Boolean).join(' ').toLowerCase();return(!q||text.includes(q))&&(!city||String(a.city||'').toLowerCase()===city)&&(!type||text.includes(type))&&(min===null||Number(a.price)>=min)&&(max===null||Number(a.price)<=max);});
 const sort=$('sort')?.value||'new';
 list.sort((a,b)=>sort==='old'?new Date(a.created_at)-new Date(b.created_at):sort==='low'?(a.price==null?Infinity:Number(a.price))-(b.price==null?Infinity:Number(b.price)):sort==='high'?(b.price==null?-Infinity:Number(b.price))-(a.price==null?-Infinity:Number(a.price)):new Date(b.created_at)-new Date(a.created_at));
 render(list);
}
async function load(){
 if(!db){showError('تعذر الاتصال بقاعدة البيانات');return;}
 if(grid)grid.innerHTML='<div class="msg">⏳ جاري التحميل...</div>';
 const r=await db.from('ads').select('*').eq('category',CATEGORY).eq('status','active').order('created_at',{ascending:false});
 if(r.error)throw r.error;ads=r.data||[];filter();
}
async function setupUser(){
 if(!db)return;
 const r=await db.auth.getUser();const u=r.data?.user;if(!u)return;
 const show=(id,display)=>{const el=$(id);if(el)el.style.display=display;};
 show('login','none');show('account','inline-block');show('myads','inline-block');show('logout','inline-block');
 const p=await db.from('profiles').select('full_name,avatar_url').eq('id',u.id).maybeSingle();
 const name=p.data?.full_name||u.email?.split('@')[0]||'المستخدم';
 const nameEl=$('name');if(nameEl)nameEl.textContent=name;
 const initial=$('initial');if(initial)initial.textContent=name.trim()[0]||'م';
 const avatar=$('avatar');if(avatar&&p.data?.avatar_url){avatar.src=p.data.avatar_url;avatar.style.display='block';if(initial)initial.style.display='none';}else if(initial)initial.style.display='flex';
 const logout=$('logout');if(logout)logout.onclick=async()=>{await db.auth.signOut();location.reload();};
}
const bind=(id,evt)=>{const el=$(id);if(el)el.addEventListener(evt,filter);};
bind('search','input');bind('q','input');bind('searchBtn','click');bind('go','click');['city','min','max','sort','type','jobType'].forEach(id=>bind(id,'change'));
setupUser().catch(()=>{});load().catch(showError);
})();
</script>
<script src="app-ui.js" defer></script>

</body></html>
