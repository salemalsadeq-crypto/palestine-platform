<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلب خدمة | فلسطين بلاتفورم</title><link rel="stylesheet" href="app.css"><style>
body{background:#f5f8fc}.req-wrap{max-width:760px;margin:24px auto;padding:0 15px}.req-card{background:#fff;border:1px solid #e0e8f1;border-radius:22px;box-shadow:0 12px 32px rgba(18,59,104,.08);padding:20px}.req-head{background:linear-gradient(135deg,#123b68,#1d5b96);color:#fff;border-radius:18px;padding:20px;margin-bottom:18px}.req-head h1{margin:0 0 6px;font-size:25px}.req-head p{margin:0;opacity:.9}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{display:block;font-weight:800;color:#44566c;font-size:13px;margin-bottom:6px}input,select,textarea{width:100%;box-sizing:border-box;padding:13px;border:1px solid #d8e2ec;border-radius:13px;font:inherit;background:#fff}textarea{min-height:105px;resize:vertical}.submit{width:100%;border:0;background:#b51f2a;color:#fff;padding:14px;border-radius:14px;font-weight:900;font-size:16px;margin-top:16px}.msg{margin-top:12px;padding:12px;border-radius:12px;background:#f3f7fb;color:#5b6d80}.ok{background:#eaf8f1;color:#13734c}.err{background:#fff0f1;color:#a51e29}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><header class="pp-simple-header"><div class="wrap" style="padding:12px 16px"><a href="service-center.html" style="color:#123b68;font-weight:900;text-decoration:none">← مركز الخدمات</a></div></header><main class="req-wrap"><div class="req-card"><div class="req-head"><h1 id="title">طلب خدمة</h1><p id="desc">أدخل التفاصيل وسننشئ لك طلبًا مستقلًا عن الإعلانات.</p></div><div class="grid"><div><label>المدينة *</label><input id="city" placeholder="مثال: نابلس"></div><div><label>الهاتف *</label><input id="phone" inputmode="tel" placeholder="رقم الهاتف"></div><div class="full"><label id="fromLabel">موقع الانطلاق / عنوان الخدمة *</label><input id="from" placeholder="الموقع أو العنوان"></div><div class="full"><label id="toLabel">الوجهة</label><input id="to" placeholder="الوجهة أو اكتب غير مطلوب"></div><div><label>موعد الطلب</label><select id="schedule"><option value="now">الآن</option><option value="later">موعد لاحق</option></select></div><div><label>الميزانية/السعر المقترح</label><input id="budget" type="number" min="0" step="0.01" placeholder="اختياري بالشيكل"></div><div class="full" id="peopleWrap"><label>عدد الأشخاص</label><input id="people" type="number" min="1" max="8" value="1"></div><div class="full"><label>تفاصيل الطلب</label><textarea id="details" placeholder="اكتب التفاصيل التي يحتاجها مقدم الخدمة..."></textarea></div></div><button class="submit" id="submit">إرسال الطلب</button><div id="msg"></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><script src="platform.js"></script><script>
const cfg=window.PP_CONFIG,db=window.ppClient;const q=new URLSearchParams(location.search);const type=q.get('type')||'home';const meta={taxi:['🚕 طلب تاكسي','حدد الانطلاق والوجهة وعدد الركاب.','موقع الانطلاق *','الوجهة *'],delivery:['📦 طلب توصيل','حدد الاستلام والتسليم وتفاصيل الطرد.','مكان الاستلام *','مكان التسليم *'],home:['🔧 طلب خدمة منزلية','اختر نوع الخدمة واكتب المطلوب.','عنوان الخدمة *','نوع/تفاصيل الخدمة'],food:['🍔 طلب طعام','اكتب طلب الطعام ومكان التوصيل.','عنوان التوصيل *','المطعم/المصدر'],transport:['🚚 طلب نقل وشحن','حدد نقطة التحميل والتسليم وحجم المنقولات.','نقطة التحميل *','نقطة التسليم *']}[type]||['طلب خدمة','أدخل التفاصيل.','الموقع *','الوجهة'];document.getElementById('title').textContent=meta[0];document.getElementById('desc').textContent=meta[1];document.getElementById('fromLabel').textContent=meta[2];document.getElementById('toLabel').textContent=meta[3];if(type!=='taxi')document.getElementById('peopleWrap').style.display='none';if(type==='home'){document.getElementById('to').placeholder='مثال: كهرباء / سباكة / تكييف';}if(type==='food'){document.getElementById('from').placeholder='عنوان التوصيل';document.getElementById('to').placeholder='اسم المطعم أو تفاصيل الطعام';}
function msg(t,c){const m=document.getElementById('msg');m.className='msg '+(c||'');m.textContent=t}
document.getElementById('submit').onclick=async()=>{const u=await ppUser();if(!u){location.href='login.html?next='+encodeURIComponent(location.href);return}const city=document.getElementById('city').value.trim(),phone=document.getElementById('phone').value.trim(),from=document.getElementById('from').value.trim(),to=document.getElementById('to').value.trim(),details=document.getElementById('details').value.trim(),budget=Number(document.getElementById('budget').value)||null,people=Number(document.getElementById('people').value)||1;if(!city||!phone||!from){msg('المدينة والهاتف والموقع مطلوبون.','err');return}if(['taxi','delivery','transport'].includes(type)&&!to){msg('الوجهة مطلوبة.','err');return}const b=document.getElementById('submit');b.disabled=true;b.textContent='جاري إرسال الطلب...';const {data,error}=await db.rpc('create_service_request',{p_type:type,p_city:city,p_phone:phone,p_from_location:from,p_to_location:to||null,p_details:details||null,p_budget:budget,p_people_count:people,p_scheduled_at:null});if(error){msg(error.message,'err');b.disabled=false;b.textContent='إرسال الطلب';return}msg('تم إنشاء طلبك بنجاح. يمكنك متابعة حالته من طلباتي الخدمية.','ok');b.textContent='تم إرسال الطلب ✓';setTimeout(()=>location.href='service-requests.html',900)};
</script></body></html>
