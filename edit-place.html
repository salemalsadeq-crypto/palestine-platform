<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تعديل المكان | فلسطين بلاتفورم</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{font-family:Arial,Tahoma,sans-serif;background:#f3f6fa;margin:0;color:#172033}.box{max-width:850px;margin:20px auto;background:#fff;padding:20px;border-radius:18px;box-shadow:0 5px 22px #0001}.back{display:inline-block;color:#173b68;text-decoration:none;font-weight:bold;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,textarea,select{width:100%;padding:12px;margin:6px 0 12px;border:1px solid #d9e0e7;border-radius:9px;font-size:15px}textarea{min-height:90px;resize:vertical}.label{font-weight:bold;color:#334155;font-size:14px}.btn{padding:12px;border:0;border-radius:9px;background:#173b68;color:#fff;width:100%;font-weight:bold;font-size:15px;cursor:pointer}.secondary{background:#eef2f6;color:#173b68}.msg{margin:12px 0;padding:10px;border-radius:9px;background:#f7f9fb;line-height:1.7}.hint{font-size:13px;color:#64748b;line-height:1.6}.coords{background:#f7f9fb;padding:10px;border-radius:9px;margin-bottom:12px}.map{height:360px;border-radius:14px;overflow:hidden;border:1px solid #dbe3ea;margin:8px 0 14px}.actions{display:flex;gap:8px;flex-wrap:wrap}.small{width:auto;flex:1;min-width:160px}@media(max-width:600px){.box{margin:0;border-radius:0;min-height:100vh}.grid{grid-template-columns:1fr}.map{height:300px}}</style><link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="theme-v47.css"></head><body><main class="box"><a class="back" href="my-places.html">← العودة إلى أماكني</a><h2>✏️ تعديل المكان</h2><p class="hint">يمكنك تعديل البيانات والموقع. بعد التعديل سيعود المكان إلى المراجعة إذا كان منشورًا.</p><form id="f"><div class="label">اسم المكان</div><input id="name" required><div class="grid"><div><div class="label">التصنيف</div><select id="category"><option>مطاعم</option><option>متاجر</option><option>خدمات</option><option>صيدليات</option><option>صحة</option><option>فنادق</option><option>تعليم</option><option>مؤسسات</option><option>أماكن سياحية</option><option>أخرى</option></select></div><div><div class="label">المدينة</div><input id="city"></div></div><div class="label">العنوان</div><input id="address"><div class="grid"><div><div class="label">الهاتف</div><input id="phone" type="tel"></div><div><div class="label">الموقع الإلكتروني</div><input id="website" type="url"></div></div><div class="label">الوصف</div><textarea id="description"></textarea><div class="label">الموقع على الخريطة</div><div id="map" class="map"></div><div class="actions"><button type="button" id="locate" class="btn small">📍 استخدام موقعي</button><button type="button" id="clear" class="btn secondary small">🧹 مسح الموقع</button></div><div class="coords">الإحداثيات: <b id="coordText">—</b></div><input id="lat" type="hidden"><input id="lng" type="hidden"><button class="btn" id="save">💾 حفظ التعديلات</button></form><div id="msg" class="msg">جاري تحميل بيانات المكان...</div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><script src="platform.js"></script><script>const db=ppClient,$=id=>document.getElementById(id),esc=ppEsc,id=new URLSearchParams(location.search).get('id');let place=null,marker=null;const map=L.map('map').setView([31.95,35.20],9);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);function setPoint(lat,lng,zoom=15){lat=Number(lat);lng=Number(lng);if(!Number.isFinite(lat)||!Number.isFinite(lng))return;$('lat').value=lat;$('lng').value=lng;$('coordText').textContent=lat.toFixed(6)+' , '+lng.toFixed(6);if(marker)marker.setLatLng([lat,lng]);else{marker=L.marker([lat,lng],{draggable:true}).addTo(map);marker.on('dragend',()=>{const p=marker.getLatLng();setPoint(p.lat,p.lng,0)})}if(zoom)map.setView([lat,lng],zoom)}map.on('click',e=>setPoint(e.latlng.lat,e.latlng.lng));$('clear').onclick=()=>{if(marker){map.removeLayer(marker);marker=null}$('lat').value='';$('lng').value='';$('coordText').textContent='لم يتم تحديد الموقع'};$('locate').onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>setPoint(p.coords.latitude,p.coords.longitude,16),()=>alert('تعذر الحصول على الموقع'),{enableHighAccuracy:true,timeout:10000}):alert('المتصفح لا يدعم تحديد الموقع');async function load(){const u=await ppUser();if(!u){location.href='login.html';return}if(!id){$('msg').textContent='❌ رابط المكان غير صحيح';return}const {data,error}=await db.from('places').select('*').eq('id',id).eq('user_id',u.id).maybeSingle();if(error||!data){$('msg').textContent='❌ لم يتم العثور على المكان أو لا تملك صلاحية تعديله';return}place=data;$('name').value=data.name||'';$('category').value=data.category||'أخرى';$('city').value=data.city||'';$('address').value=data.address||'';$('phone').value=data.phone||'';$('website').value=data.website||'';$('description').value=data.description||'';if(data.latitude!=null&&data.longitude!=null)setPoint(data.latitude,data.longitude,15);$('msg').textContent='تم تحميل البيانات.'}load();$('f').onsubmit=async e=>{e.preventDefault();const u=await ppUser();if(!u)return location.href='login.html';const lat=$('lat').value===''?null:Number($('lat').value),lng=$('lng').value===''?null:Number($('lng').value);if((lat===null)!=(lng===null)){ $('msg').textContent='❌ يجب تحديد خط العرض والطول معًا.';return}const row={name:$('name').value.trim(),category:$('category').value,city:$('city').value.trim()||null,address:$('address').value.trim()||null,phone:$('phone').value.trim()||null,website:$('website').value.trim()||null,description:$('description').value.trim()||null,latitude:lat,longitude:lng,status:'pending',updated_at:new Date().toISOString()};$('save').disabled=true;$('save').textContent='جاري الحفظ...';const {error}=await db.from('places').update(row).eq('id',id).eq('user_id',u.id);$('msg').textContent=error?'❌ '+error.message:'✅ تم حفظ التعديلات وإرسال المكان للمراجعة.';if(!error)setTimeout(()=>location.href='my-places.html',900);$('save').disabled=false;$('save').textContent='💾 حفظ التعديلات'};</script><script src="app-ui.js" defer></script>
</body></html>
