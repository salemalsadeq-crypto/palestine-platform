<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>السفر والحجوزات | فلسطين بلاتفورم</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="theme-v61.css">
<link rel="stylesheet" href="ui-polish.css?v=90"><link rel="stylesheet" href="ui-polish-v91.css?v=91">
<link rel="stylesheet" href="ui-system-v97.css?v=97">
<link rel="stylesheet" href="travel.css?v=1">
<link rel="stylesheet" href="platform-redesign-v104.css?v=104">
</head><body class="tv-page pp-redesign">
<main class="tv-wrap">
<a class="tv-back" href="index.html">← الرئيسية</a>
<section class="tv-hero">
  <h1>✈️ السفر والحجوزات</h1>
  <p>مكاتب السفر والسياحة في فلسطين: قارن العروض، تواصل مباشرة مع المكتب، وأرسل طلب حجزك خلال دقيقة. الاتفاق على التفاصيل والدفع يتم مباشرة مع المكتب.</p>
  <div class="tv-actions">
    <a class="tv-btn light" href="travel-my-bookings.html">🎫 حجوزاتي</a>
    <a class="tv-btn green" id="regLink" href="travel-register.html">🏢 سجّل مكتبك</a>
    <a class="tv-btn light" id="manageLink" href="travel-manage.html" hidden>⚙️ إدارة الحجوزات والعروض</a>
  </div>
</section>
<div class="tv-filters">
  <input id="q" class="tv-in" type="search" placeholder="ابحث باسم المكتب أو الوجهة..." autocomplete="off">
  <select id="city" class="tv-sel" aria-label="المدينة"><option value="">كل المدن</option></select>
</div>
<div class="tv-chips" id="kinds" role="group" aria-label="نوع الخدمة"></div>
<div class="tv-tabs" role="tablist">
  <button class="tv-tab on" data-t="offices" type="button">🏢 المكاتب</button>
  <button class="tv-tab" data-t="offers" type="button">🎟️ العروض والرحلات</button>
</div>
<div id="msg" class="tv-msg" style="display:none"></div>
<div id="list"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
<script src="platform.js"></script>
<script src="travel.js?v=1"></script>
<script>
(()=>{
const db=window.ppClient,$=id=>document.getElementById(id),E=TV.esc;
let offices=[],offers=[],tab='offices',kind='';
$('city').insertAdjacentHTML('beforeend',TV.CITIES.map(c=>'<option>'+E(c)+'</option>').join(''));
$('kinds').innerHTML='<button class="tv-chip on" data-k="" type="button">الكل</button>'+Object.entries(TV.KINDS).map(([k,v])=>'<button class="tv-chip" data-k="'+k+'" type="button">'+v[0]+' '+v[1]+'</button>').join('');
const one=x=>Array.isArray(x)?x[0]:x;
function officeCard(o){
  const sv=(o.services||[]).map(k=>'<span class="tv-badge">'+TV.kindLabel(k)+'</span>').join('');
  return '<article class="tv-card"><div class="tv-row sb"><h3>'+E(o.name)+'</h3><span class="tv-badge">📍 '+E(o.city)+'</span></div>'+
   (o.address?'<div class="tv-meta">'+E(o.address)+'</div>':'')+
   (sv?'<div class="tv-badges">'+sv+'</div>':'')+
   '<div class="tv-row"><a class="tv-btn green sm" href="travel-office.html?id='+encodeURIComponent(o.id)+'">عرض المكتب واحجز</a>'+
   '<a class="tv-btn light sm" href="'+TV.tel(o.phone)+'">📞 اتصال</a>'+
   '<a class="tv-btn soft sm" target="_blank" rel="noopener" href="'+TV.wa(o.whatsapp||o.phone)+'">💬 واتساب</a></div></article>';
}
function offerCard(o){
  const of=one(o.travel_offices)||{};
  const full=o.seats===0;
  const dates=[o.depart_date?'🛫 '+TV.date(o.depart_date):'',o.return_date?'🛬 '+TV.date(o.return_date):''].filter(Boolean).join('  ');
  return '<article class="tv-card"><div class="tv-row sb"><h3>'+E(o.title)+'</h3><span class="tv-badge">'+TV.kindLabel(o.kind)+'</span></div>'+
   '<div class="tv-meta">'+(o.destination?'📍 '+E(o.destination)+' · ':'')+'بواسطة <b>'+E(of.name||'')+'</b>'+(of.city?' ('+E(of.city)+')':'')+'</div>'+
   (dates?'<div class="tv-meta">'+dates+'</div>':'')+
   '<div class="tv-row sb" style="margin-top:8px"><span class="tv-price">'+E(TV.price(o.price,o.currency))+'</span>'+
   (full?'<span class="tv-st" style="color:#991b1b;background:#fee2e2">اكتملت المقاعد</span>':'<a class="tv-btn green sm" href="travel-office.html?id='+encodeURIComponent(o.office_id)+'&offer='+encodeURIComponent(o.id)+'#book">احجز الآن</a>')+'</div></article>';
}
function render(){
  const q=$('q').value.trim().toLowerCase(),city=$('city').value,list=$('list');
  let html='',n=0;
  if(tab==='offices'){
    const rows=offices.filter(o=>(!city||o.city===city)&&(!kind||(o.services||[]).includes(kind))&&(!q||[o.name,o.city,o.address,o.description,(o.services||[]).map(k=>TV.KINDS[k]?TV.KINDS[k][1]:k).join(' ')].join(' ').toLowerCase().includes(q)));
    n=rows.length;html=rows.map(officeCard).join('');
  }else{
    const rows=offers.filter(o=>{const of=one(o.travel_offices)||{};return(!city||of.city===city)&&(!kind||o.kind===kind)&&(!q||[o.title,o.destination,of.name].join(' ').toLowerCase().includes(q))});
    n=rows.length;html=rows.map(offerCard).join('');
  }
  list.innerHTML=n?html:'<div class="tv-empty">'+(tab==='offices'?'لا توجد مكاتب مطابقة حاليًا.<br>هل تملك مكتب سفر؟ <a href="travel-register.html">سجّل مكتبك مجانًا</a>':'لا توجد عروض مطابقة حاليًا.')+'</div>';
}
async function load(){
  TV.msg($('msg'),'جاري التحميل...');
  const [a,b]=await Promise.all([
    db.from('travel_offices').select('id,name,city,address,phone,whatsapp,description,services').eq('status','active').order('name').limit(300),
    db.from('travel_offers').select('id,office_id,title,kind,destination,depart_date,return_date,price,currency,seats,travel_offices(id,name,city)').eq('status','active').order('created_at',{ascending:false}).limit(300)
  ]);
  if(a.error){TV.msg($('msg'),TV.errText(a.error),'err');return}
  offices=a.data||[];
  offers=(b.error?[]:(b.data||[])).filter(o=>!o.depart_date||o.depart_date>=TV.today());
  TV.msg($('msg'),'');render();
}
$('q').addEventListener('input',render);$('city').addEventListener('change',render);
$('kinds').addEventListener('click',e=>{const b=e.target.closest('.tv-chip');if(!b)return;kind=b.dataset.k;document.querySelectorAll('.tv-chip').forEach(x=>x.classList.toggle('on',x===b));render()});
document.querySelector('.tv-tabs').addEventListener('click',e=>{const b=e.target.closest('.tv-tab');if(!b)return;tab=b.dataset.t;document.querySelectorAll('.tv-tab').forEach(x=>x.classList.toggle('on',x===b));render()});
load();
(async()=>{try{const u=await window.ppUser();if(!u)return;const {data}=await db.from('travel_offices').select('id').eq('user_id',u.id).maybeSingle();if(data){$('manageLink').hidden=false;$('regLink').textContent='🏢 بيانات مكتبي'}}catch(e){}})();
})();
</script>
<script src="app-ui.js?v=90" defer></script>
</body></html>
