<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الأماكن | فلسطين بلاتفورم</title><style>body{font-family:Arial;margin:0;background:#f5f7fa;color:#172033}.head{background:#173b68;color:#fff;padding:15px;display:flex;justify-content:space-between}.head a{color:#fff}.wrap{max-width:1100px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 12px #0001}.card h3{margin-top:0}.btn{display:inline-block;padding:9px 12px;border-radius:8px;background:#173b68;color:#fff;text-decoration:none}.muted{color:#687386}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:550px){.grid{grid-template-columns:1fr}}</style></head><body><header class="head"><b>📍 الأماكن</b><a href="index.html">الرئيسية</a></header><main class="wrap"><p><a class="btn" href="map.html">🗺️ عرض الخريطة</a> <a class="btn" href="add-place.html">➕ أضف مكانًا</a></p><div id="grid" class="grid"><div>جاري التحميل...</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><script src="platform.js"></script><script>const db=ppClient,$=id=>document.getElementById(id),esc=ppEsc;async function load(){const {data,error}=await db.from('places').select('id,name,category,city,address,description,latitude,longitude').eq('status','published').order('created_at',{ascending:false});if(error){$('grid').innerHTML='<div>❌ '+esc(error.message)+'</div>';return}$('grid').innerHTML=(data||[]).map(x=>'<article class="card"><h3>'+esc(x.name)+'</h3><div class="muted">'+esc(x.category||'')+(x.city?' • '+esc(x.city):'')+'</div><p>'+esc(x.description||'')+'</p><p>📍 '+esc(x.address||x.city||'موقع محدد على الخريطة')+'</p><a class="btn" href="place-details.html?id='+encodeURIComponent(x.id)+'">التفاصيل</a></article>').join('')||'<div>لا توجد أماكن منشورة.</div>'}load();</script></body></html>
