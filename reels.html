<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07120f"><title>ريلز فلسطين بلاتفورم</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
<script src="platform.js"></script>
<link rel="stylesheet" href="app.css"><link rel="stylesheet" href="theme-v61.css"><link rel="stylesheet" href="theme-v87.css">
<style>
html,body{margin:0!important;width:100%;height:100%;overflow:hidden!important;background:#07120f!important;color:#fff!important}
body.pp-reels-page{font-family:'Tajawal',Tahoma,sans-serif!important;line-height:1.45}
.pp-reels-top{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 14px 16px;background:linear-gradient(180deg,rgba(0,0,0,.68),transparent);pointer-events:none}
.pp-reels-top>*{pointer-events:auto}.pp-reels-brand{font-family:'Cairo',Tahoma,sans-serif;font-weight:900;font-size:18px;color:#fff;text-shadow:0 2px 14px #0008}.pp-reels-brand span{color:#e9c77b}.pp-reels-category{font-size:11px;color:#e9e9e9;display:block;font-weight:600;margin-top:2px}
.pp-reels-back{display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border:1px solid #ffffff30;border-radius:999px;background:#ffffff17;color:#fff;text-decoration:none;font-size:12px;font-weight:800;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:transform .2s,background .2s}
.pp-reels-back:active{transform:scale(.96);background:#ffffff2b}
.pp-reels-feed{height:100dvh;height:100vh;overflow-y:auto;overscroll-behavior-y:contain;scroll-snap-type:y mandatory;scrollbar-width:none;background:#07120f;touch-action:pan-y;}
.pp-reels-feed::-webkit-scrollbar{display:none}
.pp-reel{height:100dvh;height:100vh;min-height:500px;position:relative;isolation:isolate;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:#07120f;display:flex;align-items:center;justify-content:center}
.pp-reel-video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#050706;outline:none;cursor:pointer}
.pp-reel-shade{position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.22) 0%,transparent 22%,transparent 48%,rgba(0,0,0,.20) 61%,rgba(0,0,0,.82) 100%)}
.pp-reel-center{position:absolute;z-index:4;top:50%;left:50%;transform:translate(-50%,-50%);width:66px;height:66px;border-radius:50%;border:1px solid #ffffff70;background:#ffffffd9;color:#123b2c;box-shadow:0 10px 35px #0005;display:grid;place-items:center;font-size:23px;cursor:pointer;transition:opacity .2s,transform .2s;backdrop-filter:blur(8px)}
.pp-reel-center.is-playing{opacity:0;pointer-events:none;transform:translate(-50%,-46%) scale(.92)}.pp-reel:focus-within .pp-reel-center.is-playing{opacity:.15}
.pp-reel-info{position:absolute;z-index:3;right:16px;left:88px;bottom:calc(28px + env(safe-area-inset-bottom));color:#fff;text-shadow:0 2px 12px #0008;pointer-events:none}
.pp-reel-title{font-family:'Cairo',Tahoma,sans-serif;font-size:clamp(18px,4.8vw,23px);font-weight:900;line-height:1.45;margin:0 0 6px;overflow-wrap:anywhere}
.pp-reel-meta{font-size:12px;color:#f1f5f2;margin-bottom:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pp-reel-pill{border:1px solid #ffffff45;background:#ffffff1b;border-radius:99px;padding:4px 8px;font-size:10px;backdrop-filter:blur(10px)}
.pp-reel-desc{font-size:13px;line-height:1.65;color:#f5f6f5;max-height:60px;overflow:auto;white-space:pre-line;pointer-events:auto}
.pp-reel-open{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:11px 16px;border-radius:13px;background:linear-gradient(135deg,#f5d996,#d4a54f);color:#173b2b;text-decoration:none;font-weight:900;font-size:13px;box-shadow:0 8px 22px #0003;text-shadow:none;pointer-events:auto;transition:transform .18s,filter .18s}
.pp-reel-open:active{transform:scale(.97);filter:brightness(.95)}
.pp-reel-actions{position:absolute;z-index:5;left:12px;bottom:calc(30px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:15px}
.pp-reel-action{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:52px;padding:0;border:0;background:transparent;color:#fff;cursor:pointer;text-shadow:0 2px 8px #0009;transition:transform .18s,opacity .18s}
.pp-reel-action:active{transform:scale(.88)}.pp-reel-action:disabled{opacity:.5}
.pp-reel-action .pp-reel-action-icon{width:47px;height:47px;border:1px solid #ffffff50;border-radius:50%;background:rgba(7,16,13,.48);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:grid;place-items:center;font-size:21px;box-shadow:0 6px 18px #0002;transition:background .2s,border-color .2s,transform .2s}
.pp-reel-action .pp-reel-action-label{font-size:10px;font-weight:800;color:#fff}.pp-reel-action.is-active .pp-reel-action-icon{background:linear-gradient(135deg,#a92636,#e74b5b);border-color:#ffb7bf;animation:ppHeartPop .28s ease}.pp-reel-action.is-saved .pp-reel-action-icon{background:linear-gradient(135deg,#c29436,#f0d48a);color:#172f22;border-color:#ffe7aa}
@keyframes ppHeartPop{50%{transform:scale(1.16)}}
.pp-reel-feedback{position:fixed;z-index:100;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,14px);opacity:0;pointer-events:none;max-width:calc(100vw - 36px);padding:11px 16px;border-radius:999px;background:rgba(10,19,15,.92);border:1px solid #ffffff25;color:#fff;font-size:13px;font-weight:800;box-shadow:0 12px 36px #0005;transition:opacity .2s,transform .2s;backdrop-filter:blur(12px);white-space:normal;text-align:center}.pp-reel-feedback.show{opacity:1;transform:translate(-50%,0)}.pp-reel-feedback.success{border-color:#70d3a0}.pp-reel-feedback.error{border-color:#f19a9a}.pp-reel-media-error{position:absolute;z-index:7;left:50%;top:42%;transform:translateX(-50%);width:min(300px,calc(100% - 40px));border:1px solid #ffffff45;border-radius:14px;padding:12px 14px;background:#171d19e8;color:#fff;font:800 12px/1.6 Tahoma,sans-serif;box-shadow:0 12px 32px #0005;cursor:pointer}.pp-reel-media-error[hidden]{display:none}
.pp-reels-state{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;box-sizing:border-box;color:#fff;background:radial-gradient(ellipse at top,#163b2c,#07120f 68%)}.pp-reels-state-card{width:min(360px,100%);padding:28px 22px;border-radius:26px;border:1px solid #ffffff1f;background:#ffffff0c;box-shadow:0 18px 55px #0003;backdrop-filter:blur(14px)}.pp-reels-state-icon{font-size:48px;margin-bottom:10px}.pp-reels-state h2{font-family:'Cairo',Tahoma,sans-serif;font-size:20px;margin:0 0 8px;color:#fff}.pp-reels-state p{font-size:13px;line-height:1.8;color:#d8e0da;margin:0 0 17px}.pp-reels-retry{border:0;border-radius:13px;padding:12px 18px;background:linear-gradient(135deg,#f5d996,#d4a54f);color:#173b2b;font-weight:900;cursor:pointer}
.pp-reels-loading{display:grid;gap:12px;justify-items:center}.pp-reels-spinner{width:36px;height:36px;border:3px solid #ffffff30;border-top-color:#f5d996;border-radius:50%;animation:ppReelsSpin .8s linear infinite}@keyframes ppReelsSpin{to{transform:rotate(360deg)}}
@media(min-width:700px){.pp-reels-feed{max-width:500px;margin:0 auto;border-left:1px solid #ffffff10;border-right:1px solid #ffffff10}.pp-reels-top{left:50%;right:auto;width:min(500px,100%);transform:translateX(-50%);box-sizing:border-box}.pp-reel{height:100dvh}.pp-reel-video{object-fit:cover}.pp-reel-info{right:18px;left:86px}.pp-reel-actions{left:calc(50% - 230px)}}
@media(max-height:620px){.pp-reel-info{bottom:calc(16px + env(safe-area-inset-bottom))}.pp-reel-actions{bottom:calc(18px + env(safe-area-inset-bottom));gap:9px}.pp-reel-action .pp-reel-action-icon{width:40px;height:40px}.pp-reel-desc{max-height:42px}.pp-reel-open{padding:9px 13px;margin-top:8px}}
@media(prefers-reduced-motion:reduce){.pp-reels-feed{scroll-behavior:auto}.pp-reel-action,.pp-reel-feedback,.pp-reel-center{transition:none!important;animation:none!important}}
</style>
</head>
<body class="pp-reels-page">
<header class="pp-reels-top"><div><div class="pp-reels-brand">فلسطين <span>بلاتفورم</span> 🎬</div><small id="ppReelCategory" class="pp-reels-category">فيديوهات من فلسطين</small></div><a class="pp-reels-back" href="index.html">⌂ الرئيسية</a></header>
<main id="ppReelsFeed" class="pp-reels-feed" aria-label="ريلز الإعلانات"><section class="pp-reels-state"><div class="pp-reels-state-card"><div class="pp-reels-loading"><div class="pp-reels-spinner"></div><p>نجهّز لك الفيديوهات…</p></div></div></section></main>
<div id="ppReelFeedback" class="pp-reel-feedback" role="status" aria-live="polite"></div>
<script>
(()=>{
'use strict';
const db=window.ppClient, feed=document.getElementById('ppReelsFeed'), feedback=document.getElementById('ppReelFeedback');
const params=new URLSearchParams(location.search), category=(params.get('category')||'').trim();
let user=null, items=[], observer=null, toastTimer=null, loading=false;
const liked=new Set(), saved=new Set(), viewed=new Set();
const visibilityRatios=new Map();let activeReel=null;let lastActiveReelId=null;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function message(text,type='info',duration=2500){feedback.textContent=text;feedback.className='pp-reel-feedback show '+type;clearTimeout(toastTimer);toastTimer=setTimeout(()=>feedback.classList.remove('show'),duration)}
function state(icon,title,description,button='إعادة المحاولة'){feed.innerHTML=`<section class="pp-reels-state"><div class="pp-reels-state-card"><div class="pp-reels-state-icon">${icon}</div><h2>${esc(title)}</h2><p>${esc(description)}</p><button class="pp-reels-retry" id="ppReelsRetry">${esc(button)}</button></div></section>`;document.getElementById('ppReelsRetry').onclick=load}
async function load(){if(loading)return;loading=true;try{if(!db)throw new Error('لم يتم تهيئة الاتصال بقاعدة البيانات. حدّث الصفحة أو تحقق من ملف platform.js.');const auth=await db.auth.getUser();user=auth.data?.user||null;let q=db.from('ads').select('*').eq('status','active').not('video_url','is',null).order('created_at',{ascending:false}).limit(36);if(category)q=q.eq('category',category);const result=await q;if(result.error)throw result.error;items=(result.data||[]).filter(a=>typeof a.video_url==='string'&&a.video_url.trim());if(!items.length){state('🎬','لا توجد فيديوهات الآن',category?'لا توجد فيديوهات منشورة في هذا التصنيف حتى الآن.':'عندما ينشر المستخدمون فيديوهات إعلانية ستظهر هنا.','تحديث الفيديوهات');return}
if(user){const ids=items.map(a=>a.id);try{const [l,f]=await Promise.all([db.from('ad_video_likes').select('ad_id').eq('user_id',user.id).in('ad_id',ids),db.from('favorites').select('ad_id').eq('user_id',user.id).in('ad_id',ids)]);(l.data||[]).forEach(x=>liked.add(x.ad_id));(f.data||[]).forEach(x=>saved.add(x.ad_id))}catch(e){console.debug('Reel state unavailable',e)}}
render();setupObserver();}catch(e){console.error('Reels load error',e);state('⚠️','تعذّر تحميل الريلز',e.message||'تحقق من اتصال الإنترنت وصلاحيات قراءة الإعلانات.');}finally{loading=false}}
function render(){document.getElementById('ppReelCategory').textContent=category?'التصنيف: '+category:'فيديوهات وإعلانات من فلسطين';feed.innerHTML=items.map((a,i)=>`<article class="pp-reel" data-id="${esc(a.id)}" data-index="${i}"><video class="pp-reel-video" src="${esc(a.video_url)}" playsinline webkit-playsinline loop muted preload="none" disablepictureinpicture aria-label="${esc(a.title||'فيديو إعلاني')}" poster="${esc(a.thumbnail_url||a.cover_image||'')}"></video><div class="pp-reel-shade"></div><button class="pp-reel-center" aria-label="تشغيل الفيديو" title="تشغيل أو إيقاف الفيديو">▶</button><section class="pp-reel-info"><h2 class="pp-reel-title">${esc(a.title||'إعلان من فلسطين')}</h2><div class="pp-reel-meta"><span>📍 ${esc(a.city||'فلسطين')}</span><span class="pp-reel-pill">فيديو إعلاني</span></div><div class="pp-reel-desc">${esc(a.description||'اكتشف تفاصيل هذا الإعلان')}</div><a class="pp-reel-open" href="ad-details.html?id=${encodeURIComponent(a.id)}">عرض تفاصيل الإعلان <span>←</span></a></section><div class="pp-reel-actions"><button class="pp-reel-action ${liked.has(a.id)?'is-active':''}" data-action="like" data-id="${esc(a.id)}" aria-label="إعجاب"><span class="pp-reel-action-icon">${liked.has(a.id)?'❤️':'🤍'}</span><span class="pp-reel-action-label">إعجاب</span></button><button class="pp-reel-action ${saved.has(a.id)?'is-saved':''}" data-action="save" data-id="${esc(a.id)}" aria-label="حفظ الإعلان"><span class="pp-reel-action-icon">${saved.has(a.id)?'🔖':'☆'}</span><span class="pp-reel-action-label">حفظ</span></button><button class="pp-reel-action" data-action="mute" aria-label="تشغيل أو كتم الصوت"><span class="pp-reel-action-icon">🔇</span><span class="pp-reel-action-label">الصوت</span></button><button class="pp-reel-action" data-action="share" data-id="${esc(a.id)}" aria-label="مشاركة الإعلان"><span class="pp-reel-action-icon">↗</span><span class="pp-reel-action-label">مشاركة</span></button></div></article>`).join('');}
feed.addEventListener('error',e=>{const v=e.target;if(!(v instanceof HTMLVideoElement)||v.dataset.ppErrorHandled)return;v.dataset.ppErrorHandled='1';const reel=v.closest('.pp-reel');if(!reel)return;setPlayButton(reel,false);let note=reel.querySelector('.pp-reel-media-error');if(!note){note=document.createElement('button');note.type='button';note.className='pp-reel-media-error';note.textContent='تعذّر تحميل الفيديو — أعد المحاولة';note.addEventListener('click',()=>{delete v.dataset.ppErrorHandled;v.load();playReel(reel,true)});reel.appendChild(note)}note.hidden=false;},true);
function setPlayButton(reel,playing){const b=reel?.querySelector('.pp-reel-center');if(!b)return;b.textContent=playing?'Ⅱ':'▶';b.classList.toggle('is-playing',playing);b.setAttribute('aria-label',playing?'إيقاف الفيديو':'تشغيل الفيديو')}
function pauseAll(except){feed.querySelectorAll('video').forEach(v=>{if(v!==except){v.pause();setPlayButton(v.closest('.pp-reel'),false)}})}
async function playReel(reel,fromGesture=false){const v=reel?.querySelector('video');if(!v)return;pauseAll(v);activeReel=reel;lastActiveReelId=reel.dataset.id;v.preload='auto';const next=reel.nextElementSibling?.querySelector('video');if(next)next.preload='auto';const prev=reel.previousElementSibling?.querySelector('video');if(prev)prev.preload='metadata';try{const p=v.play();if(p&&p.then)await p;if(activeReel!==reel){v.pause();setPlayButton(reel,false);return}setPlayButton(reel,true);if(!viewed.has(reel.dataset.id)){viewed.add(reel.dataset.id);recordView(reel.dataset.id)}}catch(e){setPlayButton(reel,false);if(fromGesture)message('تعذّر تشغيل الفيديو. اضغط مرة أخرى أو تحقق من الاتصال.','error');}}
function togglePlay(reel){const v=reel?.querySelector('video');if(!v)return;if(v.paused){playReel(reel,true)}else{v.pause();setPlayButton(reel,false);if(activeReel===reel)activeReel=null}}
function setupObserver(){if(observer)observer.disconnect();visibilityRatios.clear();observer=new IntersectionObserver(entries=>{entries.forEach(e=>visibilityRatios.set(e.target,e.isIntersecting?e.intersectionRatio:0));let best=null,bestRatio=0;visibilityRatios.forEach((ratio,reel)=>{if(ratio>bestRatio){best=reel;bestRatio=ratio}});if(best&&bestRatio>=.62){if(activeReel!==best||best.querySelector('video')?.paused)playReel(best,false)}else if(activeReel){pauseAll(null);activeReel=null}
  // Keep the immediate next video warm, while other offscreen videos do not compete for bandwidth.
  feed.querySelectorAll('.pp-reel').forEach(reel=>{const v=reel.querySelector('video');if(!v)return;if(reel===best||reel===best?.nextElementSibling)v.preload='auto';else if(reel!==activeReel)v.preload='none'});
},{threshold:[0,.2,.4,.62,.8,1]});feed.querySelectorAll('.pp-reel').forEach(r=>observer.observe(r))}
async function recordView(id){if(!db)return;try{await db.from('ad_video_views').insert({ad_id:id,user_id:user?.id||null})}catch(e){/* تسجيل المشاهدة اختياري ولا يوقف تشغيل الفيديو */}}
function requireLogin(action){if(user)return true;message('سجّل الدخول لاستخدام ميزة '+action,'info');setTimeout(()=>location.href='login.html?next='+encodeURIComponent('reels.html'+location.search),650);return false}
async function toggleLike(button,id){if(!requireLogin('الإعجاب'))return;if(button.dataset.busy==='1')return;button.dataset.busy='1';button.disabled=true;try{if(liked.has(id)){const r=await db.from('ad_video_likes').delete().eq('ad_id',id).eq('user_id',user.id);if(r.error)throw r.error;liked.delete(id);button.classList.remove('is-active');button.querySelector('.pp-reel-action-icon').textContent='🤍';message('أزلت الإعجاب','info',1400)}else{const r=await db.from('ad_video_likes').insert({ad_id:id,user_id:user.id});if(r.error&&r.error.code!=='23505')throw r.error;liked.add(id);button.classList.add('is-active');button.querySelector('.pp-reel-action-icon').textContent='❤️';message('تم تسجيل إعجابك ❤️','success',1600)}}catch(e){console.error(e);message('تعذّر تسجيل الإعجاب. تحقق من صلاحيات جدول الإعجابات.','error')}finally{button.dataset.busy='0';button.disabled=false}}
async function toggleSave(button,id){if(!requireLogin('حفظ الإعلان'))return;if(button.dataset.busy==='1')return;button.dataset.busy='1';button.disabled=true;try{if(saved.has(id)){const r=await db.from('favorites').delete().eq('ad_id',id).eq('user_id',user.id);if(r.error)throw r.error;saved.delete(id);button.classList.remove('is-saved');button.querySelector('.pp-reel-action-icon').textContent='☆';message('أزيل الإعلان من المحفوظات','info',1600)}else{const r=await db.from('favorites').insert({ad_id:id,user_id:user.id});if(r.error&&r.error.code!=='23505')throw r.error;saved.add(id);button.classList.add('is-saved');button.querySelector('.pp-reel-action-icon').textContent='🔖';message('تم حفظ الإعلان','success',1600)}}catch(e){console.error(e);message('تعذّر حفظ الإعلان. حاول مرة أخرى.','error')}finally{button.dataset.busy='0';button.disabled=false}}
async function share(id){const url=new URL('ad-details.html?id='+encodeURIComponent(id),location.href).href;try{if(navigator.share){await navigator.share({title:'إعلان من فلسطين بلاتفورم',url});return}if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(url)}else{const ta=document.createElement('textarea');ta.value=url;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();if(!ok)throw new Error('copy failed')}message('تم نسخ رابط الإعلان 📋','success')}catch(e){if(e.name!=='AbortError'){console.warn(e);message('لم تتم المشاركة. حاول نسخ الرابط من تفاصيل الإعلان.','error')}}}
feed.addEventListener('click',e=>{const play=e.target.closest('.pp-reel-center');if(play){togglePlay(play.closest('.pp-reel'));return}const action=e.target.closest('[data-action]');if(!action)return;const id=action.dataset.id,kind=action.dataset.action;if(kind==='mute'){const reel=action.closest('.pp-reel'),v=reel.querySelector('video');v.muted=!v.muted;action.querySelector('.pp-reel-action-icon').textContent=v.muted?'🔇':'🔊';action.querySelector('.pp-reel-action-label').textContent=v.muted?'الصوت':'كتم الصوت';action.setAttribute('aria-label',v.muted?'تشغيل الصوت':'كتم الصوت');if(!v.muted){playReel(reel,true);message('تم تشغيل الصوت','success',1200)}return}if(kind==='like')toggleLike(action,id);if(kind==='save')toggleSave(action,id);if(kind==='share')share(id)});
feed.addEventListener('click',e=>{if(e.target.matches('.pp-reel-video'))togglePlay(e.target.closest('.pp-reel'))});
feed.addEventListener('dblclick',e=>{if(e.target.matches('.pp-reel-video')){const b=e.target.closest('.pp-reel')?.querySelector('[data-action="like"]');if(b)toggleLike(b,b.dataset.id)}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseAll(null)});
document.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){const reels=[...feed.querySelectorAll('.pp-reel')];if(!reels.length)return;const active=reels.reduce((best,r)=>Math.abs(r.getBoundingClientRect().top)<Math.abs(best.getBoundingClientRect().top)?r:best,reels[0]);const i=reels.indexOf(active)+(e.key==='ArrowDown'?1:-1);if(reels[i]){e.preventDefault();reels[i].scrollIntoView({behavior:'smooth',block:'start'})}}else if(e.code==='Space'&&!['A','BUTTON','INPUT','TEXTAREA'].includes(document.activeElement?.tagName)){e.preventDefault();const r=[...feed.querySelectorAll('.pp-reel')].find(x=>Math.abs(x.getBoundingClientRect().top)<window.innerHeight*.4);if(r)togglePlay(r)}});
load();
})();
</script><script src="app-ui.js" defer></script>
</body></html>
