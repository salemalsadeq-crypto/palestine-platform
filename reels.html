<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ريلز الإعلانات - فلسطين بلاتفورم</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><style>*{box-sizing:border-box}html,body{margin:0;background:#05080d;color:#fff;font-family:Arial,Tahoma,sans-serif}body{min-height:100vh}.top{position:fixed;top:0;left:0;right:0;z-index:20;padding:12px 14px;background:linear-gradient(#000b,transparent);display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;font-size:18px}.brand span{color:#e33}.back{color:#fff;text-decoration:none;background:#ffffff18;border:1px solid #ffffff22;padding:8px 11px;border-radius:10px}.feed{height:100vh;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior-y:contain}.reel{height:100vh;min-height:560px;position:relative;scroll-snap-align:start;background:#101820;display:flex;align-items:center;justify-content:center}.reel video{width:100%;height:100%;object-fit:cover;background:#000}.shade{position:absolute;inset:0;background:linear-gradient(transparent 35%,#000b 100%);pointer-events:none}.info{position:absolute;right:16px;left:82px;bottom:34px;z-index:3}.title{font-size:20px;font-weight:800;margin-bottom:8px}.meta{font-size:13px;color:#d6dce5;margin-bottom:8px}.desc{font-size:13px;line-height:1.5;color:#f0f2f5;max-height:60px;overflow:hidden}.actions{position:absolute;left:13px;bottom:32px;z-index:4;display:flex;flex-direction:column;gap:12px}.act{width:52px;height:52px;border-radius:50%;border:1px solid #ffffff30;background:#0008;color:#fff;display:flex;align-items:center;justify-content:center;font-size:23px;cursor:pointer}.act small{position:absolute;margin-top:69px;font-size:10px;color:#fff}.act.active{background:#b51f2a}.open{display:inline-block;margin-top:12px;background:#fff;color:#111;text-decoration:none;padding:10px 14px;border-radius:10px;font-weight:800;border:0}.center{position:absolute;z-index:2;width:68px;height:68px;border-radius:50%;border:0;background:#ffffffdd;color:#172033;font-size:25px;display:flex;align-items:center;justify-content:center;cursor:pointer}.hint{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:30;background:#0009;border:1px solid #ffffff22;padding:7px 11px;border-radius:99px;font-size:11px;color:#ddd}.empty{height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;color:#ddd}.error{max-width:360px;line-height:1.7}@media(min-width:700px){.feed{max-width:520px;margin:auto}.top{max-width:520px;margin:auto}.reel{height:100vh}}</style><script src="platform.js"></script><link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="theme-v47.css"><link rel="stylesheet" href="theme-v48.css"></head><body><div class="top"><div class="brand">فلسطين <span>بلاتفورم</span> 🎬</div><a class="back" href="index.html">الرئيسية</a></div><main id="feed" class="feed"><div class="empty">جاري تحميل الفيديوهات...</div></main><div class="hint">اسحب للأعلى ⬆️ للفيديو التالي</div><script>
const SUPABASE_URL='https://sesbumfedusbjevbsyzl.supabase.co';
const SUPABASE_KEY='sb_publishable_0sJrbh73jLip3O5OtJkc_A_9F6OPWqR';
const REST=SUPABASE_URL+'/rest/v1/';
let user=null,items=[];const db=window.ppClient;
const feed=document.getElementById('feed');
const esc=x=>String(x??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function api(path,options={}){const h=Object.assign({'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'},options.headers||{});const r=await fetch(REST+path,Object.assign({},options,{headers:h}));let data=null;try{data=await r.json()}catch(e){}if(!r.ok)throw new Error(data?.message||data?.hint||('HTTP '+r.status));return data}
async function getUser(){try{const r=await db.auth.getUser();user=r.data?.user||null}catch(e){user=null}return user}
async function load(){try{await getUser();const path='ads?select=*&video_url=not.is.null&order=created_at.desc&limit=50';items=await api(path);items=(Array.isArray(items)?items:[]).filter(a=>a.video_url&&(!a.status||a.status==='active'));if(!items.length){feed.innerHTML='<div class="empty">🎬 لا توجد فيديوهات إعلانية منشورة بعد.<br><br><a class="open" href="add-ad.html">أضف أول فيديو</a></div>';return}render();setupObserver()}catch(e){console.error(e);feed.innerHTML='<div class="empty"><div class="error">❌ تعذر تحميل الريلز.<br>قد تكون صلاحيات جدول الإعلانات تمنع القراءة.<br><small>'+esc(e.message||'خطأ غير معروف')+'</small><br><br><button class="open" onclick="location.reload()">إعادة المحاولة</button></div></div>'}}
function render(){feed.innerHTML=items.map(a=>`<article class="reel" data-id="${esc(a.id)}"><video src="${esc(a.video_url)}" playsinline loop preload="metadata" controlslist="nodownload"></video><div class="shade"></div><button class="center" onclick="togglePlay(this)">▶</button><div class="info"><div class="title">${esc(a.title||'إعلان')}</div><div class="meta">${esc(a.city||'فلسطين')} • إعلان فيديو</div><div class="desc">${esc(a.description||'')}</div><a class="open" href="ad-details.html?id=${encodeURIComponent(a.id)}">عرض الإعلان</a></div><div class="actions"><button class="act like" onclick="like(this,'${esc(a.id)}')">🤍<small>إعجاب</small></button><button class="act save" onclick="save(this,'${esc(a.id)}')">🔖<small>حفظ</small></button><button class="act" onclick="share('${esc(a.id)}')">↗️<small>مشاركة</small></button></div></article>`).join('')}
function togglePlay(b){const v=b.closest('.reel').querySelector('video');if(v.paused){v.play().catch(()=>{});b.textContent='❚❚'}else{v.pause();b.textContent='▶'}}
async function recordView(id){try{await api('ad_video_views',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({ad_id:id,user_id:user?.id||null})})}catch(e){}}
async function like(b,id){if(!user){if(confirm('يجب تسجيل الدخول للإعجاب. هل تريد تسجيل الدخول؟'))location.href='login.html';return}if(b.disabled)return;b.disabled=true;try{const q=await db.from('ad_video_likes').select('id').eq('ad_id',id).eq('user_id',user.id).maybeSingle();if(q.error)throw q.error;if(q.data){const r=await db.from('ad_video_likes').delete().eq('id',q.data.id);if(r.error)throw r.error;b.classList.remove('active');b.firstChild.textContent='🤍'}else{const r=await db.from('ad_video_likes').insert({ad_id:id,user_id:user.id});if(r.error){if(r.error.code==='23505'){const again=await db.from('ad_video_likes').select('id').eq('ad_id',id).eq('user_id',user.id).maybeSingle();if(again.error)throw again.error;b.classList.add('active');b.firstChild.textContent='❤️'}else throw r.error}else{b.classList.add('active');b.firstChild.textContent='❤️'}}}catch(e){console.error(e);alert('تعذر تحديث الإعجاب: '+(e.message||'تحقق من صلاحيات جدول الإعجابات.'))}finally{b.disabled=false}}
async function save(b,id){if(!user){if(confirm('يجب تسجيل الدخول للحفظ. هل تريد تسجيل الدخول؟'))location.href='login.html';return}try{const q=await db.from('favorites').select('id').eq('ad_id',id).eq('user_id',user.id).limit(1);if(q.error)throw q.error;if(q.data?.length){const r=await db.from('favorites').delete().eq('id',q.data[0].id);if(r.error)throw r.error;b.classList.remove('active')}else{const r=await db.from('favorites').insert({ad_id:id,user_id:user.id});if(r.error)throw r.error;b.classList.add('active')}}catch(e){console.error(e);alert('تعذر تحديث الحفظ: '+(e.message||'تحقق من الصلاحيات.'))}}
async function share(id){const url=location.origin+location.pathname.replace('reels.html','ad-details.html')+'?id='+encodeURIComponent(id);try{if(navigator.share)await navigator.share({title:'إعلان من فلسطين بلاتفورم',url});else{await navigator.clipboard.writeText(url);alert('تم نسخ رابط الإعلان')}}catch(e){}}
function setupObserver(){const obs=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target.querySelector('video'),b=e.target.querySelector('.center');if(e.isIntersecting&&e.intersectionRatio>.7){v.play().then(()=>b.textContent='❚❚').catch(()=>b.textContent='▶');recordView(e.target.dataset.id)}else{v.pause();b.textContent='▶'}}),{threshold:[.7]});document.querySelectorAll('.reel').forEach(x=>obs.observe(x))}
load();
</script><script src="app-ui.js" defer></script>
</body></html>
