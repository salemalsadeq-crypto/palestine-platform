<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تسجيل الدخول - فلسطين بلاتفورم</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fa;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    width: 100%;
    max-width: 430px;
    background: white;
    padding: 35px;
    border-radius: 16px;
    box-shadow: 0 5px 25px #0002;
}

h1 {
    text-align: center;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 25px;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 7px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #111;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 25px;
    border: none;
    border-radius: 8px;
    background: #111;
    color: white;
    font-size: 17px;
    cursor: pointer;
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.message {
    margin-top: 15px;
    text-align: center;
    line-height: 1.7;
    min-height: 30px;
}

.links {
    text-align: center;
    margin-top: 20px;
}

.links a {
    color: #111;
    text-decoration: none;
}

.links a:hover {
    text-decoration: underline;
}
</style>

</head>

<body>

<div class="container">

    <h1>🇵🇸 تسجيل الدخول</h1>

    <p class="subtitle">
        مرحبًا بك في فلسطين بلاتفورم
    </p>

    <form id="loginForm">

        <label for="email">
            البريد الإلكتروني
        </label>

        <input
            type="email"
            id="email"
            placeholder="example@email.com"
            autocomplete="email"
            required
        >

        <label for="password">
            كلمة المرور
        </label>

        <input
            type="password"
            id="password"
            placeholder="كلمة المرور"
            autocomplete="current-password"
            required
        >

        <button
            type="submit"
            id="loginButton"
        >
            تسجيل الدخول
        </button>

    </form>

    <div id="message" class="message"></div>

    <div class="links">

        <a href="register.html">
            ليس لديك حساب؟ إنشاء حساب
        </a>

        <br><br>

        <a href="index.html">
            العودة إلى الرئيسية
        </a>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0" crossorigin="anonymous"></script>

<script>
const supabaseClient=window.ppClient;
const form=document.getElementById('loginForm'),button=document.getElementById('loginButton'),message=document.getElementById('message');
(async()=>{const {data}=await supabaseClient.auth.getSession();if(data?.session) location.replace('index.html')})();
form.addEventListener('submit',async e=>{e.preventDefault();message.textContent='';button.disabled=true;button.textContent='جاري تسجيل الدخول...';try{const email=document.getElementById('email').value.trim();const password=document.getElementById('password').value;if(!email||!password)throw Error('أدخل البريد الإلكتروني وكلمة المرور.');const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});if(error)throw error;if(!data.session)throw Error('تم التحقق لكن لم يتم إنشاء جلسة. أعد المحاولة.');message.style.color='green';message.textContent='✅ تم تسجيل الدخول بنجاح';await new Promise(r=>setTimeout(r,250));location.replace('index.html')}catch(err){message.style.color='red';const m=(err.message||'').toLowerCase();message.textContent=m.includes('invalid login')?'❌ البريد الإلكتروني أو كلمة المرور غير صحيحة':m.includes('email not confirmed')?'❌ يجب تأكيد البريد الإلكتروني أولاً':'❌ '+(err.message||'حدث خطأ')}finally{button.disabled=false;button.textContent='تسجيل الدخول'}});
</script>

</body>
    </html>
