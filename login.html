<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تسجيل الدخول - فلسطين بلاتفورم</title>

<link rel="stylesheet" href="app.css"><link rel="stylesheet" href="theme-v47.css"><link rel="stylesheet" href="theme-v48.css">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fa;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    width: 100%;
    max-width: 430px;
    background: white;
    padding: 35px;
    border-radius: 16px;
    box-shadow: 0 5px 25px #0002;
}

h1 {
    text-align: center;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 25px;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 7px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #111;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 25px;
    border: none;
    border-radius: 8px;
    background: #111;
    color: white;
    font-size: 17px;
    cursor: pointer;
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.message {
    margin-top: 15px;
    text-align: center;
    line-height: 1.7;
    min-height: 30px;
}

.links {
    text-align: center;
    margin-top: 20px;
}

.links a {
    color: #111;
    text-decoration: none;
}

.links a:hover {
    text-decoration: underline;
}
</style>

</head>

<body>

<div class="container">

    <h1>🇵🇸 تسجيل الدخول</h1>

    <p class="subtitle">
        مرحبًا بك في فلسطين بلاتفورم
    </p>

    <form id="loginForm">

        <label for="email">
            البريد الإلكتروني
        </label>

        <input
            type="email"
            id="email"
            placeholder="example@email.com"
            autocomplete="email"
            required
        >

        <label for="password">
            كلمة المرور
        </label>

        <input
            type="password"
            id="password"
            placeholder="كلمة المرور"
            autocomplete="current-password"
            required
        >

        <button
            type="submit"
            id="loginButton"
        >
            تسجيل الدخول
        </button>

    </form>

    <div
        id="message"
        class="message"
    ></div>

    <div class="links">

        <a href="register.html">
            ليس لديك حساب؟ إنشاء حساب
        </a>

        <br><br>

        <a href="index.html">
            العودة إلى الرئيسية
        </a>

    </div>

</div>


<!-- =========================================================
     SUPABASE
     ========================================================= -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"
    crossorigin="anonymous">
</script>


<!-- =========================================================
     LOGIN
     ========================================================= -->

<script>

document.addEventListener(
    'DOMContentLoaded',
    function () {

        const form =
            document.getElementById(
                'loginForm'
            );

        const button =
            document.getElementById(
                'loginButton'
            );

        const message =
            document.getElementById(
                'message'
            );


        /* -----------------------------------------
           التأكد من وجود عناصر الصفحة
           ----------------------------------------- */

        if (
            !form ||
            !button ||
            !message
        ) {

            console.error(
                'Login elements not found'
            );

            return;
        }


        /* -----------------------------------------
           التأكد من تحميل Supabase
           ----------------------------------------- */

        if (
            !window.supabase ||
            typeof window.supabase.createClient !==
            'function'
        ) {

            message.style.color =
                'red';

            message.textContent =
                '❌ تعذر تحميل خدمة تسجيل الدخول. تحقق من اتصال الإنترنت ثم أعد المحاولة.';

            console.error(
                'Supabase library not loaded'
            );

            return;
        }


        /* -----------------------------------------
           إنشاء Supabase Client
           ----------------------------------------- */

        const client =
            window.supabase.createClient(

                'https://sesbumfedusbjevbsyzl.supabase.co',

                'sb_publishable_0sJrbh73jLip3O5OtJkc_A_9F6OPWqR',

                {
                    auth: {

                        persistSession: true,

                        autoRefreshToken: true,

                        detectSessionInUrl: true

                    }
                }
            );


        /*
         * إتاحة العميل لبقية المنصة
         */

        window.ppClient =
            client;


        /* -----------------------------------------
           فحص الجلسة الحالية
           ----------------------------------------- */

        client.auth
            .getSession()
            .then(function (result) {

                console.log(
                    'SESSION:',
                    result
                );

                if (
                    result &&
                    result.data &&
                    result.data.session
                ) {

                    window.location.href =
                        'index.html';
                }

            })
            .catch(function (error) {

                console.error(
                    'Session error:',
                    error
                );

            });


        /* -----------------------------------------
           تسجيل الدخول
           ----------------------------------------- */

        form.addEventListener(
            'submit',
            async function (event) {

                event.preventDefault();


                const email =
                    document
                        .getElementById(
                            'email'
                        )
                        .value
                        .trim();


                const password =
                    document
                        .getElementById(
                            'password'
                        )
                        .value;


                /* ---------------------------------
                   التحقق من البيانات
                   --------------------------------- */

                if (
                    !email ||
                    !password
                ) {

                    message.style.color =
                        'red';

                    message.textContent =
                        '❌ أدخل البريد الإلكتروني وكلمة المرور.';

                    return;
                }


                /* ---------------------------------
                   حالة التحميل
                   --------------------------------- */

                button.disabled =
                    true;

                button.textContent =
                    'جاري تسجيل الدخول...';

                message.textContent =
                    '';


                try {


                    /* -----------------------------
                       تنفيذ تسجيل الدخول
                       ----------------------------- */

                    const result =
                        await client.auth
                            .signInWithPassword({

                                email:
                                    email,

                                password:
                                    password

                            });


                    console.log(
                        'LOGIN RESULT:',
                        result
                    );


                    /* -----------------------------
                       Supabase Error
                       ----------------------------- */

                    if (
                        result &&
                        result.error
                    ) {

                        throw result.error;
                    }


                    /* -----------------------------
                       التأكد من وجود Session
                       ----------------------------- */

                    if (
                        !result ||
                        !result.data ||
                        !result.data.session
                    ) {

                        throw new Error(
                            'تم التحقق لكن لم يتم إنشاء جلسة تسجيل الدخول.'
                        );
                    }


                    /* -----------------------------
                       نجاح
                       ----------------------------- */

                    message.style.color =
                        'green';

                    message.textContent =
                        '✅ تم تسجيل الدخول بنجاح';


                    /*
                     * إعطاء Supabase لحظة
                     * لحفظ الجلسة
                     */

                    await new Promise(
                        function (
                            resolve
                        ) {

                            setTimeout(
                                resolve,
                                500
                            );

                        }
                    );


                    /*
                     * الانتقال للرئيسية
                     */

                    window.location.href =
                        'index.html';


                } catch (error) {


                    console.error(
                        'LOGIN ERROR:',
                        error
                    );


                    message.style.color =
                        'red';


                    const errorMessage =
                        String(
                            error &&
                            error.message
                                ? error.message
                                : ''
                        );


                    const lower =
                        errorMessage
                            .toLowerCase();


                    if (
                        lower.includes(
                            'invalid login'
                        )
                    ) {

                        message.textContent =
                            '❌ البريد الإلكتروني أو كلمة المرور غير صحيحة';

                    }

                    else if (
                        lower.includes(
                            'email not confirmed'
                        )
                    ) {

                        message.textContent =
                            '❌ يجب تأكيد البريد الإلكتروني أولاً';

                    }

                    else if (
                        lower.includes(
                            'failed to fetch'
                        )
                    ) {

                        message.textContent =
                            '❌ تعذر الاتصال بالخادم. تحقق من اتصال الإنترنت.';

                    }

                    else {

                        message.textContent =
                            '❌ ' +
                            (
                                errorMessage ||
                                'حدث خطأ أثناء تسجيل الدخول'
                            );

                    }

                }


                finally {

                    button.disabled =
                        false;

                    button.textContent =
                        'تسجيل الدخول';

                }

            }
        );

    }
);

</script>


<!-- =========================================================
     PLATFORM
     ========================================================= -->

<script src="platform.js"></script>


<!-- =========================================================
     APP UI
     ========================================================= -->

<script
    src="app-ui.js"
    defer>
</script>

</body>
</html>
