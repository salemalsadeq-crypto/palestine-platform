<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تسجيل الدخول - فلسطين بلاتفورم</title>

<link rel="stylesheet" href="app.css">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fa;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    width: 100%;
    max-width: 430px;
    background: white;
    padding: 35px;
    border-radius: 16px;
    box-shadow: 0 5px 25px #0002;
}

h1 {
    text-align: center;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 25px;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 7px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #111;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 25px;
    border: none;
    border-radius: 8px;
    background: #111;
    color: white;
    font-size: 17px;
    cursor: pointer;
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.message {
    margin-top: 15px;
    text-align: center;
    line-height: 1.7;
    min-height: 30px;
}

.links {
    text-align: center;
    margin-top: 20px;
}

.links a {
    color: #111;
    text-decoration: none;
}

.links a:hover {
    text-decoration: underline;
}
</style>
</head>

<body>

<div class="container">

    <h1>🇵🇸 تسجيل الدخول</h1>

    <p class="subtitle">
        مرحبًا بك في فلسطين بلاتفورم
    </p>

    <form id="loginForm">

        <label for="email">
            البريد الإلكتروني
        </label>

        <input
            type="email"
            id="email"
            placeholder="example@email.com"
            autocomplete="email"
            required
        >

        <label for="password">
            كلمة المرور
        </label>

        <input
            type="password"
            id="password"
            placeholder="كلمة المرور"
            autocomplete="current-password"
            required
        >

        <button
            type="submit"
            id="loginButton"
        >
            تسجيل الدخول
        </button>

    </form>

    <div id="message" class="message"></div>

    <div class="links">

        <a href="register.html">
            ليس لديك حساب؟ إنشاء حساب
        </a>

        <br><br>

        <a href="index.html">
            العودة إلى الرئيسية
        </a>

    </div>

</div>

<!-- Supabase يجب أن يأتي أولًا -->
<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"
    crossorigin="anonymous">
</script>

<script>
(function () {

    'use strict';

    const SUPABASE_URL =
        "https://sesbumfedusbjevbsyzl.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_0sJrbh73jLip3O5OtJkc_A_9F6OPWqR";

    /*
     * إنشاء عميل مستقل لتسجيل الدخول.
     * لا نعتمد على platform.js هنا.
     */
    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY,
            {
                auth: {
                    persistSession: true,
                    autoRefreshToken: true,
                    detectSessionInUrl: true
                }
            }
        );

    /*
     * نجعل العميل متاحًا أيضًا لبقية المنصة.
     */
    window.ppClient = supabaseClient;

    const form =
        document.getElementById('loginForm');

    const button =
        document.getElementById('loginButton');

    const message =
        document.getElementById('message');

    /*
     * إذا كانت هناك جلسة بالفعل،
     * لا نطلب تسجيل الدخول مرة أخرى.
     */
    (async function checkSession () {

        try {

            const result =
                await supabaseClient.auth.getSession();

            if (result?.data?.session) {
                window.location.replace(
                    'index.html'
                );
            }

        } catch (error) {

            console.warn(
                'Session check failed:',
                error
            );

        }

    })();

    /*
     * تسجيل الدخول
     */
    form.addEventListener(
        'submit',
        async function (event) {

            event.preventDefault();

            message.textContent = '';

            button.disabled = true;
            button.textContent =
                'جاري تسجيل الدخول...';

            try {

                const email =
                    document
                        .getElementById('email')
                        .value
                        .trim();

                const password =
                    document
                        .getElementById('password')
                        .value;

                if (!email || !password) {
                    throw new Error(
                        'أدخل البريد الإلكتروني وكلمة المرور.'
                    );
                }

                const result =
                    await supabaseClient.auth
                        .signInWithPassword({
                            email: email,
                            password: password
                        });

                if (result.error) {
                    throw result.error;
                }

                if (!result.data?.session) {
                    throw new Error(
                        'تم التحقق لكن لم يتم إنشاء جلسة. أعد المحاولة.'
                    );
                }

                message.style.color =
                    'green';

                message.textContent =
                    '✅ تم تسجيل الدخول بنجاح';

                /*
                 * نعطي Supabase لحظة لحفظ الجلسة.
                 */
                await new Promise(
                    function (resolve) {
                        setTimeout(
                            resolve,
                            300
                        );
                    }
                );

                window.location.replace(
                    'index.html'
                );

            } catch (error) {

                console.error(
                    'Login error:',
                    error
                );

                message.style.color =
                    'red';

                const text =
                    String(
                        error?.message || ''
                    ).toLowerCase();

                if (
                    text.includes(
                        'invalid login'
                    )
                ) {

                    message.textContent =
                        '❌ البريد الإلكتروني أو كلمة المرور غير صحيحة';

                } else if (
                    text.includes(
                        'email not confirmed'
                    )
                ) {

                    message.textContent =
                        '❌ يجب تأكيد البريد الإلكتروني أولاً';

                } else {

                    message.textContent =
                        '❌ ' +
                        (
                            error?.message ||
                            'حدث خطأ أثناء تسجيل الدخول'
                        );
                }

            } finally {

                button.disabled = false;

                button.textContent =
                    'تسجيل الدخول';

            }

        }
    );

})();
</script>

<!-- platform.js بعد إنشاء العميل -->
<script src="platform.js"></script>

<script src="app-ui.js" defer></script>

</body>
</html>
