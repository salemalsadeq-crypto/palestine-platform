<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة مقدم الخدمة | فلسطين بلاتفورم</title><link rel="stylesheet" href="app.css">
<style>
body{margin:0;background:#f5f8fc;color:#172033;font-family:Arial,Tahoma,sans-serif}.wrap{max-width:1000px;margin:auto;padding:0 15px}.top{padding:14px 0}.top a{text-decoration:none;color:#123b68;font-weight:900}.hero{background:linear-gradient(135deg,#0d2c4d,#1d5b96);color:#fff;padding:25px 0}.hero h1{margin:0 0 6px}.hero p{margin:0;color:#dceaf7;font-size:12px;line-height:1.8}.card{background:#fff;border:1px solid #e1e9f1;border-radius:18px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{display:block;font-weight:800;color:#44566c;font-size:13px}input,select,textarea{width:100%;box-sizing:border-box;padding:11px;margin-top:6px;border:1px solid #d8e2ec;border-radius:10px;font:inherit}textarea{min-height:80px}.btn{border:0;background:#123b68;color:#fff;padding:10px 13px;border-radius:10px;font-weight:800;cursor:pointer}.btn.light{background:#eef4f9;color:#123b68}.req{border:1px solid #e1e9f1;border-radius:15px;padding:14px;margin:8px 0}.muted{color:#708096;font-size:12px;line-height:1.8}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.msg{margin-top:10px;padding:10px;border-radius:10px;font-size:12px}.ok{background:#eaf8f1;color:#13734c}.bad{background:#fff0f1;color:#a51e29}@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap top"><a href="services.html">← مركز الخدمات</a></div>
<section class="hero"><div class="wrap"><h1>🧑‍🔧 لوحة مقدم الخدمة</h1><p>أدر ملفك، حالتك، وطلبات العملاء من مكان واحد.</p></div></section>
<main class="wrap"><div class="card"><h3>ملفي المهني</h3><div class="grid">
<label>نوع الحساب<select id="kind"><option value="individual">مقدم خدمة مستقل</option><option value="company">شركة</option></select></label>
<label>نوع الخدمة<select id="type"><option value="taxi">🚕 تكسي</option><option value="transport">🚐 نقل</option><option value="delivery">📦 توصيل</option><option value="home">🔧 خدمات منزلية</option><option value="food">🍔 طعام</option></select></label>
<label>المدينة<input id="city"></label><label>الاسم/الاسم الظاهر<input id="display_name"></label><label id="companyWrap">اسم الشركة<input id="company_name"></label>
<label>رقم الهاتف<input id="contact_phone"></label><label>التخصص<input id="specialization"></label><label>مناطق التغطية<input id="coverage_area"></label>
<label class="full">وصف الخدمة<textarea id="description"></textarea></label>
<label id="vehicleWrap">نوع المركبة<input id="vehicle_type"></label><label id="vehicleNumWrap">رقم المركبة<input id="vehicle_number"></label>
<label id="capacityWrap">عدد الركاب<input id="passenger_capacity" type="number" min="1" max="100"></label><label id="priceWrap">السعر الأساسي<input id="base_price" type="number" min="0" step="0.01"></label>
<label>الحالة<select id="availability"><option value="true">🟢 متاح الآن</option><option value="false">⚪ غير متاح</option></select><small class="muted">عند اختيار «متاح» سيظهر ملفك لطلبات التكسي والنقل.</small></label>
</div><div class="actions"><button class="btn" id="save">حفظ التغييرات</button><a class="btn light" href="provider-register.html" style="text-decoration:none">تعديل التسجيل</a></div><div id="msg"></div></div>
<div class="card"><h3>📥 الطلبات المتاحة</h3><div id="list">جاري التحميل...</div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><script src="platform.js"></script>
<script>
const $=id=>document.getElementById(id);let uid=null;
function notice(t,ok=false){$('msg').textContent=t;$('msg').className=ok?'msg ok':'msg bad'}
function toggle(){const on=['taxi','transport'].includes($('type').value);['vehicleWrap','vehicleNumWrap','capacityWrap','priceWrap'].forEach(x=>$(x).style.display=on?'block':'none');$('companyWrap').style.display=$('kind').value==='company'?'block':'none'}
$('type').onchange=toggle;$('kind').onchange=toggle;
async function init(){const u=await ppUser();if(!u){location.href='login.html?next='+encodeURIComponent(location.href);return}uid=u.id;const r=await ppClient.from('service_providers').select('*').eq('user_id',uid).maybeSingle();if(r.error){notice(r.error.message);return}if(!r.data){location.href='provider-register.html';return}const p=r.data;['kind','type','city','display_name','company_name','contact_phone','specialization','coverage_area','description','vehicle_type','vehicle_number','passenger_capacity','base_price'].forEach(k=>{const db={kind:'provider_kind',type:'service_type'}[k]||k;$(k).value=p[db]??''});$('availability').value=String((p.is_available===true)||(p.is_active===true));toggle();load()}
$('save').onclick=async()=>{const transport=['taxi','transport'].includes($('type').value);const available=$('availability').value==='true';let gps={latitude:null,longitude:null};if(available&&navigator.geolocation){try{const pos=await new Promise((resolve,reject)=>navigator.geolocation.getCurrentPosition(resolve,reject,{enableHighAccuracy:true,timeout:10000,maximumAge:30000}));gps={latitude:pos.coords.latitude,longitude:pos.coords.longitude}}catch(e){notice('تم الحفظ، لكن تعذر تحديد موقعك. فعّل الموقع ليظهر قربك للعملاء.');}}const payload={provider_kind:$('kind').value,service_type:$('type').value,city:$('city').value.trim()||null,display_name:$('display_name').value.trim()||null,company_name:$('company_name').value.trim()||null,contact_phone:$('contact_phone').value.trim()||null,specialization:$('specialization').value.trim()||null,coverage_area:$('coverage_area').value.trim()||null,description:$('description').value.trim()||null,vehicle_type:transport?($('vehicle_type').value.trim()||null):null,vehicle_number:transport?($('vehicle_number').value.trim()||null):null,passenger_capacity:transport&&$('passenger_capacity').value!==''?Number($('passenger_capacity').value):null,base_price:transport&&$('base_price').value!==''?Number($('base_price').value):null,is_active:available,is_available:available,latitude:gps.latitude,longitude:gps.longitude};const r=await ppClient.from('service_providers').update(payload).eq('user_id',uid);if(r.error){notice(r.error.message);return}notice('تم حفظ التغييرات ✓',true);load()}
async function load(){const type=$('type').value;const r=await ppClient.from('service_requests').select('*').eq('type',type).in('status',['pending','accepted','in_progress']).order('created_at',{ascending:false}).limit(30);if(r.error){$('list').textContent=r.error.message;return}if(!r.data?.length){$('list').innerHTML='<div class="muted">لا توجد طلبات متاحة حاليًا.</div>';return}$('list').innerHTML=r.data.map(x=>'<div class="req"><b>'+({taxi:'🚕',transport:'🚐',delivery:'📦',home:'🔧',food:'🍔'}[x.type]||'⚡')+' '+(x.city||'')+'</b> <span class="muted">— '+x.status+'</span><div class="muted">من: '+(x.from_location||'—')+'<br>إلى: '+(x.to_location||'—')+'<br>عدد الأشخاص: '+(x.people_count||1)+'<br>'+(x.details||'')+'</div>'+(x.status==='pending'?'<button class="btn" onclick="acceptReq(\''+x.id+'\')">قبول الطلب</button>':(x.provider_id===uid?'<div class="actions"><button class="btn" onclick="updateReq(\''+x.id+'\',\'in_progress\')">بدء التنفيذ</button><button class="btn" onclick="updateReq(\''+x.id+'\',\'completed\')">إكمال الطلب</button></div>':''))+'</div>').join('')}
window.acceptReq=async id=>{const r=await ppClient.rpc('accept_service_request',{p_request_id:id});if(r.error){notice(r.error.message);return}notice('تم قبول الطلب ✓',true);load()};window.updateReq=async(id,status)=>{const r=await ppClient.rpc('update_my_service_request',{p_request_id:id,p_status:status,p_note:null});if(r.error){notice(r.error.message);return}notice('تم تحديث الطلب ✓',true);load()};
init();
</script></body></html>
