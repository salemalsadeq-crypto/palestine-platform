<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مقدم الخدمة | فلسطين بلاتفورم</title><link rel="stylesheet" href="app.css"><style>body{background:#f5f8fc}.wrapx{max-width:1000px;margin:24px auto;padding:0 15px}.card{background:#fff;border:1px solid #e1e9f1;border-radius:18px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{display:block;font-weight:800;color:#44566c;font-size:13px}input,select{width:100%;box-sizing:border-box;padding:11px;margin-top:6px;border:1px solid #d8e2ec;border-radius:10px;font:inherit}.req{border:1px solid #e1e9f1;border-radius:15px;padding:14px;margin:8px 0}.btn{border:0;background:#123b68;color:#fff;padding:10px 13px;border-radius:10px;font-weight:800;cursor:pointer}.btn.light{background:#eef4f9;color:#123b68}.danger{background:#b51f2a}.muted{color:#708096;font-size:13px;line-height:1.8}.locbox{background:#f7fafc;border:1px dashed #c8d7e6;border-radius:12px;padding:12px;margin-top:12px;font-size:12px;color:#5d6e82}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrapx"><h1>🧑‍🔧 لوحة مقدم الخدمة</h1><div class="card"><h3>بيانات مقدم الخدمة</h3><p class="muted">فعّل نوع الخدمة وأدخل بياناتك. للتاكسي احفظ موقعك الحالي حتى يظهر ترتيبك حسب المسافة.</p><div class="grid"><label>نوع الخدمة<select id="type"><option value="taxi">تاكسي</option><option value="delivery">توصيل</option><option value="home">خدمات منزلية</option><option value="food">طعام</option><option value="transport">نقل وشحن</option></select></label><label>المدينة<input id="city" placeholder="المدينة"></label><label>اسم مقدم الخدمة<input id="display_name" placeholder="الاسم الظاهر للعملاء"></label><label>رقم الهاتف<input id="contact_phone" inputmode="tel" placeholder="رقم الهاتف"></label><label id="specializationWrap">التخصص<input id="specialization" placeholder="مثال: تكسي، نقل طلاب، نقل ركاب"></label><label id="capacityWrap">عدد الركاب<input id="passenger_capacity" type="number" min="1" max="100" step="1" placeholder="مثال: 4"></label><label id="vehicleTypeWrap">نوع المركبة<input id="vehicle_type" placeholder="مثال: هيونداي إلنترا"></label><label id="vehicleNumberWrap">رقم المركبة<input id="vehicle_number" placeholder="رقم المركبة"></label><label id="priceWrap">السعر التقريبي<input id="base_price" type="number" min="0" step="0.01" placeholder="₪"></label><label id="availabilityWrap">الحالة<select id="availability"><option value="true">🟢 متاح الآن</option><option value="false">⚪ غير متاح</option></select></label></div><div class="locbox"><b>📍 موقع مقدم الخدمة</b><div id="locText">لم يتم حفظ موقع جغرافي بعد.</div><div class="actions"><button class="btn light" id="locateBtn" type="button">📍 حفظ موقعي الحالي</button><button class="btn light" id="clearLocBtn" type="button">مسح الموقع</button></div></div><button class="btn" id="save" type="button" style="margin-top:12px">حفظ وتفعيل مقدم الخدمة</button><div id="msg"></div></div><div class="card"><h3>الطلبات المتاحة</h3><div id="list">جاري التحميل...</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><script src="platform.js"></script><script>
const list=document.getElementById('list'),msg=document.getElementById('msg'),type=document.getElementById('type'),city=document.getElementById('city'),display_name=document.getElementById('display_name'),contact_phone=document.getElementById('contact_phone'),specialization=document.getElementById('specialization'),passenger_capacity=document.getElementById('passenger_capacity'),vehicle_type=document.getElementById('vehicle_type'),vehicle_number=document.getElementById('vehicle_number'),base_price=document.getElementById('base_price'),availability=document.getElementById('availability'),locText=document.getElementById('locText');
let latitude=null,longitude=null;const labels={taxi:'🚕',delivery:'📦',home:'🔧',food:'🍔',transport:'🚚'};
function setMsg(t,ok=false){msg.textContent=t;msg.style.cssText='margin-top:10px;padding:10px;border-radius:10px;background:'+(ok?'#eaf8f1':'#fff0f1')+';color:'+(ok?'#13734c':'#a51e29')}
function toggleTaxi(){const on=['taxi','transport'].includes(type.value);['vehicleTypeWrap','vehicleNumberWrap','priceWrap','specializationWrap','capacityWrap','availabilityWrap'].forEach(id=>document.getElementById(id).style.display=on?'block':'none')}
function renderLoc(){locText.textContent=latitude!=null&&longitude!=null?'تم حفظ الموقع: '+latitude.toFixed(6)+', '+longitude.toFixed(6):'لم يتم حفظ موقع جغرافي بعد.'}
async function getLocation(){if(!navigator.geolocation){setMsg('المتصفح لا يدعم تحديد الموقع.');return}const b=document.getElementById('locateBtn');b.disabled=true;b.textContent='جاري تحديد الموقع...';navigator.geolocation.getCurrentPosition(pos=>{latitude=pos.coords.latitude;longitude=pos.coords.longitude;renderLoc();b.disabled=false;b.textContent='📍 حفظ موقعي الحالي'},err=>{setMsg('تعذر تحديد الموقع. اسمح للموقع من إعدادات المتصفح.');b.disabled=false;b.textContent='📍 حفظ موقعي الحالي'},{enableHighAccuracy:true,timeout:10000,maximumAge:0})}
document.getElementById('locateBtn').onclick=getLocation;document.getElementById('clearLocBtn').onclick=()=>{latitude=null;longitude=null;renderLoc()};type.onchange=toggleTaxi;
async function init(){const u=await ppUser();if(!u){location.href='login.html?next='+encodeURIComponent(location.href);return}const r=await ppClient.from('service_providers').select('*').eq('user_id',u.id).maybeSingle();if(r.error){setMsg(r.error.message)}const p=r.data;if(p){type.value=p.service_type||'taxi';city.value=p.city||'';display_name.value=p.display_name||'';contact_phone.value=p.contact_phone||'';vehicle_type.value=p.vehicle_type||'';vehicle_number.value=p.vehicle_number||'';base_price.value=p.base_price??'';specialization.value=p.specialization||'';passenger_capacity.value=p.passenger_capacity??'';availability.value=String(p.is_active!==false);latitude=p.latitude??null;longitude=p.longitude??null;renderLoc()}toggleTaxi();await load()}
document.getElementById('save').onclick=async()=>{const u=await ppUser();if(!u){location.href='login.html';return}const payload={user_id:u.id,service_type:type.value,city:city.value.trim()||null,display_name:display_name.value.trim()||null,contact_phone:contact_phone.value.trim()||null,vehicle_type:['taxi','transport'].includes(type.value)?(vehicle_type.value.trim()||null):null,vehicle_number:['taxi','transport'].includes(type.value)?(vehicle_number.value.trim()||null):null,base_price:['taxi','transport'].includes(type.value)&&base_price.value!==''?Number(base_price.value):null,specialization:['taxi','transport'].includes(type.value)?(specialization.value.trim()||null):null,passenger_capacity:['taxi','transport'].includes(type.value)&&passenger_capacity.value!==''?Number(passenger_capacity.value):null,latitude,longitude,is_active:availability.value==='true'};const r=await ppClient.from('service_providers').upsert(payload,{onConflict:'user_id'});if(r.error){setMsg(r.error.message);return}setMsg('تم حفظ بيانات مقدم الخدمة بنجاح ✓',true);await load()};
async function load(){const u=await ppUser();if(!u)return;const r=await ppClient.from('service_requests').select('*').eq('type',type.value).in('status',['pending','accepted','in_progress']).order('created_at',{ascending:false}).limit(30);if(r.error){list.textContent=r.error.message;return}if(!r.data?.length){list.innerHTML='<div class="muted">لا توجد طلبات متاحة حاليًا.</div>';return}list.innerHTML=r.data.map(x=>'<div class="req"><b>'+(labels[x.type]||'⚡')+' '+(x.city||'')+'</b> <span class="muted">— '+x.status+'</span><div class="muted">من: '+(x.from_location||'—')+'<br>إلى: '+(x.to_location||'—')+'<br>'+(x.details||'')+'</div>'+(x.status==='pending'?'<button class="btn" onclick="acceptReq(\''+x.id+'\')">قبول الطلب</button>':(x.provider_id===u.id?' <button class="btn" onclick="updateReq(\''+x.id+'\',\'in_progress\')">بدء التنفيذ</button> <button class="btn" onclick="updateReq(\''+x.id+'\',\'completed\')">إكمال الطلب</button>':''))+'</div>').join('')}
window.acceptReq=async id=>{const r=await ppClient.rpc('accept_service_request',{p_request_id:id});if(r.error){setMsg(r.error.message);return}setMsg('تم قبول الطلب ✓',true);await load()};window.updateReq=async(id,status)=>{const r=await ppClient.rpc('update_my_service_request',{p_request_id:id,p_status:status,p_note:null});if(r.error){setMsg(r.error.message);return}setMsg('تم تحديث الطلب ✓',true);await load()};
init();
</script></body></html>
