<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مقدم الخدمة | فلسطين بلاتفورم</title><link rel="stylesheet" href="app.css"><style>body{background:#f5f8fc}.wrapx{max-width:1000px;margin:24px auto;padding:0 15px}.card{background:#fff;border:1px solid #e1e9f1;border-radius:18px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.req{border:1px solid #e1e9f1;border-radius:15px;padding:14px}.btn{border:0;background:#123b68;color:#fff;padding:10px 13px;border-radius:10px;font-weight:800;cursor:pointer}.danger{background:#b51f2a}.muted{color:#708096;font-size:13px;line-height:1.8}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrapx"><h1>🧑‍🔧 لوحة مقدم الخدمة</h1><div class="card"><h3>تسجيل كمقدم خدمة</h3><p class="muted">فعّل الأنواع التي تقدمها ليظهر لك الطلب المناسب. التسجيل لا ينشئ إعلانًا.</p><div class="grid"><label>نوع الخدمة<br><select id="type"><option value="taxi">تاكسي</option><option value="delivery">توصيل</option><option value="home">خدمات منزلية</option><option value="food">طعام</option><option value="transport">نقل وشحن</option></select></label><label>المدينة<br><input id="city" placeholder="المدينة"></label></div><button class="btn" id="save">تفعيل مقدم الخدمة</button><div id="msg"></div></div><div class="card"><h3>الطلبات المتاحة</h3><div id="list">جاري التحميل...</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><script src="platform.js"></script><script>
const list=document.getElementById('list');const msg=document.getElementById('msg');const type=document.getElementById('type');const city=document.getElementById('city');const labels={taxi:'🚕',delivery:'📦',home:'🔧',food:'🍔',transport:'🚚'};(async()=>{const u=await ppUser();if(!u){location.href='login.html';return}const {data:p}=await ppClient.from('service_providers').select('*').eq('user_id',u.id).maybeSingle();if(p){type.value=p.service_type;city.value=p.city||''}load()})();document.getElementById('save').onclick=async()=>{const u=await ppUser();const {error}=await ppClient.from('service_providers').upsert({user_id:u.id,service_type:type.value,city:city.value.trim(),is_active:true},{onConflict:'user_id'});msg.textContent=error?error.message:'تم تفعيل حساب مقدم الخدمة ✓';load()};async function load(){const u=await ppUser();if(!u)return;const {data,error}=await ppClient.from('service_requests').select('*').eq('type',type.value).in('status',['pending','accepted','in_progress']).order('created_at',{ascending:false}).limit(30);if(error){list.textContent=error.message;return}if(!data?.length){list.textContent='لا توجد طلبات متاحة حاليًا.';return}list.innerHTML=data.map(r=>'<div class="req"><b>'+labels[r.type]+' '+r.city+'</b><span class="muted"> — '+r.status+'</span><div class="muted">من: '+r.from_location+'<br>إلى: '+(r.to_location||'—')+'<br>'+((r.details||''))+'</div>'+(r.status==='pending'?'<button class="btn" onclick="acceptReq(\''+r.id+'\')">قبول الطلب</button>':(r.provider_id?' <button class="btn" onclick="updateReq(\''+r.id+'\',\'in_progress\')">بدء التنفيذ</button> <button class="btn" onclick="updateReq(\''+r.id+'\',\'completed\')">إكمال الطلب</button>':''))+'</div>').join('')}window.acceptReq=async id=>{const {data,error}=await ppClient.rpc('accept_service_request',{p_request_id:id});if(error){msg.textContent=error.message;return}msg.textContent='تم قبول الطلب ✓';load()};window.updateReq=async(id,status)=>{const {error}=await ppClient.rpc('update_my_service_request',{p_request_id:id,p_status:status,p_note:null});if(error){msg.textContent=error.message;return}msg.textContent='تم تحديث الطلب ✓';load()};</script></body></html>
