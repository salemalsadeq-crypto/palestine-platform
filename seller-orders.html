<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلبات البائع | فلسطين بلاتفورم</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><script src="platform.js"></script><link rel="stylesheet" href="app.css">


<link rel="stylesheet" href="platform-theme-v101.css?v=101">
<link rel="stylesheet" href="ui-system-v102.css?v=102">
<link rel="stylesheet" href="platform-redesign-v104.css?v=104">
</head><body class="pp-redesign"><header><div class="head"><div class="logo">📦 طلبات المبيعات</div></div></header><main style="max-width:1050px;margin:24px auto;padding:0 14px"><div id="app" class="pp-order-card">جاري تحميل طلباتك...</div></main><script>
const db=window.ppClient,$=id=>document.getElementById(id),esc=window.ppEsc;
const labels={pending:'قيد المراجعة',confirmed:'تم التأكيد',preparing:'قيد التجهيز',out_for_delivery:'في الطريق',delivered:'تم التسليم واستلام المبلغ',cancelled:'ملغي'};
const choices={pending:[['confirmed','تأكيد الطلب'],['cancelled','إلغاء الطلب']],confirmed:[['preparing','بدء التجهيز'],['cancelled','إلغاء الطلب']],preparing:[['out_for_delivery','إرساله للتوصيل'],['delivered','تأكيد التسليم واستلام المبلغ'],['cancelled','إلغاء الطلب']],out_for_delivery:[['delivered','تأكيد التسليم واستلام المبلغ']]};
async function load(){const u=await ppUser();if(!u){location.href='login.html?next='+encodeURIComponent(location.href);return}const r=await db.from('orders').select('id,ad_id,buyer_id,seller_id,quantity,total_amount,delivery_method,payment_method,payment_status,order_status,customer_name,customer_phone,city,address,notes,created_at,ads(title)').eq('seller_id',u.id).order('created_at',{ascending:false}).limit(200);if(r.error){$('app').innerHTML='<p>تعذر تحميل الطلبات: '+esc(r.error.message)+'</p>';return}const rows=r.data||[];$('app').innerHTML='<div class="v68-page-head"><div><h1 style="margin:0">طلبات المبيعات</h1><p>تظهر هنا الطلبات الخاصة بإعلاناتك فقط. عند اختيار «تأكيد التسليم واستلام المبلغ» فأنت تؤكد استلام المشتري للطلب واستلامك للمبلغ.</p></div><a class="btn soft" href="orders.html">طلباتي كمشتري</a></div>'+(rows.length?rows.map(o=>'<article class="pp-order-card" style="margin:12px 0"><div style="display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap"><b>'+esc(o.ads?.title||'طلب')+'</b><span class="pp-status '+(o.order_status==='delivered'?'paid':o.order_status==='cancelled'?'failed':'pending')+'">'+esc(labels[o.order_status]||o.order_status)+'</span></div><div class="meta" style="margin-top:8px">'+new Date(o.created_at).toLocaleString('ar-PS')+'<br>المشتري: '+esc(o.customer_name)+' · '+esc(o.customer_phone)+(o.city?' · '+esc(o.city):'')+(o.address?'<br>📍 '+esc(o.address):'')+'<br>الكمية: '+o.quantity+' · الإجمالي: '+Number(o.total_amount).toLocaleString('ar-PS')+' ₪<br>طريقة الدفع: '+(o.payment_method==='online'?'دفع إلكتروني/خارجي':'الدفع عند الاستلام')+' · حالة الدفع: '+esc(o.payment_status)+'</div>'+(o.notes?'<p>ملاحظات: '+esc(o.notes)+'</p>':'')+(choices[o.order_status]?'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">'+choices[o.order_status].map(([v,t])=>'<button class="btn '+(v==='delivered'?'green':'primary')+' seller-action" data-id="'+o.id+'" data-status="'+v+'">'+t+'</button>').join('')+'</div>':'')+'</article>').join(''):'<div style="text-align:center;padding:32px">لا توجد طلبات على إعلاناتك حتى الآن.</div>')}
document.addEventListener('click',async e=>{const b=e.target.closest('.seller-action');if(!b)return;const status=b.dataset.status;if(status==='delivered'&&!(await ppConfirm('هل تؤكد أن المشتري استلم الطلب وأنك استلمت المبلغ؟ سيتم إغلاق الطلب وتسجيل الدفع كمدفوع.',{ok:'نعم، تم التسليم',cancel:'تراجع'})))return;if(status==='cancelled'&&!(await ppConfirm('هل تريد إلغاء هذا الطلب؟',{danger:true,ok:'إلغاء الطلب',cancel:'تراجع'})))return;b.disabled=true;const r=await db.rpc('seller_update_order_status',{p_order_id:b.dataset.id,p_status:status});if(r.error){alert(r.error.message);b.disabled=false;return}alert('تم تحديث حالة الطلب.');load()});
load();setInterval(load,15000);
</script><script src="app-ui.js" defer></script></body></html>
