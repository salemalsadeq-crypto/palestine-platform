<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة مقدم الخدمة | فلسطين بلاتفورم</title><link rel="stylesheet" href="app.css"><style>
:root{--b:#123b68;--b2:#2872b8;--g:#0a956d;--r:#c51f2d;--bg:#f3f7fb;--line:#e1e9f1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#172033;font-family:Arial,Tahoma,sans-serif}.wrap{max-width:980px;margin:auto;padding:0 15px}.top{padding:13px 15px}.top a{color:var(--b);text-decoration:none;font-weight:900}.hero{background:linear-gradient(135deg,#0e3155,#2872b8);color:#fff;padding:23px 0}.hero h1{margin:0 0 5px}.hero p{margin:0;color:#dceaf7;font-size:12px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin:14px 0;box-shadow:0 8px 25px #123b680b}.online{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#eef8f4;border:1px solid #cceee1;border-radius:16px;padding:14px}.online strong{color:#087a58}.switch{position:relative;width:56px;height:31px}.switch input{display:none}.slider{position:absolute;inset:0;background:#b9c5d1;border-radius:30px;cursor:pointer}.slider:before{content:"";position:absolute;width:23px;height:23px;right:4px;top:4px;background:#fff;border-radius:50%;transition:.2s}.switch input:checked+.slider{background:#0a956d}.switch input:checked+.slider:before{transform:translateX(-25px)}.btn{border:0;border-radius:13px;padding:12px 15px;background:var(--b);color:#fff;font-weight:900;font:inherit;cursor:pointer}.btn.soft{background:#eaf3fb;color:var(--b)}.btn.green{background:#eaf8f2;color:#087a58}.btn:disabled{opacity:.55}.req{border:1px solid var(--line);border-radius:17px;padding:14px;margin:9px 0}.reqhead{display:flex;justify-content:space-between;gap:8px}.badge{padding:6px 9px;border-radius:9px;background:#eef5fb;color:var(--b);font-size:10px;font-weight:900}.muted{font-size:11px;color:#718096;line-height:1.8}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.msg{padding:11px;border-radius:12px;font-size:12px;margin-top:9px}.ok{background:#eaf8f2;color:#087a58}.err{background:#fff0f1;color:#a51e29}.section-title{font-size:15px;color:var(--b);margin:0 0 8px}
</style></head><body><div class="wrap top"><a href="services.html">← مركز الخدمات</a></div><section class="hero"><div class="wrap"><h1 id="heroTitle">🧑‍🔧 لوحة مقدم الخدمة</h1><p id="heroDesc">استقبل الطلبات الجديدة وتابع حالتها.</p></div></section><main class="wrap">
<section class="card"><div class="online"><div><strong id="onlineText">غير متاح</strong><div class="muted">عند تفعيل الحالة سيظهر لك عملاء جدد.</div></div><label class="switch"><input id="available" type="checkbox"><span class="slider"></span></label></div><div id="msg"></div></section>
<section class="card"><h3 class="section-title">🆕 طلبات جديدة متاحة</h3><div class="muted">أي طلب هنا لم يقبله أحد بعد — أول من يضغط "قبول" يحصل عليه.</div><div id="newList" style="margin-top:10px">جاري التحميل...</div></section>
<section class="card"><h3 class="section-title">📋 طلباتي الحالية</h3><div id="mineList" style="margin-top:10px">جاري التحميل...</div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><script src="platform.js"></script><script>
const $=id=>document.getElementById(id);let uid=null,myType=null;const esc=window.ppEsc||((x)=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])));
const typeLabels={delivery:['📦 لوحة مقدم التوصيل','استقبل طلبات التوصيل وتابع حالتها.'],home:['🔧 لوحة الخدمات المنزلية','استقبل طلبات الصيانة والخدمات المنزلية.'],food:['🍔 لوحة مقدم الطعام','استقبل طلبات الطعام وتابع حالتها.'],transport:['🚚 لوحة النقل والشحن','استقبل طلبات النقل والشحن وتابع حالتها.']};
const statusLabels={pending:'قيد الانتظار',accepted:'تم القبول',in_progress:'جاري التنفيذ',completed:'مكتمل',cancelled:'ملغى'};
function notice(t,ok=false){$('msg').className='msg '+(ok?'ok':'err');$('msg').textContent=t}
function renderOnline(){$('onlineText').textContent=$('available').checked?'🟢 متاح الآن':'⚪ غير متاح';$('onlineText').style.color=$('available').checked?'#087a58':'#66768a'}
async function loadProfile(){const r=await ppClient.from('service_providers').select('*').eq('user_id',uid).maybeSingle();if(r.error){notice(r.error.message);return}if(!r.data){location.href='provider-register.html';return}const p=r.data;if(p.service_type==='taxi'){location.href='service-provider.html';return}myType=p.service_type;const meta=typeLabels[myType]||['🧑‍🔧 لوحة مقدم الخدمة','استقبل الطلبات وتابع حالتها.'];$('heroTitle').textContent=meta[0];$('heroDesc').textContent=meta[1];$('available').checked=!!p.is_active;renderOnline()}
async function toggleActive(){const on=$('available').checked;const r=await ppClient.from('service_providers').update({is_active:on}).eq('user_id',uid);if(r.error){notice(r.error.message);return}renderOnline();notice(on?'أنت متاح الآن لاستقبال الطلبات ✓':'تم إيقاف استقبال الطلبات.',true);loadRequests()}
function reqCard(x,actionsHtml){return '<div class="req"><div class="reqhead"><b>'+esc(x.city||'—')+'</b><span class="badge">'+(statusLabels[x.status]||x.status)+'</span></div><div class="muted">📍 من: '+esc(x.from_location||'—')+(x.to_location?'<br>🎯 إلى: '+esc(x.to_location):'')+(x.details?'<br>📝 '+esc(x.details):'')+(x.budget?'<br>💰 الميزانية: '+esc(String(x.budget))+' ₪':'')+'<br>📞 '+esc(x.phone||'—')+'</div><div class="actions">'+actionsHtml+'</div></div>'}
async function acceptReq(id){const r=await ppClient.rpc('accept_service_request',{p_request_id:id});if(r.error){notice(r.error.message);return}notice('تم قبول الطلب ✓',true);loadRequests()}
async function advance(id,status){const r=await ppClient.rpc('update_my_service_request',{p_request_id:id,p_status:status,p_note:null});if(r.error){notice(r.error.message);return}notice('تم تحديث حالة الطلب ✓',true);loadRequests()}
async function loadRequests(){if(!myType)return;
const newR=await ppClient.from('service_requests').select('*').eq('type',myType).eq('status','pending').is('provider_id',null).order('created_at',{ascending:false}).limit(50);
if(newR.error){$('newList').textContent=newR.error.message}else{const arr=newR.data||[];$('newList').innerHTML=arr.length?arr.map(x=>reqCard(x,'<button class="btn" onclick="acceptReq(\''+x.id+'\')">قبول الطلب</button>')).join(''):'<div class="muted">لا توجد طلبات جديدة حاليًا.</div>'}
const mineR=await ppClient.from('service_requests').select('*').eq('provider_id',uid).in('status',['accepted','in_progress']).order('created_at',{ascending:false}).limit(50);
if(mineR.error){$('mineList').textContent=mineR.error.message}else{const arr=mineR.data||[];$('mineList').innerHTML=arr.length?arr.map(x=>{const act=x.status==='accepted'?'<button class="btn" onclick="advance(\''+x.id+'\',\'in_progress\')">🚀 بدء التنفيذ</button><button class="btn soft" onclick="advance(\''+x.id+'\',\'cancelled\')">إلغاء</button>':x.status==='in_progress'?'<button class="btn green" onclick="advance(\''+x.id+'\',\'completed\')">✅ إكمال الطلب</button>':'';return reqCard(x,act)}).join(''):'<div class="muted">لا توجد طلبات قيد التنفيذ حاليًا.</div>'}
}
window.acceptReq=acceptReq;window.advance=advance;
$('available').onchange=toggleActive;
async function init(){const u=await ppUser();if(!u){location.href='login.html?next='+encodeURIComponent(location.href);return}uid=u.id;await loadProfile();await loadRequests();setInterval(loadRequests,7000)}
init();
</script></body></html>
