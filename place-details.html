<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تفاصيل المكان</title><style>body{font-family:Arial;background:#f5f7fa;margin:0}.box{max-width:800px;margin:30px auto;background:#fff;padding:22px;border-radius:15px}.btn{display:inline-block;padding:10px 14px;background:#173b68;color:#fff;text-decoration:none;border-radius:8px}</style></head><body><main class="box" id="app">جاري التحميل...</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><script src="platform.js"></script><script>const db=ppClient,app=document.getElementById('app'),esc=ppEsc,id=new URLSearchParams(location.search).get('id');async function load(){if(!id)return app.textContent='رابط غير صحيح';const {data,error}=await db.from('places').select('*').eq('id',id).eq('status','published').maybeSingle();if(error||!data)return app.innerHTML='❌ لم يتم العثور على المكان';app.innerHTML='<h1>📍 '+esc(data.name)+'</h1><p>'+esc(data.category||'')+(data.city?' • '+esc(data.city):'')+'</p><p>'+esc(data.description||'لا يوجد وصف')+'</p><p>العنوان: '+esc(data.address||'غير محدد')+'</p><p>الإحداثيات: '+esc(data.latitude)+', '+esc(data.longitude)+'</p><a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(data.latitude+','+data.longitude)+'">🧭 الاتجاهات</a> <a class="btn" href="map.html">🗺️ الخريطة</a></p>'}load();</script></body></html>
