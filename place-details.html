<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تفاصيل المكان | فلسطين بلاتفورم"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><script src="platform.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f3f6fa;color:#172033}.wrap{max-width:900px;margin:auto;padding:16px}.back{display:inline-block;color:#173b68;font-weight:bold;text-decoration:none;margin:8px 0 14px}.box{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 5px 22px #0000000b}.hero{background:linear-gradient(135deg,#173b68,#245789);color:#fff;padding:26px}.badge{display:inline-block;background:#ffffff20;border:1px solid #ffffff2e;border-radius:999px;padding:7px 11px;font-size:13px}.hero h1{font-size:30px;margin:12px 0 8px}.hero p{margin:6px 0;opacity:.92}.body{padding:22px}.info{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{background:#f7f9fb;border-radius:13px;padding:14px}.item b{display:block;color:#173b68;margin-bottom:6px}.desc{line-height:1.8;color:#4b5563;margin:18px 0}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;background:#173b68;color:#fff;padding:11px 15px;border-radius:10px;font-weight:bold}.btn.secondary{background:#eef2f6;color:#173b68}.error{text-align:center;background:#fff;padding:50px;border-radius:16px;color:#a51d2a}@media(max-width:600px){.hero{padding:20px}.hero h1{font-size:24px}.body{padding:16px}.info{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><a class="back" href="places.html">← العودة إلى دليل الأماكن</a><div id="app">جاري تحميل المكان...</div></main><script>const db=ppClient,app=document.getElementById('app'),esc=ppEsc,id=new URLSearchParams(location.search).get('id');function safeUrl(v){if(!v)return'';try{const u=new URL(v);return ['http:','https:'].includes(u.protocol)?u.href:''}catch(e){return''}}async function load(){if(!id){app.innerHTML='<div class="error">❌ رابط المكان غير صحيح.</div>';return}const {data,error}=await db.from('places').select('*').eq('id',id).eq('status','published').maybeSingle();if(error||!data){app.innerHTML='<div class="error">❌ لم يتم العثور على المكان.</div>';return}const coord=data.latitude!=null&&data.longitude!=null?`${data.latitude},${data.longitude}`:'';const website=safeUrl(data.website);const phone=data.phone?String(data.phone):'';app.innerHTML=`<section class="box"><div class="hero"><span class="badge">📍 ${esc(data.category||'مكان')}</span><h1>${esc(data.name)}</h1><p>🏙️ ${esc(data.city||'المدينة غير محددة')}</p></div><div class="body"><div class="info"><div class="item"><b>العنوان</b>${esc(data.address||'غير محدد')}</div><div class="item"><b>الموقع</b>${coord?esc(coord):'الإحداثيات غير متوفرة'}</div>${phone?`<div class="item"><b>الهاتف</b>${esc(phone)}</div>`:''}${website?`<div class="item"><b>الموقع الإلكتروني</b><a href="${esc(website)}" target="_blank" rel="noopener">فتح الموقع</a></div>`:''}</div><div class="desc">${esc(data.description||'لا يوجد وصف لهذا المكان.')}</div><div class="actions">${coord?`<a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(coord)}">🧭 الحصول على الاتجاهات</a><a class="btn secondary" href="map.html?lat=${encodeURIComponent(data.latitude)}&lon=${encodeURIComponent(data.longitude)}">🗺️ فتح على الخريطة</a>`:''}${phone?`<a class="btn secondary" href="tel:${encodeURIComponent(phone)}">📞 اتصال</a>`:''}${website?`<a class="btn secondary" target="_blank" rel="noopener" href="${esc(website)}">🌐 الموقع الإلكتروني</a>`:''}</div></div></section>`}load();</script></body></html>
