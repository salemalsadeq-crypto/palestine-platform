<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تفاصيل المكان | فلسطين بلاتفورم</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><script src="platform.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f3f6fa;color:#172033}.wrap{max-width:1000px;margin:auto;padding:14px}.back{display:inline-block;color:#173b68;font-weight:bold;text-decoration:none;margin:8px 0 14px}.box{background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 5px 22px #0000000b}.hero{background:linear-gradient(135deg,#173b68,#245789);color:#fff;padding:28px}.topline{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.badge{display:inline-block;background:#ffffff20;border:1px solid #ffffff35;border-radius:999px;padding:7px 11px;font-size:13px}.hero h1{font-size:31px;margin:12px 0 7px}.hero p{margin:6px 0;opacity:.92}.fav{border:0;background:#ffffff18;color:#fff;border:1px solid #ffffff35;border-radius:12px;padding:10px 13px;font-weight:bold;cursor:pointer}.fav.active{background:#fff;color:#b51f2a}.body{padding:22px}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}.quick a,.quick button{border:0;background:#eef3f8;color:#173b68;border-radius:12px;padding:12px 8px;text-align:center;text-decoration:none;font-weight:bold;cursor:pointer}.info{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{background:#f7f9fb;border-radius:13px;padding:14px}.item b{display:block;color:#173b68;margin-bottom:6px}.desc{line-height:1.9;color:#4b5563;margin:18px 0}.section{margin-top:22px;border-top:1px solid #e9edf2;padding-top:18px}.section h2{margin:0 0 12px;font-size:20px;color:#173b68}.hours{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.hour{background:#f7f9fb;border-radius:10px;padding:10px}.map{height:300px;border-radius:14px;overflow:hidden;border:1px solid #dbe3ea}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;background:#173b68;color:#fff;padding:11px 15px;border-radius:10px;font-weight:bold;border:0;cursor:pointer}.btn.secondary{background:#eef2f6;color:#173b68}.empty{text-align:center;background:#f7f9fb;border-radius:12px;padding:20px;color:#667085}.error{text-align:center;background:#fff;padding:50px;border-radius:16px;color:#a51d2a}.note{font-size:13px;color:#667085;line-height:1.7}@media(max-width:700px){.hero{padding:20px}.hero h1{font-size:25px}.body{padding:16px}.quick{grid-template-columns:1fr 1fr}.info,.hours{grid-template-columns:1fr}.map{height:260px}}
</style><link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="theme-v59.css">
</head><body><main class="wrap"><a class="back" href="places.html">← العودة إلى دليل الأماكن</a><div id="app">جاري تحميل المكان...</div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const db=ppClient,app=document.getElementById('app'),esc=ppEsc,id=new URLSearchParams(location.search).get('id');let place=null;function safeUrl(v){if(!v)return'';try{const u=new URL(v);return ['http:','https:'].includes(u.protocol)?u.href:''}catch(e){return''}}function favKey(){return 'pp_place_favs_v1'}function getFavs(){try{return JSON.parse(localStorage.getItem(favKey())||'[]')}catch(e){return[]}}function isFav(){return getFavs().includes(String(id))}function toggleFav(){let a=getFavs(),k=String(id);a=a.includes(k)?a.filter(x=>x!==k):a.concat(k);localStorage.setItem(favKey(),JSON.stringify(a));const b=document.getElementById('fav');if(b){b.classList.toggle('active',a.includes(k));b.textContent=a.includes(k)?'❤️ محفوظ':'🤍 حفظ'}}async function sharePlace(){const url=location.href;if(navigator.share){try{await navigator.share({title:place?.name||'مكان',text:'شاهد هذا المكان على فلسطين بلاتفورم',url})}catch(e){}}else{try{await navigator.clipboard.writeText(url);alert('تم نسخ رابط المكان')}catch(e){alert(url)}}}function hoursHtml(d){let h=d.opening_hours||d.hours||d.working_hours;if(!h)return '<div class="empty">🕒 لم تتم إضافة ساعات العمل بعد.</div>';if(typeof h==='string')return '<div class="item">'+esc(h)+'</div>';if(typeof h==='object'){return '<div class="hours">'+Object.entries(h).map(([k,v])=>'<div class="hour"><b>'+esc(k)+'</b><br>'+esc(String(v))+'</div>').join('')+'</div>'}return '<div class="empty">🕒 لم تتم إضافة ساعات العمل بعد.</div>'}function imageHtml(d){let urls=[];if(Array.isArray(d.image_urls))urls=d.image_urls;else if(d.image_url)urls=[d.image_url];urls=urls.filter(Boolean);if(!urls.length)return '';return '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:20px">'+urls.slice(0,6).map(u=>'<img src="'+esc(u)+'" alt="'+esc(d.name)+'" style="width:100%;height:190px;object-fit:cover;border-radius:14px">').join('')+'</div>'}function mapHtml(d){if(d.latitude==null||d.longitude==null)return '';return '<div class="map" id="placeMap"></div>'}async function load(){if(!id){app.innerHTML='<div class="error">❌ رابط المكان غير صحيح.</div>';return}const {data,error}=await db.from('places').select('*').eq('id',id).eq('status','published').maybeSingle();if(error||!data){app.innerHTML='<div class="error">❌ لم يتم العثور على المكان.</div>';return}place=data;const currentUser=await ppUser();const isOwner=!!currentUser&&currentUser.id===data.user_id;const coord=data.latitude!=null&&data.longitude!=null?`${data.latitude},${data.longitude}`:'';const website=safeUrl(data.website),phone=data.phone?String(data.phone):'',address=data.address||'العنوان غير محدد';const fav=isFav();app.innerHTML='<section class="box"><div class="hero"><div class="topline"><div><span class="badge">📍 '+esc(data.category||'مكان')+'</span><h1>'+esc(data.name||'مكان')+'</h1><p>🏙️ '+esc(data.city||'المدينة غير محددة')+'</p></div><button id="fav" class="fav '+(fav?'active':'')+'">'+(fav?'❤️ محفوظ':'🤍 حفظ')+'</button></div></div><div class="body">'+imageHtml(data)+'<div class="quick">'+(phone?'<a href="tel:'+encodeURIComponent(phone)+'">📞 اتصال</a>':'<span></span>')+(coord?'<a target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(coord)+'">🧭 الاتجاهات</a>':'<span></span>')+'<button id="share">🔗 مشاركة</button><a href="map.html?lat='+encodeURIComponent(data.latitude||'')+'&lon='+encodeURIComponent(data.longitude||'')+'">🗺️ الخريطة</a></div><div class="info"><div class="item"><b>📍 العنوان</b>'+esc(address)+'</div><div class="item"><b>📌 الإحداثيات</b>'+ (coord?esc(coord):'غير متوفرة')+'</div>'+(phone?'<div class="item"><b>☎️ الهاتف</b>'+esc(phone)+'</div>':'')+(website?'<div class="item"><b>🌐 الموقع الإلكتروني</b><a href="'+esc(website)+'" target="_blank" rel="noopener">فتح الموقع</a></div>':'')+'</div><div class="desc">'+esc(data.description||'لا يوجد وصف لهذا المكان.')+'</div><div class="section"><h2>🕒 ساعات العمل</h2>'+hoursHtml(data)+'</div><div class="section"><h2>🗺️ موقع المكان</h2>'+mapHtml(data)+'</div><div class="section"><h2>⭐ التقييمات</h2><div class="empty">⭐ التقييمات والتعليقات ستكون متاحة بعد تفعيل نظام تقييم الأماكن في قاعدة البيانات.</div><p class="note">لا يتم عرض تقييمات وهمية؛ ستظهر هنا فقط التقييمات المحفوظة فعليًا.</p></div><div class="actions">'+(isOwner?'<a class="btn secondary" href="edit-place.html?id='+encodeURIComponent(data.id)+'">✏️ تعديل المكان</a>':'')+(coord?'<a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(coord)+'">🧭 الحصول على الاتجاهات</a>':'')+(phone?'<a class="btn secondary" href="tel:'+encodeURIComponent(phone)+'">📞 اتصال</a>':'')+(website?'<a class="btn secondary" target="_blank" rel="noopener" href="'+esc(website)+'">🌐 الموقع الإلكتروني</a>':'')+'<button class="btn secondary" id="share2">🔗 مشاركة المكان</button></div></div></section>';document.getElementById('fav').onclick=toggleFav;document.getElementById('share').onclick=sharePlace;document.getElementById('share2').onclick=sharePlace;if(data.latitude!=null&&data.longitude!=null){const m=L.map('placeMap').setView([data.latitude,data.longitude],16);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(m);L.marker([data.latitude,data.longitude]).addTo(m).bindPopup('<b>'+esc(data.name)+'</b>').openPopup()}}load();</script><script src="app-ui.js" defer></script>
</body></html>
