<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلبي | فلسطين بلاتفورم</title><link rel="stylesheet" href="app.css"><style>
body{margin:0;background:#f3f7fb;color:#172033;font-family:Arial,Tahoma,sans-serif}.wrap{max-width:820px;margin:auto;padding:0 15px}.top{padding:14px 15px}.top a{color:#123b68;text-decoration:none;font-weight:900}.hero{background:linear-gradient(135deg,#123b68,#2872b8);color:#fff;padding:23px 0}.hero h1{margin:0 0 5px;font-size:21px}.hero p{margin:0;color:#dceaf7;font-size:12px}.card{background:#fff;border:1px solid #e1e9f1;border-radius:20px;padding:16px;margin:14px 0;box-shadow:0 8px 25px #123b680b}.statusbox{display:flex;align-items:center;gap:10px;padding:14px;border-radius:15px;background:#eef5fb}.dot{width:12px;height:12px;border-radius:50%;background:#0a956d}.big{font-size:17px;font-weight:900;color:#123b68}.muted{font-size:11px;color:#718096;line-height:1.8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.item{background:#f7fafc;border-radius:12px;padding:11px}.item small{display:block;color:#718096;font-size:9px}.item b{display:block;margin-top:3px;font-size:12px}.timeline{display:flex;gap:6px;margin:10px 0}.step{flex:1;height:6px;border-radius:5px;background:#e5edf5}.step.on{background:#0a956d}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{border:0;border-radius:13px;padding:12px;font-weight:900;font:inherit;cursor:pointer;text-decoration:none;text-align:center;display:block}.red{background:#c51f2d;color:#fff}.soft{background:#eaf3fb;color:#123b68}.msg{padding:11px;border-radius:12px;font-size:12px}.ok{background:#eaf8f2;color:#087a58}.err{background:#fff0f1;color:#a51e29}@media(max-width:600px){.grid,.actions{grid-template-columns:1fr}}
</style><link rel="stylesheet" href="theme-v61.css">
</head><body><div class="wrap top"><a href="service-requests.html">← طلباتي الخدمية</a></div><section class="hero"><div class="wrap"><h1 id="heroTitle">📋 طلبي</h1><p>متابعة مباشرة لحالة طلبك.</p></div></section><main class="wrap">
<section class="card"><div class="statusbox"><span class="dot" id="dot"></span><div><div class="big" id="statusTitle">جاري التحميل...</div><div class="muted" id="statusText">سنحدّث الحالة تلقائيًا.</div></div></div><div class="timeline"><div class="step" id="s1"></div><div class="step" id="s2"></div><div class="step" id="s3"></div><div class="step" id="s4"></div></div></section>
<section class="card"><div class="grid"><div class="item"><small>مقدم الخدمة</small><b id="pName">لم يُقبل بعد</b></div><div class="item"><small>الهاتف</small><b id="pPhone">—</b></div><div class="item"><small>من</small><b id="from">—</b></div><div class="item"><small>إلى</small><b id="to">—</b></div><div class="item full" style="grid-column:1/-1"><small>التفاصيل</small><b id="details">—</b></div></div></section>
<section class="card"><div class="actions"><a class="btn soft" id="call" href="#">📞 اتصال بمقدم الخدمة</a><button class="btn red" id="cancel">إلغاء الطلب</button></div><div id="msg" style="margin-top:9px"></div></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><script src="platform.js"></script><script>
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),rid=params.get('id');const esc=window.ppEsc||((x)=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])));
const typeTitle={taxi:'🚕 رحلتي',delivery:'📦 طلب التوصيل',home:'🔧 طلب الخدمة المنزلية',food:'🍔 طلب الطعام',transport:'🚚 طلب النقل'};
const labels={pending:['بانتظار قبول مقدم خدمة','تم إرسال طلبك وننتظر أحد مقدمي الخدمة ليقبله.',1],accepted:['تم قبول طلبك ✓','مقدم الخدمة سيبدأ التنفيذ قريبًا.',2],in_progress:['طلبك قيد التنفيذ 🚀','مقدم الخدمة يعمل على طلبك الآن.',3],completed:['اكتمل الطلب ✅','شكرًا لاستخدام فلسطين بلاتفورم.',4],cancelled:['تم إلغاء الطلب','هذا الطلب لم يعد نشطًا.',0]};
async function load(){if(!rid){$('statusTitle').textContent='رابط غير صحيح';return}const r=await ppClient.from('service_requests').select('*').eq('id',rid).maybeSingle();if(r.error||!r.data){$('statusTitle').textContent='تعذر تحميل الطلب';return}const req=r.data;$('heroTitle').textContent=typeTitle[req.type]||'📋 طلبي';const l=labels[req.status]||[req.status,'',0];$('statusTitle').textContent=l[0];$('statusText').textContent=l[1];for(let i=1;i<=4;i++)$('s'+i).classList.toggle('on',i<=l[2]);$('from').textContent=req.from_location||'—';$('to').textContent=req.to_location||'غير محدد';$('details').textContent=req.details||'—';
if(req.provider_id){const p=await ppClient.from('service_providers').select('display_name,company_name,provider_kind,contact_phone').eq('user_id',req.provider_id).maybeSingle();const pd=p.data;$('pName').textContent=pd?(pd.provider_kind==='company'?(pd.company_name||'مقدم خدمة'):(pd.display_name||'مقدم خدمة')):'مقدم خدمة';$('pPhone').textContent=pd?.contact_phone||req.phone||'—';$('call').href=pd?.contact_phone?'tel:'+pd.contact_phone:'#'}else{$('pName').textContent='لم يُقبل بعد';$('pPhone').textContent='—';$('call').href='#'}
$('cancel').style.display=['pending','accepted'].includes(req.status)?'block':'none'}
$('cancel').onclick=async()=>{if(!confirm('هل تريدين إلغاء هذا الطلب؟'))return;$('cancel').disabled=true;const r=await ppClient.rpc('cancel_my_service_request',{p_request_id:rid});const m=$('msg');if(r.error){m.className='msg err';m.textContent=r.error.message}else{m.className='msg ok';m.textContent='تم إلغاء الطلب ✓';load()}$('cancel').disabled=false};
async function init(){const u=await ppUser();if(!u){location.href='login.html?next='+encodeURIComponent(location.href);return}await load();setInterval(load,6000)}init();
</script></body></html>
