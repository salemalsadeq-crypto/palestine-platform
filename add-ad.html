<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>إضافة إعلان - فلسطين بلاتفورم</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f5f7fa;color:#222}header{background:#fff;border-bottom:1px solid #ddd;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.logo{font-weight:800;font-size:22px;color:#173b68}.links{display:flex;gap:8px;flex-wrap:wrap}.links a{padding:8px 12px;border-radius:9px;background:#f1f3f5;color:#333;text-decoration:none}.wrap{width:min(900px,94%);margin:22px auto 50px}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 5px 22px #00000012}.title{text-align:center}.title h1{margin:0 0 8px}.title p{color:#777}.group{margin:14px 0}label{display:block;font-weight:bold;margin-bottom:7px}input,select,textarea{width:100%;padding:12px;border:1px solid #ccd3da;border-radius:10px;font:inherit}textarea{min-height:120px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.filebox{padding:15px;border:2px dashed #ccd3da;border-radius:12px;background:#fafafa}.preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.preview img{width:82px;height:65px;object-fit:cover;border-radius:8px}.btn{width:100%;padding:13px;border:0;border-radius:10px;font-weight:800;font-size:16px;cursor:pointer}.primary{background:#173b68;color:#fff}.secondary{background:#eef2f7;color:#222;margin-top:8px}.msg{text-align:center;margin-top:12px;min-height:24px}.video-preview video{max-width:100%;max-height:260px;border-radius:12px;background:#111;margin-top:10px}@media(max-width:650px){.grid{grid-template-columns:1fr}.links a{font-size:13px}}
</style>
<script src="platform.js"></script><link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="theme-v59.css">
</head>
<body>
<header><div class="logo">فلسطين بلاتفورم</div><div class="links"><a href="index.html">الرئيسية</a><a href="ads.html">الإعلانات</a><a href="my-ads.html">إعلاناتي</a><a href="account.html">حسابي</a></div></header>
<main class="wrap"><div class="title"><h1>➕ إضافة إعلان جديد</h1><p>أدخل بيانات إعلانك ثم انشره مباشرة.</p></div>
<div class="card"><form id="form">
<div class="group"><label>عنوان الإعلان *</label><input id="title" required placeholder="مثال: شقة للبيع في نابلس"></div>
<div class="grid"><div class="group"><label>التصنيف *</label><select id="category" required><option value="">اختر التصنيف</option><option>سيارات</option><option>عقارات</option><option>وظائف</option><option>متاجر</option><option>أجهزة وإلكترونيات</option><option>أثاث ومستلزمات</option><option>مواشي وحيوانات</option><option>ملابس وأغراض شخصية</option><option>بيع وشراء</option><option>إعلانات أخرى</option></select></div><div class="group"><label>المدينة</label><input id="city" placeholder="مثال: نابلس"></div></div>
<div class="grid"><div class="group"><label>السعر بالشيكل</label><input id="price" type="number" min="0" step="0.01"></div><div class="group"><label>رقم الهاتف</label><input id="phone" type="tel"></div></div>
<div class="group"><label>الوصف</label><textarea id="description" placeholder="اكتب تفاصيل الإعلان..."></textarea></div><div class="group" style="padding:14px;background:#f7fafc;border:1px solid #e1e8f0;border-radius:14px"><label>🚚 البيع والتوصيل والدفع</label><div class="grid"><label style="font-weight:600"><input id="deliveryAvailable" type="checkbox" style="width:auto"> أقبل طلبات التوصيل</label><label style="font-weight:600"><input id="allowCod" type="checkbox" checked style="width:auto"> الدفع عند الاستلام</label><label style="font-weight:600"><input id="allowOnline" type="checkbox" style="width:auto"> الدفع الإلكتروني</label><div><label style="font-weight:600">رسوم التوصيل (₪)</label><input id="deliveryFee" type="number" min="0" step="0.01" value="0"></div></div><small style="display:block;margin-top:8px;color:#667085">الدفع الإلكتروني لا يخزن بيانات البطاقة هنا؛ بعد تفعيل حساب التاجر يتم الربط مع بوابة الدفع الرسمية.</small></div>
<div class="group"><label>📍 موقع الإعلان</label><div class="grid"><input id="latitude" type="number" step="any" placeholder="خط العرض"><input id="longitude" type="number" step="any" placeholder="خط الطول"></div><input id="locationName" style="margin-top:8px" placeholder="اسم الموقع أو العنوان (اختياري)"><button type="button" class="btn secondary" id="locate">📍 تحديد موقعي تلقائياً</button></div>
<div class="group filebox"><label>🖼️ صور الإعلان</label><input id="images" type="file" accept="image/jpeg,image/png,image/webp" multiple><small>حتى 5 صور، 5MB للصورة.</small><div id="preview" class="preview"></div></div>
<div class="group filebox"><label>🎬 فيديو الإعلان</label><input id="video" type="file" accept="video/mp4,video/webm,video/quicktime"><small>فيديو واحد حتى 50MB — MP4 / WEBM / MOV.</small><div id="videoPreview" class="video-preview"></div></div>
<button id="submit" class="btn primary" type="submit">🚀 نشر الإعلان</button><div id="msg" class="msg"></div>
</form></div></main>
<script>
const db=window.ppClient;const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search);if(params.get('category'))$('category').value=params.get('category');
$('images').onchange=()=>{$('preview').innerHTML='';[...$('images').files].slice(0,5).forEach(f=>{if(f.size<=5*1024*1024){const i=document.createElement('img');i.src=URL.createObjectURL(f);$('preview').appendChild(i)}})};
$('video').onchange=()=>{const f=$('video').files[0];$('videoPreview').innerHTML='';if(!f)return;if(f.size>50*1024*1024){$('msg').textContent='❌ الفيديو أكبر من 50MB';$('video').value='';return}const v=document.createElement('video');v.src=URL.createObjectURL(f);v.controls=true;v.playsInline=true;$('videoPreview').appendChild(v)};
$('locate').onclick=()=>{if(!navigator.geolocation){alert('المتصفح لا يدعم تحديد الموقع');return}navigator.geolocation.getCurrentPosition(p=>{$('latitude').value=p.coords.latitude.toFixed(7);$('longitude').value=p.coords.longitude.toFixed(7);if(!$('locationName').value)$('locationName').value='موقعي الحالي'},()=>alert('تعذر تحديد الموقع. تأكد من السماح للموقع.'))};
$('form').onsubmit=async e=>{e.preventDefault();const msg=$('msg'),btn=$('submit');btn.disabled=true;btn.textContent='⏳ جاري النشر...';try{const {data:{user},error:ue}=await db.auth.getUser();if(ue||!user){location.href='login.html';return}const files=[...$('images').files],video=$('video').files[0];if(files.length>5)throw Error('الحد الأقصى 5 صور.');for(const f of files){if(f.size>5*1024*1024)throw Error('إحدى الصور أكبر من 5MB.');if(!['image/jpeg','image/png','image/webp'].includes(f.type))throw Error('نوع إحدى الصور غير مدعوم.')}if(video){if(video.size>50*1024*1024)throw Error('الفيديو أكبر من 50MB.');if(!['video/mp4','video/webm','video/quicktime'].includes(video.type))throw Error('صيغة الفيديو غير مدعومة.')}let urls=[];for(const f of files){const ext=f.name.split('.').pop().toLowerCase(),path=`${user.id}/ad_${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;const up=await db.storage.from('ad-images').upload(path,f,{contentType:f.type,upsert:false});if(up.error)throw Error('فشل رفع صورة: '+up.error.message);urls.push(db.storage.from('ad-images').getPublicUrl(path).data.publicUrl)}let videoUrl=null;if(video){const ext=video.name.split('.').pop().toLowerCase(),path=`${user.id}/ad_${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;const up=await db.storage.from('ad-videos').upload(path,video,{contentType:video.type,upsert:false});if(up.error)throw Error('فشل رفع الفيديو: '+up.error.message);videoUrl=db.storage.from('ad-videos').getPublicUrl(path).data.publicUrl}const row={user_id:user.id,title:$('title').value.trim(),category:$('category').value,description:$('description').value.trim()||null,price:$('price').value===''?null:Number($('price').value),city:$('city').value.trim()||null,phone:$('phone').value.trim()||null,latitude:$('latitude').value===''?null:Number($('latitude').value),longitude:$('longitude').value===''?null:Number($('longitude').value),location_name:$('locationName').value.trim()||null,image_urls:urls,video_url:videoUrl,status:'active',delivery_available:$('deliveryAvailable').checked,delivery_fee:Number($('deliveryFee').value||0),allow_cod:$('allowCod').checked,allow_online_payment:$('allowOnline').checked};const r=await db.from('ads').insert(row);if(r.error)throw Error('فشل حفظ الإعلان: '+r.error.message);msg.textContent='✅ تم نشر الإعلان بنجاح';setTimeout(()=>location.href='my-ads.html',800)}catch(err){msg.textContent='❌ '+(err.message||err);btn.disabled=false;btn.textContent='🚀 نشر الإعلان'}};
(async()=>{const {data:{user}}=await db.auth.getUser();if(!user){$('msg').innerHTML='يجب تسجيل الدخول أولاً. <a href="login.html">تسجيل الدخول</a>'}})();
</script><script src="app-ui.js" defer></script>
</body></html>
