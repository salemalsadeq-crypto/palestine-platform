<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلباتي | فلسطين بلاتفورم</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><script src="platform.js"></script><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="theme-v47.css"><link rel="stylesheet" href="theme-v48.css"></head><body><header><div class="head"><div class="logo">🛍️ طلباتي ومشترياتي</div></div></header><main style="max-width:900px;margin:24px auto;padding:0 14px"><div id="app" class="pp-order-card">جاري تحميل الطلبات...</div></main><script>
const db=window.ppClient,$=id=>document.getElementById(id),esc=window.ppEsc;const labels={pending:'قيد المراجعة',confirmed:'تم تأكيد الطلب',preparing:'جاري التجهيز',out_for_delivery:'في الطريق',delivered:'تم التسليم',cancelled:'ملغي'};const payLabels={pending:'بانتظار الدفع',awaiting_gateway:'بانتظار بوابة الدفع',paid:'مدفوع',failed:'فشل الدفع',refunded:'مسترد',cancelled:'ملغي'};
function timeline(s){const steps=['pending','confirmed','preparing','out_for_delivery','delivered'];const idx=steps.indexOf(s);return '<div class="pp-timeline">'+steps.map((x,i)=>'<div class="pp-step '+(i<=idx?'active':'')+'">'+(i+1)+'<br>'+labels[x].replace('قيد المراجعة','طلب')+'</div>').join('')+'</div>'}
async function load(){const u=await ppUser();if(!u){location.href='login.html?next='+encodeURIComponent(location.href);return}const r=await db.from('orders').select('id,ad_id,seller_id,quantity,unit_price,delivery_fee,total_amount,delivery_method,payment_method,payment_provider,payment_status,order_status,customer_name,customer_phone,city,address,notes,created_at,ads(title)').eq('buyer_id',u.id).order('created_at',{ascending:false}).limit(100);if(r.error){$('app').innerHTML='<div class="pp-pay-note">❌ '+esc(r.error.message)+'</div>';return}const rows=r.data||[];if(!rows.length){$('app').innerHTML='<div style="text-align:center;padding:30px">🛍️ لا توجد طلبات بعد.<br><a href="ads.html" class="btn primary" style="display:inline-block;margin-top:12px">تصفح الإعلانات</a></div>';return}$('app').innerHTML='<h1 style="margin-top:0">طلباتي</h1>'+rows.map(o=>'<article class="pp-order-card" style="margin:12px 0"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>🛒 '+esc(o.ads?.title||'طلب')+'</b><span class="pp-status '+(o.payment_status==='paid'?'paid':o.payment_status==='failed'?'failed':'pending')+'">💳 '+esc(payLabels[o.payment_status]||o.payment_status)+'</span></div><div class="meta" style="margin-top:8px">الكمية: '+o.quantity+' · سعر الوحدة: '+Number(o.unit_price).toLocaleString('ar-PS')+' ₪ · التوصيل: '+Number(o.delivery_fee).toLocaleString('ar-PS')+' ₪<br><b>الإجمالي: '+Number(o.total_amount).toLocaleString('ar-PS')+' ₪</b><br>الاستلام: '+(o.delivery_method==='delivery'?'توصيل':'استلام من البائع')+(o.city?' · '+esc(o.city):'')+(o.address?'<br>📍 '+esc(o.address):'')+'</div>'+timeline(o.order_status)+'<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><span class="pp-status '+(o.order_status==='delivered'?'paid':o.order_status==='out_for_delivery'?'ship':'pending')+'">📦 '+esc(labels[o.order_status]||o.order_status)+'</span>'+(o.order_status==='pending'||o.order_status==='confirmed'?'<button class="btn soft pp-cancel" data-id="'+o.id+'">إلغاء الطلب</button>':'')+'</div></article>').join('');document.querySelectorAll('.pp-cancel').forEach(b=>b.onclick=()=>cancelOrder(b.dataset.id))}
async function cancelOrder(id){if(!confirm('هل تريد إلغاء الطلب؟'))return;const r=await db.rpc('cancel_my_order',{p_order_id:id});if(r.error){alert(r.error.message);return}load()};load();
</script><script src="app-ui.js" defer></script></body></html>
