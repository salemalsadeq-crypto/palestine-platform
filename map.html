<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>خريطة فلسطين - فلسطين بلاتفورم</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma;background:#f5f7fa;color:#172033}header{background:#173b68;color:#fff;padding:14px 16px}.head{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center}.logo{font-size:21px;font-weight:bold}.logo span{color:#e34b55}nav a{color:#fff;text-decoration:none;background:#234d7e;border-radius:9px;padding:8px 10px;font-size:12px;margin:2px}.wrap{max-width:1100px;margin:20px auto;padding:0 14px}.box{background:#fff;padding:16px;border-radius:16px;box-shadow:0 3px 14px #0001}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tools>*{padding:10px;border:1px solid #dce4ee;border-radius:9px}.tools button{background:#198754;color:#fff;border:0;font-weight:bold}.map{height:600px;border-radius:14px;overflow:hidden}@media(max-width:600px){.map{height:500px}.logo{font-size:18px}}</style></head><body><header><div class="head"><div class="logo">فلسطين <span>بلاتفورم</span></div><nav><a href="index.html">الرئيسية</a><a href="nearby.html?v=20260920v3">📍 قريب مني</a><a href="account.html">حسابي</a></nav></div></header><main class="wrap"><div class="box"><h1>🗺️ خريطة فلسطين التفاعلية</h1><p>استعرض المواقع والإعلانات التي حدد أصحابها موقعًا جغرافيًا.</p><div class="tools"><select id="category"><option value="">كل الأقسام</option><option>سيارات</option><option>عقارات</option><option>وظائف</option><option>خدمات</option><option>متاجر</option><option>مطاعم</option><option>ترفيه</option></select><input id="city" placeholder="المدينة"><button id="apply">تطبيق</button><a href="nearby.html?v=20260920v3" style="text-decoration:none;background:#eef3f8;color:#173b68">📍 الأماكن القريبة</a></div><div id="count" style="margin:8px 0;font-weight:bold"></div><div id="map" class="map"></div></div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const API='https://sesbumfedusbjevbsyzl.supabase.co/rest/v1/ads?select=id,title,category,city,price,latitude,longitude,location_name,status&status=eq.active&latitude=not.is.null&longitude=not.is.null&order=created_at.desc';const KEY='sb_publishable_0sJrbh73jLip3O5OtJkc_A_9F6OPWqR';const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));let map=L.map('map').setView([31.9,35.2],9),markers=[];const base={"خريطة واضحة":L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{maxZoom:20,attribution:'© OpenStreetMap © CARTO'}),"OpenStreetMap":L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}),"قمر صناعي":L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © Esri'} )};base['خريطة واضحة'].addTo(map);L.control.layers(base,null,{collapsed:false,position:'topright'}).addTo(map);async function load(){markers.forEach(m=>map.removeLayer(m));markers=[];const u=new URL(API);if($('category').value)u.searchParams.set('category','eq.'+$('category').value);if($('city').value.trim())u.searchParams.set('city','ilike.*'+$('city').value.trim()+'*');try{const r=await fetch(u,{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});if(!r.ok)throw new Error('تعذر تحميل المواقع');const data=await r.json();$('count').textContent='عدد المواقع: '+data.length;data.forEach(a=>{const m=L.marker([Number(a.latitude),Number(a.longitude)]).addTo(map);m.bindPopup('<b>'+esc(a.title)+'</b><br>'+esc(a.category||'')+(a.city?'<br>📍 '+esc(a.city):'')+(a.location_name?'<br>'+esc(a.location_name):'')+'<br><a href="ad-details.html?id='+encodeURIComponent(a.id)+'">عرض الإعلان</a>');markers.push(m)});if(data.length)map.fitBounds(L.latLngBounds(data.map(a=>[Number(a.latitude),Number(a.longitude)])),{padding:[25,25]})}catch(e){$('count').textContent='❌ '+e.message}}$('apply').onclick=load;load();</script></body></html>
