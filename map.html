<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>خريطة الإعلانات - فلسطين بلاتفورم</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma;background:#f5f7fa;color:#172033}header{background:#173b68;color:#fff;padding:14px 20px}.head{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.logo{font-size:22px;font-weight:bold}.logo span{color:#b51f2a}nav a{color:#fff;text-decoration:none;margin:3px;padding:8px 10px;background:#234d7e;border-radius:8px;font-size:13px}.wrap{max-width:1100px;margin:25px auto;padding:0 16px}.box{background:#fff;padding:18px;border-radius:14px;box-shadow:0 3px 14px #0001}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.filters>*{padding:10px;border:1px solid #ddd;border-radius:8px}.map{height:620px;border-radius:12px;overflow:hidden}@media(max-width:600px){.map{height:500px}}</style></head><body><header><div class="head"><div class="logo">فلسطين <span>بلاتفورم</span></div><nav><a href="index.html">الرئيسية</a><a href="ads.html">الإعلانات</a><a href="shops.html">المتاجر</a><a href="account.html">حسابي</a></nav></div></header><main class="wrap"><div class="box"><h1>🗺️ خريطة الإعلانات</h1><p>الإعلانات التي يحدد أصحابها موقعاً تظهر هنا.</p><div class="filters"><select id="category"><option value="">كل الأقسام</option><option>سيارات</option><option>عقارات</option><option>وظائف</option><option>خدمات</option><option>متاجر</option><option>أجهزة وإلكترونيات</option><option>أثاث ومستلزمات</option><option>مواشي وحيوانات</option><option>ملابس وأغراض شخصية</option><option>بيع وشراء</option><option>إعلانات أخرى</option></select><input id="city" placeholder="المدينة"><button id="apply">تطبيق</button></div><div id="map" class="map"></div><div id="count" style="margin-top:10px;font-weight:bold"></div></div></main><script>const SUPABASE_URL='https://sesbumfedusbjevbsyzl.supabase.co',KEY='sb_publishable_0sJrbh73jLip3O5OtJkc_A_9F6OPWqR',db=supabase.createClient(SUPABASE_URL,KEY);let map,markers=[];const $=id=>document.getElementById(id);function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}async function load(){if(!map){map=L.map('map').setView([31.9,35.2],9);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map)}markers.forEach(m=>map.removeLayer(m));markers=[];let q=db.from('ads').select('id,title,category,city,price,latitude,longitude,location_name').not('latitude','is',null).not('longitude','is',null);if($('category').value)q=q.eq('category',$('category').value);if($('city').value.trim())q=q.ilike('city','%'+$('city').value.trim()+'%');const r=await q.order('created_at',{ascending:false});if(r.error){$('count').textContent='❌ '+r.error.message;return}const data=r.data||[];$('count').textContent='عدد المواقع: '+data.length;data.forEach(a=>{const m=L.marker([a.latitude,a.longitude]).addTo(map);m.bindPopup(`<b>${esc(a.title)}</b><br>${esc(a.category)}${a.city?'<br>📍 '+esc(a.city):''}<br>${a.location_name?esc(a.location_name)+'<br>':''}<a href="ad-details.html?id=${encodeURIComponent(a.id)}">عرض الإعلان</a>`);markers.push(m)});if(data.length){map.fitBounds(L.latLngBounds(data.map(a=>[a.latitude,a.longitude])),{padding:[30,30]})}}$('apply').onclick=load;load();</script></body></html>
