<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الخريطة الذكية | فلسطين بلاتفورم</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma;background:#f4f7fb;color:#172033}.head{background:#173b68;color:#fff;padding:13px 16px;position:relative;z-index:1000}.headin{max-width:1300px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}.logo{font-size:20px;font-weight:700}.nav a{color:#fff;text-decoration:none;background:#234d7e;padding:8px 10px;border-radius:9px;margin:2px;font-size:13px}.wrap{max-width:1300px;margin:auto;padding:12px}.toolbar{background:#fff;border-radius:15px;padding:11px;box-shadow:0 2px 12px #0001;display:grid;grid-template-columns:minmax(220px,1fr) auto auto auto;gap:8px;margin-bottom:10px}.search{display:flex;gap:7px}.search input,.toolbar select{width:100%;padding:11px;border:1px solid #dce3ec;border-radius:10px;font-size:14px;outline:0}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:700;cursor:pointer}.primary{background:#173b68;color:#fff}.green{background:#198754;color:#fff}.soft{background:#eef3f8;color:#173b68}.chips{display:flex;gap:7px;overflow:auto;padding:3px 1px 9px}.chip{white-space:nowrap;border:1px solid #d9e1eb;background:#fff;color:#33445a;border-radius:20px;padding:8px 12px;cursor:pointer;font-weight:700}.chip.active{background:#173b68;color:#fff;border-color:#173b68}.layout{display:grid;grid-template-columns:1fr 340px;gap:10px}.mapbox{height:calc(100vh - 190px);min-height:520px;border-radius:16px;overflow:hidden;box-shadow:0 2px 12px #0001;background:#ddd;position:relative}.panel{background:#fff;border-radius:16px;box-shadow:0 2px 12px #0001;overflow:hidden;display:flex;flex-direction:column;max-height:calc(100vh - 190px)}.panelhead{padding:14px;border-bottom:1px solid #edf1f5}.status{font-size:13px;color:#66758a;margin-top:6px}.results{overflow:auto;padding:9px}.card{border:1px solid #e1e7ef;border-radius:12px;padding:11px;margin-bottom:8px;background:#fff}.card b{display:block;font-size:15px;margin-bottom:5px}.meta{font-size:12px;color:#69778a;line-height:1.7}.card a{display:inline-block;text-decoration:none;background:#eef3f8;color:#173b68;border-radius:8px;padding:6px 8px;font-size:12px;font-weight:700;margin:7px 3px 0 0}.card a.main{background:#198754;color:#fff}.empty{text-align:center;padding:25px;color:#718096}.legendbox{font-size:12px;line-height:1.8}.leaflet-popup-content{font-family:Arial,Tahoma;line-height:1.8}.leaflet-control-layers{direction:rtl;text-align:right}.notice{padding:9px 12px;background:#f1f7ff;color:#315273;border-radius:10px;font-size:12px;margin-bottom:10px}.loading{opacity:.65;pointer-events:none}@media(max-width:900px){.toolbar{grid-template-columns:1fr 1fr}.search{grid-column:1/-1}.layout{grid-template-columns:1fr}.panel{max-height:none}.mapbox{height:58vh;min-height:380px}.results{max-height:420px}}@media(max-width:550px){.headin{align-items:flex-start}.logo{font-size:17px}.nav a{font-size:11px;padding:7px}.toolbar{grid-template-columns:1fr 1fr}.toolbar .btn{width:100%}}
.place-label{background:rgba(255,255,255,.94);border:1px solid #d6dee8;border-radius:8px;padding:3px 7px;font:700 11px Arial,Tahoma;color:#173b68;box-shadow:0 1px 5px #0002;white-space:nowrap;direction:rtl}.place-label:before{content:"";position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);border:5px solid transparent;border-top-color:#d6dee8;border-bottom:0}.place-label-wrap{background:transparent;border:0}.name-toggle{position:absolute;top:10px;left:10px;z-index:900;background:#fff;border:1px solid #d8e0ea;border-radius:10px;padding:9px 11px;font-weight:700;color:#173b68;box-shadow:0 2px 8px #0002;cursor:pointer}.name-toggle.active{background:#173b68;color:#fff}</style><link rel="stylesheet" href="app.css">
</head><body>
<header class="head"><div class="headin"><div class="logo">🗺️ فلسطين بلاتفورم — الخريطة الذكية</div><div class="nav"><a href="index.html">الرئيسية</a><a href="nearby.html">📍 قريب مني</a><a href="account.html">حسابي</a></div></div></header>
<main class="wrap">
<div class="notice">ابحث عن مدينة أو عنوان، أو حرّك الخريطة لاستكشاف الإعلانات والأماكن. البيانات المفتوحة للأماكن تأتي من OpenStreetMap، ولا تحتاج إلى API Key.</div>
<section class="toolbar"><div class="search"><input id="q" placeholder="🔎 ابحث عن مدينة، شارع، مطعم، متجر..." autocomplete="off"><button class="btn primary" id="searchBtn">بحث</button></div><select id="radius"><option value="2">2 كم</option><option value="5">5 كم</option><option value="10" selected>10 كم</option><option value="25">25 كم</option></select><button class="btn green" id="locate">📍 موقعي</button><button class="btn soft" id="refresh">↻ تحديث</button></section>
<div class="chips" id="chips"><button class="chip active" data-cat="all">الكل</button><button class="chip" data-cat="food">🍽️ مطاعم ومقاهي</button><button class="chip" data-cat="shop">🛒 متاجر</button><button class="chip" data-cat="health">🏥 صحة</button><button class="chip" data-cat="pharmacy">💊 صيدليات</button><button class="chip" data-cat="fuel">⛽ وقود</button><button class="chip" data-cat="bank">🏦 بنوك</button><button class="chip" data-cat="hotel">🏨 فنادق</button><button class="chip" data-cat="education">🎓 تعليم</button><button class="chip" data-cat="government">🏛️ مؤسسات</button><button class="chip" data-cat="fun">🎭 ترفيه</button></div>
<div class="layout"><div id="map" class="mapbox"><button id="nameToggle" class="name-toggle active">🏷️ أسماء الأماكن</button></div></div><aside class="panel"><div class="panelhead"><b>📍 النتائج</b><div id="status" class="status">جاري تحميل الخريطة...</div></div><div id="results" class="results"><div class="empty">حرّك الخريطة أو استخدم البحث.</div></div></aside></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><script src="platform.js"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const db=window.ppClient,$=id=>document.getElementById(id),esc=window.ppEsc||((x)=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])));
const OVERPASS=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://overpass.private.coffee/api/interpreter'];
const NOMINATIM='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&accept-language=ar&q=';
let map,layerGroup=L.layerGroup(),userMarker=null,allItems=[],currentCat='all',lastCenter=null,searchTimer=null;
const catLabel={food:'🍽️ مطعم/مقهى',shop:'🛒 متجر',health:'🏥 صحة',pharmacy:'💊 صيدلية',fuel:'⛽ وقود',bank:'🏦 بنك',hotel:'🏨 فندق',education:'🎓 تعليم',government:'🏛️ مؤسسة',fun:'🎭 ترفيه',other:'📍 مكان'};
const catQuery={food:'nwr["name"]["amenity"~"restaurant|cafe|fast_food|food_court|ice_cream|bakery"]',shop:'nwr["name"]["shop"]',pharmacy:'nwr["name"]["amenity"="pharmacy"]',health:'nwr["name"]["amenity"~"hospital|clinic|doctors|dentist|veterinary"]',fuel:'nwr["name"]["amenity"="fuel"]',bank:'nwr["name"]["amenity"~"bank|atm"]',hotel:'nwr["name"]["tourism"~"hotel|hostel|guest_house|motel"]',education:'nwr["name"]["amenity"~"school|college|university|kindergarten"]',government:'nwr["name"]["office"~"government|administrative|association"];nwr["name"]["amenity"~"police|fire_station|post_office"]',fun:'nwr["name"]["tourism"~"museum|attraction|theme_park|water_park"];nwr["name"]["leisure"~"park|playground|sports_centre|stadium|fitness_centre"]'};
function dist(a,b,c,d){const R=6371,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,h=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;return R*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h))}
function icon(cat){return (catLabel[cat]||'📍').split(' ')[0]}
function init(){map=L.map('map',{zoomControl:true}).setView([31.9,35.2],9);const voyager=L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{maxZoom:20,attribution:'© OpenStreetMap © CARTO'}).addTo(map);const osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'});const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'© Esri'});L.control.layers({'خريطة واضحة':voyager,'OpenStreetMap':osm,'قمر صناعي':sat}).addTo(map);layerGroup.addTo(map);map.on('moveend',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>loadViewport(),650)});loadViewport()}
function clear(){layerGroup.clearLayers();allItems=[]}
function pointOf(e){return e.center?{lat:e.center.lat,lon:e.center.lon}:e.lat!=null?{lat:e.lat,lon:e.lon}:null}
function tagsCat(t){const a=t.amenity||'',s=t.shop||'',to=t.tourism||'',l=t.leisure||'';if(/restaurant|cafe|fast_food|food_court|ice_cream|bakery/.test(a))return'food';if(a==='pharmacy')return'pharmacy';if(/hospital|clinic|doctors|dentist|veterinary/.test(a))return'health';if(a==='fuel')return'fuel';if(/bank|atm/.test(a))return'bank';if(/hotel|hostel|guest_house|motel/.test(to))return'hotel';if(/school|college|university|kindergarten/.test(a))return'education';if(/government|administrative|association/.test(t.office||'')||/police|fire_station|post_office/.test(a))return'government';if(/museum|attraction|theme_park|water_park/.test(to)||/park|playground|sports_centre|stadium|fitness_centre/.test(l))return'fun';if(s)return'shop';return'other'}
function nameOf(t){return t['name:ar']||t.name||t['name:en']||'مكان بدون اسم'}
function linkMaps(lat,lon){return 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(lat+','+lon)}
function linkOSM(lat,lon){return 'https://www.openstreetmap.org/?mlat='+encodeURIComponent(lat)+'&mlon='+encodeURIComponent(lon)+'#map=18/'+encodeURIComponent(lat)+'/'+encodeURIComponent(lon)}
async function overpass(center){const r=Number($('radius').value),meters=Math.min(r*1000,25000),filter=currentCat==='all'?Object.values(catQuery).join(';'):catQuery[currentCat];const q='[out:json][timeout:35];('+filter.replace(/nwr/g,'nwr(around:'+meters+','+center.lat+','+center.lng+')')+';);out center tags;';let last;for(const ep of OVERPASS){try{const res=await fetch(ep,{method:'POST',body:q,headers:{'Content-Type':'text/plain;charset=UTF-8'}});if(!res.ok)throw new Error('Overpass '+res.status);const j=await res.json();return j.elements||[]}catch(e){last=e}}throw last||new Error('تعذر تحميل الأماكن المفتوحة')}
async function loadSupabase(center){const r=Number($('radius').value),minLat=center.lat-r/111,maxLat=center.lat+r/111,minLon=center.lng-r/(111*Math.cos(center.lat*Math.PI/180)),maxLon=center.lng+r/(111*Math.cos(center.lat*Math.PI/180));const adsP=db.from('ads').select('id,title,category,city,latitude,longitude,location_name,status').eq('status','active').gte('latitude',minLat).lte('latitude',maxLat).gte('longitude',minLon).lte('longitude',maxLon).limit(300);const placesP=db.from('places').select('id,name,category,city,address,latitude,longitude,status').eq('status','published').gte('latitude',minLat).lte('latitude',maxLat).gte('longitude',minLon).lte('longitude',maxLon).limit(300);const [a,p]=await Promise.all([adsP,placesP]);return {ads:a.error?[]:(a.data||[]),places:p.error?[]:(p.data||[])} }
function popup(x){const real=x.kind==='real',t=x.tags||{};const phone=t.phone||t['contact:phone']||'';const addr=t['addr:street']||t['addr:city']||x.address||x.city||'';return '<b>'+esc(real?icon(x.cat)+' '+x.name:'📢 '+x.title)+'</b><br><span>'+esc(real?(catLabel[x.cat]||'مكان'):(x.category||'إعلان'))+'</span>'+(addr?'<br>📍 '+esc(addr):'')+(phone?'<br>📞 '+esc(phone):'')+'<br><a target="_blank" rel="noopener" href="'+linkMaps(x.lat,x.lon)+'">🧭 الاتجاهات</a> '+(real?'<a target="_blank" rel="noopener" href="'+linkOSM(x.lat,x.lon)+'">الخريطة</a>':'<a href="ad-details.html?id='+encodeURIComponent(x.id)+'">الإعلان</a>')}
function render(items,center){clear();const bounds=[];if(userMarker)layerGroup.addLayer(userMarker);items.slice(0,180).forEach(x=>{const m=L.marker([x.lat,x.lon]).bindPopup(popup(x));if(x.name||x.title){const label=(x.kind==='real'?icon(x.cat)+' '+x.name:'📢 '+x.title);m.bindTooltip(esc(label),{permanent:true,direction:'top',offset:[0,-10],className:'place-label'});}layerGroup.addLayer(m);bounds.push([x.lat,x.lon])});if(center)bounds.push([center.lat,center.lng]);const list=$('results');if(!items.length){list.innerHTML='<div class="empty">لا توجد نتائج في النطاق الحالي.<br>جرّب تصنيفًا آخر أو وسّع النطاق.</div>'}else{list.innerHTML=items.slice(0,100).map(x=>'<div class="card"><b>'+esc(x.kind==='real'?icon(x.cat)+' '+x.name:'📢 '+x.title)+'</b><div class="meta">'+esc(x.kind==='real'?(catLabel[x.cat]||'مكان'):(x.category||'إعلان'))+(x.city?' · '+esc(x.city):'')+(x.distance!=null?' · 📏 '+x.distance.toFixed(1)+' كم':'')+'</div>'+(x.address?'<div class="meta">📍 '+esc(x.address)+'</div>':'')+(x.tags?.opening_hours?'<div class="meta">🕐 '+esc(x.tags.opening_hours)+'</div>':'')+(x.tags?.phone?'<div class="meta">📞 '+esc(x.tags.phone)+'</div>':'')+'<a class="main" target="_blank" rel="noopener" href="'+linkMaps(x.lat,x.lon)+'">🧭 الاتجاهات</a>'+(x.kind==='real'?'<a target="_blank" rel="noopener" href="'+linkOSM(x.lat,x.lon)+'">🗺️ الخريطة</a>':'<a href="ad-details.html?id='+encodeURIComponent(x.id)+'">عرض الإعلان</a>')+'</div>').join('')}
if(bounds.length>1&&currentCat==='all'&&map.getZoom()<14)map.fitBounds(L.latLngBounds(bounds),{padding:[25,25],maxZoom:15});$('status').textContent='وجدنا '+items.length+' نتيجة في هذا النطاق.'}
async function loadViewport(){const center=map.getCenter();lastCenter=center;$('status').textContent='جاري تحديث النتائج...';try{const [osm,sb]=await Promise.all([overpass(center),loadSupabase(center)]);const items=[];osm.forEach(e=>{const p=pointOf(e);if(!p)return;const t=e.tags||{};const c=tagsCat(t);if(currentCat!=='all'&&c!==currentCat)return;items.push({kind:'real',id:'osm-'+e.type+'-'+e.id,name:nameOf(t),cat:c,tags:t,lat:Number(p.lat),lon:Number(p.lon),address:[t['addr:street'],t['addr:city']||t['addr:town']].filter(Boolean).join('، ')});});sb.ads.forEach(x=>{const lat=Number(x.latitude),lon=Number(x.longitude);if(!Number.isFinite(lat)||!Number.isFinite(lon))return;items.push({kind:'ad',...x,lat,lon})});sb.places.forEach(x=>{const lat=Number(x.latitude),lon=Number(x.longitude);if(!Number.isFinite(lat)||!Number.isFinite(lon))return;items.push({kind:'real',id:'place-'+x.id,name:x.name,cat:({'مطاعم':'food','متاجر':'shop','خدمات':'other','أماكن سياحية':'fun','مؤسسات':'government'}[x.category]||'other'),city:x.city,address:x.address,lat,lon,tags:{}})});items.forEach(x=>x.distance=dist(center.lat,center.lng,x.lat,x.lon));items.sort((a,b)=>a.distance-b.distance);allItems=items;render(items,center)}catch(e){$('status').textContent='تعذر تحديث النتائج';$('results').innerHTML='<div class="empty">⚠️ '+esc(e.message||'خطأ غير معروف')+'<br><button class="btn primary" style="margin-top:10px" onclick="loadViewport()">إعادة المحاولة</button></div>'}}
async function search(){const q=$('q').value.trim();if(!q)return loadViewport();$('status').textContent='جاري البحث عن «'+esc(q)+'»...';try{const r=await fetch(NOMINATIM+encodeURIComponent(q));if(!r.ok)throw new Error('تعذر البحث');const data=await r.json();if(!data.length){$('status').textContent='لم يتم العثور على المكان';return}const x=data[0];const lat=Number(x.lat),lon=Number(x.lon);map.setView([lat,lon],15);$('status').textContent='تم الانتقال إلى '+(x.display_name||q)}catch(e){$('status').textContent='تعذر البحث. حاول باسم مدينة أو شارع آخر.'}}
let showNames=true;function updateLabels(){layerGroup.eachLayer(m=>{if(!m.getTooltip)return;const t=m.getTooltip();if(!t)return;if(map.getZoom()>=13&&showNames)m.openTooltip();else m.closeTooltip()})}map.on('zoomend',updateLabels);$('nameToggle').onclick=()=>{showNames=!showNames;$('nameToggle').classList.toggle('active',showNames);updateLabels()};
$('searchBtn').onclick=search;$('q').onkeydown=e=>{if(e.key==='Enter')search()};$('refresh').onclick=loadViewport;$('radius').onchange=loadViewport;document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentCat=b.dataset.cat;loadViewport()});$('locate').onclick=()=>{if(!navigator.geolocation){alert('المتصفح لا يدعم تحديد الموقع');return}navigator.geolocation.getCurrentPosition(p=>{const lat=p.coords.latitude,lon=p.coords.longitude;if(userMarker)layerGroup.removeLayer(userMarker);userMarker=L.circleMarker([lat,lon],{radius:9,weight:3,color:'#fff',fillColor:'#198754',fillOpacity:1}).bindPopup('📍 موقعك الحالي');layerGroup.addLayer(userMarker);map.setView([lat,lon],15);loadViewport()},()=>alert('تعذر تحديد موقعك. اسمح للموقع من إعدادات المتصفح.'))};init();
</script><script src="app-ui.js" defer></script>
</body></html>
