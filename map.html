<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الخريطة والأماكن | فلسطين بلاتفورم</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;font-family:Arial,Tahoma;background:#f5f7fa;color:#172033}.head{background:#173b68;color:#fff;padding:14px;display:flex;justify-content:space-between;gap:10px;align-items:center}.head a{color:#fff;text-decoration:none;background:#234d7e;padding:8px 12px;border-radius:8px}.wrap{max-width:1200px;margin:auto;padding:15px}.tools{background:#fff;padding:12px;border-radius:12px;display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tools input,.tools select,.tools button{padding:10px;border:1px solid #ddd;border-radius:8px}.tools button{background:#173b68;color:#fff}.map{height:68vh;border-radius:14px;overflow:hidden;background:#ddd}.legend{margin-top:10px;background:#fff;padding:10px;border-radius:10px}.place-link{color:#173b68;font-weight:bold}</style></head><body><header class="head"><b>📍 فلسطين بلاتفورم — الخريطة والأماكن</b><a href="index.html">الرئيسية</a></header><main class="wrap"><div class="tools"><input id="q" placeholder="ابحث باسم المكان أو الإعلان"><input id="city" placeholder="المدينة"><select id="category"><option value="">كل التصنيفات</option><option>مطاعم</option><option>متاجر</option><option>خدمات</option><option>وظائف</option><option>عقارات</option><option>أماكن سياحية</option><option>مؤسسات</option><option>أخرى</option></select><button id="locate">📍 موقعي</button><button id="apply">بحث</button></div><div id="map" class="map"></div><div id="count" class="legend">جاري تحميل المواقع...</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><script src="platform.js"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const db=window.ppClient,$=id=>document.getElementById(id),esc=window.ppEsc;let map=L.map('map').setView([31.9,35.2],9),markers=[];const base={'الخريطة':L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}),'قمر صناعي':L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'© Esri'})};base['الخريطة'].addTo(map);L.control.layers(base).addTo(map);
function clear(){markers.forEach(m=>map.removeLayer(m));markers=[]}function addMarker(x,type){const lat=Number(x.latitude),lng=Number(x.longitude);if(!Number.isFinite(lat)||!Number.isFinite(lng))return;const m=L.marker([lat,lng]).addTo(map);const title=esc(x.title||x.name||'موقع');const cat=esc(x.category||'');const city=esc(x.city||'');const id=x.id;const link=type==='place'?'place-details.html?id='+encodeURIComponent(id):'ad-details.html?id='+encodeURIComponent(id);m.bindPopup('<b>'+title+'</b><br>'+cat+(city?'<br>📍 '+city:'')+(x.location_name?'<br>'+esc(x.location_name):'')+'<br><a class="place-link" href="'+link+'">عرض التفاصيل</a>');markers.push(m)}
async function load(){clear();$('count').textContent='جاري البحث...';const q=$('q').value.trim(),city=$('city').value.trim(),cat=$('category').value;try{let aq=db.from('ads').select('id,title,category,city,price,latitude,longitude,location_name,status').eq('status','active').not('latitude','is',null).not('longitude','is',null).limit(300);if(city)aq=aq.ilike('city','%'+city+'%');if(cat)aq=aq.eq('category',cat);if(q)aq=aq.or('title.ilike.%'+q+'%,description.ilike.%'+q+'%');const pq=db.from('places').select('id,name,category,city,address,latitude,longitude,status').eq('status','published').not('latitude','is',null).not('longitude','is',null).limit(300);let pquery=pq;if(city)pquery=pquery.ilike('city','%'+city+'%');if(cat)pquery=pquery.eq('category',cat);if(q)pquery=pquery.or('name.ilike.%'+q+'%,description.ilike.%'+q+'%');const [ar,pr]=await Promise.all([aq,pquery]);if(ar.error && ar.error.code!=='42P01')throw ar.error;if(pr.error && pr.error.code!=='42P01')throw pr.error;const ads=ar.data||[],places=pr.data||[];ads.forEach(x=>addMarker(x,'ad'));places.forEach(x=>addMarker({...x,title:x.name,location_name:x.address},'place'));$('count').textContent='📍 '+markers.length+' موقعاً — إعلانات: '+ads.length+' — أماكن: '+places.length;if(markers.length)map.fitBounds(L.latLngBounds(markers.map(m=>m.getLatLng())),{padding:[25,25]})}catch(e){$('count').textContent='❌ '+(e.message||'تعذر تحميل الخريطة')}}
$('apply').onclick=load;$('q').onkeydown=e=>{if(e.key==='Enter')load()};$('locate').onclick=()=>navigator.geolocation?.getCurrentPosition(p=>{map.setView([p.coords.latitude,p.coords.longitude],14);L.circleMarker([p.coords.latitude,p.coords.longitude],{radius:8}).addTo(map).bindPopup('📍 موقعك الحالي').openPopup()},()=>alert('تعذر تحديد الموقع.'));load();</script></body></html>
