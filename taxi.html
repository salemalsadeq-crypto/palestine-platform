<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تاكسي قريب مني | فلسطين بلاتفورم</title><link rel="stylesheet" href="app.css"><style>
body{margin:0;background:#f5f8fc;font-family:Arial,Tahoma,sans-serif;color:#172033}.wrap{max-width:1050px;margin:auto;padding:0 15px}.hero{background:linear-gradient(135deg,#123b68,#1d5b96);color:#fff;padding:28px 0}.hero h1{margin:0 0 6px}.hero p{margin:0;color:#dceaf7;font-size:13px}.bar{margin:16px 0;display:flex;gap:8px;flex-wrap:wrap}.bar button,.bar a{border:0;border-radius:12px;padding:11px 14px;font-weight:900;text-decoration:none;cursor:pointer}.primary{background:#b51f2a;color:#fff}.light{background:#fff;color:#123b68;border:1px solid #dce5ee!important}.status{background:#fff;border:1px solid #e0e8f0;border-radius:14px;padding:12px;color:#607188;font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:10px 0 30px}.card{background:#fff;border:1px solid #e0e8f0;border-radius:18px;padding:15px;box-shadow:0 8px 24px #123b6810}.toprow{display:flex;align-items:center;gap:12px}.car{width:52px;height:52px;border-radius:15px;background:#edf5fc;display:flex;align-items:center;justify-content:center;font-size:28px}.name{font-size:17px;font-weight:900;color:#123b68}.city{font-size:11px;color:#738298;margin-top:3px}.details{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.item{background:#f7f9fb;border-radius:11px;padding:9px}.item small{display:block;color:#7b899b;font-size:10px}.item b{display:block;margin-top:3px;font-size:12px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.actions a,.actions button{border:0;border-radius:10px;padding:10px 6px;text-align:center;font-weight:900;text-decoration:none;font-size:11px;cursor:pointer}.call{background:#e9f8f1;color:#13734c}.message{background:#edf5fc;color:#123b68}.request{background:#b51f2a;color:#fff}.empty{background:#fff;border-radius:18px;padding:35px;text-align:center;color:#718096;grid-column:1/-1}.note{font-size:11px;color:#718096;line-height:1.8;margin:0 0 20px}@media(max-width:650px){.grid{grid-template-columns:1fr}.actions{grid-template-columns:1fr 1fr 1fr}}
</style></head><body><header class="pp-simple-header"><div class="wrap" style="padding:12px 15px"><a href="services.html" style="font-weight:900;color:#123b68;text-decoration:none">← الخدمات</a></div></header><section class="hero"><div class="wrap"><h1>🚕 تاكسي قريب مني</h1><p>السائقون المسجلون في منطقتك مع بيانات السيارة والسعر.</p></div></section><main class="wrap"><div class="bar"><button id="locate" class="primary">📍 تحديد موقعي</button><a class="light" href="service-request.html?type=taxi">🚕 طلب تاكسي</a></div><div id="status" class="status">جاري تحديد المنطقة...</div><p class="note">للدقة المكانية، يجب أن يسجل مقدم التاكسي موقعه الجغرافي من صفحة مقدم الخدمة. إذا لم تسمح بالموقع، سيظهر لك سائقو المدينة المسجلة.</p><div id="grid" class="grid"><div class="empty">جاري تحميل السائقين...</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><script src="platform.js"></script><script>
const grid=document.getElementById('grid'),status=document.getElementById('status');let userPos=null,cityGuess='';const esc=window.ppEsc||((x)=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])));
function dist(lat1,lng1,lat2,lng2){const R=6371,rad=x=>x*Math.PI/180,la=rad(lat2-lat1),lo=rad(lng2-lng1);const x=Math.sin(la/2)**2+Math.cos(rad(lat1))*Math.cos(rad(lat2))*Math.sin(lo/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function card(p){const name=p.display_name||'سائق تاكسي',phone=p.contact_phone||'',price=p.base_price==null?'غير محدد':Number(p.base_price).toLocaleString('ar-PS')+' ₪',spec=p.specialization||'تاكسي',cap=p.passenger_capacity==null?'غير محدد':String(p.passenger_capacity)+' ركاب',km=p.latitude!=null&&p.longitude!=null&&userPos?dist(userPos.lat,userPos.lng,p.latitude,p.longitude).toFixed(1)+' كم':'ضمن المدينة';return `<article class="card"><div class="toprow"><div class="car">🚕</div><div><div class="name">${esc(name)}</div><div class="city">📍 ${esc(p.city||'المدينة غير محددة')} • ${km}</div></div></div><div class="details"><div class="item"><small>السيارة</small><b>${esc(p.vehicle_type||'غير محدد')}</b></div><div class="item"><small>رقم المركبة</small><b>${esc(p.vehicle_number||'غير محدد')}</b></div><div class="item"><small>السعر</small><b>${esc(price)}</b></div><div class="item"><small>الهاتف</small><b>${esc(phone||'غير متوفر')}</b></div><div class="item"><small>التخصص</small><b>${esc(spec)}</b></div><div class="item"><small>الركاب</small><b>${esc(cap)}</b></div></div><div class="actions"><a class="call" href="${phone?'tel:'+encodeURIComponent(phone):'#'}">📞 اتصال</a><a class="message" href="messages.html?user=${encodeURIComponent(p.user_id)}">💬 رسالة</a><a class="request" href="service-request.html?type=taxi&provider=${encodeURIComponent(p.user_id)}">🚕 اطلب</a></div></article>`}
async function load(){let q=ppClient.from('service_providers').select('user_id,service_type,city,is_active,display_name,vehicle_type,vehicle_number,contact_phone,base_price,specialization,passenger_capacity,latitude,longitude').eq('service_type','taxi').eq('is_active',true);if(cityGuess)q=q.ilike('city',cityGuess);let r=await q.limit(100);if(r.error){grid.innerHTML='<div class="empty">تعذر تحميل السائقين: '+esc(r.error.message)+'</div>';return}let arr=r.data||[];
if(!arr.length&&cityGuess){const all=await ppClient.from('service_providers').select('user_id,service_type,city,is_active,display_name,vehicle_type,vehicle_number,contact_phone,base_price,specialization,passenger_capacity,latitude,longitude').eq('service_type','taxi').eq('is_active',true).limit(100);if(!all.error)arr=all.data||[];status.textContent='لا يوجد سائق في مدينة الحساب؛ نعرض السائقين المسجلين المتاحين.'}
arr=arr.map(p=>({...p,_d:p.latitude!=null&&p.longitude!=null&&userPos?dist(userPos.lat,userPos.lng,p.latitude,p.longitude):99999})).sort((a,b)=>a._d-b._d);if(!arr.length){grid.innerHTML='<div class="empty">لا يوجد سائق تاكسي مسجل حاليًا.<br><br>إذا كنت سائقًا، فعّل حسابك من «مقدم الخدمة».</div>';return}grid.innerHTML=arr.map(card).join('')}
async function init(){const u=await ppUser();if(!u){location.href='login.html?next='+encodeURIComponent(location.href);return}const p=await ppProfile(u.id);cityGuess=p?.city||'';status.textContent=cityGuess?'مدينة الحساب: '+cityGuess+' — جاري ترتيب السائقين.':'لم تحدد مدينة في حسابك — جاري عرض السائقين.';if(navigator.geolocation){navigator.geolocation.getCurrentPosition(pos=>{userPos={lat:pos.coords.latitude,lng:pos.coords.longitude};status.textContent='تم تحديد موقعك — الأقرب أولًا عندما تكون مواقع السائقين محفوظة.';load()},()=>load(),{enableHighAccuracy:true,timeout:8000,maximumAge:300000})}else load()}
document.getElementById('locate').onclick=()=>{if(!navigator.geolocation){status.textContent='المتصفح لا يدعم تحديد الموقع.';return}navigator.geolocation.getCurrentPosition(pos=>{userPos={lat:pos.coords.latitude,lng:pos.coords.longitude};status.textContent='تم تحديد موقعك — جاري إعادة الترتيب.';load()},()=>status.textContent='لم نتمكن من الوصول للموقع. اسمح بالموقع من المتصفح.',{enableHighAccuracy:true,timeout:8000,maximumAge:0})};init();
</script></body></html>
