<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تفاصيل الإعلان - فلسطين بلاتفورم</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma;background:#f5f7fa;color:#172033}header{background:#173b68;color:#fff;padding:14px 20px}.head{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.logo{font-size:22px;font-weight:bold}.logo span{color:#b51f2a}nav a{color:#fff;text-decoration:none;margin:3px;padding:8px 10px;background:#234d7e;border-radius:8px;font-size:13px}.wrap{max-width:1000px;margin:28px auto;padding:0 16px}.box{background:#fff;border-radius:16px;padding:22px;box-shadow:0 3px 14px #0001}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.gallery img{width:100%;height:230px;object-fit:cover;border-radius:10px;cursor:pointer}.title{font-size:28px;margin:22px 0 8px}.tag{display:inline-block;background:#eef2f7;padding:7px 10px;border-radius:8px}.price{font-size:23px;font-weight:bold;color:#b51f2a;margin:15px 0}.desc{line-height:1.8;white-space:pre-wrap}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.btn{border:0;border-radius:9px;padding:12px 18px;text-decoration:none;font-weight:bold;cursor:pointer}.back{background:#173b68;color:#fff}.fav{background:#f1f3f5;color:#222}.fav.active{background:#b51f2a;color:#fff}.owner{margin-top:20px;padding:18px;background:#f7f8fa;border-radius:12px}.owner a{display:inline-block;margin-top:10px;color:#173b68;font-weight:bold}.section{margin-top:20px;padding:18px;background:#fff;border-radius:14px;box-shadow:0 3px 14px #0001}.map{height:330px;border-radius:12px;overflow:hidden;margin-top:12px}.stars{font-size:25px;direction:rtl;unicode-bidi:bidi-override}.stars button{border:0;background:none;font-size:28px;cursor:pointer;padding:2px}.rating-summary{font-weight:bold;margin-bottom:12px}.review{padding:12px;border-top:1px solid #eee}.review small{color:#777}.review-form textarea{width:100%;min-height:90px;padding:10px;border:1px solid #ddd;border-radius:8px}.review-form select{padding:10px;border:1px solid #ddd;border-radius:8px;margin-bottom:8px;width:100%}.error{text-align:center;background:#fff;padding:40px}@media(max-width:700px){.gallery{grid-template-columns:1fr}.gallery img{height:250px}.title{font-size:23px}.map{height:280px}}</style></head><body><header><div class="head"><div class="logo">فلسطين <span>بلاتفورم</span></div><nav><a href="index.html">الرئيسية</a><a href="ads.html">الإعلانات</a><a href="favorites.html">❤️ المفضلة</a><a href="account.html">حسابي</a></nav></div></header><main class="wrap"><div id="app">جاري التحميل...</div></main><script>const SUPABASE_URL='https://sesbumfedusbjevbsyzl.supabase.co',KEY='sb_publishable_0sJrbh73jLip3O5OtJkc_A_9F6OPWqR',db=supabase.createClient(SUPABASE_URL,KEY);const id=new URLSearchParams(location.search).get('id');let ad,user,favId=null,map;const $=x=>document.getElementById(x);function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function stars(n){n=Number(n)||0;return '★★★★★'.slice(0,Math.round(n))+'☆☆☆☆☆'.slice(0,5-Math.round(n))}async function loadReviews(){const r=await db.from('ad_reviews').select('id,rating,review,created_at,reviewer_id,profiles:reviewer_id(full_name)').eq('ad_id',ad.id).order('created_at',{ascending:false});if(r.error)return {avg:0,count:0,rows:[]};const rows=r.data||[],avg=rows.length?rows.reduce((a,x)=>a+x.rating,0)/rows.length:0;return {avg,count:rows.length,rows}}async function submitReview(){if(!user){if(confirm('يجب تسجيل الدخول للتقييم. هل تريد تسجيل الدخول؟'))location.href='login.html';return}const rating=Number($('rating').value),review=$('reviewText').value.trim();if(!rating)return alert('اختر عدد النجوم');const r=await db.from('ad_reviews').insert({ad_id:ad.id,reviewer_id:user.id,owner_id:ad.user_id,rating,review:review||null});if(r.error){alert(r.error.message.includes('duplicate')?'لقد قيّمت هذا الإعلان مسبقاً.':r.error.message);return} $('reviewText').value='';await renderReviews()}async function renderReviews(){const x=await loadReviews();$('ratingSummary').innerHTML=x.count?`<span style="font-size:24px">${stars(x.avg)}</span> <b>${x.avg.toFixed(1)}/5</b> (${x.count} تقييم)`:'لا توجد تقييمات بعد';$('reviews').innerHTML=x.rows.length?x.rows.map(r=>`<div class="review"><b>${esc(r.profiles?.full_name||'مستخدم')}</b> — <span>${stars(r.rating)}</span><div>${esc(r.review||'')}</div><small>${new Date(r.created_at).toLocaleDateString('ar-PS')}</small></div>`).join(''):'<div>كن أول من يقيّم هذا الإعلان.</div>'}async function toggleFav(){if(!user){if(confirm('يجب تسجيل الدخول لإضافة الإعلان إلى المفضلة. هل تريد تسجيل الدخول؟'))location.href='login.html';return}if(favId){const {error}=await db.from('favorites').delete().eq('id',favId);if(error)return alert(error.message);favId=null}else{const {data,error}=await db.from('favorites').insert({user_id:user.id,ad_id:ad.id}).select('id').single();if(error)return alert(error.message);favId=data.id}$('fav').className='btn fav '+(favId?'active':'');$('fav').textContent=favId?'❤️ إزالة من المفضلة':'🤍 إضافة للمفضلة'}function initMap(){if(ad.latitude==null||ad.longitude==null)return;map=L.map('map').setView([ad.latitude,ad.longitude],15);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);L.marker([ad.latitude,ad.longitude]).addTo(map).bindPopup(esc(ad.location_name||ad.city||ad.title)).openPopup()}async function load(){if(!id){$('app').innerHTML='<div class="error">الإعلان غير موجود.</div>';return}const r=await db.from('ads').select('*').eq('id',id).single();if(r.error){$('app').innerHTML='<div class="error">❌ '+esc(r.error.message)+'</div>';return}ad=r.data;user=(await db.auth.getUser()).data.user;if(user){const f=await db.from('favorites').select('id').eq('user_id',user.id).eq('ad_id',ad.id).maybeSingle();favId=f.data?.id||null}const p=await db.from('profiles').select('id,full_name,phone,city,avatar_url').eq('id',ad.user_id).maybeSingle();const profile=p.data,imgs=Array.isArray(ad.image_urls)?ad.image_urls:[];$('app').innerHTML=`<section class="box"><div class="gallery">${imgs.length?imgs.map(x=>`<img src="${esc(x)}" alt="${esc(ad.title)}">`).join(''):'<div>📦 لا توجد صور</div>'}</div><h1 class="title">${esc(ad.title)}</h1><span class="tag">${esc(ad.category||'إعلان')}</span><div class="price">${ad.price!=null?Number(ad.price).toLocaleString('ar-PS')+' شيكل':'السعر عند التواصل'}</div><div class="desc">${esc(ad.description||'لا يوجد وصف')}</div>${ad.city?`<p>📍 ${esc(ad.city)}</p>`:''}${ad.location_name?`<p>🗺️ ${esc(ad.location_name)}</p>`:''}${ad.phone?`<p>📞 ${esc(ad.phone)}</p>`:''}<div class="actions"><a class="btn back" href="ads.html">← العودة</a><button id="fav" class="btn fav ${favId?'active':''}">${favId?'❤️ إزالة من المفضلة':'🤍 إضافة للمفضلة'}</button>${ad.phone?`<a class="btn back" href="tel:${encodeURIComponent(ad.phone)}">📞 اتصال</a>`:''}</div></section>${ad.latitude!=null&&ad.longitude!=null?`<section class="section"><h2>📍 موقع الإعلان على الخريطة</h2><div id="map" class="map"></div></section>`:''}<section class="section"><h2>⭐ تقييمات الإعلان</h2><div id="ratingSummary" class="rating-summary">جاري التحميل...</div><div id="reviews"></div>${user&&user.id!==ad.user_id?`<div class="review-form" style="margin-top:18px"><select id="rating"><option value="">اختر التقييم</option><option value="5">★★★★★ — ممتاز</option><option value="4">★★★★☆ — جيد جداً</option><option value="3">★★★☆☆ — جيد</option><option value="2">★★☆☆☆ — ضعيف</option><option value="1">★☆☆☆☆ — سيئ</option></select><textarea id="reviewText" placeholder="اكتب مراجعتك (اختياري)"></textarea><button id="submitReview" class="btn back" style="margin-top:8px">إرسال التقييم</button></div>`:''}</section><section class="owner"><b>👤 صاحب الإعلان</b><div>${esc(profile?.full_name||'مستخدم')}</div>${profile?.city?`<div>📍 ${esc(profile.city)}</div>`:''}${profile?.phone?`<div>📞 ${esc(profile.phone)}</div>`:''}<a href="profile.html?id=${encodeURIComponent(ad.user_id)}">عرض حساب صاحب الإعلان</a></section>`;$('fav').onclick=toggleFav;if($('submitReview'))$('submitReview').onclick=submitReview;if(ad.latitude!=null&&ad.longitude!=null)initMap();await renderReviews()}load();</script></body></html>
