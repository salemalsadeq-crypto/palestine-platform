<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تفاصيل الإعلان - فلسطين بلاتفورم</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0" crossorigin="anonymous"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma;background:#f5f7fa;color:#172033}header{background:#173b68;color:#fff;padding:14px 20px}.head{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.logo{font-size:22px;font-weight:bold}.logo span{color:#b51f2a}nav a{color:#fff;text-decoration:none;margin:3px;padding:8px 10px;background:#234d7e;border-radius:8px;font-size:13px}.wrap{max-width:1000px;margin:28px auto;padding:0 16px}.box{background:#fff;border-radius:16px;padding:22px;box-shadow:0 3px 14px #0001}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.gallery img{width:100%;height:230px;object-fit:cover;border-radius:10px}.title{font-size:28px;margin:22px 0 8px}.tag{display:inline-block;background:#eef2f7;padding:7px 10px;border-radius:8px}.price{font-size:23px;font-weight:bold;color:#b51f2a;margin:15px 0}.desc{line-height:1.8;white-space:pre-wrap}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.btn{border:0;border-radius:9px;padding:12px 18px;text-decoration:none;font-weight:bold;cursor:pointer}.back{background:#173b68;color:#fff}.fav{background:#f1f3f5;color:#222}.fav.active{background:#b51f2a;color:#fff}.owner{margin-top:20px;padding:18px;background:#f7f8fa;border-radius:12px}.owner a{display:inline-block;margin-top:10px;color:#173b68;font-weight:bold}.error{text-align:center;background:#fff;padding:40px;border-radius:14px}@media(max-width:700px){.gallery{grid-template-columns:1fr}.gallery img{height:250px}.title{font-size:23px}}</style></head><body><header><div class="head"><div class="logo">فلسطين <span>بلاتفورم</span></div><nav><a href="index.html">الرئيسية</a><a href="ads.html">الإعلانات</a><a href="favorites.html">❤️ المفضلة</a><a href="account.html">حسابي</a></nav></div></header><main class="wrap"><div id="app">جاري التحميل...</div></main><script>
window.onerror=function(m){var a=document.getElementById('app');if(a)a.innerHTML='<div class="error">❌ خطأ بالكود: '+m+'</div>';return false};
window.addEventListener('unhandledrejection',function(e){var a=document.getElementById('app');if(a)a.innerHTML='<div class="error">❌ خطأ غير متوقع: '+(e.reason&&e.reason.message||e.reason)+'</div>'});
if(typeof supabase==='undefined'){
document.getElementById('app').innerHTML='<div class="error">❌ لم يتم تحميل مكتبة Supabase — تحقق من اتصال الإنترنت</div>';
}else{
const URL='https://sesbumfedusbjevbsyzl.supabase.co',KEY='sb_publishable_0sJrbh73jLip3O5OtJkc_A_9F6OPWqR',db=supabase.createClient(URL,KEY);const id=new URLSearchParams(location.search).get('id');let ad,user,favId=null;const $=x=>document.getElementById(x);function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
async function load(){
try{
if(!id){$('app').innerHTML='<div class="error">الإعلان غير موجود.</div>';return}
const r=await db.from('ads').select('*').eq('id',id).single();
if(r.error){$('app').innerHTML='<div class="error">❌ '+esc(r.error.message)+'</div>';return}
ad=r.data;
const u=await db.auth.getUser();
if(u.error){$('app').innerHTML='<div class="error">❌ خطأ بجلسة الدخول: '+esc(u.error.message)+'</div>';return}
user=u.data.user;
if(user){
const f=await db.from('favorites').select('id').eq('user_id',user.id).eq('ad_id',ad.id).maybeSingle();
if(f.error){$('app').innerHTML='<div class="error">❌ خطأ بجلب المفضلة: '+esc(f.error.message)+'</div>';return}
favId=f.data?.id||null
}
const p=await db.from('profiles').select('id,full_name,phone,city,avatar_url').eq('id',ad.user_id).maybeSingle();
if(p.error){$('app').innerHTML='<div class="error">❌ خطأ بجلب بيانات صاحب الإعلان: '+esc(p.error.message)+'</div>';return}
const profile=p.data;const imgs=Array.isArray(ad.image_urls)?ad.image_urls:[];$('app').innerHTML=`<section class="box"><div class="gallery">${imgs.length?imgs.map(x=>`<img src="${esc(x)}" alt="${esc(ad.title)}">`).join(''):'<div>📦 لا توجد صور</div>'}</div><h1 class="title">${esc(ad.title)}</h1><span class="tag">${esc(ad.category||'إعلان')}</span><div class="price">${ad.price!=null?Number(ad.price).toLocaleString('ar-PS')+' شيكل':'السعر عند التواصل'}</div><div class="desc">${esc(ad.description||'لا يوجد وصف')}</div>${ad.city?`<p>📍 ${esc(ad.city)}</p>`:''}${ad.phone?`<p>📞 ${esc(ad.phone)}</p>`:''}<div class="actions"><a class="btn back" href="ads.html">← العودة</a><button id="fav" class="btn fav ${favId?'active':''}">${favId?'❤️ إزالة من المفضلة':'🤍 إضافة للمفضلة'}</button>${ad.phone?`<a class="btn back" href="tel:${encodeURIComponent(ad.phone)}">📞 اتصال</a>`:''}</div><div class="owner"><b>👤 صاحب الإعلان</b><div>${esc(profile?.full_name||'مستخدم')}</div>${profile?.city?`<div>📍 ${esc(profile.city)}</div>`:''}${profile?.phone?`<div>📞 ${esc(profile.phone)}</div>`:''}<a href="profile.html?id=${encodeURIComponent(ad.user_id)}">عرض حساب صاحب الإعلان</a></div></section>`;$('fav').onclick=toggleFav
}catch(e){
$('app').innerHTML='<div class="error">❌ حدث خطأ غير متوقع: '+esc(e.message||String(e))+'</div>';
}
}
async function toggleFav(){if(!user){if(confirm('يجب تسجيل الدخول لإضافة الإعلان إلى المفضلة. هل تريد تسجيل الدخول؟'))location.href='login.html';return}if(favId){const {error}=await db.from('favorites').delete().eq('id',favId);if(error){alert(error.message);return}favId=null}else{const {data,error}=await db.from('favorites').insert({user_id:user.id,ad_id:ad.id}).select('id').single();if(error){alert(error.message);return}favId=data.id}$('fav').className='btn fav '+(favId?'active':'');$('fav').textContent=favId?'❤️ إزالة من المفضلة':'🤍 إضافة للمفضلة'}
load();
}
</script></body></html>
