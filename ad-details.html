}else{
const SUPABASE_URL='https://sesbumfedusbjevbsyzl.supabase.co',KEY='sb_publishable_0sJrbh73jLip3O5OtJkc_A_9F6OPWqR',db=supabase.createClient(SUPABASE_URL,KEY);const id=new URLSearchParams(location.search).get('id');let ad,user,favId=null;const $=x=>document.getElementById(x);function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
async function load(){
try{
if(!id){$('app').innerHTML='<div class="error">الإعلان غير موجود.</div>';return}
const r=await db.from('ads').select('*').eq('id',id).single();
if(r.error){$('app').innerHTML='<div class="error">❌ '+esc(r.error.message)+'</div>';return}
ad=r.data;
const u=await db.auth.getUser();
if(u.error){$('app').innerHTML='<div class="error">❌ خطأ بجلسة الدخول: '+esc(u.error.message)+'</div>';return}
user=u.data.user;
if(user){
const f=await db.from('favorites').select('id').eq('user_id',user.id).eq('ad_id',ad.id).maybeSingle();
if(f.error){$('app').innerHTML='<div class="error">❌ خطأ بجلب المفضلة: '+esc(f.error.message)+'</div>';return}
favId=f.data?.id||null
}
const p=await db.from('profiles').select('id,full_name,phone,city,avatar_url').eq('id',ad.user_id).maybeSingle();
if(p.error){$('app').innerHTML='<div class="error">❌ خطأ بجلب بيانات صاحب الإعلان: '+esc(p.error.message)+'</div>';return}
const profile=p.data;const imgs=Array.isArray(ad.image_urls)?ad.image_urls:[];const phone=ad.phone||profile?.phone||'';const waPhone=phone.replace(/[^0-9+]/g,'').replace(/^00/,'+');const waUrl=waPhone?'https://wa.me/'+waPhone.replace(/^\+/,''):'';const avatar=profile?.avatar_url||'';$('app').innerHTML=`<section class="box"><div class="gallery">${imgs.length?imgs.map(x=>`<img src="${esc(x)}" alt="${esc(ad.title)}">`).join(''):'<div>📦 لا توجد صور</div>'}</div><h1 class="title">${esc(ad.title)}</h1><span class="tag">${esc(ad.category||'إعلان')}</span>${ad.video_url?`<div><video id="adVideo" class="video-player" src="${esc(ad.video_url)}" controls playsinline preload="metadata"></video><div class="video-tools"><button id="videoLike" class="video-tool">🤍 إعجاب</button><button class="video-tool" onclick="shareAd()">📤 مشاركة الفيديو</button></div><div id="videoStats" class="video-stats">جاري تحميل المشاهدات...</div></div>`:''}<div id="ratingSummary" class="rating-summary">⭐ جاري تحميل التقييم...</div><div class="price">${ad.price!=null?Number(ad.price).toLocaleString('ar-PS')+' شيكل':'السعر عند التواصل'}</div><div class="desc">${esc(ad.description||'لا يوجد وصف')}</div>${ad.city?`<p>📍 ${esc(ad.city)}</p>`:''}${ad.phone?`<p>📞 ${esc(ad.phone)}</p>`:''}<div class="actions"><a class="btn back" href="ads.html">← العودة</a><button id="fav" class="btn fav ${favId?'active':''}">${favId?'❤️ إزالة من المفضلة':'🤍 إضافة للمفضلة'}</button>${ad.phone?`<a class="btn back" href="tel:${encodeURIComponent(ad.phone)}">📞 اتصال</a><a class="btn whatsapp" target="_blank" rel="noopener" href="https://wa.me/${String(ad.phone).replace(/[^0-9]/g,'')}?text=${encodeURIComponent('مرحباً، بخصوص إعلان: '+ad.title)}">💬 واتساب</a>`:''}<button class="btn share" onclick="shareAd()">📤 مشاركة</button>${(!user||user.id!==ad.user_id)?`<button class="btn message" onclick="startConversation()">💬 مراسلة صاحب الإعلان</button>`:''}${user&&user.id!==ad.user_id?`<button class="btn report" onclick="openReport()">🚩 إبلاغ</button>`:''}</div><div class="owner"><b>👤 صاحب الإعلان</b><div>${esc(profile?.full_name||'مستخدم')}</div>${profile?.city?`<div>📍 ${esc(profile.city)}</div>`:''}${profile?.phone?`<div>📞 ${esc(profile.phone)}</div>`:''}<a href="profile.html?id=${encodeURIComponent(ad.user_id)}">عرض حساب صاحب الإعلان</a></div><section class="reviews"><h2>⭐ التقييمات والمراجعات</h2><div id="reviewForm"></div><div id="reviewsList">جاري تحميل التقييمات...</div></section></section>`;$('fav').onclick=toggleFav;if(ad.video_url)loadVideoStats();loadReviews()
}catch(e){
$('app').innerHTML='<div class="error">❌ حدث خطأ غير متوقع: '+esc(e.message||String(e))+'</div>';

async function loadVideoStats(){if(!ad?.video_url)return;try{await db.from('ad_video_views').insert({ad_id:ad.id,user_id:user?.id||null});const [v,l]=await Promise.all([db.from('ad_video_views').select('id',{count:'exact',head:true}).eq('ad_id',ad.id),db.from('ad_video_likes').select('id',{count:'exact',head:true}).eq('ad_id',ad.id)]);$('videoStats').textContent='👁️ '+(v.count??0)+' مشاهدة  •  ❤️ '+(l.count??0)+' إعجاب';if(user){const mine=await db.from('ad_video_likes').select('id').eq('ad_id',ad.id).eq('user_id',user.id).maybeSingle();const b=$('videoLike');if(b){b.classList.toggle('active',!!mine.data);b.textContent=mine.data?'❤️ إلغاء الإعجاب':'🤍 إعجاب';b.onclick=toggleVideoLike}}}catch(e){console.warn(e)}}
async function toggleVideoLike(){if(!user){if(confirm('يجب تسجيل الدخول للإعجاب بالفيديو. هل تريد تسجيل الدخول؟'))location.href='login.html';return}const b=$('videoLike');if(!b)return;const mine=await db.from('ad_video_likes').select('id').eq('ad_id',ad.id).eq('user_id',user.id).maybeSingle();if(mine.data){const r=await db.from('ad_video_likes').delete().eq('id',mine.data.id);if(r.error){alert(r.error.message);return}}else{const r=await db.from('ad_video_likes').insert({ad_id:ad.id,user_id:user.id});if(r.error){alert(r.error.message);return}}loadVideoStats()}
async function startConversation(){
  if(!user){if(confirm('يجب تسجيل الدخول لمراسلة صاحب الإعلان. هل تريد تسجيل الدخول؟'))location.href='login.html';return}
  if(!ad||user.id===ad.user_id){alert('لا يمكنك مراسلة نفسك.');return}
  const b=document.querySelector('.message');if(b)b.disabled=true;
  try{
    const q=await db.from('conversations').select('id').eq('ad_id',ad.id).eq('buyer_id',user.id).eq('seller_id',ad.user_id).maybeSingle();
    if(q.error)throw q.error;
    let cid=q.data?.id;
    if(!cid){
      const r=await db.from('conversations').insert({ad_id:ad.id,buyer_id:user.id,seller_id:ad.user_id}).select('id').single();
      if(r.error){
        if(r.error.code==='23505'){
          const again=await db.from('conversations').select('id').eq('ad_id',ad.id).eq('buyer_id',user.id).eq('seller_id',ad.user_id).single();
          if(again.error)throw again.error;cid=again.data.id;
        }else throw r.error;
      }else cid=r.data.id;
    }
    location.href='messages.html?conversation='+encodeURIComponent(cid);
  }catch(e){alert('تعذر فتح المحادثة: '+(e.message||e));}
  finally{if(b)b.disabled=false;}
}
function openReport(){if(!user){if(confirm('يجب تسجيل الدخول لإرسال بلاغ. هل تريد تسجيل الدخول؟'))location.href='login.html';return}if(user.id===ad?.user_id){alert('لا يمكنك الإبلاغ عن إعلانك الخاص.');return}$('reportModal').classList.add('show')}function closeReport(e){if(e&&e.target&&e.target.id!=='reportModal')return;$('reportModal').classList.remove('show')}async function submitReport(){if(!user||!ad)return;const reason=$('reportReason').value,details=$('reportDetails').value.trim();const {error}=await db.from('ad_reports').insert({reporter_id:user.id,ad_id:ad.id,reason,details:details||null});if(error){if(error.code==='23505')alert('لقد أرسلت بلاغًا لهذا الإعلان مسبقًا.');else alert('تعذر إرسال البلاغ: '+error.message);return}closeReport();$('reportDetails').value='';alert('تم إرسال البلاغ بنجاح. شكرًا لمساعدتنا في الحفاظ على المنصة.')}function openLightbox(src){$('lightboxImg').src=src;$('lightbox').classList.add('show')}function closeLightbox(e){if(e){e.stopPropagation();if(e.target.id!=='lightbox'&&!e.target.classList.contains('closebox'))return}$('lightbox').classList.remove('show');$('lightboxImg').src=''}async function shareAd(){
 const url=location.href;
 try{
   if(navigator.share){
     await navigator.share({title:ad?.title||'إعلان',text:'شاهد هذا الإعلان على فلسطين بلاتفورم',url});
     return;
   }
 }catch(e){
   if(e && e.name==='AbortError') return;
 }
 try{
   if(navigator.clipboard && window.isSecureContext){
     await navigator.clipboard.writeText(url);
     alert('✅ تم نسخ رابط الإعلان. يمكنك الآن إرساله لأي شخص.');
     return;
   }
 }catch(e){}
 const ta=document.createElement('textarea');
 ta.value=url;ta.style.position='fixed';ta.style.opacity='0';
 document.body.appendChild(ta);ta.focus();ta.select();
 try{document.execCommand('copy');alert('✅ تم نسخ رابط الإعلان.');}
 catch(e){prompt('انسخ رابط الإعلان:',url);}
 ta.remove();
}
async function loadReviews(){
  const r=await db.from('ad_reviews').select('id,reviewer_id,rating,review,status,created_at').eq('ad_id',ad.id).order('created_at',{ascending:false});
  if(r.error){$('reviewsList').innerHTML='<div class="review-empty">تعذر تحميل التقييمات.</div>';return}
  const reviews=r.data||[];
  const visible=reviews.filter(x=>x.status!=='hidden');
  const avg=visible.length?visible.reduce((sum,x)=>sum+Number(x.rating||0),0)/visible.length:0;
  $('ratingSummary').innerHTML=visible.length?`⭐ ${avg.toFixed(1)} / 5 — ${visible.length} تقييم`:'⭐ لا توجد تقييمات بعد';
  if(user && user.id!==ad.user_id){
    const mine=reviews.find(x=>x.reviewer_id===user.id);
    $('reviewForm').innerHTML=mine?`<div class="my-review"><b>تقييمك:</b> ${'⭐'.repeat(Number(mine.rating))}${mine.review?`<div>${esc(mine.review)}</div>`:''}<small>يمكنك تقييم الإعلان مرة واحدة فقط.</small></div>`:`<div class="review-form"><h3>أضف تقييمك</h3><div class="stars" id="stars">${[1,2,3,4,5].map(n=>`<button type="button" class="star" data-v="${n}" onclick="setRating(${n})">☆</button>`).join('')}</div><textarea id="reviewText" placeholder="اكتب مراجعتك (اختياري)"></textarea><button class="btn back" onclick="submitReview()">نشر التقييم</button></div>`;
  }else $('reviewForm').innerHTML='';
  $('reviewsList').innerHTML=visible.length?visible.map(x=>`<article class="review"><div class="review-head"><b>${'⭐'.repeat(Number(x.rating))}</b><small>${new Date(x.created_at).toLocaleDateString('ar-PS')}</small></div>${x.review?`<div>${esc(x.review)}</div>`:''}</article>`).join(''):'<div class="review-empty">لا توجد مراجعات منشورة لهذا الإعلان.</div>';
}
let selectedRating=0;
function setRating(v){selectedRating=v;document.querySelectorAll('.star').forEach(b=>b.textContent=Number(b.dataset.v)<=v?'★':'☆')}
async function submitReview(){
 if(!user){if(confirm('يجب تسجيل الدخول لإضافة تقييم. هل تريد تسجيل الدخول؟'))location.href='login.html';return}
 if(user.id===ad.user_id){alert('لا يمكنك تقييم إعلانك الخاص.');return}
 if(!selectedRating){alert('اختر عدد النجوم أولاً.');return}
 const review=($('reviewText')?.value||'').trim();
 const r=await db.from('ad_reviews').insert({ad_id:ad.id,reviewer_id:user.id,owner_id:ad.user_id,rating:selectedRating,review:review||null});
 if(r.error){alert(r.error.code==='23505'?'لقد قيّمت هذا الإعلان مسبقًا.':'تعذر حفظ التقييم: '+r.error.message);return}
 alert('تم نشر تقييمك.');selectedRating=0;loadReviews();
}
async function toggleFav(){if(!user){if(confirm('يجب تسجيل الدخول لإضافة الإعلان إلى المفضلة. هل تريد تسجيل الدخول؟'))location.href='login.html';return}if(favId){const {error}=await db.from('favorites').delete().eq('id',favId);if(error){alert(error.message);return}favId=null}else{const {data,error}=await db.from('favorites').insert({user_id:user.id,ad_id:ad.id}).select('id').single();if(error){alert(error.message);return}favId=data.id}$('fav').className='btn fav '+(favId?'active':'');$('fav').textContent=favId?'❤️ إزالة من المفضلة':'🤍 إضافة للمفضلة'}
window.startConversation=startConversation;
window.shareAd=shareAd;
window.openReport=openReport;

window.submitReport=submitReport;

}
