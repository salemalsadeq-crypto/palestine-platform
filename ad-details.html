<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تفاصيل الإعلان - فلسطين بلاتفورم</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0" crossorigin="anonymous"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma;background:#f5f7fa;color:#172033}header{background:#173b68;color:#fff;padding:14px 20px}.head{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.logo{font-size:22px;font-weight:bold}.logo span{color:#b51f2a}nav a{color:#fff;text-decoration:none;margin:3px;padding:8px 10px;background:#234d7e;border-radius:8px;font-size:13px}.wrap{max-width:1000px;margin:28px auto;padding:0 16px}.box{background:#fff;border-radius:16px;padding:22px;box-shadow:0 3px 14px #0001}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.gallery:has(img:only-child){grid-template-columns:1fr}.gallery:has(img:only-child) img{height:360px}.meta{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.pill{background:#f0f4f8;border:1px solid #e4e9ef;border-radius:999px;padding:7px 11px;font-size:13px}.descbox{background:#fafbfc;border:1px solid #edf0f3;border-radius:12px;padding:15px;margin-top:14px}.owner{display:flex;align-items:center;gap:14px}.avatar{width:58px;height:58px;border-radius:50%;object-fit:cover;background:#e8edf3;display:flex;align-items:center;justify-content:center;font-size:25px;flex:0 0 auto}.ownerinfo{flex:1}.actions .btn{min-width:130px;text-align:center}.notice{font-size:13px;color:#667085;margin-top:8px}.gallery img{width:100%;height:230px;object-fit:cover;border-radius:10px;cursor:pointer;transition:.2s}.gallery img:hover{transform:scale(1.02)}.title{font-size:28px;margin:22px 0 8px}.tag{display:inline-block;background:#eef2f7;padding:7px 10px;border-radius:8px}.price{font-size:23px;font-weight:bold;color:#b51f2a;margin:15px 0}.desc{line-height:1.8;white-space:pre-wrap}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.btn{border:0;border-radius:9px;padding:12px 18px;text-decoration:none;font-weight:bold;cursor:pointer}.back{background:#173b68;color:#fff}.fav{background:#f1f3f5;color:#222}.fav.active{background:#b51f2a;color:#fff}.owner{margin-top:20px;padding:18px;background:#f7f8fa;border-radius:12px}.owner a{display:inline-block;margin-top:10px;color:#173b68;font-weight:bold}.wa{background:#198754;color:#fff}.share{background:#6c757d;color:#fff}.report{background:#dc3545;color:#fff}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:10000;padding:18px}.modal.show{display:flex}.modalbox{background:#fff;width:min(520px,100%);border-radius:16px;padding:20px}.modalbox h2{margin-top:0}.modalbox select,.modalbox textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;font:inherit;margin:8px 0}.modalactions{display:flex;gap:8px;margin-top:12px}.cancel{background:#6c757d;color:#fff}.lightbox{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:9999;padding:20px}.lightbox.show{display:flex}.lightbox img{max-width:95vw;max-height:90vh;object-fit:contain;border-radius:12px}.closebox{position:absolute;top:18px;right:18px;background:#fff;color:#111;border:0;border-radius:50%;width:42px;height:42px;font-size:24px;cursor:pointer}.error{text-align:center;background:#fff;padding:40px;border-radius:14px}@media(max-width:700px){.wrap{margin:15px auto}.box{padding:15px}.gallery{grid-template-columns:1fr}.gallery img{height:250px}.gallery:has(img:only-child) img{height:280px}.title{font-size:23px}.actions .btn{flex:1;min-width:calc(50% - 5px)}.owner{align-items:flex-start}}</style></head><body><header><div class="head"><div class="logo">فلسطين <span>بلاتفورم</span></div><nav><a href="index.html">الرئيسية</a><a href="ads.html">الإعلانات</a><a href="favorites.html">❤️ المفضلة</a><a href="account.html">حسابي</a></nav></div></header><main class="wrap"><div id="app">جاري التحميل...</div></main><div id="reportModal" class="modal" onclick="closeReport(event)"><div class="modalbox" onclick="event.stopPropagation()"><h2>🚩 الإبلاغ عن الإعلان</h2><p>اختر سبب البلاغ:</p><select id="reportReason"><option value="إعلان مزيف">إعلان مزيف</option><option value="احتيال أو محاولة نصب">احتيال أو محاولة نصب</option><option value="محتوى مخالف">محتوى مخالف</option><option value="إعلان مكرر">إعلان مكرر</option><option value="سبب آخر">سبب آخر</option></select><textarea id="reportDetails" rows="4" maxlength="500" placeholder="تفاصيل إضافية (اختياري)"></textarea><div class="modalactions"><button class="btn report" onclick="submitReport()">إرسال البلاغ</button><button class="btn cancel" onclick="closeReport()">إلغاء</button></div></div></div><div id="lightbox" class="lightbox" onclick="closeLightbox(event)"><button class="closebox" onclick="closeLightbox(event)">×</button><img id="lightboxImg" src="" alt="صورة الإعلان"></div><script>
window.onerror=function(m){var a=document.getElementById('app');if(a)a.innerHTML='<div class="error">❌ خطأ بالكود: '+m+'</div>';return false};
window.addEventListener('unhandledrejection',function(e){var a=document.getElementById('app');if(a)a.innerHTML='<div class="error">❌ خطأ غير متوقع: '+(e.reason&&e.reason.message||e.reason)+'</div>'});
if(typeof supabase==='undefined'){
document.getElementById('app').innerHTML='<div class="error">❌ لم يتم تحميل مكتبة Supabase — تحقق من اتصال الإنترنت</div>';
}else{
const URL='https://sesbumfedusbjevbsyzl.supabase.co',KEY='sb_publishable_0sJrbh73jLip3O5OtJkc_A_9F6OPWqR',db=supabase.createClient(URL,KEY);const id=new URLSearchParams(location.search).get('id');let ad,user,favId=null;const $=x=>document.getElementById(x);function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
async function load(){
try{
if(!id){$('app').innerHTML='<div class="error">الإعلان غير موجود.</div>';return}
const r=await db.from('ads').select('*').eq('id',id).single();
if(r.error){$('app').innerHTML='<div class="error">❌ '+esc(r.error.message)+'</div>';return}
ad=r.data;
const u=await db.auth.getUser();
if(u.error){$('app').innerHTML='<div class="error">❌ خطأ بجلسة الدخول: '+esc(u.error.message)+'</div>';return}
user=u.data.user;
if(user){
const f=await db.from('favorites').select('id').eq('user_id',user.id).eq('ad_id',ad.id).maybeSingle();
if(f.error){$('app').innerHTML='<div class="error">❌ خطأ بجلب المفضلة: '+esc(f.error.message)+'</div>';return}
favId=f.data?.id||null
}
const p=await db.from('profiles').select('id,full_name,phone,city,avatar_url').eq('id',ad.user_id).maybeSingle();
if(p.error){$('app').innerHTML='<div class="error">❌ خطأ بجلب بيانات صاحب الإعلان: '+esc(p.error.message)+'</div>';return}
const profile=p.data;const imgs=Array.isArray(ad.image_urls)?ad.image_urls:[];const phone=ad.phone||profile?.phone||'';const waPhone=phone.replace(/[^0-9+]/g,'').replace(/^00/,'+');const waUrl=waPhone?'https://wa.me/'+waPhone.replace(/^\+/,''):'';const avatar=profile?.avatar_url||'';$('app').innerHTML=`<section class="box"><div class="gallery">${imgs.length?imgs.map((x,i)=>`<img src="${esc(x)}" alt="${esc(ad.title)} - صورة ${i+1}" onclick="openLightbox('${esc(x)}')">`).join(''):'<div>📦 لا توجد صور</div>'}</div><h1 class="title">${esc(ad.title)}</h1><span class="tag">${esc(ad.category||'إعلان')}</span><div class="price">${ad.price!=null?Number(ad.price).toLocaleString('ar-PS')+' شيكل':'السعر عند التواصل'}</div><div class="descbox"><b>📝 وصف الإعلان</b><div class="desc">${esc(ad.description||'لا يوجد وصف')}</div></div><div class="meta">${ad.city?`<span class="pill">📍 ${esc(ad.city)}</span>`:''}${phone?`<span class="pill">📞 ${esc(phone)}</span>`:''}<span class="pill">🕒 ${ad.created_at?new Date(ad.created_at).toLocaleDateString('ar-PS'):''}</span></div><div class="actions"><a class="btn back" href="ads.html">← العودة</a><button id="fav" class="btn fav ${favId?'active':''}">${favId?'❤️ إزالة من المفضلة':'🤍 إضافة للمفضلة'}</button>${phone?`<a class="btn back" href="tel:${encodeURIComponent(phone)}">📞 اتصال</a>`:''}${waUrl?`<a class="btn wa" target="_blank" rel="noopener" href="${waUrl}">💬 واتساب</a>`:''}<button class="btn share" onclick="shareAd()">↗️ مشاركة</button><button class="btn report" onclick="openReport()">🚩 إبلاغ</button></div><div class="owner">${avatar?`<img class="avatar" src="${esc(avatar)}" alt="صورة صاحب الإعلان">`:`<div class="avatar">👤</div>`}<div class="ownerinfo"><b>👤 صاحب الإعلان</b><div>${esc(profile?.full_name||'مستخدم')}</div>${profile?.city?`<div>📍 ${esc(profile.city)}</div>`:''}${profile?.phone?`<div>📞 ${esc(profile.phone)}</div>`:''}<a href="profile.html?id=${encodeURIComponent(ad.user_id)}">عرض حساب صاحب الإعلان ←</a></div></div><div class="notice">💡 إذا كان الإعلان مناسبًا لك، يمكنك حفظه في المفضلة أو مشاركته مع الآخرين.</div></section>`;$('fav').onclick=toggleFav
}catch(e){
$('app').innerHTML='<div class="error">❌ حدث خطأ غير متوقع: '+esc(e.message||String(e))+'</div>';
}
}
function openReport(){if(!user){if(confirm('يجب تسجيل الدخول لإرسال بلاغ. هل تريد تسجيل الدخول؟'))location.href='login.html';return}if(user.id===ad?.user_id){alert('لا يمكنك الإبلاغ عن إعلانك الخاص.');return}$('reportModal').classList.add('show')}function closeReport(e){if(e&&e.target&&e.target.id!=='reportModal')return;$('reportModal').classList.remove('show')}async function submitReport(){if(!user||!ad)return;const reason=$('reportReason').value,details=$('reportDetails').value.trim();const {error}=await db.from('ad_reports').insert({reporter_id:user.id,ad_id:ad.id,reason,details:details||null});if(error){if(error.code==='23505')alert('لقد أرسلت بلاغًا لهذا الإعلان مسبقًا.');else alert('تعذر إرسال البلاغ: '+error.message);return}closeReport();$('reportDetails').value='';alert('تم إرسال البلاغ بنجاح. شكرًا لمساعدتنا في الحفاظ على المنصة.')}function openLightbox(src){$('lightboxImg').src=src;$('lightbox').classList.add('show')}function closeLightbox(e){if(e){e.stopPropagation();if(e.target.id!=='lightbox'&&!e.target.classList.contains('closebox'))return}$('lightbox').classList.remove('show');$('lightboxImg').src=''}async function shareAd(){
 const url=location.href;
 try{
   if(navigator.share){
     await navigator.share({title:ad?.title||'إعلان',text:'شاهد هذا الإعلان على فلسطين بلاتفورم',url});
     return;
   }
 }catch(e){
   if(e && e.name==='AbortError') return;
 }
 try{
   if(navigator.clipboard && window.isSecureContext){
     await navigator.clipboard.writeText(url);
     alert('✅ تم نسخ رابط الإعلان. يمكنك الآن إرساله لأي شخص.');
     return;
   }
 }catch(e){}
 const ta=document.createElement('textarea');
 ta.value=url;ta.style.position='fixed';ta.style.opacity='0';
 document.body.appendChild(ta);ta.focus();ta.select();
 try{document.execCommand('copy');alert('✅ تم نسخ رابط الإعلان.');}
 catch(e){prompt('انسخ رابط الإعلان:',url);}
 ta.remove();
}async function toggleFav(){if(!user){if(confirm('يجب تسجيل الدخول لإضافة الإعلان إلى المفضلة. هل تريد تسجيل الدخول؟'))location.href='login.html';return}if(favId){const {error}=await db.from('favorites').delete().eq('id',favId);if(error){alert(error.message);return}favId=null}else{const {data,error}=await db.from('favorites').insert({user_id:user.id,ad_id:ad.id}).select('id').single();if(error){alert(error.message);return}favId=data.id}$('fav').className='btn fav '+(favId?'active':'');$('fav').textContent=favId?'❤️ إزالة من المفضلة':'🤍 إضافة للمفضلة'}
window.shareAd=shareAd;
window.openReport=openReport;
window.closeReport=closeReport;
window.submitReport=submitReport;
window.openLightbox=openLightbox;
window.closeLightbox=closeLightbox;
load();
}
</script></body></html>
