<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إتمام الطلب | فلسطين بلاتفورم</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><script src="platform.js"></script><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="theme-v61.css">
</head><body><header><div class="head"><div class="logo">🛒 فلسطين بلاتفورم</div></div></header><main class="wrap" style="max-width:820px;margin:24px auto;padding:0 14px"><div class="pp-order-card"><h1 id="title" style="margin-top:0">إتمام الطلب</h1><div id="adSummary" class="pp-pay-note">جاري تحميل الإعلان...</div><form id="orderForm" style="margin-top:16px"><div class="pp-order-grid"><div class="pp-order-field"><label>الكمية</label><input id="quantity" type="number" min="1" max="100" value="1" required></div><div class="pp-order-field"><label>طريقة الاستلام</label><select id="deliveryMethod"><option value="pickup">استلام من البائع</option><option value="delivery">توصيل إلى العنوان</option></select></div><div class="pp-order-field"><label>الاسم</label><input id="customerName" required></div><div class="pp-order-field"><label>رقم الهاتف</label><input id="customerPhone" type="tel" required></div><div class="pp-order-field"><label>المدينة</label><input id="city" placeholder="مطلوب للتوصيل"></div><div class="pp-order-field"><label>العنوان</label><input id="address" placeholder="الحي، الشارع، رقم المنزل"></div><div class="pp-order-field full"><label>ملاحظات</label><textarea id="notes" rows="3" placeholder="أي ملاحظات للبائع أو المندوب"></textarea></div></div><h3>💳 طريقة الدفع</h3><label class="pp-payment-option active"><input type="radio" name="pay" value="cash_on_delivery" checked><span><b>الدفع عند الاستلام</b><br><small>متاح إذا فعّله صاحب الإعلان</small></span></label><label class="pp-payment-option" style="opacity:.65"><input type="radio" name="pay" value="online" disabled><span><b>الدفع الإلكتروني</b><br><small>غير متاح حاليًا — سيتم تفعيله بعد ربط بوابة الدفع التجارية</small></span></label><div id="providers" style="display:none;margin-top:8px"><select id="provider" class="pp-order-field" style="width:100%;padding:12px;border:1px solid #d8e1eb;border-radius:12px"><option value="bank_of_palestine">بوابة بنك فلسطين</option><option value="palpay">PalPay للتجارة الإلكترونية</option></select><div class="pp-pay-note" style="margin-top:8px">سيتم فتح بوابة الدفع الخارجية بعد تفعيل حساب التاجر وربط بياناتها الآمنة. لا تضع مفاتيح أو أسرار البوابة داخل GitHub.</div></div><div id="total" style="font-size:20px;font-weight:900;color:#123b68;margin:16px 0"></div><button id="submit" class="btn primary" style="width:100%">✅ تأكيد الطلب</button><div id="msg" class="pp-pay-note" style="margin-top:10px;display:none"></div></form></div></main><script>
const db=window.ppClient,$=id=>document.getElementById(id),esc=window.ppEsc;let ad=null,user=null;
function selectedPay(){return document.querySelector('input[name="pay"]:checked')?.value||'cash_on_delivery'}
function updatePayUI(){const online=selectedPay()==='online';$('providers').style.display=online?'block':'none';document.querySelectorAll('.pp-payment-option').forEach(x=>x.classList.toggle('active',x.querySelector('input').checked));updateTotal()}
function updateTotal(){if(!ad)return;const q=Math.max(1,Number($('quantity').value)||1),delivery=$('deliveryMethod').value==='delivery'?Number(ad.delivery_fee||0):0;const total=Number(ad.price||0)*q+delivery;$('total').textContent='الإجمالي: '+total.toLocaleString('ar-PS')+' شيكل'+(delivery?' (يشمل توصيل '+delivery.toLocaleString('ar-PS')+' ₪)':'')}
$('quantity').oninput=updateTotal;$('deliveryMethod').onchange=()=>{const d=$('deliveryMethod').value==='delivery';$('city').required=d;$('address').required=d;updateTotal()};document.querySelectorAll('input[name="pay"]').forEach(r=>r.onchange=updatePayUI);
(async()=>{const u=await ppUser();if(!u){location.href='login.html?next='+encodeURIComponent(location.href);return}user=u;const id=new URLSearchParams(location.search).get('id');if(!id){$('adSummary').textContent='الإعلان غير موجود.';return}const r=await db.from('ads').select('id,title,price,city,delivery_available,delivery_fee,allow_cod,allow_online_payment,user_id,status').eq('id',id).single();if(r.error||!r.data||r.data.status!=='active'){ $('adSummary').textContent='الإعلان غير متاح للشراء.';return}ad=r.data;if(ad.user_id===user.id){$('adSummary').textContent='لا يمكنك شراء إعلانك الخاص.';$('submit').disabled=true;return}if(ad.price==null){$('adSummary').textContent='هذا الإعلان يحتاج إلى التواصل مع البائع ولا يملك سعرًا ثابتًا للشراء.';$('submit').disabled=true;return} $('title').textContent='🛒 شراء: '+ad.title;$('adSummary').innerHTML='<b>'+esc(ad.title)+'</b><br>السعر: '+Number(ad.price).toLocaleString('ar-PS')+' ₪'+(ad.delivery_available?' · التوصيل متاح':' · الاستلام من البائع');$('deliveryMethod').querySelector('option[value="delivery"]').disabled=!ad.delivery_available;$('deliveryMethod').value=ad.delivery_available?'delivery':'pickup';document.querySelector('input[value="cash_on_delivery"]').disabled=ad.allow_cod===false;document.querySelector('input[value="online"]').disabled=true;if(ad.allow_cod===false){$('adSummary').innerHTML += '<br><span style="color:#b51f2a;font-weight:800">الدفع عند الاستلام غير متاح لهذا الإعلان، والدفع الإلكتروني لم يُفعّل بعد.</span>';$('submit').disabled=true}const p=await ppProfile(user.id);$('customerName').value=p?.full_name||user.user_metadata?.name||'';$('customerPhone').value=p?.phone||'';updatePayUI();})();
$('orderForm').onsubmit=async e=>{e.preventDefault();if(!ad)return;const btn=$('submit');btn.disabled=true;btn.textContent='⏳ جاري إنشاء الطلب...';$('msg').style.display='none';try{const pay=selectedPay();
if(pay==='online') throw Error('الدفع الإلكتروني غير مفعّل حاليًا في المنصة');const r=await db.rpc('create_order',{p_ad_id:ad.id,p_quantity:Number($('quantity').value),p_delivery_method:$('deliveryMethod').value,p_payment_method:pay,p_payment_provider:pay==='online'?$('provider').value:null,p_customer_name:$('customerName').value.trim(),p_customer_phone:$('customerPhone').value.trim(),p_city:$('city').value.trim(),p_address:$('address').value.trim(),p_notes:$('notes').value.trim()});if(r.error)throw r.error;const id=r.data;$('msg').style.display='block';$('msg').innerHTML=pay==='online'?'✅ تم إنشاء الطلب. حالة الدفع الآن «بانتظار بوابة الدفع». قبل تفعيل البوابة لن يتم خصم أي مبلغ.':'✅ تم إنشاء الطلب بنجاح. سنتابع حالة التوصيل من صفحة طلباتك.';setTimeout(()=>location.href='orders.html',1000)}catch(err){$('msg').style.display='block';$('msg').textContent='❌ '+(err.message||'تعذر إنشاء الطلب');btn.disabled=false;btn.textContent='✅ تأكيد الطلب'}};
</script><script src="app-ui.js" defer></script></body></html>
