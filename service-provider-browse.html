<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اختر مقدم الخدمة | فلسطين بلاتفورم</title><link rel="stylesheet" href="app.css"><style>
:root{--b:#123b68;--b2:#1d5b96;--r:#b51f2a;--bg:#f5f8fc;--line:#e1e9f1;--g:#0a8f68}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,Tahoma,sans-serif;color:#172033}.wrap{max-width:900px;margin:auto;padding:0 15px}.top{padding:12px 15px}.top a{color:var(--b);text-decoration:none;font-weight:900}.hero{background:linear-gradient(135deg,#0d2c4d,#1d5b96 65%,#a31f2a);color:#fff;padding:26px 0}.hero h1{margin:0 0 6px;font-size:24px}.hero p{margin:0;color:#e6eff8;font-size:12px}.tools{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}.tools input{flex:1;min-width:140px;height:44px;border-radius:10px;border:0;padding:0 12px}.section{padding:18px 0}.any{background:#fff;border:1px dashed #b7c6d8;border-radius:16px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}.any b{color:var(--b)}.any p{margin:3px 0 0;font-size:12px;color:#66788e}.btn{border:0;border-radius:12px;padding:11px 16px;background:var(--b);color:#fff;font-weight:900;cursor:pointer;text-decoration:none;display:inline-block;font-size:13px}.btn.red{background:var(--r)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}.card h3{margin:0 0 6px;font-size:17px;color:var(--b)}.badge{display:inline-block;background:#eef5fb;color:var(--b);border-radius:8px;padding:4px 8px;font-size:11px;font-weight:900;margin-bottom:6px}.line{font-size:12px;color:#5f6b7a;margin:4px 0}.empty,.error{background:#fff;border-radius:16px;padding:40px 20px;text-align:center;color:#66788e}@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style><link rel="stylesheet" href="theme-v61.css">
</head><body><div class="wrap top"><a href="services.html">← مركز الخدمات</a></div><section class="hero"><div class="wrap"><h1 id="heroTitle">اختر مقدم الخدمة</h1><p id="heroDesc"></p><div class="tools"><input id="city" placeholder="🏙️ المدينة (اختياري للفلترة)"></div></div></section><main class="wrap section">
<div class="any"><div><b id="anyTitle">مو لاقية اللي بيناسبك؟</b><p>أرسل طلبك العام وأول مقدم خدمة متاح رح يقبله.</p></div><a class="btn red" id="anyBtn" href="#">إرسال طلب عام ←</a></div>
<div id="grid" class="grid"><div class="empty">جاري التحميل...</div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><script src="platform.js"></script><script>
const $=id=>document.getElementById(id);const esc=window.ppEsc||((x)=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])));
const q=new URLSearchParams(location.search);const type=q.get('type')||'home';
const meta={transport:['🚚 مزوّدو النقل والشحن','اختر شركة أو سائق نقل واطلب رحلتك.'],delivery:['📦 مزوّدو التوصيل','اختر مندوب توصيل متاح بمدينتك.'],home:['🔧 مزوّدو الخدمات المنزلية','اختر فنيًا أو شركة صيانة مناسبة.'],food:['🍔 مطاعم ومزوّدو الطعام','اختر مطعمًا أو مزوّد طعام متاح.']}[type]||['مقدمو الخدمة','اختر مقدم خدمة.'];
$('heroTitle').textContent=meta[0];$('heroDesc').textContent=meta[1];$('anyBtn').href='service-request.html?type='+encodeURIComponent(type);
function fmtKind(p){return p.provider_kind==='company'?(p.company_name||'شركة'):(p.display_name||'مقدم خدمة مستقل')}
function card(p){const extra=[];if(type==='transport'||type==='delivery'){if(p.vehicle_type)extra.push('🚗 '+esc(p.vehicle_type));if(p.passenger_capacity)extra.push('👥 حتى '+p.passenger_capacity+' راكب')}if(type==='home'&&p.specialization)extra.push('🛠️ '+esc(p.specialization));if(p.coverage_area)extra.push('📍 '+esc(p.coverage_area));if(p.base_price)extra.push('💰 ابتداءً من '+esc(String(p.base_price))+' ₪');
const rr=ratings[p.user_id]||{average_rating:0,review_count:0}; const rating=Number(rr.average_rating||0);
return '<article class="card"><span class="badge">'+(p.provider_kind==='company'?'🏢 شركة':'👤 مستقل')+'</span><h3>'+esc(fmtKind(p))+'</h3>'+(p.description?'<div class="line">'+esc(p.description)+'</div>':'')+extra.map(x=>'<div class="line">'+x+'</div>').join('')+(p.city?'<div class="line">🏙️ '+esc(p.city)+'</div>':'')+'<div class="line">⭐ '+rating.toFixed(1)+' ('+Number(rr.review_count||0)+' تقييم)</div><a class="btn" style="margin-top:10px;width:100%;text-align:center" href="service-request.html?type='+encodeURIComponent(type)+'&provider='+encodeURIComponent(p.user_id)+'">اطلب من هذا المزوّد ←</a></article>'}
let all=[],ratings={};
function render(){const c=$('city').value.trim().toLowerCase();const rows=all.filter(p=>!c||!p.city||p.city.toLowerCase().includes(c));$('grid').innerHTML=rows.length?rows.map(card).join(''):'<div class="empty" style="grid-column:1/-1">لا يوجد مقدمو خدمة متاحون بهذا النوع حاليًا. جرّب "إرسال طلب عام" بالأعلى.</div>'}
async function load(){const r=await ppClient.from('service_providers').select('*').eq('service_type',type).eq('is_active',true).order('created_at',{ascending:false}).limit(60);if(r.error){$('grid').innerHTML='<div class="error">❌ '+esc(r.error.message)+'</div>';return}all=r.data||[]; if(all.length){const ids=all.map(x=>x.user_id);const q=await ppClient.from('provider_reviews').select('provider_id,rating').in('provider_id',ids).eq('status','visible');if(!q.error){const g={};(q.data||[]).forEach(x=>{g[x.provider_id]??=[];g[x.provider_id].push(Number(x.rating))});ratings={};Object.entries(g).forEach(([id,v])=>ratings[id]={average_rating:v.reduce((a,b)=>a+b,0)/v.length,review_count:v.length})}} render()}
$('city').addEventListener('input',render);load();
</script></body></html>
