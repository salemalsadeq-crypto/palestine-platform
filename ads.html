turn}if(data.user)await showLoggedIn(data.user);else showLoggedOut();}logoutBtn.addEventListener("click",async function(){logoutBtn.disabled=true;logoutBtn.textContent="جاري الخروج...";const {error}=await supabaseClient.auth.signOut();if(error){console.error(error);alert("حدث خطأ أثناء تسجيل الخروج.");logoutBtn.disabled=false;logoutBtn.textContent="تسجيل الخروج";return}window.location.href="index.html";});supabaseClient.auth.onAuthStateChange(function(event,session){if(session&&session.user)showLoggedIn(session.user);else showLoggedOut()});/* الإعلانات */addButton.addEventListener("click",async function(){try{const result=await supabaseClient.auth.getUser();if(result.error){console.error(result.error);alert("حدث خطأ أثناء التحقق من تسجيل الدخول.");return}if(!result.data.user){alert("يجب تسجيل الدخول أولاً لإضافة إعلان.");window.location.href="login.html";return}adForm.reset();selectedFiles=[];imagePreview.innerHTML="";message.textContent="";message.style.color="";addModal.style.display="block";}catch(error){console.error(error);alert("حدث خطأ. يرجى المحاولة مرة أخرى.")}});cancelButton.addEventListener("click",()=>addModal.style.display="none");addModal.addEventListener("click",e=>{if(e.target===addModal)addModal.style.display="none"});document.addEventListener("keydown",e=>{if(e.key==="Escape")addModal.style.display="none"});imagesInput.addEventListener("change",function(){const files=Array.from(imagesInput.files);if(files.length>5){alert("يمكنك اختيار 5 صور كحد أقصى.");imagesInput.value="";selectedFiles=[];renderPreview();return}for(const file of files){if(!file.type.startsWith("image/")){alert("يرجى اختيار صور فقط.");imagesInput.value="";selectedFiles=[];renderPreview();return}if(file.size>5*1024*1024){alert("حجم الصورة يجب ألا يتجاوز 5MB.");imagesInput.value="";selectedFiles=[];renderPreview();return}}selectedFiles=files;renderPreview();});function renderPreview(){imagePreview.innerHTML="";selectedFiles.forEach((file,index)=>{const box=document.createElement("div");box.className="preview-box";const img=document.createElement("img");img.src=URL.createObjectURL(file);const remove=document.createElement("button");remove.type="button";remove.className="remove-image";remove.textContent="×";remove.addEventListener("click",()=>{selectedFiles.splice(index,1);renderPreview()});box.appendChild(img);box.appendChild(remove);imagePreview.appendChild(box);});}async function uploadImages(files,userId){const imageUrls=[];for(const file of files){const extension=file.name.split(".").pop().toLowerCase();const fileName=userId+"/"+Date.now()+"_"+Math.random().toString(36).substring(2)+"."+extension;const uploadResult=await supabaseClient.storage.from("ad-images").upload(fileName,file,{cacheControl:"3600",upsert:false,contentType:file.type});if(uploadResult.error)throw new Error("فشل رفع إحدى الصور: "+uploadResult.error.message);const publicResult=supabaseClient.storage.from("ad-images").getPublicUrl(fileName);if(!publicResult.data||!publicResult.data.publicUrl)throw new Error("تعذر الحصول على رابط الصورة.");imageUrls.push(publicResult.data.publicUrl);}return imageUrls;}adForm.addEventListener("submit",async function(event){event.preventDefault();saveButton.disabled=true;saveButton.textContent="جاري النشر...";message.textContent="يرجى الانتظار...";message.style.color="";try{const userResult=await supabaseClient.auth.getUser();if(userResult.error||!userResult.data.user){alert("انتهت جلسة تسجيل الدخول. يرجى تسجيل الدخول مرة أخرى.");window.location.href="login.html";return}const user=userResult.data.user;const title=document.getElementById("title").value.trim(),category=document.getElementById("category").value,description=document.getElementById("description").value.trim(),priceValue=document.getElementById("price").value,city=document.getElementById("city").value.trim(),phone=document.getElementById("phone").value.trim();if(!title||!category||!description)throw new Error("يرجى تعبئة الحقول المطلوبة.");let imageUrls=[];if(selectedFiles.length>0){message.textContent="جاري رفع الصور...";imageUrls=await uploadImages(selectedFiles,user.id)}message.textContent="جاري حفظ الإعلان...";const adData={user_id:user.id,title,category,description,city:city||null,phone:phone||null,image_urls:imageUrls,price:priceValue!==""?Number(priceValue):null};const insertResult=await supabaseClient.from("ads").insert(adData).select().single();if(insertResult.error)throw new Error("تعذر حفظ الإعلان: "+insertResult.error.message);message.textContent="✅ تم نشر الإعلان بنجاح";message.style.color="#16823b";adForm.reset();selectedFiles=[];imagePreview.innerHTML="";await loadAds();setTimeout(()=>{addModal.style.display="none";message.textContent="";message.style.color=""},1200);}catch(error){console.error(error);message.textContent="❌ "+error.message;message.style.color="#b51f2a"}finally{saveButton.disabled=false;saveButton.textContent="نشر الإعلان"}});const urlCategory=new URLSearchParams(window.location.search).get("category");
if(urlCategory){categoryFilter.value=urlCategory;}
async function loadAds(){adsList.innerHTML='<div class="loading">جاري تحميل الإعلانات...</div>';resultsCount.textContent="جاري تحميل الإعلانات...";try{const result=await supabaseClient.from("ads").select("id,user_id,title,category,description,price,city,phone,image_urls,created_at").order("created_at",{ascending:false});if(result.error)throw new Error("تعذر تحميل الإعلانات: "+result.error.message);allAds=result.data||[];applyFilters();}catch(error){console.error(error);resultsCount.textContent="تعذر تحميل الإعلانات";adsList.innerHTML='<div class="empty">❌ '+escapeHTML(error.message)+'<br><br>يرجى تحديث الصفحة والمحاولة مرة أخرى.</div>'}}function applyFilters(){let filtered=[...allAds];const search=searchInput.value.trim().toLowerCase(),category=categoryFilter.value,city=cityFilter.value.trim().toLowerCase(),min=minPrice.value!==""?Number(minPrice.value):null,max=maxPrice.value!==""?Number(maxPrice.value):null;if(search)filtered=filtered.filter(ad=>[ad.title,ad.description,ad.category,ad.city].filter(Boolean).join(" ").toLowerCase().includes(search));if(category)filtered=filtered.filter(ad=>ad.category===category);if(city)filtered=filtered.filter(ad=>String(ad.city||"").toLowerCase().includes(city));if(min!==null)filtered=filtered.filter(ad=>ad.price!==null&&Number(ad.price)>=min);if(max!==null)filtered=filtered.filter(ad=>ad.price!==null&&Number(ad.price)<=max);const sort=sortSelect.value;filtered.sort((a,b)=>{if(sort==="oldest")return new Date(a.created_at)-new Date(b.created_at);if(sort==="low"){const ap=a.price===null?Infinity:Number(a.price),bp=b.price===null?Infinity:Number(b.price);return ap-bp}if(sort==="high"){const ap=a.price===null?-Infinity:Number(a.price),bp=b.price===null?-Infinity:Number(b.price);return bp-ap}return new Date(b.created_at)-new Date(a.created_at)});renderAds(filtered);}function renderAds(ads){resultsCount.textContent="عدد الإعلانات: "+ads.length;if(ads.length===0){adsList.innerHTML='<div class="empty">📭 لا توجد إعلانات مطابقة للبحث.</div>';return}adsList.innerHTML="";ads.forEach(ad=>{const card=document.createElement("div");card.className="ad-card";card.addEventListener("click",()=>{window.location.href="ad-details.html?id="+encodeURIComponent(ad.id)});let imageHTML='<div class="ad-no-image">📦</div>';if(Array.isArray(ad.image_urls)&&ad.image_urls.length>0)imageHTML='<img class="ad-image" src="'+escapeAttribute(ad.image_urls[0])+'" alt="صورة الإعلان" loading="lazy">';const priceHTML=ad.price!==null&&ad.price!==undefined&&ad.price!==""?'<div class="ad-price">'+formatPrice(ad.price)+'</div>':"";const cityHTML=ad.city?"📍 "+escapeHTML(ad.city):"";const phoneHTML=ad.phone?"<br>📞 "+escapeHTML(ad.phone):"";const dateHTML=ad.created_at?formatDate(ad.created_at):"";card.innerHTML=imageHTML+'<div class="ad-content"><h3>'+escapeHTML(ad.title||"بدون عنوان")+'</h3><span class="ad-category">'+escapeHTML(ad.category||"إعلانات أخرى")+'</span><div class="ad-description">'+escapeHTML(ad.description||"")+'</div>'+priceHTML+'<div class="ad-info">'+cityHTML+phoneHTML+'</div><div class="ad-date">'+dateHTML+'</div></div>';adsList.appendChild(card);});}searchButton.addEventListener("click",applyFilters);searchInput.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();applyFilters()}});applyButton.addEventListener("click",applyFilters);clearButton.addEventListener("click",function(){searchInput.value="";categoryFilter.value="";cityFilter.value="";minPrice.value="";maxPrice.value="";sortSelect.value="newest";applyFilters()});sortSelect.addEventListener("change",applyFilters);function escapeHTML(value){return String(value).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}function escapeAttribute(value){return escapeHTML(value)}function formatPrice(price){const number=Number(price);return isNaN(number)?escapeHTML(price)+" شيكل":number.toLocaleString("ar")+" شيكل"}function formatDate(date){try{return new Date(date).toLocaleDateString("ar-PS",{year:"numeric",month:"long",day:"numeric"})}catch(e){return ""}}checkUser();loadAds();</script></body></html>
