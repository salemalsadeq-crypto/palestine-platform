<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الإعلانات - فلسطين بلاتفورم</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0" crossorigin="anonymous"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma;background:#f5f7fa;color:#172033}header{background:#173b68;color:#fff;padding:14px 20px}.head{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.logo{font-size:22px;font-weight:bold}.logo span{color:#b51f2a}nav a{color:#fff;text-decoration:none;margin:3px;padding:8px 10px;background:#234d7e;border-radius:8px;font-size:13px}.wrap{max-width:1100px;margin:25px auto;padding:0 16px}.filters{background:#fff;padding:18px;border-radius:14px;margin-bottom:20px}.filters>*{margin:5px;padding:11px;border:1px solid #ddd;border-radius:8px}button{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 3px 14px #0001;position:relative}.pic,.nop{width:100%;height:190px;object-fit:cover}.nop{display:flex;align-items:center;justify-content:center;background:#e9edf2;font-size:50px}.body{padding:15px}.title{font-size:19px;font-weight:bold}.meta{color:#667085;margin:7px 0}.price{color:#b51f2a;font-weight:bold;font-size:18px}.desc{color:#555;line-height:1.5}.row{display:flex;gap:8px;margin-top:13px}.details,.heart{padding:10px;border-radius:8px;text-decoration:none;font-weight:bold;border:0}.details{background:#173b68;color:#fff;flex:1;text-align:center}.heart{background:#f0f2f5}.heart.active{background:#b51f2a;color:#fff}.count{margin:15px 0;font-weight:bold}.video-badge{position:absolute;top:10px;right:10px;background:#b51f2a;color:#fff;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:bold;z-index:2}.video-mini{width:100%;height:190px;object-fit:cover;background:#101d30}.video-note{font-size:12px;color:#667085;margin:6px 0}.empty{background:#fff;padding:40px;text-align:center;border-radius:14px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="head"><div class="logo">فلسطين <span>بلاتفورم</span></div><nav><a href="index.html">الرئيسية</a><a href="favorites.html">❤️ المفضلة</a><a href="my-ads.html">إعلاناتي</a><a href="account.html">حسابي</a></nav></div></header><main class="wrap"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between"><h1>📋 جميع الإعلانات</h1><button id="addBtn" style="background:#b51f2a;color:#fff;border:0;padding:11px 16px;border-radius:9px;font-weight:bold">➕ أضف إعلانك الآن</button></div><div class="filters"><input id="search" placeholder="🔎 ابحث في الإعلانات"><select id="category"><option value="">كل التصنيفات</option><option>سيارات</option><option>عقارات</option><option>وظائف</option><option>خدمات</option><option>متاجر</option><option>أجهزة وإلكترونيات</option><option>أثاث ومستلزمات</option><option>مواشي وحيوانات</option><option>ملابس وأغراض شخصية</option><option>بيع وشراء</option><option>إعلانات أخرى</option></select><input id="city" placeholder="📍 المدينة"><input id="min" type="number" min="0" placeholder="أقل سعر"><input id="max" type="number" min="0" placeholder="أعلى سعر"><select id="sort"><option value="new">الأحدث أولاً</option><option value="old">الأقدم أولاً</option><option value="low">الأقل سعراً</option><option value="high">الأعلى سعراً</option></select><button onclick="filter()">بحث</button></div><div id="count" class="count">جاري التحميل...</div><div id="grid" class="grid"></div></main>
<div id="addModal" style="display:none;position:fixed;inset:0;background:#0008;z-index:99;padding:20px;overflow:auto"><div style="max-width:650px;margin:30px auto;background:#fff;border-radius:16px;padding:20px"><div style="display:flex;justify-content:space-between;align-items:center"><h2>➕ إضافة إعلان</h2><button id="closeModal" style="border:0;background:#eee;border-radius:8px;padding:8px">✕</button></div><form id="adForm"><input id="title" required placeholder="عنوان الإعلان" style="width:100%;padding:11px;margin:6px 0"><select id="adCategory" required style="width:100%;padding:11px;margin:6px 0"><option value="">اختر التصنيف</option><option>سيارات</option><option>عقارات</option><option>وظائف</option><option>خدمات</option><option>متاجر</option><option>أجهزة وإلكترونيات</option><option>أثاث ومستلزمات</option><option>مواشي وحيوانات</option><option>ملابس وأغراض شخصية</option><option>بيع وشراء</option><option>إعلانات أخرى</option></select><textarea id="description" placeholder="وصف الإعلان" style="width:100%;padding:11px;margin:6px 0;min-height:110px"></textarea><input id="price" type="number" min="0" placeholder="السعر بالشيكل" style="width:100%;padding:11px;margin:6px 0"><input id="city2" placeholder="المدينة" style="width:100%;padding:11px;margin:6px 0"><input id="phone" placeholder="رقم الهاتف" style="width:100%;padding:11px;margin:6px 0"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0"><input id="latitude" type="number" step="any" placeholder="خط العرض Latitude"><input id="longitude" type="number" step="any" placeholder="خط الطول Longitude"></div><input id="locationName" placeholder="اسم الموقع أو العنوان (اختياري)" style="width:100%;padding:11px;margin:6px 0"><button type="button" id="locateBtn" style="width:100%;padding:10px;background:#eef2f7;border:1px solid #ccd5e0;border-radius:8px;font-weight:bold">📍 تحديد موقعي تلقائياً</button><input id="images" type="file" accept="image/jpeg,image/png,image/webp" multiple style="width:100%;padding:11px;margin:6px 0"><small>حد أقصى 5 صور، وكل صورة 5MB.</small><input id="video" type="file" accept="video/mp4,video/webm,video/quicktime" style="display:none"><button type="button" id="videoBtn" style="width:100%;padding:11px;margin:10px 0 6px;background:#eef2f7;border:1px solid #ccd5e0;border-radius:8px;font-weight:bold;cursor:pointer">🎬 اختيار فيديو الإعلان</button><small>🎬 فيديو الإعلان: MP4 / WEBM / MOV — فيديو واحد حتى 50MB.</small><div id="videoPreview" class="video-note"></div><div id="preview" style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0"></div><button id="saveAd" type="submit" style="width:100%;padding:13px;background:#173b68;color:#fff;border:0;border-radius:9px;font-weight:bold">نشر الإعلان</button><div id="formMsg" style="margin-top:10px;text-align:center"></div></form></div></div><script>
const SUPABASE_URL = 'https://sesbumfedusbjevbsyzl.supabase.co';
const SUPABASE_KEY = 'sb_publishable_0sJrbh73jLip3O5OtJkc_A_9F6OPWqR';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const esc = x => String(x ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
let ads = [], user = null, favs = new Set();

async function withTimeout(promise, ms=12000){
  return Promise.race([promise, new Promise((_, reject)=>setTimeout(()=>reject(new Error('انتهت مهلة الاتصال بقاعدة البيانات. تحقق من الإنترنت ثم أعد المحاولة.')), ms))]);
}

async function load(){
  $('count').textContent = 'جاري التحميل...';
  $('grid').innerHTML = '';
  try {
    const session = await withTimeout(db.auth.getUser());
    if (session.error) throw session.error;
    user = session.data.user || null;

    // لا نجعل المفضلة تعطل تحميل الإعلانات.
    if (user) {
      try {
        const f = await withTimeout(db.from('favorites').select('ad_id').eq('user_id', user.id), 7000);
        if (!f.error) (f.data || []).forEach(x => favs.add(x.ad_id));
      } catch(e) { console.warn('favorites:', e); }
    }

    const r = await withTimeout(
      db.from('ads').select('*').eq('status','active').order('created_at',{ascending:false}),
      12000
    );
    if (r.error) throw r.error;
    ads = r.data || [];

    const params = new URLSearchParams(location.search);
    const c = params.get('category'), q = params.get('q');
    if (c) $('category').value = c;
    if (q) $('search').value = q;
    filter();

    // إذا وصلنا من زر "إضافة إعلان" افتح نموذج الإضافة مباشرة.
    if (location.hash === '#add') setTimeout(openAddModal, 100);
  } catch(e) {
    console.error(e);
    $('count').textContent = '❌ تعذر تحميل الإعلانات';
    $('grid').innerHTML = '<div class="empty">❌ '+esc(e.message || e)+'<br><button onclick="load()" style="margin-top:12px;padding:10px 18px;border:0;border-radius:8px;background:#173b68;color:#fff;font-weight:bold">إعادة المحاولة</button></div>';
  }
}

function filter(){
  const s=$('search').value.trim().toLowerCase(), c=$('category').value,
        city=$('city').value.trim().toLowerCase(),
        mn=$('min').value===''?null:+$('min').value,
        mx=$('max').value===''?null:+$('max').value;
  let list=ads.filter(a =>
    (!s || [a.title,a.description,a.category,a.city].filter(Boolean).join(' ').toLowerCase().includes(s)) &&
    (!c || a.category===c) &&
    (!city || String(a.city||'').toLowerCase().includes(city)) &&
    (mn===null || (a.price!=null && +a.price>=mn)) &&
    (mx===null || (a.price!=null && +a.price<=mx))
  );
  const so=$('sort').value;
  list.sort((a,b)=>so==='old'?new Date(a.created_at)-new Date(b.created_at):so==='low'?(a.price==null?Infinity:+a.price)-(b.price==null?Infinity:+b.price):so==='high'?(b.price==null?-Infinity:+b.price)-(a.price==null?-Infinity:+a.price):new Date(b.created_at)-new Date(a.created_at));
  render(list);
}

function render(list){
  $('count').textContent='عدد الإعلانات: '+list.length;
  if(!list.length){$('grid').innerHTML='<div class="empty">📭 لا توجد إعلانات مطابقة.</div>';return;}
  $('grid').innerHTML=list.map(a=>{
    const im=Array.isArray(a.image_urls)&&a.image_urls.length?a.image_urls[0]:'';
    return `<article class="card">${a.video_url?'<span class="video-badge">🎬 فيديو</span>':''}${a.video_url?`<video class="video-mini" src="${esc(a.video_url)}" muted playsinline preload="metadata" controls></video>`:(im?`<img class="pic" src="${esc(im)}" alt="${esc(a.title)}">`:'<div class="nop">📦</div>')}<div class="body"><div class="title">${esc(a.title||'إعلان')}</div><div class="meta">${esc(a.category||'')} ${a.city?' • '+esc(a.city):''}</div><div class="desc">${esc((a.description||'').slice(0,120))}</div><div class="price">${a.price!=null?Number(a.price).toLocaleString('ar-PS')+' شيكل':'السعر عند التواصل'}</div><div class="row"><a class="details" href="ad-details.html?id=${encodeURIComponent(a.id)}">عرض التفاصيل</a><button class="heart ${favs.has(a.id)?'active':''}" onclick="toggleFav(event,'${a.id}')">${favs.has(a.id)?'❤️':'🤍'}</button></div></div></article>`;
  }).join('');
}

async function toggleFav(e,id){
  e.stopPropagation();
  if(!user){if(confirm('يجب تسجيل الدخول لإضافة المفضلة. هل تريد تسجيل الدخول؟')) location.href='login.html';return;}
  try{
    if(favs.has(id)){
      const r=await withTimeout(db.from('favorites').delete().eq('user_id',user.id).eq('ad_id',id),8000);
      if(r.error) throw r.error;
      favs.delete(id);
    }else{
      const r=await withTimeout(db.from('favorites').insert({user_id:user.id,ad_id:id}),8000);
      if(r.error) throw r.error;
      favs.add(id);
    }
    filter();
  }catch(e){alert('تعذر تحديث المفضلة: '+(e.message||e));}
}
window.filter=filter; window.toggleFav=toggleFav;

function openAddModal(){
  if(!user){
    alert('يجب تسجيل الدخول أولاً لإضافة إعلان.');
    location.href='login.html';
    return;
  }
  $('addModal').style.display='block';
}

$('addBtn').onclick=openAddModal;
$('closeModal').onclick=()=>{$('addModal').style.display='none'};
$('addModal').onclick=e=>{if(e.target===$('addModal')) $('addModal').style.display='none'};
$('images').onchange=()=>{
  const files=[...$('images').files]; $('preview').innerHTML='';
  files.slice(0,5).forEach(f=>{if(f.size<=5*1024*1024){const im=document.createElement('img');im.src=URL.createObjectURL(f);im.style.cssText='width:80px;height:60px;object-fit:cover;border-radius:8px';$('preview').appendChild(im);}});
};
$('videoBtn').onclick=()=>$('video').click();
$('video').onchange=()=>{const f=$('video').files[0];$('videoPreview').textContent=!f?'':(f.size>50*1024*1024?'❌ الفيديو أكبر من 50MB':'🎬 '+f.name+' — '+(f.size/1024/1024).toFixed(1)+'MB');};
$('locateBtn').onclick=()=>{
  if(!navigator.geolocation){alert('المتصفح لا يدعم تحديد الموقع');return;}
  navigator.geolocation.getCurrentPosition(pos=>{$('latitude').value=pos.coords.latitude.toFixed(7);$('longitude').value=pos.coords.longitude.toFixed(7);if(!$('locationName').value)$('locationName').value='موقعي الحالي';},()=>alert('تعذر تحديد الموقع. تأكد من السماح بالموقع.'));
};

$('adForm').onsubmit=async e=>{
  e.preventDefault();
  const msg=$('formMsg'), submitBtn=$('saveAd');
  submitBtn.disabled=true; msg.textContent='جاري رفع الملفات...';
  try{
    const session=await withTimeout(db.auth.getUser());
    if(session.error||!session.data.user) throw new Error('يجب تسجيل الدخول أولاً.');
    user=session.data.user;
    const files=[...$('images').files], video=$('video').files[0];
    if(files.length>5 || files.some(f=>f.size>5*1024*1024)) throw new Error('الحد الأقصى 5 صور، 5MB للصورة.');
    if(video){
      if(video.size>50*1024*1024) throw new Error('الفيديو أكبر من 50MB.');
      const ve=(video.name.split('.').pop()||'').toLowerCase();
      if(!['mp4','webm','mov'].includes(ve)) throw new Error('صيغة الفيديو غير مدعومة. استخدم MP4 أو WEBM أو MOV.');
    }
    let urls=[], imagePaths=[], videoPath=null;
    const cleanup=async()=>{try{if(imagePaths.length)await db.storage.from('ad-images').remove(imagePaths);if(videoPath)await db.storage.from('ad-videos').remove([videoPath]);}catch(e){console.warn('cleanup',e)}};
    for(const f of files){
      const ext=(f.name.split('.').pop()||'jpg').toLowerCase();
      const path=user.id+'/'+Date.now()+'_'+Math.random().toString(36).slice(2)+'.'+ext;
      const up=await withTimeout(db.storage.from('ad-images').upload(path,f,{contentType:f.type,upsert:false}),20000);
      if(up.error) throw new Error('فشل رفع الصورة: '+up.error.message);
      imagePaths.push(path); urls.push(db.storage.from('ad-images').getPublicUrl(path).data.publicUrl);
    }
    let videoUrl=null;
    if(video){
      const ext=(video.name.split('.').pop()||'mp4').toLowerCase(), vp=user.id+'/'+Date.now()+'_'+Math.random().toString(36).slice(2)+'.'+ext;
      const mimeMap={mp4:'video/mp4',webm:'video/webm',mov:'video/quicktime'};
      const vu=await withTimeout(db.storage.from('ad-videos').upload(vp,video,{contentType:mimeMap[ext]||video.type||'application/octet-stream',upsert:false}),60000);
      if(vu.error) throw new Error('فشل رفع الفيديو: '+vu.error.message);
      videoPath=vp; videoUrl=db.storage.from('ad-videos').getPublicUrl(vp).data.publicUrl;
    }
    const row={user_id:user.id,title:$('title').value.trim(),category:$('adCategory').value,description:$('description').value.trim(),price:$('price').value===''?null:Number($('price').value),city:$('city2').value.trim(),phone:$('phone').value.trim(),latitude:$('latitude').value===''?null:Number($('latitude').value),longitude:$('longitude').value===''?null:Number($('longitude').value),location_name:$('locationName').value.trim()||null,image_urls:urls,video_url:videoUrl,status:'active'};
    const r=await withTimeout(db.from('ads').insert(row),15000);
    if(r.error) throw r.error;
    msg.textContent='✅ تم نشر الإعلان بنجاح';
    setTimeout(()=>{$('addModal').style.display='none';$('adForm').reset();$('preview').innerHTML='';$('videoPreview').textContent='';msg.textContent='';load();},700);
  }catch(e){
    console.error(e); msg.textContent='❌ '+(e.message||e); submitBtn.disabled=false;
  }
};

['search','category','city','min','max','sort'].forEach(id=>$(id).addEventListener('input',filter));
load();
</script></body></html>
