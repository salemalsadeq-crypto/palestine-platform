<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الإعلانات - فلسطين بلاتفورم</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma;background:#f5f7fa;color:#172033}header{background:#173b68;color:#fff;padding:14px 20px}.head{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.logo{font-size:22px;font-weight:bold}.logo span{color:#b51f2a}nav a{color:#fff;text-decoration:none;margin:3px;padding:8px 10px;background:#234d7e;border-radius:8px;font-size:13px}.wrap{max-width:1100px;margin:25px auto;padding:0 16px}.filters{background:#fff;padding:18px;border-radius:14px;margin-bottom:20px}.filters>*{margin:5px;padding:11px;border:1px solid #ddd;border-radius:8px}button{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 3px 14px #0001;position:relative}.pic,.nop{width:100%;height:190px;object-fit:cover}.nop{display:flex;align-items:center;justify-content:center;background:#e9edf2;font-size:50px}.body{padding:15px}.title{font-size:19px;font-weight:bold}.meta{color:#667085;margin:7px 0}.price{color:#b51f2a;font-weight:bold;font-size:18px}.desc{color:#555;line-height:1.5}.row{display:flex;gap:8px;margin-top:13px}.details,.heart{padding:10px;border-radius:8px;text-decoration:none;font-weight:bold;border:0}.details{background:#173b68;color:#fff;flex:1;text-align:center}.heart{background:#f0f2f5}.heart.active{background:#b51f2a;color:#fff}.count{margin:15px 0;font-weight:bold}.empty{background:#fff;padding:40px;text-align:center;border-radius:14px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}}
.addbtn{background:#b51f2a;color:#fff;border:0;padding:11px 16px;border-radius:9px;font-weight:bold}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:15px}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:9999;padding:16px}
.modal.show{display:flex}.modalbox{background:#fff;width:min(620px,100%);max-height:92vh;overflow:auto;border-radius:16px;padding:20px}
.modalbox h2{margin-top:0}.modalbox input,.modalbox select,.modalbox textarea{width:100%;padding:11px;margin:6px 0 10px;border:1px solid #ddd;border-radius:8px;font:inherit}
.modal-actions{display:flex;gap:8px;margin-top:8px}.modal-actions button{flex:1;padding:12px;border:0;border-radius:8px;font-weight:bold}
.save{background:#173b68;color:#fff}.cancel{background:#eee;color:#333}
.preview{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:5px 0 12px}
.preview img{width:100%;height:75px;object-fit:cover;border-radius:7px}
.hint{font-size:12px;color:#667085}
</style></head><body><header><div class="head"><div class="logo">فلسطين <span>بلاتفورم</span></div><nav><a href="index.html">الرئيسية</a><a href="favorites.html">❤️ المفضلة</a><a href="my-ads.html">إعلاناتي</a><a href="account.html">حسابي</a></nav></div></header><main class="wrap"><div class="topbar"><h1>📋 جميع الإعلانات</h1><button class="addbtn" id="openAdd">➕ أضف إعلانك</button></div><div class="filters"><input id="search" placeholder="🔎 ابحث في الإعلانات"><select id="category"><option value="">كل التصنيفات</option><option>سيارات</option><option>عقارات</option><option>وظائف</option><option>خدمات</option><option>متاجر</option><option>أجهزة وإلكترونيات</option><option>أثاث ومستلزمات</option><option>مواشي وحيوانات</option><option>ملابس وأغراض شخصية</option><option>بيع وشراء</option><option>إعلانات أخرى</option></select><input id="city" placeholder="📍 المدينة"><input id="min" type="number" min="0" placeholder="أقل سعر"><input id="max" type="number" min="0" placeholder="أعلى سعر"><select id="sort"><option value="new">الأحدث أولاً</option><option value="old">الأقدم أولاً</option><option value="low">الأقل سعراً</option><option value="high">الأعلى سعراً</option></select><button onclick="filter()">بحث</button></div><div id="count" class="count">جاري التحميل...</div><div id="grid" class="grid"></div>
<div id="addModal" class="modal" aria-hidden="true">
<div class="modalbox">
<h2>➕ إضافة إعلان جديد</h2>
<form id="adForm">
<label>عنوان الإعلان</label><input id="adTitle" required maxlength="120" placeholder="مثال: شقة للبيع في رام الله">
<label>التصنيف</label><select id="adCategory" required>
<option value="">اختر التصنيف</option><option>سيارات</option><option>عقارات</option><option>وظائف</option><option>خدمات</option><option>متاجر</option><option>أجهزة وإلكترونيات</option><option>أثاث ومستلزمات</option><option>مواشي وحيوانات</option><option>ملابس وأغراض شخصية</option><option>بيع وشراء</option><option>إعلانات أخرى</option>
</select>
<label>الوصف</label><textarea id="adDescription" rows="5" maxlength="3000" placeholder="اكتب تفاصيل الإعلان"></textarea>
<label>السعر (شيكل)</label><input id="adPrice" type="number" min="0" step="0.01" placeholder="اختياري">
<label>المدينة</label><input id="adCity" maxlength="80" placeholder="مثال: الخليل">
<label>رقم الهاتف</label><input id="adPhone" maxlength="30" placeholder="05xxxxxxxx">
<label>الصور</label><input id="adImages" type="file" accept="image/jpeg,image/png,image/webp" multiple>
<div class="hint">حتى 5 صور، وبحد أقصى 5MB للصورة.</div><div id="imagePreview" class="preview"></div>
<div class="modal-actions"><button type="submit" class="save" id="saveAd">نشر الإعلان</button><button type="button" class="cancel" id="closeAdd">إلغاء</button></div>
</form></div></div>
</main><script>
const SUPABASE_URL='https://sesbumfedusbjevbsyzl.supabase.co',KEY='sb_publishable_0sJrbh73jLip3O5OtJkc_A_9F6OPWqR',db=supabase.createClient(SUPABASE_URL,KEY);
let ads=[],user=null,favs=new Set();const $=x=>document.getElementById(x);
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
async function load(){
 const u=await db.auth.getUser();user=u.data.user||null;
 if(user){const f=await db.from('favorites').select('ad_id').eq('user_id',user.id);if(!f.error)(f.data||[]).forEach(x=>favs.add(x.ad_id))}
 const r=await db.from('ads').select('*').order('created_at',{ascending:false});
 if(r.error){$('grid').innerHTML='<div class="empty">❌ '+esc(r.error.message)+'</div>';return}
 ads=r.data||[];const c=new URLSearchParams(location.search).get('category');
 if(c&&[...$('category').options].some(o=>o.value===c))$('category').value=c;filter();
 if(location.hash==='#add')setTimeout(openAdd,250);
}
function filter(){
 let s=$('search').value.trim().toLowerCase(),c=$('category').value,city=$('city').value.trim().toLowerCase(),mn=$('min').value===''?null:+$('min').value,mx=$('max').value===''?null:+$('max').value;
 let list=ads.filter(a=>(!s||[a.title,a.description,a.category,a.city].filter(Boolean).join(' ').toLowerCase().includes(s))&&(!c||a.category===c)&&(!city||String(a.city||'').toLowerCase().includes(city))&&(mn===null||(a.price!=null&&+a.price>=mn))&&(mx===null||(a.price!=null&&+a.price<=mx)));
 const so=$('sort').value;list.sort((a,b)=>so==='old'?new Date(a.created_at)-new Date(b.created_at):so==='low'?(a.price==null?Infinity:+a.price)-(b.price==null?Infinity:+b.price):so==='high'?(b.price==null?-Infinity:+b.price)-(a.price==null?-Infinity:+a.price):new Date(b.created_at)-new Date(a.created_at));render(list)
}
function render(list){
 $('count').textContent='عدد الإعلانات: '+list.length;if(!list.length){$('grid').innerHTML='<div class="empty">📭 لا توجد إعلانات مطابقة.</div>';return}
 $('grid').innerHTML=list.map(a=>{const im=Array.isArray(a.image_urls)&&a.image_urls.length?a.image_urls[0]:'';
 return `<article class="card">${im?`<img class="pic" src="${esc(im)}" alt="${esc(a.title)}">`:'<div class="nop">📦</div>'}<div class="body"><div class="title">${esc(a.title||'إعلان')}</div><div class="meta">${esc(a.category||'')} ${a.city?' • '+esc(a.city):''}</div><div class="desc">${esc((a.description||'').slice(0,120))}</div><div class="price">${a.price!=null?Number(a.price).toLocaleString('ar-PS')+' شيكل':'السعر عند التواصل'}</div><div class="row"><a class="details" href="ad-details.html?id=${encodeURIComponent(a.id)}">عرض التفاصيل</a><button class="heart ${favs.has(a.id)?'active':''}" onclick="toggleFav(event,'${a.id}')">${favs.has(a.id)?'❤️':'🤍'}</button></div></div></article>`}).join('')
}
async function toggleFav(e,id){
 e.stopPropagation();if(!user){if(confirm('يجب تسجيل الدخول لإضافة المفضلة. هل تريد تسجيل الدخول؟'))location.href='login.html';return}
 if(favs.has(id)){const r=await db.from('favorites').delete().eq('user_id',user.id).eq('ad_id',id);if(r.error){alert(r.error.message);return}favs.delete(id)}
 else{const r=await db.from('favorites').insert({user_id:user.id,ad_id:id});if(r.error){alert(r.error.message);return}favs.add(id)}filter()
}
function openAdd(){
 if(!user){if(confirm('يجب تسجيل الدخول لإضافة إعلان. هل تريد تسجيل الدخول؟'))location.href='login.html';return}
 $('addModal').classList.add('show');$('addModal').setAttribute('aria-hidden','false')
}
function closeAdd(){$('addModal').classList.remove('show');$('addModal').setAttribute('aria-hidden','true')}
$('openAdd').onclick=openAdd;$('closeAdd').onclick=closeAdd;$('addModal').onclick=e=>{if(e.target.id==='addModal')closeAdd()};
$('adImages').onchange=()=>{
 const files=[...$('adImages').files];if(files.length>5){alert('يمكن اختيار 5 صور كحد أقصى.');$('adImages').value='';$('imagePreview').innerHTML='';return}
 if(files.some(f=>f.size>5*1024*1024)){alert('حجم كل صورة يجب ألا يتجاوز 5MB.');$('adImages').value='';$('imagePreview').innerHTML='';return}
 $('imagePreview').innerHTML='';files.forEach(f=>{const img=document.createElement('img');img.src=window.URL.createObjectURL(f);$('imagePreview').appendChild(img)})
};
$('adForm').onsubmit=async e=>{
 e.preventDefault();if(!user){alert('انتهت جلسة الدخول. سجل الدخول مرة أخرى.');return}
 const btn=$('saveAd');btn.disabled=true;btn.textContent='جاري النشر...';
 try{
  const files=[...$('adImages').files],urls=[];
  for(const f of files){const ext=(f.name.split('.').pop()||'jpg').toLowerCase(),path=`${user.id}/${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
   const up=await db.storage.from('ad-images').upload(path,f,{contentType:f.type,upsert:false});if(up.error)throw up.error;
   urls.push(db.storage.from('ad-images').getPublicUrl(path).data.publicUrl)
  }
  const payload={user_id:user.id,title:$('adTitle').value.trim(),category:$('adCategory').value,description:$('adDescription').value.trim()||null,price:$('adPrice').value===''?null:+$('adPrice').value,city:$('adCity').value.trim()||null,phone:$('adPhone').value.trim()||null,image_urls:urls};
  const r=await db.from('ads').insert(payload);if(r.error)throw r.error;
  alert('✅ تم نشر الإعلان بنجاح.');$('adForm').reset();$('imagePreview').innerHTML='';closeAdd();await load()
 }catch(err){alert('❌ تعذر نشر الإعلان: '+(err.message||err))}
 finally{btn.disabled=false;btn.textContent='نشر الإعلان'}
};
load();['search','category','city','min','max','sort'].forEach(id=>$(id).addEventListener('input',filter));
</script></body></html>
