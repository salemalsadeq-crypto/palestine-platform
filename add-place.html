<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إضافة مكان</title><style>body{font-family:Arial;background:#f5f7fa}.box{max-width:700px;margin:30px auto;background:#fff;padding:20px;border-radius:14px}input,textarea,select{width:100%;padding:11px;margin:6px 0 12px;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}.btn{padding:12px;border:0;border-radius:8px;background:#173b68;color:#fff;width:100%;font-weight:bold}.msg{margin:10px 0}</style></head><body><main class="box"><h2>📍 إضافة مكان</h2><form id="f"><input id="name" placeholder="اسم المكان" required><select id="category"><option>مطاعم</option><option>متاجر</option><option>خدمات</option><option>أماكن سياحية</option><option>مؤسسات</option><option>أخرى</option></select><input id="city" placeholder="المدينة"><input id="address" placeholder="العنوان"><textarea id="description" placeholder="وصف المكان"></textarea><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input id="lat" type="number" step="any" placeholder="خط العرض" required><input id="lng" type="number" step="any" placeholder="خط الطول" required></div><button class="btn">إرسال المكان للمراجعة</button></form><div id="msg" class="msg"></div><p><a href="map.html">العودة للخريطة</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><script src="platform.js"></script><script>const db=ppClient,$=id=>document.getElementById(id);$('f').onsubmit=async e=>{e.preventDefault();const u=await ppUser();if(!u)return location.href='login.html';const row={user_id:u.id,name:$('name').value.trim(),category:$('category').value,city:$('city').value.trim()||null,address:$('address').value.trim()||null,description:$('description').value.trim()||null,latitude:Number($('lat').value),longitude:Number($('lng').value),status:'pending'};const {error}=await db.from('places').insert(row);$('msg').textContent=error?'❌ '+error.message:'✅ تم إرسال المكان للمراجعة.';if(!error)e.target.reset()};</script></body></html>
