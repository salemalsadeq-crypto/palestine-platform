<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إضافة مكان | فلسطين بلاتفورم</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{font-family:Arial,Tahoma,sans-serif;background:#f3f6fa;margin:0;color:#172033}.box{max-width:850px;margin:20px auto;background:#fff;padding:20px;border-radius:18px;box-shadow:0 5px 22px #0001}.back{display:inline-block;color:#173b68;text-decoration:none;font-weight:bold;margin-bottom:12px}h2{margin-top:4px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,textarea,select{width:100%;padding:12px;margin:6px 0 12px;border:1px solid #d9e0e7;border-radius:9px;font-size:15px}textarea{min-height:90px;resize:vertical}.label{font-weight:bold;color:#334155;font-size:14px}.btn{padding:12px;border:0;border-radius:9px;background:#173b68;color:#fff;width:100%;font-weight:bold;font-size:15px;cursor:pointer}.secondary{background:#eef2f6;color:#173b68;margin-top:8px}.msg{margin:12px 0;padding:10px;border-radius:9px;background:#f7f9fb}.hint{font-size:13px;color:#64748b;line-height:1.6}.coords{background:#f7f9fb;padding:10px;border-radius:9px;margin-bottom:12px}.map{height:360px;border-radius:14px;overflow:hidden;border:1px solid #dbe3ea;margin:8px 0 14px}.actions{display:flex;gap:8px;flex-wrap:wrap}.small{width:auto;flex:1;min-width:160px}@media(max-width:600px){.box{margin:0;border-radius:0;min-height:100vh}.grid{grid-template-columns:1fr}.map{height:300px}}
</style><link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="theme-v61.css">
</head><body><main class="box"><a class="back" href="places.html">← العودة إلى دليل الأماكن</a><h2>📍 إضافة مكان جديد</h2><p class="hint">حدد موقع المكان على الخريطة بالنقر عليه، أو استخدم موقعك الحالي. سيتم إرسال المكان للمراجعة قبل نشره.</p><form id="f"><div class="label">اسم المكان</div><input id="name" placeholder="مثال: مطعم فلسطين" required><div class="grid"><div><div class="label">التصنيف</div><select id="category"><option>مطاعم</option><option>متاجر</option><option>خدمات</option><option>صيدليات</option><option>صحة</option><option>فنادق</option><option>تعليم</option><option>مؤسسات</option><option>أماكن سياحية</option><option>أخرى</option></select></div><div><div class="label">المدينة</div><input id="city" placeholder="نابلس"></div></div><div class="label">العنوان</div><input id="address" placeholder="الشارع / المنطقة"><div class="grid"><div><div class="label">الهاتف (اختياري)</div><input id="phone" type="tel" placeholder="059..."></div><div><div class="label">الموقع الإلكتروني (اختياري)</div><input id="website" type="url" placeholder="https://..."></div></div><div class="label">وصف المكان</div><textarea id="description" placeholder="اكتب وصفًا مختصرًا للمكان"></textarea><div class="label">حدد موقع المكان</div><div id="map" class="map"></div><div class="actions"><button type="button" id="locate" class="btn small">📍 استخدام موقعي الحالي</button><button type="button" id="clear" class="btn secondary small">🧹 مسح الموقع</button></div><div class="coords">الإحداثيات: <b id="coordText">لم يتم تحديد الموقع</b></div><input id="lat" type="hidden"><input id="lng" type="hidden"><button class="btn" id="submitBtn">إرسال المكان للمراجعة</button></form><div id="msg" class="msg"></div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><script src="platform.js"></script><script>const db=ppClient,$=id=>document.getElementById(id);const map=L.map('map').setView([31.95,35.20],9);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);let marker=null;function setPoint(lat,lng,zoom=15){lat=Number(lat);lng=Number(lng);if(!Number.isFinite(lat)||!Number.isFinite(lng))return;$('lat').value=lat;$('lng').value=lng;$('coordText').textContent=lat.toFixed(6)+' , '+lng.toFixed(6);if(marker)marker.setLatLng([lat,lng]);else marker=L.marker([lat,lng],{draggable:true}).addTo(map);marker.on('dragend',()=>{const p=marker.getLatLng();setPoint(p.lat,p.lng,0)});if(zoom)map.setView([lat,lng],zoom)}map.on('click',e=>setPoint(e.latlng.lat,e.latlng.lng));$('clear').onclick=()=>{if(marker){map.removeLayer(marker);marker=null}$('lat').value='';$('lng').value='';$('coordText').textContent='لم يتم تحديد الموقع'};$('locate').onclick=()=>{if(!navigator.geolocation){alert('المتصفح لا يدعم تحديد الموقع');return}navigator.geolocation.getCurrentPosition(pos=>setPoint(pos.coords.latitude,pos.coords.longitude,16),()=>alert('تعذر الحصول على الموقع. يمكنك تحديده بالنقر على الخريطة.'),{enableHighAccuracy:true,timeout:10000,maximumAge:0})};marker=null;$('f').onsubmit=async e=>{e.preventDefault();const u=await ppUser();if(!u)return location.href='login.html';const lat=Number($('lat').value),lng=Number($('lng').value);if(!Number.isFinite(lat)||!Number.isFinite(lng)){ $('msg').textContent='❌ حدد موقع المكان على الخريطة أولاً.';return}const row={user_id:u.id,name:$('name').value.trim(),category:$('category').value,city:$('city').value.trim()||null,address:$('address').value.trim()||null,phone:$('phone').value.trim()||null,website:$('website').value.trim()||null,description:$('description').value.trim()||null,latitude:lat,longitude:lng,status:'pending'};$('submitBtn').disabled=true;$('submitBtn').textContent='جاري الإرسال...';const {error}=await db.from('places').insert(row);$('msg').textContent=error?'❌ '+error.message:'✅ تم إرسال المكان للمراجعة بنجاح.';if(!error){e.target.reset();$('clear').click()}$('submitBtn').disabled=false;$('submitBtn').textContent='إرسال المكان للمراجعة'};</script><script src="app-ui.js" defer></script>
</body></html>
