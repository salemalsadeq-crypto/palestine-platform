<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة الطلبات | فلسطين بلاتفورم</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><script src="platform.js"></script><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="theme-v47.css"><link rel="stylesheet" href="theme-v48.css"></head><body><header><div class="head"><div class="logo">👑 إدارة الطلبات والتوصيل</div></div></header><main style="max-width:1100px;margin:24px auto;padding:0 14px"><div id="app" class="pp-order-card">جاري التحميل...</div></main><script>
const db=window.ppClient,$=id=>document.getElementById(id),esc=window.ppEsc;const labels={pending:'قيد المراجعة',confirmed:'تم التأكيد',preparing:'جاري التجهيز',out_for_delivery:'في الطريق',delivered:'تم التسليم',cancelled:'ملغي'};
async function load(){const u=await ppRequire('manage_orders');if(!u)return;const r=await db.from('orders').select('id,ad_id,buyer_id,seller_id,quantity,total_amount,delivery_method,payment_method,payment_provider,payment_status,order_status,customer_name,customer_phone,city,address,created_at,ads(title)').order('created_at',{ascending:false}).limit(200);if(r.error){$('app').textContent='❌ '+r.error.message;return}const rows=r.data||[];$('app').innerHTML='<h1 style="margin-top:0">الطلبات</h1>'+(rows.length?rows.map(o=>'<article class="pp-order-card" style="margin:12px 0"><div><b>'+esc(o.ads?.title||'طلب')+'</b> · '+Number(o.total_amount).toLocaleString('ar-PS')+' ₪</div><div class="meta">'+esc(o.customer_name)+' · '+esc(o.customer_phone)+(o.city?' · '+esc(o.city):'')+(o.address?'<br>📍 '+esc(o.address):'')+'<br>الدفع: '+esc(o.payment_status)+' · التوصيل: '+(o.delivery_method==='delivery'?'توصيل':'استلام')+'</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><select data-id="'+o.id+'" class="order-status" style="padding:10px;border:1px solid #d8e1eb;border-radius:10px">'+Object.entries(labels).map(([k,v])=>'<option value="'+k+'" '+(o.order_status===k?'selected':'')+'>'+v+'</option>').join('')+'</select><button class="btn primary save-order" data-id="'+o.id+'">حفظ الحالة</button>'+(o.payment_method==='online'&&o.payment_status!=='paid'?'<button class="btn green mark-paid" data-id="'+o.id+'">تأكيد الدفع</button>':'')+'</div></article>').join(''):'<div style="padding:30px;text-align:center">لا توجد طلبات.</div>');document.querySelectorAll('.save-order').forEach(b=>b.onclick=()=>save(b.dataset.id));document.querySelectorAll('.mark-paid').forEach(b=>b.onclick=()=>paid(b.dataset.id))}
async function save(id){const s=document.querySelector('.order-status[data-id="'+id+'"]').value;const r=await db.rpc('seller_update_order_status',{p_order_id:id,p_status:s});if(r.error)alert(r.error.message);else load()}async function paid(id){const ref=prompt('رقم العملية من بوابة الدفع (اختياري):')||'';const r=await db.rpc('set_order_paid',{p_order_id:id,p_provider_reference:ref});if(r.error)alert(r.error.message);else load()}load();
</script><script src="app-ui.js" defer></script></body></html>
