<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة الطلبات والاعتراضات | فلسطين بلاتفورم</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><script src="platform.js"></script><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="theme-v61.css"></head><body><header><div class="head"><div class="logo">👑 إدارة الطلبات والاعتراضات</div></div></header><main style="max-width:1100px;margin:24px auto;padding:0 14px"><div id="app" class="pp-order-card">جاري التحميل...</div></main><script>
const db=window.ppClient,$=id=>document.getElementById(id),esc=window.ppEsc;const labels={pending:'قيد المراجعة',confirmed:'تم التأكيد',preparing:'قيد التجهيز',out_for_delivery:'في الطريق',delivered:'تم التسليم',cancelled:'ملغي'};const disputeLabels={open:'مفتوح',resolved:'تمت المعالجة',rejected:'مرفوض'};
async function load(){const u=await ppRequire('manage_orders');if(!u)return;const [r,d]=await Promise.all([db.from('orders').select('id,ad_id,buyer_id,seller_id,quantity,total_amount,delivery_method,payment_method,payment_status,order_status,customer_name,customer_phone,city,address,created_at,ads(title)').order('created_at',{ascending:false}).limit(200),db.from('order_disputes').select('id,order_id,buyer_id,seller_id,reason,status,resolution_note,created_at,orders(customer_name,customer_phone,ads(title),total_amount)').order('created_at',{ascending:false}).limit(200)]);if(r.error){$('app').textContent='❌ '+r.error.message;return}const rows=r.data||[],disputes=d.error?[]:(d.data||[]);$('app').innerHTML='<h1 style="margin-top:0">إدارة الطلبات</h1><p>تغييرات المدير تصحيحية. لا توجد بوابة دفع متصلة؛ تأكيد الدفع هنا يدوي فقط بعد التحقق من استلامه خارج الموقع.</p>'+(rows.length?rows.map(o=>'<article class="pp-order-card" style="margin:12px 0"><div><b>'+esc(o.ads?.title||'طلب')+'</b> · '+Number(o.total_amount).toLocaleString('ar-PS')+' ₪</div><div class="meta">'+esc(o.customer_name)+' · '+esc(o.customer_phone)+(o.city?' · '+esc(o.city):'')+(o.address?'<br>📍 '+esc(o.address):'')+'<br>الدفع: '+esc(o.payment_status)+' · التوصيل: '+(o.delivery_method==='delivery'?'توصيل':'استلام')+'</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><select data-id="'+o.id+'" class="order-status" style="padding:10px;border:1px solid #d8e1eb;border-radius:10px">'+Object.entries(labels).map(([k,v])=>'<option value="'+k+'" '+(o.order_status===k?'selected':'')+'>'+v+'</option>').join('')+'</select><button class="btn primary save-order" data-id="'+o.id+'">حفظ الحالة (مدير)</button>'+(o.payment_method==='online'&&o.payment_status!=='paid'?'<button class="btn green mark-paid" data-id="'+o.id+'">تأكيد الدفع يدويًا</button>':'')+'</div></article>').join(''):'<div style="padding:20px">لا توجد طلبات.</div>')+'<hr style="margin:28px 0"><h2>⚑ اعتراضات المشترين</h2><p>تظهر الاعتراضات التي أرسلها المشتري بعد تسجيل تسليم الطلب.</p>'+(disputes.length?disputes.map(x=>'<article class="pp-order-card" style="margin:12px 0"><div><b>'+esc(x.orders?.ads?.title||'طلب')+'</b> · '+Number(x.orders?.total_amount||0).toLocaleString('ar-PS')+' ₪</div><div class="meta">المشتري: '+esc(x.orders?.customer_name||'')+' · '+esc(x.orders?.customer_phone||'')+'<br>الحالة: '+esc(disputeLabels[x.status]||x.status)+' · '+new Date(x.created_at).toLocaleString('ar-PS')+'</div><p style="white-space:pre-wrap">'+esc(x.reason)+'</p>'+(x.resolution_note?'<p>ملاحظة الإدارة: '+esc(x.resolution_note)+'</p>':'')+(x.status==='open'?'<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary resolve-dispute" data-id="'+x.id+'" data-status="resolved">اعتماد المعالجة</button><button class="btn soft resolve-dispute" data-id="'+x.id+'" data-status="rejected">رفض الاعتراض</button></div>':'')+'</article>').join(''):'<div style="padding:20px">لا توجد اعتراضات'+(d.error?' (قد يلزم تنفيذ ملف SQL أولاً).':'.')+'</div>');document.querySelectorAll('.save-order').forEach(b=>b.onclick=()=>save(b.dataset.id));document.querySelectorAll('.mark-paid').forEach(b=>b.onclick=()=>paid(b.dataset.id));document.querySelectorAll('.resolve-dispute').forEach(b=>b.onclick=()=>resolveDispute(b.dataset.id,b.dataset.status))}
async function save(id){const s=document.querySelector('.order-status[data-id="'+id+'"]').value;if(!confirm('حفظ الحالة الجديدة كإجراء إداري؟'))return;const r=await db.rpc('seller_update_order_status',{p_order_id:id,p_status:s});if(r.error)alert(r.error.message);else load()}
async function paid(id){if(!confirm('هل تحققت يدوياً من استلام المبلغ؟ لا توجد بوابة دفع متصلة.'))return;const ref=prompt('مرجع العملية إن وجد (اختياري):')||'';const r=await db.rpc('set_order_paid',{p_order_id:id,p_provider_reference:ref});if(r.error)alert(r.error.message);else load()}
async function resolveDispute(id,status){const note=prompt(status==='resolved'?'اكتب ملخص المعالجة (اختياري):':'اذكر سبب رفض الاعتراض (اختياري):');if(note===null)return;const r=await db.rpc('admin_resolve_order_dispute',{p_dispute_id:id,p_status:status,p_note:note});if(r.error)alert(r.error.message);else{alert('تم تحديث الاعتراض.');load()}}
load();
</script><script src="app-ui.js" defer></script></body></html>
