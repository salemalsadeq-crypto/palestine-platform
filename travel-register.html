<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل مكتب سفر | فلسطين بلاتفورم</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="theme-v61.css">
<link rel="stylesheet" href="ui-polish.css?v=90"><link rel="stylesheet" href="ui-polish-v91.css?v=91">
<link rel="stylesheet" href="ui-system-v97.css?v=97">
<link rel="stylesheet" href="travel.css?v=1">
<link rel="stylesheet" href="platform-redesign-v104.css?v=104">
</head><body class="tv-page pp-redesign">
<main class="tv-wrap">
<a class="tv-back" href="travel.html">← السفر والحجوزات</a>
<div class="tv-card">
  <h1 id="title" style="margin:0 0 6px;font-size:22px">🏢 تسجيل مكتب سفر</h1>
  <p class="tv-note" id="sub" style="margin:0 0 6px">سجّل مكتبك ليظهر لعملاء المنصة ويستقبل طلبات الحجز. تتم مراجعة المكتب قبل نشره.</p>
  <div id="status"></div>
  <form id="f" novalidate>
    <label class="tv-label" for="name">اسم المكتب</label><input id="name" class="tv-in" maxlength="120" placeholder="مثال: مكتب القدس للسياحة والسفر" required>
    <div class="tv-grid2">
      <div><label class="tv-label" for="city">المدينة</label><select id="city" class="tv-sel"></select></div>
      <div><label class="tv-label" for="address">العنوان</label><input id="address" class="tv-in" maxlength="250" placeholder="الشارع / المنطقة"></div>
    </div>
    <div class="tv-grid2">
      <div><label class="tv-label" for="phone">رقم الهاتف</label><input id="phone" class="tv-in" type="tel" inputmode="tel" maxlength="25" placeholder="059..." required></div>
      <div><label class="tv-label" for="whatsapp">واتساب (اختياري)</label><input id="whatsapp" class="tv-in" type="tel" inputmode="tel" maxlength="25" placeholder="نفس الهاتف إن تُرك فارغًا"></div>
    </div>
    <label class="tv-label" for="website">الموقع الإلكتروني (اختياري)</label><input id="website" class="tv-in" type="url" maxlength="250" placeholder="https://...">
    <label class="tv-label">الخدمات التي يقدمها المكتب</label>
    <div class="tv-checks" id="services"></div>
    <label class="tv-label" for="description">نبذة عن المكتب</label><textarea id="description" class="tv-ta" maxlength="2000" placeholder="سنوات الخبرة، الوجهات، رقم الترخيص إن وجد..."></textarea>
    <div id="msg" class="tv-msg" style="display:none"></div>
    <button class="tv-btn green" id="save" type="submit" style="width:100%;margin-top:6px">إرسال المكتب للمراجعة</button>
  </form>
  <div id="extra" class="tv-row" style="margin-top:12px"></div>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
<script src="platform.js"></script>
<script src="travel.js?v=1"></script>
<script>
(()=>{
const db=window.ppClient,$=id=>document.getElementById(id),E=TV.esc;
let user=null,office=null;
$('city').innerHTML=TV.CITIES.map(c=>'<option>'+E(c)+'</option>').join('');
$('services').innerHTML=Object.entries(TV.KINDS).map(([k,v])=>'<label class="tv-check"><input type="checkbox" value="'+k+'"> '+v[0]+' '+v[1]+'</label>').join('');
function fill(o){
  $('name').value=o.name||'';$('city').value=o.city||TV.CITIES[0];$('address').value=o.address||'';$('phone').value=o.phone||'';
  $('whatsapp').value=o.whatsapp||'';$('website').value=o.website||'';$('description').value=o.description||'';
  document.querySelectorAll('#services input').forEach(c=>c.checked=(o.services||[]).includes(c.value));
}
function showState(){
  const s=office.status,st=$('status');
  $('title').textContent='🏢 بيانات مكتبي';
  let h='<div class="tv-row" style="margin:6px 0">الحالة: '+TV.badge(TV.OST,s)+'</div>';
  if(s==='pending')h+='<div class="tv-msg warn">مكتبك قيد المراجعة. سيصلك إشعار عند الموافقة عليه.</div>';
  if(s==='rejected')h+='<div class="tv-msg err">لم يتم قبول المكتب'+(office.admin_note?': '+E(office.admin_note):'')+'. عدّل البيانات ثم أعد الإرسال.</div>';
  if(s==='hidden')h+='<div class="tv-msg warn">مكتبك مخفي حاليًا ولا يظهر للزوار.</div>';
  st.innerHTML=h;
  $('save').textContent=s==='rejected'?'حفظ وإعادة الإرسال للمراجعة':'حفظ التعديلات';
  let x='';
  if(s==='active'||s==='hidden')x+='<button class="tv-btn light sm" id="toggle" type="button">'+(s==='active'?'🙈 إخفاء المكتب مؤقتًا':'👁️ إظهار المكتب')+'</button>';
  if(s==='active')x+='<a class="tv-btn soft sm" href="travel-office.html?id='+encodeURIComponent(office.id)+'">معاينة صفحة المكتب</a>';
  x+='<a class="tv-btn green sm" href="travel-manage.html">⚙️ الحجوزات والعروض</a>';
  $('extra').innerHTML=x;
  const t=$('toggle');if(t)t.onclick=async()=>{t.disabled=true;const to=office.status==='active'?'hidden':'active';const {error}=await db.from('travel_offices').update({status:to}).eq('id',office.id);if(error){TV.msg($('msg'),'❌ '+TV.errText(error),'err');t.disabled=false;return}office.status=to;showState()};
}
$('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const m=$('msg');
  const name=$('name').value.trim(),phone=$('phone').value.trim(),services=[...document.querySelectorAll('#services input:checked')].map(c=>c.value);
  if(name.length<2)return TV.msg(m,'اكتب اسم المكتب.','err');
  if(phone.replace(/\D/g,'').length<7)return TV.msg(m,'اكتب رقم هاتف صحيح.','err');
  if(!services.length)return TV.msg(m,'اختر خدمة واحدة على الأقل.','err');
  const web=$('website').value.trim();
  if(web&&!TV.url(web))return TV.msg(m,'رابط الموقع الإلكتروني غير صحيح.','err');
  const row={name,city:$('city').value,address:$('address').value.trim()||null,phone,whatsapp:$('whatsapp').value.trim()||null,website:web||null,description:$('description').value.trim()||null,services};
  const btn=$('save');btn.disabled=true;const old=btn.textContent;btn.textContent='جاري الحفظ...';TV.msg(m,'');
  let error;
  if(office){
    if(office.status==='rejected')row.status='pending';
    ({error}=await db.from('travel_offices').update(row).eq('id',office.id));
    if(!error){Object.assign(office,row);TV.msg(m,office.status==='pending'?'✅ تم الحفظ وإرسال المكتب للمراجعة.':'✅ تم حفظ التعديلات.','ok');showState()}
  }else{
    ({error}=await db.from('travel_offices').insert({...row,user_id:user.id,status:'pending'}));
    if(!error){TV.msg(m,'✅ تم إرسال المكتب للمراجعة. سيصلك إشعار عند الموافقة.','ok');await load()}
  }
  if(error)TV.msg(m,'❌ '+(/duplicate key|unique/i.test(error.message||'')?'لديك مكتب مسجل بالفعل.':TV.errText(error)),'err');
  btn.disabled=false;if(!office)btn.textContent=old;
});
async function load(){
  user=await TV.need();if(!user)return;
  const {data,error}=await db.from('travel_offices').select('*').eq('user_id',user.id).maybeSingle();
  if(error){TV.msg($('msg'),TV.errText(error),'err');return}
  if(data){office=data;fill(data);showState()}
}
load();
})();
</script>
<script src="app-ui.js?v=90" defer></script>
</body></html>
