<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سيارات للبيع | فلسطين بلاتفورم</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0" crossorigin="anonymous"></script>
<script src="platform.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Arial,Tahoma,sans-serif;
    background:#f5f7fa;
    color:#172033;
}

button,input,select{font-family:inherit}

header{
    background:white;
    padding:15px 20px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.header{
    max-width:1100px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    flex-wrap:wrap;
}

.logo{
    font-size:22px;
    font-weight:bold;
    color:#173b68;
}

.logo span{color:#b51f2a}

.account-area{
    display:flex;
    align-items:center;
    gap:9px;
    flex-wrap:wrap;
}

.header-avatar{
    width:42px;
    height:42px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid #173b68;
    background:#eef2f7;
}

#headerAvatar{display:none}

#userInitial{
    width:42px;
    height:42px;
    border-radius:50%;
    background:#eef2f7;
    color:#173b68;
    display:none;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:18px;
}

#userName{
    font-weight:bold;
    color:#333;
}

.account-btn,
.login-btn{
    text-decoration:none;
    padding:9px 13px;
    border-radius:8px;
    font-size:13px;
    font-weight:bold;
}

.account-btn{
    background:#173b68;
    color:white;
}

.login-btn{
    background:#eee;
    color:#333;
}

.logout-btn{
    border:0;
    padding:9px 13px;
    border-radius:8px;
    background:#b51f2a;
    color:white;
    font-size:13px;
    font-weight:bold;
    cursor:pointer;
}

.back{
    text-decoration:none;
    background:#173b68;
    color:white;
    padding:9px 16px;
    border-radius:8px;
}

.hero{
    background:#173b68;
    color:white;
    text-align:center;
    padding:40px 20px;
}

.hero h1{
    font-size:34px;
    margin-bottom:10px;
}

.hero p{
    font-size:17px;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:30px 20px;
}

.top-actions{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.add-btn{
    flex:1;
    display:block;
    text-align:center;
    background:#b51f2a;
    color:white;
    padding:14px;
    border-radius:10px;
    text-decoration:none;
    font-weight:bold;
}

.all-btn{
    flex:1;
    display:block;
    text-align:center;
    background:#173b68;
    color:white;
    padding:14px;
    border-radius:10px;
    text-decoration:none;
    font-weight:bold;
}

.filters{
    background:white;
    padding:18px;
    border-radius:14px;
    margin-bottom:25px;
    box-shadow:0 3px 15px rgba(0,0,0,.06);
}

.search{
    display:flex;
    gap:8px;
    margin-bottom:15px;
}

  .search input{
    flex:1;
    border:1px solid #ddd;
    outline:none;
    padding:13px;
    font-size:16px;
    border-radius:8px;
}

.search button{
    border:none;
    background:#b51f2a;
    color:white;
    padding:0 22px;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

.filter-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.filter-grid input,
.filter-grid select{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    background:white;
}

.results-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:15px;
    flex-wrap:wrap;
}

.results-count{
    font-weight:bold;
}

.sort{
    padding:9px 12px;
    border:1px solid #ddd;
    border-radius:8px;
    background:white;
}

.ads-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.ad-card{
    background:white;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 3px 15px rgba(0,0,0,.07);
    transition:.2s;
}

.ad-card:hover{
    transform:translateY(-3px);
    box-shadow:0 7px 22px rgba(0,0,0,.12);
}

.ad-image{
    width:100%;
    height:210px;
    object-fit:cover;
    background:#eef1f5;
    display:block;
}

.no-image{
    width:100%;
    height:210px;
    background:#eef1f5;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:48px;
    color:#8b96a8;
}

.ad-body{
    padding:16px;
}

.ad-title{
    font-size:19px;
    font-weight:bold;
    margin-bottom:8px;
    color:#172033;
}

.ad-category{
    display:inline-block;
    background:#edf2f8;
    color:#173b68;
    padding:5px 9px;
    border-radius:6px;
    font-size:12px;
    margin-bottom:10px;
}

.ad-description{
    color:#687386;
    line-height:1.6;
    min-height:45px;
    margin-bottom:10px;
}

.ad-info{
    display:flex;
    flex-direction:column;
    gap:6px;
    color:#555;
    font-size:14px;
}

.price{
    color:#b51f2a;
    font-weight:bold;
    font-size:18px;
}

.details-btn{
    display:block;
    text-align:center;
    background:#173b68;
    color:white;
    text-decoration:none;
    padding:11px;
    border-radius:8px;
    margin-top:14px;
}

.loading,
.empty,
.error{
    background:white;
    border-radius:12px;
    padding:35px;
    text-align:center;
    color:#697586;
    grid-column:1/-1;
}

.error{color:#b51f2a}

@media(max-width:850px){
    .ads-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .filter-grid{
        grid-template-columns:1fr 1fr;
    }
}

@media(max-width:600px){
    .hero h1{
        font-size:27px;
    }

    .container{

  padding:22px 12px;
    }

    .ads-grid{
        grid-template-columns:1fr;
    }

    .filter-grid{
        grid-template-columns:1fr;
    }

    .top-actions{
        flex-direction:column;
    }

    .search button{
        padding:0 15px;
    }

    .logo{
        font-size:20px;
    }
}
</style>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="theme-v47.css"><link rel="stylesheet" href="theme-v48.css"></head>

<body>

<header>
<div class="header">

    <div class="logo">
        فلسطين <span>بلاتفورم</span>
    </div>

    <div class="account-area">

        <img id="headerAvatar" class="header-avatar" alt="صورة المستخدم">

        <div id="userInitial">س</div>

        <span id="userName"></span>

        <a id="accountBtn" class="account-btn" href="account.html" style="display:none;">
            حسابي
        </a>

        <a id="myAdsBtn" class="account-btn" href="my-ads.html" style="display:none;">
            إعلاناتي
        </a>

        <button id="logoutBtn" class="logout-btn" style="display:none;">
            خروج
        </button>

        <a id="loginBtn" class="login-btn" href="login.html">
            تسجيل الدخول
        </a>

        <a class="back" href="index.html">
            الرئيسية
        </a>

    </div>

</div>
</header>


<section class="hero">
    <h1>🚗 سيارات للبيع</h1>
    <p>تصفح أحدث إعلانات السيارات في فلسطين</p>
</section>


<main class="container">

    <div class="top-actions">

        <a href="ads.html?category=سيارات#add" class="add-btn">
            ➕ أضف إعلان سيارة
        </a>

        <a href="ads.html" class="all-btn">
            ← تصنيفات الإعلانات
        </a>

    </div>


    <section class="filters">

        <div class="search">

            <input
                id="searchInput"
                type="search"
                placeholder="ابحث عن سيارة، موديل، نوع..."
            >

            <button id="searchBtn">
                بحث
            </button>

        </div>


        <div class="filter-grid">

            <select id="cityFilter">
                <option value="">كل المدن</option>
                <option value="نابلس">نابلس</option>
                <option value="رام الله">رام الله</option>
                <option value="القدس">القدس</option>
                <option value="الخليل">الخليل</option>
                <option value="بيت لحم">بيت لحم</option>
                <option value="جنين">جنين</option>
                <option value="طولكرم">طولكرم</option>
                <option value="قلقيلية">قلقيلية</option>
                <option value="سلفيت">سلفيت</option>
                <option value="طوباس">طوباس</option>
                <option value="أريحا">أريحا</option>
                <option value="غزة">غزة</option>
            </select>


            <input
                id="minPrice"
                type="number"
                min="0"
                placeholder="أقل سعر"
            >


            <input
                id="maxPrice"
                type="number"
                min="0"
                placeholder="أعلى سعر"
            >

        </div>

    </section>


    <div class="results-bar">

        <div class="results-count" id="resultsCount">
            جاري التحميل...

                  </div>

        <select id="sortSelect" class="sort">

            <option value="newest">
                الأحدث أولاً
            </option>

            <option value="oldest">
                الأقدم أولاً
            </option>

            <option value="low">
                السعر من الأقل
            </option>

            <option value="high">
                السعر من الأعلى
            </option>

        </select>

    </div>


    <div id="adsGrid" class="ads-grid">

        <div class="loading">
            جاري تحميل السيارات...
        </div>

    </div>

</main>


<script>

window.onerror=function(m){var g=document.getElementById('adsGrid'),c=document.getElementById('resultsCount');if(c)c.textContent='❌ خطأ';if(g)g.innerHTML='<div class="error">❌ خطأ بالكود: '+m+'</div>';return false};
window.addEventListener('unhandledrejection',function(e){var g=document.getElementById('adsGrid'),c=document.getElementById('resultsCount');if(c)c.textContent='❌ خطأ';if(g)g.innerHTML='<div class="error">❌ خطأ غير متوقع: '+(e.reason&&e.reason.message||e.reason)+'</div>'});

const supabaseClient = window.ppClient || null;


let allAds = [];


const adsGrid =
document.getElementById("adsGrid");

const resultsCount =
document.getElementById("resultsCount");

const searchInput =
document.getElementById("searchInput");

const searchBtn =
document.getElementById("searchBtn");

const cityFilter =
document.getElementById("cityFilter");

const minPrice =
document.getElementById("minPrice");

const maxPrice =
document.getElementById("maxPrice");

const sortSelect =
document.getElementById("sortSelect");

const headerAvatar =
document.getElementById("headerAvatar");

const userInitial =
document.getElementById("userInitial");

const userName =
document.getElementById("userName");

const accountBtn =
document.getElementById("accountBtn");

const myAdsBtn =
document.getElementById("myAdsBtn");

const logoutBtn =
document.getElementById("logoutBtn");

const loginBtn =
document.getElementById("loginBtn");


function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function formatPrice(price){

    if(
        price === null ||
        price === undefined ||
        price === ""
    ){
        return "السعر غير محدد";
    }

    return Number(price).toLocaleString("ar-EG")
        + " شيكل";
}

  function formatDate(date){

    if(!date){
        return "";
    }

    try{

        return new Date(date)
            .toLocaleDateString(
                "ar-PS",
                {
                    year:"numeric",
                    month:"short",
                    day:"numeric"
                }
            );

    }catch(e){

        return "";
    }
}


function getFirstImage(ad){

    if(
        Array.isArray(ad.image_urls) &&
        ad.image_urls.length > 0
    ){

        return ad.image_urls[0];

    }

    return null;
}


function renderAds(ads){

    adsGrid.innerHTML = "";

    resultsCount.textContent =
        `عدد السيارات: ${ads.length}`;


    if(ads.length === 0){

        adsGrid.innerHTML = `
            <div class="empty">
                🚗 لا توجد سيارات مطابقة للبحث حالياً.
            </div>
        `;

        return;
    }


    ads.forEach(ad => {

        const image =
            getFirstImage(ad);

        const imageHtml =
            image
            ? `
                <img
                    class="ad-image"
                    src="${escapeHtml(image)}"
                    alt="${escapeHtml(ad.title)}"
                    loading="lazy"
                    onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"
                >
                <div class="no-image" style="display:none;">
                    🚗
                </div>
              `
            : `
                <div class="no-image">
                    🚗
                </div>
              `;


        const description =
            ad.description
            ? (
                ad.description.length > 100
                ? ad.description.substring(0,100) + "..."
                : ad.description
              )
            : "لا يوجد وصف";


        const card =
            document.createElement("article");

        card.className =
            "ad-card";


        card.innerHTML = `

            ${imageHtml}

            <div class="ad-body">

                <div class="ad-title">
                    ${escapeHtml(ad.title)}
                </div>

                <span class="ad-category">
                    ${escapeHtml(ad.category || "سيارات")}
                </span>

                <div class="ad-description">
                    ${escapeHtml(description)}
                </div>

                <div class="ad-info">

                    <div class="price">
                        💰 ${formatPrice(ad.price)}
                    </div>

                    ${
                        ad.city
                        ? `<div>📍 ${escapeHtml(ad.city)}</div>`
                        : ""
                    }

                    ${
                        ad.created_at
                        ? `<div>📅 ${formatDate(ad.created_at)}</div>`
                        : ""
                    }

                </div>

                <a
                    class="details-btn"
                    href="ad-details.html?id=${encodeURIComponent(ad.id)}"
                >
                    👁️ عرض تفاصيل السيارة
                </a>

            </div>

        `;


        adsGrid.appendChild(card);

    });

}


function applyFilters(){

    const search =
        searchInput.value
            .trim()
            .toLowerCase();


    const city =
        cityFilter.value
            .trim()
            .toLowerCase();


    const min =
        minPrice.value === ""
        ? null
        : Number(minPrice.value);


    const max =
        maxPrice.value === ""
        ? null
        : Number(maxPrice.value);


    let filtered =
        allAds.filter(ad => {

            const text =
                [
                    ad.title,
                    ad.description,
                    ad.city
                ]
                .filter(Boolean)
                .join(" ")
                .toLowerCase();


            if(
                search &&
                !text.includes(search)
            ){
                return false;
            }


            if(
                city &&
                String(ad.city || "")
                    .toLowerCase() !== city
            ){
                return false;
            }


            if(
                min !== null &&
                (ad.price === null ||
                 Number(ad.price) < min)
            ){
                return false;
            }

  

        




            if(
                max !== null &&
                (ad.price === null ||
                 Number(ad.price) > max)
            ){
                return false;
            }


            return true;

        });


    const sort =
        sortSelect.value;


    filtered.sort((a,b) => {

        if(sort === "oldest"){

            return new Date(a.created_at)
                - new Date(b.created_at);

        }


        if(sort === "low"){

            const aPrice =
                a.price === null
                ? Infinity
                : Number(a.price);

            const bPrice =
                b.price === null
                ? Infinity
                : Number(b.price);

            return aPrice - bPrice;

        }


        if(sort === "high"){

            const aPrice =
                a.price === null
                ? -Infinity
                : Number(a.price);

            const bPrice =
                b.price === null
                ? -Infinity
                : Number(b.price);

            return bPrice - aPrice;

        }


        return new Date(b.created_at)
            - new Date(a.created_at);

    });


    renderAds(filtered);

}


async function loadAds(){

    adsGrid.innerHTML = `
        <div class="loading">
            جاري تحميل السيارات...
        </div>
    `;


    const {
        data,
        error
    } =
    await supabaseClient
        .from("ads")
        .select("*")
        .eq("category","سيارات")
        .eq("status","active")
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error(error);

        adsGrid.innerHTML = `
            <div class="error">
                ❌ حدث خطأ أثناء تحميل السيارات.
                <br>
                ${escapeHtml(error.message)}
            </div>
        `;

        resultsCount.textContent =
            "تعذر تحميل الإعلانات";

        return;
    }


    allAds =
        data || [];


    applyFilters();

}


async function loadUser(){

    const {
        data,
        error
    } =
    await supabaseClient.auth.getUser();


    if(
        error ||
        !data ||
        !data.user
    ){

        loginBtn.style.display =
            "inline-block";

        return;
    }


    const user =
        data.user;


    loginBtn.style.display =
        "none";

    accountBtn.style.display =
        "inline-block";

    myAdsBtn.style.display =
        "inline-block";

    logoutBtn.style.display =
        "inline-block";


    let name =
        user.user_metadata?.full_name ||
        user.email?.split("@")[0] ||
        "المستخدم";


    let avatarUrl = "";


    try{

        const {
            data:profile
        } =
        await supabaseClient
            .from("profiles")
            .select("full_name,avatar_url")
            .eq("id",user.id)
            .maybeSingle();


        if(profile){

            name =
                profile.full_name ||
                name;

            avatarUrl =
                profile.avatar_url ||
                "";

        }

    }catch(e){

        console.warn(e);

    }


    userName.textContent =
        name;


    const initial =
        name.trim().charAt(0) || "س";

    userInitial.textContent =
        initial;


    if(avatarUrl){

        headerAvatar.src =
            avatarUrl;

        headerAvatar.style.display =
            "block";

        userInitial.style.display =
            "none";

        headerAvatar.onerror =
            function(){

                headerAvatar.style.display =
                    "none";

                userInitial.style.display =
                    "flex";

            };

    }else{

        headerAvatar.style.display =
            "none";

        userInitial.style.display =
            "flex";

    }

}


logoutBtn.addEventListener(
    "click",
    async function(){

        await supabaseClient.auth.signOut();

        window.location.reload();

    }
);


searchBtn.addEventListener(
    "click",
    applyFilters
);


searchInput.addEventListener(
    "keydown",
    function(e){

        if(e.key === "Enter"){

            applyFilters();

        }

    }
);


cityFilter.addEventListener(
    "change",
    applyFilters
);


minPrice.addEventListener(
    "input",
    applyFilters
);


maxPrice.addEventListener(
    "input",
    applyFilters
);


sortSelect.addEventListener(
    "change",
    applyFilters
);


(async function(){

    if(!supabaseClient){
        resultsCount.textContent='❌ خطأ';
        adsGrid.innerHTML='<div class="error">❌ لم يتم تحميل مكتبة Supabase — تحقق من اتصال الإنترنت أو جرب شبكة/متصفح آخر</div>';
        return;
    }

    await loadUser();

    await loadAds();

})();

</script>

<script src="app-ui.js" defer></script>
</body>
