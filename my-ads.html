<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إعلاناتي | فلسطين بلاتفورم</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,Tahoma,sans-serif;
background:#f5f7fa;
color:#172033;
}

header{
background:white;
padding:16px 20px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.header{
max-width:1100px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:22px;
font-weight:bold;
color:#173b68;
}

.logo span{
color:#b51f2a;
}

.back{
text-decoration:none;
background:#173b68;
color:white;
padding:9px 16px;
border-radius:8px;
}

.hero{
background:#173b68;
color:white;
text-align:center;
padding:40px 20px;
}

.hero h1{
font-size:32px;
margin-bottom:10px;
}

.container{
max-width:1100px;
margin:auto;
padding:35px 20px;
}

.top-buttons{
display:flex;
gap:10px;
margin-bottom:25px;
}

.top-button{
flex:1;
text-align:center;
padding:13px;
border-radius:10px;
text-decoration:none;
font-weight:bold;
}

.add{
background:#b51f2a;
color:white;
}

.home{
background:#173b68;
color:white;
}

.ads-list{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
}

.ad-card{
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.ad-image{
width:100%;
height:210px;
object-fit:cover;
display:block;
background:#eee;
}

.no-image{
height:150px;
background:#eef2f7;
display:flex;
align-items:center;
justify-content:center;
font-size:55px;
}

.content{
padding:20px;
}

.title{
font-size:20px;
color:#173b68;
margin-bottom:10px;
}

.category{
display:inline-block;
background:#eef2f7;
padding:5px 10px;
border-radius:15px;
font-size:13px;
margin-bottom:12px;
}

.description{
color:#555;
line-height:1.7;
margin-bottom:10px;
}

.price{
color:#b51f2a;
font-size:18px;
font-weight:bold;
margin:10px 0;
}

.info{
color:#666;
font-size:14px;
line-height:1.8;
}

.buttons{
display:flex;
gap:8px;
margin-top:18px;
}

.button{
flex:1;
border:0;
padding:11px;
border-radius:8px;
font-size:15px;
font-weight:bold;
cursor:pointer;
text-align:center;
text-decoration:none;
}

.view{
background:#173b68;
color:white;
}

.edit{
background:#e9eef5;
color:#173b68;
}

.delete{
background:#b51f2a;
color:white;
}

.empty{
background:white;
padding:50px 20px;
border-radius:15px;
text-align:center;
color:#777;
grid-column:1/-1;
font-size:18px;
}

.loading{
text-align:center;
padding:40px;
color:#777;
grid-column:1/-1;
}

.message{
text-align:center;
padding:15px;
margin-bottom:20px;
border-radius:10px;
display:none;
}

.message.success{
display:block;
background:#e8f7ed;
color:#187a3d;
}

.message.error{
display:block;
background:#fdecec;
color:#b51f2a;
}

@media(max-width:700px){

.ads-list{
grid-template-columns:1fr;
}

.top-buttons{
flex-direction:column;
}

.hero h1{
font-size:27px;
}

.logo{
font-size:18px;
}

.back{
font-size:14px;
padding:8px 12px;
}

}

</style>

<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="theme-v61.css">
</head>

<body>

<header>

<div class="header">

<div class="logo">
فلسطين <span>بلاتفورم</span>
</div>

<a href="index.html" class="back">
← الرئيسية
</a>

</div>

</header>

<section class="hero">

<h1>📋 إعلاناتي</h1>

<p>
إدارة الإعلانات التي قمت بنشرها
</p>

</section>

<main class="container">

<div class="top-buttons">

<a href="add-ad.html" class="top-button add">
➕ إضافة إعلان جديد
</a>

<a href="index.html" class="top-button home">
🏠 الرئيسية
</a>

</div>

<div id="message" class="message"></div>

<div id="adsList" class="ads-list">

<div class="loading">
⏳ جاري تحميل إعلاناتك...
</div>

</div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0" crossorigin="anonymous"></script><script src="platform.js"></script>

<script>

const supabaseClient = window.ppClient;


/* =========================
   رسالة
========================= */

function showMessage(text,type){

const message =
document.getElementById("message");

message.textContent=text;

message.className =
"message " + type;

setTimeout(function(){

message.className="message";

},4000);

}


/* =========================
   تحميل إعلانات المستخدم
========================= */

async function loadMyAds(){

const adsList =
document.getElementById("adsList");

adsList.innerHTML =
'<div class="loading">⏳ جاري تحميل إعلاناتك...</div>';


/* المستخدم الحالي */

const {
data:userData,
error:userError
} =
await supabaseClient.auth.getUser();


if(userError || !userData.user){

window.location.href="login.html";

return;

}


const user =
userData.user;


/* جلب إعلانات المستخدم فقط */

const {
data,
error
} =
await supabaseClient
.from("ads")
.select("*")
.eq("user_id",user.id)
.order(
"created_at",
{
ascending:false
}
);


if(error){

console.error(error);

adsList.innerHTML =
'<div class="empty">❌ حدث خطأ أثناء تحميل الإعلانات.<br><br>' +
escapeHTML(error.message) +
'</div>';

return;

}


displayAds(data);

}


/* =========================
   عرض الإعلانات
========================= */

function displayAds(ads){

const adsList =
document.getElementById("adsList");


if(!ads || ads.length===0){

adsList.innerHTML =
'<div class="empty">' +
'📭 لا يوجد لديك إعلانات حتى الآن.' +
'<br><br>' +
'اضغط على "إضافة إعلان جديد" لنشر أول إعلان لك.' +
'</div>';

return;

}


adsList.innerHTML="";


ads.forEach(function(ad){

const card =
document.createElement("div");

card.className="ad-card";


/* الصورة */

if(
ad.image_urls &&
Array.isArray(ad.image_urls) &&
ad.image_urls.length>0
){

const image =
document.createElement("img");

image.className="ad-image";

image.src=ad.image_urls[0];

image.alt=ad.title || "الإعلان";

image.loading="lazy";

card.appendChild(image);

}

else{

const noImage =
document.createElement("div");

noImage.className="no-image";

noImage.textContent="📷";

card.appendChild(noImage);

}


/* المحتوى */

const content =
document.createElement("div");

content.className="content";


const title =
document.createElement("h3");

title.className="title";

title.textContent =
ad.title || "بدون عنوان";

content.appendChild(title);


const category =
document.createElement("div");

category.className="category";

category.textContent =
ad.category || "";

content.appendChild(category);


const description =
document.createElement("div");

description.className="description";

description.textContent =
ad.description || "";

content.appendChild(description);


if(
ad.price !== null &&
ad.price !== undefined
){

const price =
document.createElement("div");

price.className="price";

price.textContent =
"💰 " +
Number(ad.price).toLocaleString("ar") +
" شيكل";

content.appendChild(price);

}


const info =
document.createElement("div");

info.className="info";


if(ad.city){

const city =
document.createElement("div");

city.textContent =
"📍 " + ad.city;

info.appendChild(city);

}


if(ad.phone){

const phone =
document.createElement("div");

phone.textContent =
"📞 " + ad.phone;

info.appendChild(phone);

}


content.appendChild(info);


/* =========================
   أزرار الإعلان
========================= */

const buttons = document.createElement("div");

buttons.className = "buttons";

buttons.style.display = "flex";
buttons.style.gap = "8px";
buttons.style.marginTop = "18px";


/* زر عرض */

const view = document.createElement("a");

view.href =
"ad-details.html?id=" +
encodeURIComponent(ad.id);

view.textContent = "👁️ عرض";

view.style.cssText =
"flex:1;background:#173b68;color:white;padding:12px 5px;border-radius:8px;text-align:center;text-decoration:none;font-weight:bold;display:block;";


/* زر تعديل */

const edit = document.createElement("a");

edit.href =
"edit-ad.html?id=" +
encodeURIComponent(ad.id);

edit.textContent = "✏️ تعديل";

edit.style.cssText =
"flex:1;background:#e9eef5;color:#173b68;padding:12px 5px;border-radius:8px;text-align:center;text-decoration:none;font-weight:bold;display:block;";


/* زر حذف */

const deleteButton =
document.createElement("button");

deleteButton.type = "button";

deleteButton.textContent = "🗑️ حذف";

deleteButton.style.cssText =
"flex:1;background:#b51f2a;color:white;padding:12px 5px;border:0;border-radius:8px;text-align:center;font-weight:bold;cursor:pointer;";

deleteButton.onclick = function(event){

event.stopPropagation();

deleteAd(ad);

};


/* إضافة الأزرار */

buttons.appendChild(view);

buttons.appendChild(edit);

buttons.appendChild(deleteButton);

content.appendChild(buttons);

card.appendChild(content);

adsList.appendChild(card);

});

}


/* =========================
   حذف الإعلان
========================= */

async function deleteAd(ad){

const confirmed =
confirm(
'هل أنت متأكد من حذف الإعلان:\n\n' +
ad.title +
'\n\nلا يمكن التراجع عن هذا الإجراء.'
);


if(!confirmed){

return;

}


try{


/* التأكد من المستخدم */

const {
data:userData,
error:userError
} =
await supabaseClient.auth.getUser();


if(
userError ||
!userData.user
){

alert("يجب تسجيل الدخول.");

return;

}


const user =
userData.user;


/* التأكد أن الإعلان للمستخدم */

const {
data:adData,
error:adError
} =
await supabaseClient
.from("ads")
.select("id,user_id,image_urls")
.eq("id",ad.id)
.eq("user_id",user.id)
.single();


if(adError || !adData){

alert(
"لا يمكن حذف هذا الإعلان."
);

return;

}


/* حذف الإعلان */

const {
error
} =
await supabaseClient
.from("ads")
.delete()
.eq("id",ad.id)
.eq("user_id",user.id);


if(error){

throw error;

}


/* حذف الصور من Storage */

if(
Array.isArray(adData.image_urls) &&
adData.image_urls.length>0
){

const paths=[];

adData.image_urls.forEach(function(url){

try{

const marker =
"/storage/v1/object/public/ad-images/";

const position =
url.indexOf(marker);

if(position !== -1){

const path =
decodeURIComponent(
url.substring(
position + marker.length
)
);

paths.push(path);

}

}
catch(e){

console.error(e);

}

});


if(paths.length>0){

const {
error:storageError
} =
await supabaseClient
.storage
.from("ad-images")
.remove(paths);


if(storageError){

console.warn(
"تم حذف الإعلان لكن تعذر حذف بعض الصور:",
storageError.message
);

}

}

}


showMessage(
"✅ تم حذف الإعلان بنجاح.",
"success"
);


loadMyAds();


}
catch(error){

console.error(error);

showMessage(
"❌ حدث خطأ أثناء حذف الإعلان: " +
error.message,
"error"
);

}

}


/* =========================
   حماية النصوص
========================= */

function escapeHTML(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
   تشغيل الصفحة
========================= */

loadMyAds();

</script>

<script src="app-ui.js" defer></script>
</body>
