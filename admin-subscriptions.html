<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة الاشتراكات | فلسطين بلاتفورم</title><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="theme-v47.css"><link rel="stylesheet" href="theme-v48.css"><style>
.sub-page{max-width:1200px;margin:auto;padding:22px 14px 50px}.hero-admin{border-radius:26px;padding:24px;color:#fff;background:linear-gradient(135deg,#0b4b31,#12633f 58%,#2a9565);box-shadow:0 18px 45px rgba(12,84,53,.16)}.hero-admin h1{margin:0 0 6px}.hero-admin p{margin:0;color:#e5f4eb}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.stat{background:#fff;border:1px solid #e8e2d6;border-radius:18px;padding:17px;box-shadow:0 10px 30px rgba(20,55,39,.07)}.stat span{color:#6e756f;font-size:12px}.stat b{display:block;font-size:27px;color:#12633f;margin-top:6px}.panel{background:#fff;border:1px solid #e8e2d6;border-radius:22px;padding:16px;box-shadow:0 12px 34px rgba(20,55,39,.08)}.toolbar{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.toolbar button{white-space:nowrap;border:1px solid #e8e2d6;background:#f7f5ef;color:#365143;padding:10px 14px;border-radius:12px;font-weight:900}.toolbar button.active{background:#12633f;color:#fff;border-color:#12633f}.table{overflow:auto}table{width:100%;min-width:900px;border-collapse:collapse}th,td{padding:11px;text-align:right;border-bottom:1px solid #eeeae2;vertical-align:top}th{background:#f5f7f3;color:#31503e}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#edf6f0;color:#12633f;font-weight:900}.btn{border:0;border-radius:11px;padding:9px 12px;font-weight:900;cursor:pointer}.blue{background:#edf4ef;color:#12633f}.green{background:#12633f;color:#fff}.red{background:#b52b32;color:#fff}.actions{display:flex;gap:7px;flex-wrap:wrap}.muted{color:#6e756f;font-size:12px}.notice{padding:12px;border-radius:13px;margin:12px 0}.err{background:#fff0f1;color:#a51f2b}.success{background:#eaf7ef;color:#0a6a43}@media(max-width:650px){.stats{grid-template-columns:1fr}.actions>*{flex:1}}
</style></head><body><header><div class="head"><a class="logo" href="index.html">فلسطين <span>بلاتفورم</span></a><div class="account"></div></div></header><main class="sub-page"><section class="hero-admin"><h1>💳 إدارة الاشتراكات</h1><p>مراجعة طلبات الاشتراك والإلغاء وتفعيل الاشتراكات بعد التحقق من الدفع.</p></section><div id="notice"></div><section class="stats"><div class="stat"><span>⏳ طلبات الإلغاء</span><b id="pending">—</b></div><div class="stat"><span>💳 اشتراكات فعالة</span><b id="active">—</b></div><div class="stat"><span>📦 طلبات الاشتراك</span><b id="orders">—</b></div></section><section class="panel"><div class="toolbar"><button class="active" data-filter="pending">طلبات الإلغاء</button><button data-filter="active">الاشتراكات الفعالة</button><button data-filter="orders">طلبات الاشتراك</button></div><div id="content">جاري التحميل...</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><script src="platform.js"></script><script>
const db=ppClient,$=id=>document.getElementById(id),esc=ppEsc;let filter='pending',cache={c:[],a:[],o:[]};
function note(t,ok=false){$('notice').innerHTML='<div class="notice '+(ok?'success':'err')+'">'+esc(t)+'</div>';setTimeout(()=>{$('notice').innerHTML=''},4000)}
async function load(){if(!(await ppRequire('manage_subscriptions')))return;const [c,a,o]=await Promise.all([db.rpc('admin_list_subscription_cancellations'),db.rpc('admin_list_active_subscriptions'),db.rpc('admin_list_subscription_orders')]);if(c.error||a.error||o.error){note(c.error?.message||a.error?.message||o.error?.message);return}cache={c:c.data||[],a:a.data||[],o:o.data||[]};$('pending').textContent=cache.c.filter(x=>x.status==='pending').length;$('active').textContent=cache.a.length;$('orders').textContent=cache.o.length;render()}
function render(){const arr=filter==='pending'?cache.c.filter(x=>x.status==='pending'):filter==='active'?cache.a:cache.o;if(!arr.length){$('content').innerHTML='<div class="muted">لا توجد بيانات.</div>';return}if(filter==='pending'){$('content').innerHTML='<div class="table"><table><thead><tr><th>المشترك</th><th>الاشتراك</th><th>السبب</th><th>التاريخ</th><th>إجراءات</th></tr></thead><tbody>'+arr.map(x=>'<tr><td><b>'+esc(x.full_name||'مستخدم')+'</b><div class="muted">'+esc(x.phone||'')+'</div></td><td>'+esc(x.plan_id||'—')+'</td><td>'+esc(x.reason||'لم يذكر سببًا')+'</td><td>'+new Date(x.created_at).toLocaleString('ar-PS')+'</td><td><div class="actions"><a class="btn blue" href="messages.html?user='+encodeURIComponent(x.user_id)+'">💬 مراسلة</a><button class="btn green" onclick="handle(\''+x.id+'\',\'approve\')">موافقة وإلغاء</button><button class="btn red" onclick="handle(\''+x.id+'\',\'reject\')">رفض</button></div></td></tr>').join('')+'</tbody></table></div>'}else if(filter==='active'){$('content').innerHTML='<div class="table"><table><thead><tr><th>المشترك</th><th>الباقة</th><th>الانتهاء</th><th>إجراءات</th></tr></thead><tbody>'+arr.map(x=>'<tr><td><b>'+esc(x.full_name||'مستخدم')+'</b><div class="muted">'+esc(x.phone||'')+'</div></td><td>'+esc(x.plan_name||x.plan_id)+'</td><td>'+new Date(x.ends_at).toLocaleDateString('ar-PS')+'</td><td><div class="actions"><a class="btn blue" href="messages.html?user='+encodeURIComponent(x.user_id)+'">💬 مراسلة</a><button class="btn red" onclick="directCancel(\''+x.id+'\')">إلغاء إداري</button></div></td></tr>').join('')+'</tbody></table></div>'}else{$('content').innerHTML='<div class="table"><table><thead><tr><th>المشترك</th><th>الباقة</th><th>الحالة</th><th>التاريخ</th><th>إجراء</th></tr></thead><tbody>'+arr.map(x=>'<tr><td>'+esc(x.full_name||'مستخدم')+'</td><td>'+esc(x.plan_name||x.plan_id)+'</td><td><span class="badge">'+esc(x.status||'')+'</span></td><td>'+new Date(x.created_at).toLocaleString('ar-PS')+'</td><td>'+(x.status==='pending'?'<button class="btn green" onclick="activateOrder(\''+x.id+'\')">✅ تفعيل الاشتراك</button>':'—')+'</td></tr>').join('')+'</tbody></table></div>'}}
async function activateOrder(id){if(!confirm('تأكد من استلام الدفع قبل التفعيل. متابعة؟'))return;const r=await db.rpc('admin_activate_subscription',{p_order_id:id});if(r.error){note(r.error.message);return}note('تم تفعيل الاشتراك بنجاح.',true);load()}
async function handle(id,action){const noteText=prompt(action==='approve'?'ملاحظة الإدارة (اختياري):':'سبب الرفض (اختياري):')??'';const r=await db.rpc('admin_handle_subscription_cancellation',{p_request_id:id,p_action:action,p_note:noteText});if(r.error){note(r.error.message);return}note(action==='approve'?'تم إلغاء الاشتراك.':'تم رفض طلب الإلغاء.',true);load()}
async function directCancel(id){if(!confirm('سيتم إلغاء الاشتراك وإيقاف مقدم الخدمة إن وجد. متابعة؟'))return;const r=await db.rpc('admin_cancel_active_subscription',{p_subscription_id:id});if(r.error){note(r.error.message);return}note('تم إلغاء الاشتراك إداريًا.',true);load()}
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});load();
</script></body></html>
