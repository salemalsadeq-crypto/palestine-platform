<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>إدارة الاشتراكات | فلسطين بلاتفورم</title>
<link rel="stylesheet" href="app.css"><link rel="stylesheet" href="admin-v88.css?v=88">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><script src="platform.js"></script><script src="app-ui.js?v=90" defer></script></head>
<body>
<div class="adm-top"><div class="in"><div><b>👑 إدارة الاشتراكات</b><small>التفعيل والإلغاء والمراجعة</small></div><div class="lk"><a href="admin.html">لوحة المدير</a><a href="index.html">الرئيسية</a></div></div></div>
<div class="adm-wrap"><div id="notice"></div>
<div class="adm-stats"><div class="adm-stat">⏳ طلبات الإلغاء<b id="pending">—</b></div><div class="adm-stat">💳 اشتراكات فعالة<b id="active">—</b></div><div class="adm-stat">📦 طلبات الاشتراك<b id="orders">—</b></div></div>
<div class="adm-panel"><div class="adm-tabs"><button data-filter="pending">طلبات الإلغاء</button><button data-filter="active">الاشتراكات الفعالة</button><button data-filter="orders">طلبات الاشتراك</button></div><div id="content">جاري التحميل...</div></div></div>
<script>
const db=ppClient,$=id=>document.getElementById(id),esc=ppEsc;
let filter=new URLSearchParams(location.search).get('f')||'pending',cache={c:[],a:[],o:[]};
if(!['pending','active','orders'].includes(filter))filter='pending';
const OS={pending:'بانتظار التفعيل',paid:'مدفوع',active:'مفعّل',completed:'مكتمل',cancelled:'ملغي',failed:'فشل'};
const bc=s=>({pending:'pending',paid:'active',active:'active',completed:'active',cancelled:'suspended',failed:'suspended'}[s]||'');
const td=(l,v)=>'<td data-l="'+l+'">'+v+'</td>';
const tbl=(h,rows)=>rows.length?'<div class="adm-table"><table><thead><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>':'<div class="adm-empty">لا توجد بيانات.</div>';
const who=x=>'<b>'+esc(x.full_name||'مستخدم')+'</b><div class="adm-m">'+esc(x.phone||'')+'</div>';
const dt=(d,t)=>d?(t?new Date(d).toLocaleString('ar-PS'):new Date(d).toLocaleDateString('ar-PS')):'—';
function note(t,ok=false){$('notice').innerHTML='<div class="notice '+(ok?'success':'err')+'">'+esc(t)+'</div>';setTimeout(()=>{$('notice').innerHTML=''},4000)}
async function load(){
  if(!(await ppRequire('manage_subscriptions')))return;
  const [c,a,o]=await Promise.all([db.rpc('admin_list_subscription_cancellations'),db.rpc('admin_list_active_subscriptions'),db.rpc('admin_list_subscription_orders')]);
  if(c.error||a.error||o.error){note(c.error?.message||a.error?.message||o.error?.message);return}
  cache={c:c.data||[],a:a.data||[],o:o.data||[]};
  $('pending').textContent=cache.c.filter(x=>x.status==='pending').length;$('active').textContent=cache.a.length;$('orders').textContent=cache.o.length;render();
}
function render(){
  document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));
  const msg=x=>'<a class="adm-btn s" href="profile.html?id='+encodeURIComponent(x.user_id)+'">💬 مراسلة</a>';
  if(filter==='pending')$('content').innerHTML=tbl(['المشترك','الاشتراك','السبب','التاريخ','إجراءات'],cache.c.filter(x=>x.status==='pending').map(x=>'<tr>'+td('المشترك',who(x))+td('الاشتراك',esc(x.plan_id||'—'))+td('السبب',esc(x.reason||'لم يذكر سببًا'))+td('التاريخ',dt(x.created_at,1))+td('إجراءات','<div class="adm-act">'+msg(x)+'<button class="adm-btn g" data-a="approve" data-id="'+esc(x.id)+'">موافقة وإلغاء</button><button class="adm-btn r" data-a="reject" data-id="'+esc(x.id)+'">رفض</button></div>')+'</tr>'));
  else if(filter==='active')$('content').innerHTML=tbl(['المشترك','الباقة','الانتهاء','إجراءات'],cache.a.map(x=>'<tr>'+td('المشترك',who(x))+td('الباقة',esc(x.plan_name||x.plan_id))+td('الانتهاء',dt(x.ends_at))+td('إجراءات','<div class="adm-act">'+msg(x)+'<button class="adm-btn r" data-a="cancel" data-id="'+esc(x.id)+'">إلغاء إداري</button></div>')+'</tr>'));
  else $('content').innerHTML=tbl(['المشترك','الباقة','الحالة','التاريخ','إجراءات'],cache.o.map(x=>'<tr>'+td('المشترك',esc(x.full_name||'مستخدم'))+td('الباقة',esc(x.plan_name||x.plan_id))+td('الحالة','<span class="adm-badge b-'+bc(x.status)+'">'+esc(OS[x.status]||x.status||'')+'</span>')+td('التاريخ',dt(x.created_at,1))+td('إجراءات',x.status==='pending'?'<div class="adm-act"><button class="adm-btn g" data-a="activate" data-id="'+esc(x.id)+'">✅ تفعيل الاشتراك</button></div>':'—')+'</tr>'));
}
async function run(rpc,args,okMsg){const r=await db.rpc(rpc,args);if(r.error){note(r.error.message);return}note(okMsg,true);load()}
document.addEventListener('click',async e=>{
  const f=e.target.closest('[data-filter]');if(f){filter=f.dataset.filter;render();return}
  const b=e.target.closest('[data-a]');if(!b)return;const id=b.dataset.id,a=b.dataset.a;
  if(a==='activate'){if(await ppConfirm('سيتم تفعيل هذا الاشتراك بعد التأكد من استلام الدفع. متابعة؟',{ok:'تفعيل'}))await ppBusy(b,()=>run('admin_activate_subscription',{p_order_id:id},'تم تفعيل الاشتراك بنجاح.'))}
  else if(a==='cancel'){if(await ppConfirm('سيتم إلغاء الاشتراك وإيقاف مقدم الخدمة إن وجد. متابعة؟',{danger:true,ok:'إلغاء الاشتراك',cancel:'تراجع'}))await ppBusy(b,()=>run('admin_cancel_active_subscription',{p_subscription_id:id},'تم إلغاء الاشتراك إداريًا.'))}
  else{const ap=a==='approve',n=await ppPrompt(ap?'ملاحظة الإدارة (اختياري)':'سبب الرفض (اختياري)',{multiline:true,ok:ap?'موافقة وإلغاء':'رفض الطلب'});if(n===null)return;
    await ppBusy(b,()=>run('admin_handle_subscription_cancellation',{p_request_id:id,p_action:a,p_note:n},ap?'تم إلغاء الاشتراك وإيقاف مقدم الخدمة إن وجد.':'تم رفض طلب الإلغاء.'))}
});
load();
</script></body></html>
