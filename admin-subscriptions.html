<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة الاشتراكات - فلسطين بلاتفورم</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172b3f;font-family:Tahoma,"Segoe UI",Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:0 14px}header{background:linear-gradient(135deg,#12365f,#2563a6);color:#fff}.head{min-height:68px;display:flex;align-items:center;justify-content:space-between}.logo{color:#fff;text-decoration:none;font-size:20px;font-weight:900}.back{color:#fff;text-decoration:none;background:#ffffff18;padding:9px 12px;border-radius:10px}.hero{background:#fff;padding:25px 0;border-bottom:1px solid #e2e8f0}.hero h1{margin:0 0 6px;color:#173b68}.hero p{margin:0;color:#718096;font-size:12px}.toolbar{display:flex;gap:8px;margin:16px 0}.toolbar button{border:0;border-radius:10px;padding:10px 14px;background:#173b68;color:#fff;font-weight:900}.msg{display:none;padding:12px;border-radius:10px;margin:12px 0;font-size:12px}.ok{display:block;background:#e8f5e9;color:#276b31}.err{display:block;background:#ffebee;color:#b71c1c}.table{background:#fff;border:1px solid #e2e8f0;border-radius:15px;overflow:auto}.row{min-width:850px;display:grid;grid-template-columns:1.3fr 1.2fr .8fr .8fr .8fr 1fr;gap:10px;padding:13px;border-bottom:1px solid #edf1f5;align-items:center;font-size:12px}.row.headrow{font-weight:900;background:#f7f9fc;color:#173b68}.row:last-child{border-bottom:0}.state{padding:5px 8px;border-radius:999px;background:#f1f5f9;font-size:10px;font-weight:900;display:inline-block}.pending{background:#fff4d6;color:#8a6200}.paid{background:#e8f5e9;color:#287334}.failed,.cancelled{background:#ffebee;color:#b71c1c}.activate{border:0;background:#087443;color:#fff;border-radius:8px;padding:8px 10px;font-weight:900;cursor:pointer}.activate:disabled{opacity:.5}.muted{color:#718096}
</style></head><body><header><div class="wrap head"><a class="logo" href="index.html">فلسطين بلاتفورم</a><a class="back" href="subscriptions.html">← الاشتراكات</a></div></header><div class="hero"><div class="wrap"><h1>👑 إدارة الاشتراكات</h1><p>تفعيل الطلبات المدفوعة يدويًا في المرحلة الحالية. ربط بوابة الدفع يأتي لاحقًا.</p></div></div><main class="wrap"><div class="toolbar"><button id="reload">تحديث الطلبات</button></div><div id="msg" class="msg"></div><div class="table" id="table"><div class="row headrow"><div>المستخدم</div><div>الخطة</div><div>المبلغ</div><div>الحالة</div><div>التاريخ</div><div>الإجراء</div></div><div class="row"><div class="muted">جاري التحميل...</div></div></div></main><script>
const U='https://sesbumfedusbjevbsyzl.supabase.co',K='sb_publishable_0sJrbh73jLip3O5OtJkc_A_9F6OPWqR',db=supabase.createClient(U,K);const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function date(v){return v?new Date(v).toLocaleDateString('ar-PS'):'—'}function msg(t,ok=false){$('msg').textContent=t;$('msg').className='msg '+(ok?'ok':'err')}
async function checkAdmin(){const {data:{session}}=await db.auth.getSession();if(!session){msg('يجب تسجيل الدخول بحساب مدير.');return false}const {data:p,error}=await db.from('profiles').select('role,status').eq('id',session.user.id).maybeSingle();if(error||!p||p.status!=='active'||!['admin','manager'].includes(p.role)){msg('لا تملك صلاحية إدارة الاشتراكات.');return false}return true}
async function load(){if(!await checkAdmin())return;const {data,error}=await db.from('subscription_orders').select('id,user_id,plan_id,amount,currency,status,created_at,subscription_plans(name)').order('created_at',{ascending:false}).limit(100);if(error){msg(error.message);return}const box=$('table');box.innerHTML='<div class="row headrow"><div>المستخدم</div><div>الخطة</div><div>المبلغ</div><div>الحالة</div><div>التاريخ</div><div>الإجراء</div></div>'+(data?.length?data.map(o=>`<div class="row"><div>${esc(o.user_id.slice(0,8))}…</div><div><b>${esc(o.subscription_plans?.name||o.plan_id)}</b></div><div>${esc(o.amount)} ${esc(o.currency)}</div><div><span class="state ${o.status}">${o.status==='pending'?'بانتظار الدفع':o.status==='paid'?'مدفوع':o.status==='failed'?'فشل':'ملغى'}</span></div><div>${date(o.created_at)}</div><div>${o.status==='pending'?`<button class="activate" data-id="${o.id}">تفعيل بعد الدفع</button>`:'—'}</div></div>`).join(''):'<div class="row muted">لا توجد طلبات.</div>');box.querySelectorAll('.activate').forEach(b=>b.onclick=()=>activate(b.dataset.id,b))}
async function activate(id,b){if(!confirm('تفعيل هذا الاشتراك؟ يجب تنفيذ ذلك فقط بعد التأكد من استلام الدفع.'))return;b.disabled=true;const {error}=await db.rpc('admin_activate_subscription',{p_order_id:id,p_payment_method:'manual',p_gateway_reference:null});if(error){b.disabled=false;msg(error.message);return}msg('تم تفعيل الاشتراك بنجاح.',true);load()}
$('reload').onclick=load;load();
</script></body></html>
