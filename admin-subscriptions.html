<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة الاشتراكات | فلسطين بلاتفورم</title><link rel="stylesheet" href="app.css"><style>
body{margin:0;background:#f3f7fb;color:#172033;font-family:Arial,Tahoma,sans-serif}.wrap{max-width:1180px;margin:auto;padding:0 14px}.head{background:linear-gradient(135deg,#123b68,#2878bc);color:#fff;padding:18px 0}.headin{display:flex;justify-content:space-between;gap:10px;align-items:center}.head a{color:#fff;text-decoration:none;background:#ffffff18;padding:9px 12px;border-radius:11px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.stat,.card{background:#fff;border:1px solid #e1e9f1;border-radius:18px;padding:16px;box-shadow:0 8px 25px #123b680b}.stat b{font-size:28px;display:block;margin-top:7px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.toolbar button{border:0;border-radius:12px;padding:10px 14px;font-weight:900;cursor:pointer}.active{background:#173f69;color:#fff}.table{overflow:auto}table{width:100%;min-width:900px;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid #edf1f5;text-align:right;vertical-align:top}.badge{display:inline-block;padding:6px 9px;border-radius:10px;background:#eef5fb;color:#174f86;font-size:11px;font-weight:900}.pending{background:#fff7df;color:#916b00}.ok{background:#eaf8f2;color:#087957}.danger{background:#fff0f1;color:#a51f2b}.btn{border:0;border-radius:11px;padding:9px 12px;font-weight:900;cursor:pointer}.blue{background:#174f86;color:#fff}.green{background:#0b986d;color:#fff}.red{background:#c62838;color:#fff}.gray{background:#e9eef4}.actions{display:flex;gap:7px;flex-wrap:wrap}.muted{color:#6d7d90;font-size:12px;line-height:1.7}.notice{margin-top:15px;padding:12px;border-radius:12px}.err{background:#fff0f1;color:#a51f2b}.success{background:#eaf8f2;color:#087957}@media(max-width:650px){.stats{grid-template-columns:1fr}.headin{align-items:flex-start;flex-direction:column}}
</style><link rel="stylesheet" href="theme-v59.css">
</head><body><header class="head"><div class="wrap headin"><b>👑 إدارة الاشتراكات</b><div><a href="admin.html">لوحة المدير</a> <a href="index.html">الرئيسية</a></div></div></header><main class="wrap"><div id="notice"></div><section class="stats"><div class="stat">⏳ طلبات الإلغاء<b id="pending">—</b></div><div class="stat">💳 اشتراكات فعالة<b id="active">—</b></div><div class="stat">📦 طلبات الاشتراك<b id="orders">—</b></div></section><section class="card"><div class="toolbar"><button class="active" data-filter="pending">طلبات الإلغاء</button><button data-filter="active">الاشتراكات الفعالة</button><button data-filter="orders">طلبات الاشتراك</button></div><div id="content">جاري التحميل...</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><script src="platform.js"></script><script>
const db=ppClient,$=id=>document.getElementById(id),esc=ppEsc;let filter='pending',cache={c:[],a:[],o:[]};
function note(t,ok=false){$('notice').innerHTML='<div class="notice '+(ok?'success':'err')+'">'+esc(t)+'</div>';setTimeout(()=>{$('notice').innerHTML=''},4000)}
async function guard(){return await ppRequire('manage_subscriptions')}
async function load(){if(!(await guard()))return;const [c,a,o]=await Promise.all([db.rpc('admin_list_subscription_cancellations'),db.rpc('admin_list_active_subscriptions'),db.rpc('admin_list_subscription_orders')]);if(c.error||a.error||o.error){note(c.error?.message||a.error?.message||o.error?.message);return}cache={c:c.data||[],a:a.data||[],o:o.data||[]};$('pending').textContent=cache.c.filter(x=>x.status==='pending').length;$('active').textContent=cache.a.length;$('orders').textContent=cache.o.length;render()}
function render(){const arr=filter==='pending'?cache.c.filter(x=>x.status==='pending'):filter==='active'?cache.a:cache.o;if(!arr.length){$('content').innerHTML='<div class="muted">لا توجد بيانات.</div>';return}if(filter==='pending'){$('content').innerHTML='<div class="table"><table><thead><tr><th>المشترك</th><th>الاشتراك</th><th>السبب</th><th>التاريخ</th><th>إجراءات</th></tr></thead><tbody>'+arr.map(x=>'<tr><td><b>'+esc(x.full_name||'مستخدم')+'</b><div class="muted">'+esc(x.phone||'')+'</div></td><td>'+esc(x.plan_id||'—')+'</td><td>'+esc(x.reason||'لم يذكر سببًا')+'</td><td>'+new Date(x.created_at).toLocaleString('ar-PS')+'</td><td><div class="actions"><a class="btn blue" href="profile.html?id='+encodeURIComponent(x.user_id)+'">💬 مراسلة</a><button class="btn green" onclick="handle(\''+x.id+'\',\'approve\')">موافقة وإلغاء</button><button class="btn red" onclick="handle(\''+x.id+'\',\'reject\')">رفض</button></div></td></tr>').join('')+'</tbody></table></div>'}else if(filter==='active'){$('content').innerHTML='<div class="table"><table><thead><tr><th>المشترك</th><th>الباقة</th><th>الانتهاء</th><th>إجراءات</th></tr></thead><tbody>'+arr.map(x=>'<tr><td><b>'+esc(x.full_name||'مستخدم')+'</b><div class="muted">'+esc(x.phone||'')+'</div></td><td>'+esc(x.plan_name||x.plan_id)+'</td><td>'+new Date(x.ends_at).toLocaleDateString('ar-PS')+'</td><td><div class="actions"><a class="btn blue" href="profile.html?id='+encodeURIComponent(x.user_id)+'">💬 مراسلة</a><button class="btn red" onclick="directCancel(\''+x.id+'\')">إلغاء إداري</button></div></td></tr>').join('')+'</tbody></table></div>'}else{$('content').innerHTML='<div class="table"><table><thead><tr><th>المشترك</th><th>الباقة</th><th>الحالة</th><th>التاريخ</th><th>إجراءات</th></tr></thead><tbody>'+arr.map(x=>'<tr><td>'+esc(x.full_name||'مستخدم')+'</td><td>'+esc(x.plan_name||x.plan_id)+'</td><td><span class="badge">'+esc(x.status||'')+'</span></td><td>'+new Date(x.created_at).toLocaleString('ar-PS')+'</td><td>'+(x.status==='pending'?'<div class="actions"><button class="btn green" onclick="activateOrder(\''+x.id+'\')">✅ تفعيل الاشتراك</button></div>':'—')+'</td></tr>').join('')+'</tbody></table></div>'}}
async function activateOrder(id){if(!confirm('سيتم تفعيل هذا الاشتراك بعد التأكد من استلام الدفع. متابعة؟'))return;const r=await db.rpc('admin_activate_subscription',{p_order_id:id});if(r.error){note(r.error.message);return}note('تم تفعيل الاشتراك بنجاح.',true);load()}
async function handle(id,action){const noteText=prompt(action==='approve'?'ملاحظة الإدارة (اختياري):':'سبب الرفض (اختياري):')??'';const r=await db.rpc('admin_handle_subscription_cancellation',{p_request_id:id,p_action:action,p_note:noteText});if(r.error){note(r.error.message);return}note(action==='approve'?'تم إلغاء الاشتراك وإيقاف مقدم الخدمة إن وجد.':'تم رفض طلب الإلغاء.',true);load()}
async function directCancel(id){if(!confirm('سيتم إلغاء الاشتراك وإيقاف مقدم الخدمة إن وجد. متابعة؟'))return;const r=await db.rpc('admin_cancel_active_subscription',{p_subscription_id:id});if(r.error){note(r.error.message);return}note('تم إلغاء الاشتراك إداريًا.',true);load()}
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});load();
</script></body></html>
