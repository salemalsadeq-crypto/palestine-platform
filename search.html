<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>البحث الموحد - فلسطين بلاتفورم</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="theme-v61.css"><style>
body{background:#f5f8fc}.search-page{max-width:1100px;margin:auto;padding:18px 14px 40px}.search-top{background:linear-gradient(135deg,#102f50,#1e659b);color:#fff;border-radius:24px;padding:24px;box-shadow:0 15px 35px #123b6820}.search-top h1{margin:0 0 6px;font-size:26px}.search-top p{margin:0 0 16px;color:#e3edf6;font-size:12px}.searchbox{display:flex;gap:8px;background:#fff;padding:6px;border-radius:15px}.searchbox input{flex:1;border:0;outline:0;padding:13px;font-size:15px;min-width:0}.searchbox button{border:0;border-radius:11px;background:#b51f2a;color:#fff;font-weight:900;padding:0 18px}.chips{display:flex;gap:7px;overflow:auto;padding:14px 0 2px}.chips button{white-space:nowrap;border:1px solid #d9e4ef;background:#fff;border-radius:999px;padding:8px 12px;font-weight:800;color:#21476c}.chips button.active{background:#173b68;color:#fff;border-color:#173b68}.summary{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:20px 0 10px}.summary h2{margin:0;color:#173b68;font-size:20px}.summary span{color:#738298;font-size:12px}.results{display:grid;gap:12px}.result{background:#fff;border:1px solid #e1e8f0;border-radius:18px;padding:15px;display:flex;gap:14px;align-items:center;box-shadow:0 7px 22px #123b6809}.result .icon{width:52px;height:52px;border-radius:15px;background:#edf5fb;display:grid;place-items:center;font-size:26px;flex:0 0 52px}.result h3{margin:0 0 3px;color:#173b68;font-size:16px}.result p{margin:0;color:#66758a;font-size:11px;line-height:1.7}.result .type{margin-right:auto;background:#f1f5f9;color:#52667d;border-radius:999px;padding:5px 9px;font-size:10px;font-weight:800}.empty{background:#fff;border:1px dashed #cbd8e5;border-radius:18px;padding:35px;text-align:center;color:#68798d}.loading{background:#fff;border-radius:18px;padding:30px;text-align:center;color:#60748b}.error{background:#fff0f0;color:#a51f2a;border-radius:15px;padding:15px}.back{display:inline-block;margin-bottom:10px;color:#173b68;text-decoration:none;font-weight:900;font-size:12px}@media(max-width:600px){.search-top{padding:18px;border-radius:19px}.search-top h1{font-size:22px}.result{align-items:flex-start}.result .type{display:none}}
</style></head><body><header class="header"><div class="wrap head"><a class="logo" href="index.html">فلسطين <span>بلاتفورم</span></a><div class="account"></div></div></header>
<main class="search-page"><a class="back" href="index.html">← العودة للرئيسية</a><section class="search-top"><h1>🔎 البحث في فلسطين بلاتفورم</h1><p>ابحث مرة واحدة في الإعلانات والأماكن ومقدمي الخدمات.</p><form class="searchbox" id="form"><input id="q" autocomplete="off" placeholder="مثال: مطعم، سيارة، عقار، تاكسي، متجر..."><button>بحث</button></form><div class="chips" id="chips"></div></section><div class="summary"><h2>نتائج البحث</h2><span id="count">—</span></div><section id="results" class="results"><div class="loading">اكتب كلمة للبحث…</div></section></main>
<script src="platform.js"></script><script>
const db=ppClient,$=id=>document.getElementById(id);let current='all';
const cats=[['all','الكل'],['ads','الإعلانات'],['places','الأماكن'],['services','الخدمات']];
$('chips').innerHTML=cats.map(x=>'<button data-type="'+x[0]+'" class="'+(x[0]==='all'?'active':'')+'">'+x[1]+'</button>').join('');
$('chips').onclick=e=>{const b=e.target.closest('button');if(!b)return;current=b.dataset.type;document.querySelectorAll('#chips button').forEach(x=>x.classList.toggle('active',x===b));run()};
$('form').onsubmit=e=>{e.preventDefault();run()};
function esc(v){return ppEsc(v)}
function card(icon,title,text,type,url){return '<a class="result" href="'+url+'"><span class="icon">'+icon+'</span><div><h3>'+esc(title)+'</h3><p>'+esc(text||'')+'</p></div><span class="type">'+type+'</span></a>'}
async function run(){const q=$('q').value.trim();if(!q){$('results').innerHTML='<div class="empty">🔎 اكتب كلمة أو اسمًا للبحث.</div>';$('count').textContent='—';return}$('results').innerHTML='<div class="loading">⏳ جاري البحث في المنصة…</div>';$('count').textContent='جاري البحث';const like='%'+q.replace(/[%_]/g,'')+'%';let out=[];
try{
if(current==='all'||current==='ads'){const r=await db.from('ads').select('id,title,category,city,description,status').eq('status','active').or('title.ilike.'+like+',description.ilike.'+like+',category.ilike.'+like+',city.ilike.'+like).order('created_at',{ascending:false}).limit(30);if(!r.error)(r.data||[]).forEach(a=>out.push({html:card('🛒',a.title,(a.category||'إعلان')+(a.city?' • '+a.city:'')+' — '+(a.description||'').slice(0,90),'إعلان','ad-details.html?id='+encodeURIComponent(a.id)),sort:1}));}
if(current==='all'||current==='places'){const r=await db.from('places').select('id,name,category,city,address,description,status').eq('status','published').or('name.ilike.'+like+',category.ilike.'+like+',city.ilike.'+like+',address.ilike.'+like+',description.ilike.'+like).order('created_at',{ascending:false}).limit(30);if(!r.error)(r.data||[]).forEach(p=>out.push({html:card('📍',p.name,(p.category||'مكان')+(p.city?' • '+p.city:'')+' — '+(p.address||p.description||''),'مكان','place-details.html?id='+encodeURIComponent(p.id)),sort:2}));}
if(current==='all'||current==='services'){const aliases={'تاكسي':'taxi','تكسي':'taxi','توصيل':'delivery','منزل':'home','طعام':'food','نقل':'transport','شحن':'delivery'};const serviceTerm=aliases[q.toLowerCase()]||q;const serviceLike='%'+serviceTerm.replace(/[%_]/g,'')+'%';const r=await db.from('service_providers').select('user_id,display_name,company_name,provider_kind,service_type,city,specialization,coverage_area,is_active').eq('is_active',true).or('display_name.ilike.'+like+',company_name.ilike.'+like+',service_type.ilike.'+serviceLike+',city.ilike.'+like+',specialization.ilike.'+like+',coverage_area.ilike.'+like).limit(30);if(!r.error)(r.data||[]).forEach(p=>{const n=p.provider_kind==='company'?(p.company_name||'شركة خدمات'):(p.display_name||'مقدم خدمة');out.push({html:card('⚡',n,(p.service_type||'خدمة')+(p.city?' • '+p.city:'')+' — '+(p.specialization||p.coverage_area||'متاح حاليًا'),'خدمة','service-provider-browse.html?type='+encodeURIComponent(p.service_type)),sort:3});});}
out.sort((a,b)=>a.sort-b.sort);$('results').innerHTML=out.length?out.map(x=>x.html).join(''):'<div class="empty">📭 لم نجد نتائج مطابقة. جرّب كلمة أخرى أو قسمًا مختلفًا.</div>';$('count').textContent=out.length+' نتيجة';
}catch(e){$('results').innerHTML='<div class="error">❌ تعذر إكمال البحث. حاول مرة أخرى.</div>';$('count').textContent='';}}
const initial=new URLSearchParams(location.search).get('q');if(initial){$('q').value=initial;run()}
</script><script>ppSetupHeader?.();</script></body></html>
