<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>رحلتي | فلسطين بلاتفورم</title><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
body{margin:0;background:#f3f7fb;color:#172033;font-family:Arial,Tahoma,sans-serif}.wrap{max-width:900px;margin:auto;padding:0 15px}.top{padding:14px 15px}.top a{color:#123b68;text-decoration:none;font-weight:900}.hero{background:linear-gradient(135deg,#123b68,#2872b8);color:#fff;padding:23px 0}.hero h1{margin:0 0 5px}.hero p{margin:0;color:#dceaf7;font-size:12px}.card{background:#fff;border:1px solid #e1e9f1;border-radius:20px;padding:16px;margin:14px 0;box-shadow:0 8px 25px #123b680b}.statusbox{display:flex;align-items:center;gap:10px;padding:14px;border-radius:15px;background:#eef5fb}.dot{width:12px;height:12px;border-radius:50%;background:#0a956d}.big{font-size:18px;font-weight:900;color:#123b68}.muted{font-size:11px;color:#718096;line-height:1.8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.item{background:#f7fafc;border-radius:12px;padding:11px}.item small{display:block;color:#718096;font-size:9px}.item b{display:block;margin-top:3px;font-size:12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{border:0;border-radius:13px;padding:12px;font-weight:900;font:inherit;cursor:pointer}.red{background:#c51f2d;color:#fff}.soft{background:#eaf3fb;color:#123b68}.stars button{border:0;background:none;font-size:29px;cursor:pointer;opacity:.35}.stars button.on{opacity:1}.msg{padding:11px;border-radius:12px;font-size:12px}.ok{background:#eaf8f2;color:#087a58}.err{background:#fff0f1;color:#a51e29}#map{height:300px;border-radius:16px;overflow:hidden}@media(max-width:600px){.grid,.actions{grid-template-columns:1fr}#map{height:250px}}
</style><link rel="stylesheet" href="theme-v59.css">
</head><body><div class="wrap top"><a href="services.html">← الخدمات</a></div><section class="hero"><div class="wrap"><h1>🚕 رحلتي</h1><p>متابعة مباشرة لحالة طلب التاكسي.</p></div></section><main class="wrap"><section class="card"><div class="statusbox"><span class="dot" id="dot"></span><div><div class="big" id="statusTitle">جاري تحميل الرحلة...</div><div class="muted" id="statusText">سنحدّث الحالة تلقائيًا.</div></div></div></section><section class="card"><div class="grid"><div class="item"><small>السائق</small><b id="driver">—</b></div><div class="item"><small>المركبة</small><b id="vehicle">—</b></div><div class="item"><small>رقم المركبة</small><b id="plate">—</b></div><div class="item"><small>عدد الركاب</small><b id="people">—</b></div></div></section><section class="card"><div id="map"></div></section><section class="card"><div class="actions"><button class="btn soft" id="call">📞 اتصال بالسائق</button><button class="btn red" id="cancel">إلغاء الرحلة</button></div><div id="msg" style="margin-top:9px"></div></section><section class="card" id="review" style="display:none"><h3>⭐ قيّم رحلتك</h3><div class="muted">اختر عدد النجوم ثم أرسل تقييمك.</div><div class="stars" id="stars"><button data-v="1">★</button><button data-v="2">★</button><button data-v="3">★</button><button data-v="4">★</button><button data-v="5">★</button></div><textarea id="comment" placeholder="ملاحظة اختيارية" style="width:100%;min-height:70px;box-sizing:border-box;border:1px solid #d8e2ec;border-radius:12px;padding:10px;font:inherit"></textarea><button class="btn soft" id="sendReview" style="margin-top:8px;width:100%">إرسال التقييم</button></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><script src="platform.js"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),rid=params.get('id');let uid=null,req=null,provider=null,map=null,marker=null,selectedRating=0;
const labels={pending:['جاري انتظار السائق','تم إرسال الطلب إلى السائق.'],accepted:['السائق قبل الطلب ✓','السائق سيبدأ الرحلة قريبًا.'],in_progress:['الرحلة جارية 🚕','السائق ينفذ الرحلة الآن.'],completed:['اكتملت الرحلة ✅','شكرًا لاستخدام فلسطين بلاتفورم.'],cancelled:['تم إلغاء الرحلة','هذه الرحلة لم تعد نشطة.']};
function notice(t,ok=false){$('msg').className='msg '+(ok?'ok':'err');$('msg').textContent=t}function showMap(){if(map)return;map=L.map('map').setView([32.22,35.26],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map)}function put(lat,lng){if(lat==null||lng==null)return;showMap();if(marker)marker.setLatLng([lat,lng]);else marker=L.marker([lat,lng]).addTo(map).bindPopup('موقع السائق').openPopup();map.setView([lat,lng],15)}
async function load(){if(!rid)return;const r=await ppClient.from('service_requests').select('*').eq('id',rid).maybeSingle();if(r.error||!r.data){notice('تعذر تحميل الرحلة.');return}req=r.data;const l=labels[req.status]||[req.status,''];$('statusTitle').textContent=l[0];$('statusText').textContent=l[1];$('people').textContent=req.people_count||1;provider=null;if(req.provider_id){const p=await ppClient.from('service_providers').select('display_name,company_name,vehicle_type,vehicle_number,contact_phone,latitude,longitude').eq('user_id',req.provider_id).maybeSingle();provider=p.data||null}$('driver').textContent=provider?.display_name||provider?.company_name||'السائق';$('vehicle').textContent=provider?.vehicle_type||'—';$('plate').textContent=provider?.vehicle_number||'—';$('call').disabled=!provider?.contact_phone;$('call').onclick=()=>{if(provider?.contact_phone)location.href='tel:'+provider.contact_phone};$('cancel').style.display=['pending','accepted'].includes(req.status)?'block':'none';if(provider?.latitude!=null)put(provider.latitude,provider.longitude);if(req.status==='completed'){$('review').style.display='block';$('cancel').style.display='none'}if(req.status==='cancelled'){$('cancel').style.display='none'} }
$('cancel').onclick=async()=>{if(!confirm('هل تريد إلغاء الرحلة؟'))return;$('cancel').disabled=true;const r=await ppClient.rpc('cancel_my_taxi_request',{p_request_id:rid});if(r.error)notice(r.error.message);else{notice('تم إلغاء الرحلة ✓',true);load()}$('cancel').disabled=false};document.querySelectorAll('#stars button').forEach(b=>b.onclick=()=>{selectedRating=+b.dataset.v;document.querySelectorAll('#stars button').forEach(x=>x.classList.toggle('on',+x.dataset.v<=selectedRating))});$('sendReview').onclick=async()=>{if(!selectedRating){notice('اختر عدد النجوم أولًا.');return}const r=await ppClient.rpc('add_taxi_review',{p_request_id:rid,p_rating:selectedRating,p_comment:$('comment').value.trim()||null});if(r.error)notice(r.error.message);else{$('sendReview').disabled=true;notice('تم إرسال تقييمك، شكرًا لك ✓',true)}};async function init(){const u=await ppUser();if(!u){location.href='login.html?next='+encodeURIComponent(location.href);return}uid=u.id;await load();setInterval(load,5000)}init();
</script></body></html>
