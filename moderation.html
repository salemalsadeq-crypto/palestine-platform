<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مركز الثقة والسلامة | فلسطين بلاتفورم</title><link rel="stylesheet" href="app.css"><style>body{margin:0;background:#f3f7fb;color:#172033;font-family:Arial,Tahoma,sans-serif}.wrap{max-width:1200px;margin:auto;padding:18px}.head{background:#123b68;color:#fff}.panel{background:#fff;border:1px solid #e1e9f1;border-radius:18px;padding:16px;margin:14px 0}.tabs{display:flex;gap:8px;overflow:auto}.tabs button,.btn{border:0;border-radius:10px;padding:9px 12px;font-weight:900;cursor:pointer}.tabs button{background:#e8eef4}.tabs .active,.blue{background:#174f86;color:#fff}.red{background:#c62838;color:#fff}.green{background:#087957;color:#fff}.table{overflow:auto}table{width:100%;min-width:850px;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #edf1f5;text-align:right}.muted{color:#718096;font-size:13px}.notice{padding:11px;border-radius:11px;margin:10px 0}.err{background:#fff0f1;color:#a51f2b}.ok{background:#eaf8f2;color:#087957}textarea{width:100%;box-sizing:border-box;border:1px solid #dbe3eb;border-radius:10px;padding:9px}</style><link rel="stylesheet" href="theme-v59.css">
</head><body><header class="head"><div class="wrap"><b>🛡️ مركز الثقة والسلامة</b><div class="muted" style="color:#dbeaf7">البلاغات، المراجعة، وسجل العمليات</div></div></header><main class="wrap"><div id="notice"></div><section class="panel"><div class="tabs"><button class="active" data-tab="reports">🚩 البلاغات</button><button data-tab="audit">📋 سجل التدقيق</button><button data-tab="users">👤 المستخدمون الموثقون</button></div><div id="content">جاري التحميل...</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><script src="platform.js"></script><script>const db=ppClient,$=id=>document.getElementById(id),esc=ppEsc;let tab='reports';function note(t,ok=false){$('notice').innerHTML='<div class="notice '+(ok?'ok':'err')+'">'+esc(t)+'</div>';setTimeout(()=>$('notice').innerHTML='',3000)}async function guard(){return await ppRequire('manage_reports')}async function render(){if(tab==='reports')await reports();if(tab==='audit')await audit();if(tab==='users')await users()}async function reports(){const r=await db.from('ad_reports').select('id,ad_id,reporter_id,reason,details,status,admin_note,created_at').eq('status','pending').order('created_at',{ascending:false}).limit(100);if(r.error){note(r.error.message);return}$('content').innerHTML='<div class="table"><table><thead><tr><th>البلاغ</th><th>السبب</th><th>التفاصيل</th><th>التاريخ</th><th>إجراء</th></tr></thead><tbody>'+(r.data||[]).map(x=>'<tr><td><a href="ad-details.html?id='+encodeURIComponent(x.ad_id)+'">فتح الإعلان</a><br><small>'+esc(x.id)+'</small></td><td>'+esc(x.reason)+'</td><td>'+esc(x.details||'—')+'</td><td>'+new Date(x.created_at).toLocaleString('ar-PS')+'</td><td><textarea id="n-'+x.id+'" placeholder="ملاحظة الإدارة"></textarea><br><button class="btn green" onclick="moderate(\''+x.id+'\',\'reviewed\')">مراجعة</button> <button class="btn red" onclick="moderate(\''+x.id+'\',\'dismissed\')">رفض البلاغ</button></td></tr>').join('')+'</tbody></table></div>'}async function moderate(id,status){const r=await db.rpc('moderate_ad_report',{p_report_id:id,p_status:status,p_admin_note:document.getElementById('n-'+id)?.value||null});if(r.error){note(r.error.message);return}note('تم تحديث البلاغ',true);reports()}async function audit(){const r=await db.from('audit_logs').select('id,actor_id,action,entity_type,entity_id,metadata,created_at').order('created_at',{ascending:false}).limit(150);if(r.error){note(r.error.message);return}$('content').innerHTML='<div class="table"><table><thead><tr><th>العملية</th><th>النوع</th><th>المعرّف</th><th>التفاصيل</th><th>التاريخ</th></tr></thead><tbody>'+(r.data||[]).map(x=>'<tr><td>'+esc(x.action)+'</td><td>'+esc(x.entity_type)+'</td><td>'+esc(x.entity_id||'—')+'</td><td><pre style="white-space:pre-wrap">'+esc(JSON.stringify(x.metadata||{}))+'</pre></td><td>'+new Date(x.created_at).toLocaleString('ar-PS')+'</td></tr>').join('')+'</tbody></table></div>'}async function users(){const r=await db.from('profiles').select('id,full_name,city,is_verified,trust_score,verified_at').eq('is_verified',true).order('verified_at',{ascending:false}).limit(100);if(r.error){note(r.error.message);return}$('content').innerHTML='<div class="table"><table><thead><tr><th>المستخدم</th><th>المدينة</th><th>موثق</th><th>درجة الثقة</th><th>تاريخ التوثيق</th></tr></thead><tbody>'+(r.data||[]).map(x=>'<tr><td>'+esc(x.full_name||'مستخدم')+'</td><td>'+esc(x.city||'—')+'</td><td>✅</td><td>'+esc(String(x.trust_score??0))+'</td><td>'+new Date(x.verified_at).toLocaleString('ar-PS')+'</td></tr>').join('')+'</tbody></table></div>'}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;render()});(async()=>{if(await guard())render()})();</script></body></html>
