<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الثقة والسلامة | فلسطين بلاتفورم</title><link rel="stylesheet" href="app.css"><style>
.mod-page{max-width:1240px;margin:auto;padding:22px 14px 50px}.mod-hero{border-radius:26px;padding:24px;color:#fff;background:linear-gradient(135deg,#0b4b31,#12633f 58%,#2a9565);box-shadow:0 18px 45px rgba(12,84,53,.16)}.mod-hero h1{margin:0 0 6px}.mod-hero p{margin:0;color:#e5f4eb}.panel{margin-top:18px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.tabs button{white-space:nowrap;border:1px solid #e8e2d6;background:#f7f5ef;color:#365143;padding:10px 14px;border-radius:12px;font-weight:900;cursor:pointer}.tabs button.active{background:#12633f;color:#fff;border-color:#12633f}.btn{border:0;border-radius:11px;padding:9px 12px;font-weight:900;cursor:pointer}.green{background:#12633f;color:#fff}.red{background:#b52b32;color:#fff}.muted{color:#6e756f;font-size:12px}.notice{padding:12px;border-radius:13px;margin:12px 0}.ok{background:#eaf7ef;color:#0a6a43}.err{background:#fff0f1;color:#a51f2b}.table{overflow:auto}table{width:100%;min-width:850px;border-collapse:collapse}th,td{padding:11px;text-align:right;border-bottom:1px solid #eeeae2;vertical-align:top}th{background:#f5f7f3;color:#31503e}textarea{width:100%;box-sizing:border-box;border:1px solid #ddd6c9;border-radius:10px;padding:9px;min-height:70px}.score{display:inline-flex;align-items:center;justify-content:center;min-width:42px;padding:5px 8px;border-radius:999px;background:#edf6f0;color:#12633f;font-weight:900}
</style></head><body><header><div class="head"><a class="logo" href="index.html">فلسطين <span>بلاتفورم</span></a><div class="account"></div></div></header><main class="mod-page"><section class="mod-hero"><h1>🛡️ مركز الثقة والسلامة</h1><p>مراجعة البلاغات، سجل التدقيق، وإدارة توثيق الحسابات.</p></section><div id="notice"></div><section class="panel pp-surface" style="padding:16px"><div class="tabs"><button class="active" data-tab="reports">🚩 البلاغات</button><button data-tab="audit">📋 سجل التدقيق</button><button data-tab="users">👤 التوثيق والثقة</button></div><div id="content">جاري التحميل...</div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><script src="platform.js"></script><script>
const db=ppClient,$=id=>document.getElementById(id),esc=ppEsc;let tab='reports',canVerify=false;
function note(t,ok=false){$('notice').innerHTML='<div class="notice '+(ok?'ok':'err')+'">'+esc(t)+'</div>';setTimeout(()=>$('notice').innerHTML='',3500)}
async function guard(){const u=await ppRequire('manage_reports');if(!u)return false;canVerify=await ppCan('manage_verification')||await ppCan('manage_users');return true}
async function render(){if(tab==='reports')return reports();if(tab==='audit')return audit();return users()}
async function reports(){const r=await db.from('ad_reports').select('id,ad_id,reporter_id,reason,details,status,admin_note,created_at').eq('status','pending').order('created_at',{ascending:false}).limit(100);if(r.error){note(r.error.message);return}$('content').innerHTML='<div class="table"><table><thead><tr><th>البلاغ</th><th>السبب</th><th>التفاصيل</th><th>التاريخ</th><th>الإجراء</th></tr></thead><tbody>'+(r.data||[]).map(x=>'<tr><td><a href="ad-details.html?id='+encodeURIComponent(x.ad_id)+'">فتح الإعلان</a><br><small>'+esc(x.id)+'</small></td><td>'+esc(x.reason||'—')+'</td><td>'+esc(x.details||'—')+'</td><td>'+new Date(x.created_at).toLocaleString('ar-PS')+'</td><td><textarea id="n-'+x.id+'" placeholder="ملاحظة الإدارة"></textarea><br><button class="btn green" onclick="moderate(\''+x.id+'\',\'reviewed\')">مراجعة</button> <button class="btn red" onclick="moderate(\''+x.id+'\',\'dismissed\')">رفض البلاغ</button></td></tr>').join('')+'</tbody></table></div>'}
async function moderate(id,status){const r=await db.rpc('moderate_ad_report',{p_report_id:id,p_status:status,p_admin_note:document.getElementById('n-'+id)?.value||null});if(r.error){note(r.error.message);return}note('تم تحديث البلاغ',true);reports()}
async function audit(){const r=await db.from('audit_logs').select('id,actor_id,action,entity_type,entity_id,metadata,created_at').order('created_at',{ascending:false}).limit(150);if(r.error){note(r.error.message);return}$('content').innerHTML='<div class="table"><table><thead><tr><th>العملية</th><th>النوع</th><th>المعرّف</th><th>التفاصيل</th><th>التاريخ</th></tr></thead><tbody>'+(r.data||[]).map(x=>'<tr><td>'+esc(x.action)+'</td><td>'+esc(x.entity_type)+'</td><td>'+esc(x.entity_id||'—')+'</td><td><pre style="white-space:pre-wrap">'+esc(JSON.stringify(x.metadata||{}))+'</pre></td><td>'+new Date(x.created_at).toLocaleString('ar-PS')+'</td></tr>').join('')+'</tbody></table></div>'}
async function users(){if(!canVerify){$('content').innerHTML='<div class="muted">لا تملك صلاحية إدارة التوثيق.</div>';return}const r=await db.from('profiles').select('id,full_name,city,is_verified,trust_score,verified_at').order('created_at',{ascending:false}).limit(150);if(r.error){note(r.error.message);return}$('content').innerHTML='<div class="table"><table><thead><tr><th>المستخدم</th><th>المدينة</th><th>الحالة</th><th>الثقة</th><th>إجراء</th></tr></thead><tbody>'+(r.data||[]).map(x=>'<tr><td><b>'+esc(x.full_name||'مستخدم')+'</b></td><td>'+esc(x.city||'—')+'</td><td>'+(x.is_verified?'✅ موثق':'غير موثق')+'</td><td><span class="score">'+esc(String(x.trust_score??0))+'</span></td><td><button class="btn '+(x.is_verified?'red':'green')+'" onclick="verify(\''+x.id+'\','+(x.is_verified?'false':'true')+')">'+(x.is_verified?'إلغاء التوثيق':'توثيق الحساب')+'</button></td></tr>').join('')+'</tbody></table></div>'}
async function verify(id,value){const r=await db.rpc('admin_set_user_verification',{target_user_id:id,new_verified:value});if(r.error){note(r.error.message);return}note(value?'تم توثيق الحساب':'تم إلغاء التوثيق',true);users()}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;render()});(async()=>{if(await guard())render()})();
</script></body></html>
