<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>إنشاء حساب - فلسطين بلاتفورم</title><style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fa;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    width: 100%;
    max-width: 430px;
    background: white;
    padding: 35px;
    border-radius: 16px;
    box-shadow: 0 5px 25px #0002;
}

h1 {
    text-align: center;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 25px;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 7px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 25px;
    border: none;
    border-radius: 8px;
    background: #111;
    color: white;
    font-size: 17px;
    cursor: pointer;
}

button:disabled {
    opacity: .6;
}

.message {
    margin-top: 15px;
    text-align: center;
    line-height: 1.7;
}

.back {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #111;
    text-decoration: none;
}

</style><link rel="stylesheet" href="app.css">
</head><body><div class="container"><h1>🇵🇸 إنشاء حساب</h1><p class="subtitle">
انضم إلى فلسطين بلاتفورم
</p><form id="registerForm"><label for="name">
الاسم
</label><input
type="text"
id="name"
placeholder="اكتب اسمك"
required
>

<label for="email">
البريد الإلكتروني
</label><input
type="email"
id="email"
placeholder="example@email.com"
required
>

<label for="password">
كلمة المرور
</label><input
type="password"
id="password"
placeholder="6 أحرف على الأقل"
required
>

<label for="confirmPassword">
    تأكيد كلمة المرور
</label>

<input
    type="password"
    id="confirmPassword"
    placeholder="أعد كتابة كلمة المرور"
    required
>

<button
    type="submit"
    id="registerButton"
    style="
        display:block;
        width:100%;
        padding:14px;
        margin-top:25px;
        border:none;
        border-radius:8px;
        background:#111;
        color:white;
        font-size:17px;
        cursor:pointer;
">
    إنشاء الحساب
</button>

<div
    id="message"
    class="message"
></div>

<a
    href="login.html"
    class="back"
>
    لديك حساب؟ تسجيل الدخول
</a>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0" crossorigin="anonymous"></script><script src="platform.js"></script><script>
const supabaseClient=window.ppClient,form=document.getElementById('registerForm'),button=document.getElementById('registerButton'),message=document.getElementById('message');
form.addEventListener('submit',async e=>{e.preventDefault();const name=document.getElementById('name').value.trim(),email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,confirmPassword=document.getElementById('confirmPassword').value;message.textContent='';if(!name)return message.textContent='❌ أدخل الاسم';if(password.length<6)return message.textContent='❌ كلمة المرور يجب أن تكون 6 أحرف على الأقل';if(password!==confirmPassword)return message.textContent='❌ كلمتا المرور غير متطابقتين';button.disabled=true;button.textContent='جاري إنشاء الحساب...';try{const {data,error}=await supabaseClient.auth.signUp({email,password,options:{data:{name,full_name:name}}});if(error)throw error;if(data.session){message.style.color='green';message.textContent='✅ تم إنشاء الحساب وتسجيل الدخول';setTimeout(()=>location.replace('index.html'),600)}else{message.style.color='green';message.textContent='✅ تم إنشاء الحساب. تحقق من بريدك الإلكتروني ثم سجل الدخول.'}}catch(err){message.style.color='red';message.textContent='❌ '+(err.message||'تعذر إنشاء الحساب')}finally{button.disabled=false;button.textContent='إنشاء الحساب'}});
</script><script src="app-ui.js" defer></script>
</body></html>
