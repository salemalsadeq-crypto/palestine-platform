<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الملف الشخصي - فلسطين بلاتفورم</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f5f7fa;color:#172033}
header{background:#173b68;color:#fff;padding:14px 20px}
.head{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-size:22px;font-weight:bold}.logo span{color:#b51f2a}
nav{display:flex;gap:7px;flex-wrap:wrap}
nav a{color:#fff;text-decoration:none;padding:8px 11px;background:#234d7e;border-radius:8px;font-size:13px}
.wrap{max-width:1050px;margin:28px auto;padding:0 15px}
.profile-card{background:#fff;border-radius:18px;padding:25px;box-shadow:0 4px 18px #0001;margin-bottom:22px}
.profile-top{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.avatar{width:110px;height:110px;border-radius:50%;object-fit:cover;border:4px solid #eef2f7}
.initial{width:110px;height:110px;border-radius:50%;background:#173b68;color:#fff;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:bold}
.info{flex:1;min-width:220px}
.name{font-size:28px;font-weight:bold;margin-bottom:10px}
.meta{color:#667085;margin:7px 0;font-size:16px}
.stats{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}
.stat{background:#f5f7fa;border-radius:12px;padding:14px 20px;min-width:140px;text-align:center}
.stat strong{display:block;font-size:24px;color:#173b68;margin-bottom:5px}
.stat span{color:#667085;font-size:13px}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:22px 0 14px;flex-wrap:wrap}
.section-title h2{margin:0;font-size:22px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 3px 14px #0001}
.pic,.nop{width:100%;height:190px;object-fit:cover}
.nop{display:flex;align-items:center;justify-content:center;background:#e9edf2;font-size:52px}
.body{padding:15px}.title{font-size:19px;font-weight:bold;margin-bottom:8px}
.card-meta{color:#667085;margin:7px 0}.price{color:#b51f2a;font-weight:bold;font-size:18px;margin:8px 0}
.desc{color:#555;line-height:1.5;min-height:45px}
.view{display:block;background:#173b68;color:#fff;text-decoration:none;text-align:center;padding:10px;border-radius:8px;margin-top:12px;font-weight:bold}
.empty,.error,.loading{background:#fff;border-radius:14px;padding:40px;text-align:center}
.back{display:inline-block;background:#173b68;color:#fff;text-decoration:none;padding:10px 15px;border-radius:9px;margin-bottom:18px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.follow{background:#f0f6ff;color:#173b68;border:1px solid #d7e5f7}.follow.active{background:#173b68;color:#fff}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}.tab{border:0;background:#eef3f8;color:#173b68;padding:9px 14px;border-radius:999px;cursor:pointer;font-weight:bold}.tab.active{background:#173b68;color:#fff}.follow-note{font-size:13px;color:#667085;margin-top:7px;min-height:18px}.action{border:0;text-decoration:none;cursor:pointer;padding:10px 15px;border-radius:10px;font-weight:bold;font-size:14px}.primary{background:#173b68;color:#fff}.light{background:#eef3f8;color:#173b68}.success{background:#198754;color:#fff}.danger{background:#b51f2a;color:#fff}.share-note{font-size:13px;color:#667085;margin-top:8px;min-height:18px}.section-sub{color:#667085;font-size:14px}.card{transition:transform .18s ease,box-shadow .18s ease}.card:hover{transform:translateY(-2px);box-shadow:0 8px 22px #0002}.status{display:inline-flex;align-items:center;gap:6px;background:#eef8f2;color:#198754;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:bold}.badge{display:inline-block;background:#f1f4f8;color:#475467;border-radius:999px;padding:5px 9px;font-size:12px;margin-top:4px}.empty{grid-column:1/-1}
@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}
@media(max-width:520px){
 .wrap{padding:0 10px;margin-top:18px}
 .profile-card{padding:18px}
 .profile-top{justify-content:center;text-align:center}
 .info{min-width:100%}
 .name{font-size:23px}
 .stats{justify-content:center}
 .stat{flex:1;min-width:110px}
 .grid{grid-template-columns:1fr}
 .pic,.nop{height:210px}
 nav{width:100%}
}
</style>
<script src="platform.js"></script><link rel="stylesheet" href="app.css">
</head>
<body>
<header>
<div class="head">
  <div class="logo">فلسطين <span>بلاتفورم</span></div>
  <nav>
    <a href="index.html">الرئيسية</a>
    <a href="ads.html">الإعلانات</a>
    <a href="favorites.html">❤️ المفضلة</a>
    <a href="my-ads.html">إعلاناتي</a>
    <a href="account.html">حسابي</a>
  </nav>
</div>
</header>

<main class="wrap">
  <a class="back" href="javascript:history.back()">← رجوع</a>
  <div id="app" class="loading">جاري تحميل الملف الشخصي...</div>
</main>

<script>
const SUPABASE_URL='https://sesbumfedusbjevbsyzl.supabase.co';
const SUPABASE_KEY='sb_publishable_0sJrbh73jLip3O5OtJkc_A_9F6OPWqR';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const params=new URLSearchParams(location.search);
const profileId=params.get('id');

function esc(v){
  return String(v??'').replace(/[&<>"']/g,m=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
  }[m]));
}

function firstImage(ad){
  return Array.isArray(ad.image_urls) && ad.image_urls.length ? ad.image_urls[0] : '';
}

function render(profile,ads){
  const name=(profile?.full_name||'مستخدم').trim()||'مستخدم';
  const initial=esc(name.charAt(0)||'م');
  const city=profile?.city ? '📍 '+esc(profile.city) : '📍 المدينة غير محددة';
  const phone=profile?.phone ? '📞 '+esc(profile.phone) : '';
  const userLink=`profile.html?id=${encodeURIComponent(profile.id)}`;
  const cards=ads.length ? ads.map(ad=>{
    const img=firstImage(ad);
    const date=ad.created_at ? new Date(ad.created_at).toLocaleDateString('ar-PS') : '';
    return `<article class="card" data-status="${esc(ad.status||'active')}">
      ${img ? `<img class="pic" src="${esc(img)}" alt="${esc(ad.title||'إعلان')}" loading="lazy">` : `<div class="nop">📦</div>`}
      <div class="body">
        <div class="title">${esc(ad.title||'إعلان')}</div>
        <div class="card-meta">${esc(ad.category||'إعلان')} ${ad.city?' • '+esc(ad.city):''}</div>
        ${date ? `<div class="badge">🗓️ ${esc(date)}</div>` : ''}
        ${ad.price!=null && ad.price!=='' ? `<div class="price">${esc(ad.price)} ₪</div>` : ''}
        <div class="desc">${esc(ad.description||'')}</div>
        <a class="view" href="ad-details.html?id=${encodeURIComponent(ad.id)}">عرض الإعلان</a>
      </div>
    </article>`;
  }).join('') : `<div class="empty">📭 لا توجد إعلانات منشورة لهذا المستخدم.</div>`;

  document.getElementById('app').innerHTML=`
    <section class="profile-card">
      <div class="profile-top">
        ${profile?.avatar_url
          ? `<img class="avatar" src="${esc(profile.avatar_url)}" alt="صورة ${esc(name)}" onerror="this.outerHTML='<div class=\'initial\'>${initial}</div>'">`
          : `<div class="initial">${initial}</div>`}
        <div class="info">
          <div class="name">${esc(name)}</div>
          <div class="status">● عضو في فلسطين بلاتفورم</div>
          <div class="meta">${city}</div>
          ${phone ? `<div class="meta">${phone}</div>` : ''}
          <div class="actions">
            <a class="action primary" href="messages.html?user=${encodeURIComponent(profile.id)}">💬 مراسلة</a>
            ${phone ? `<a class="action success" href="tel:${encodeURIComponent(profile.phone)}">📞 اتصال</a>` : ''}
            <button id="followBtn" class="action follow" type="button" onclick="toggleFollow()">➕ متابعة</button>
            <button class="action light" type="button" onclick="shareProfile()">🔗 مشاركة الملف</button>
          </div>
          <div id="shareNote" class="share-note"></div><div id="followNote" class="follow-note"></div>
          <div class="stats">
            <div class="stat"><strong>${ads.length}</strong><span>إعلان منشور</span></div>
            <div class="stat"><strong id="followersCount">0</strong><span>متابع</span></div>
          </div>
        </div>
      </div>
    </section>
    <section>
      <div class="section-title">
        <div><h2>📢 إعلانات ${esc(name)}</h2><div class="section-sub">آخر الإعلانات المنشورة من هذا المستخدم</div></div>
      </div>
      <div class="tabs" id="adTabs">
        <button class="tab active" data-filter="all" type="button">الكل</button>
        <button class="tab" data-filter="active" type="button">المتاح</button>
      </div>
      <div class="grid" id="adsGrid">${cards}</div>
    </section>`;
}

async function shareProfile(){
  const url=location.href;
  const note=document.getElementById('shareNote');
  try{
    if(navigator.share){
      await navigator.share({title:'الملف الشخصي - فلسطين بلاتفورم',url});
      if(note) note.textContent='تم فتح المشاركة.';
    }else if(navigator.clipboard){
      await navigator.clipboard.writeText(url);
      if(note) note.textContent='✅ تم نسخ رابط الملف الشخصي.';
    }else{
      if(note) note.textContent='انسخ الرابط من شريط المتصفح لمشاركته.';
    }
  }catch(e){
    if(note) note.textContent='يمكنك نسخ رابط الصفحة ومشاركته.';
  }
}

let currentProfileId=null;
let currentUserId=null;

function setupTabs(ads){
  document.querySelectorAll('#adTabs .tab').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('#adTabs .tab').forEach(x=>x.classList.remove('active'));
      btn.classList.add('active');
      const filter=btn.dataset.filter;
      document.querySelectorAll('#adsGrid .card').forEach(card=>{
        card.style.display=(filter==='all'||card.dataset.status===filter)?'':'none';
      });
    });
  });
}

async function loadFollowState(){
  const btn=document.getElementById('followBtn');
  if(!btn||!currentProfileId) return;
  const {data:{user}}=await db.auth.getUser();
  currentUserId=user?.id||null;
  if(!currentUserId || currentUserId===currentProfileId){btn.style.display='none'; return;}
  const {data}=await db.from('profile_follows').select('follower_id').eq('follower_id',currentUserId).eq('following_id',currentProfileId).maybeSingle();
  const following=!!data;
  btn.classList.toggle('active',following);
  btn.textContent=following?'✓ تتابعه':'➕ متابعة';
  const {count}=await db.from('profile_follows').select('following_id',{count:'exact',head:true}).eq('following_id',currentProfileId);
  const c=document.getElementById('followersCount'); if(c) c.textContent=String(count||0);
}

async function toggleFollow(){
  const btn=document.getElementById('followBtn'), note=document.getElementById('followNote');
  if(!btn||!currentProfileId) return;
  const {data:{user}}=await db.auth.getUser();
  if(!user){ if(note) note.textContent='سجّل الدخول أولًا لمتابعة المستخدم.'; return; }
  if(user.id===currentProfileId) return;
  btn.disabled=true;
  try{
    const {data:existing}=await db.from('profile_follows').select('follower_id').eq('follower_id',user.id).eq('following_id',currentProfileId).maybeSingle();
    if(existing){
      const {error}=await db.from('profile_follows').delete().eq('follower_id',user.id).eq('following_id',currentProfileId);
      if(error) throw error;
      btn.classList.remove('active'); btn.textContent='➕ متابعة'; if(note) note.textContent='تم إلغاء المتابعة.';
    }else{
      const {error}=await db.from('profile_follows').insert({follower_id:user.id,following_id:currentProfileId});
      if(error) throw error;
      btn.classList.add('active'); btn.textContent='✓ تتابعه'; if(note) note.textContent='تمت متابعة المستخدم.';
    }
    const {count}=await db.from('profile_follows').select('following_id',{count:'exact',head:true}).eq('following_id',currentProfileId);
    const c=document.getElementById('followersCount'); if(c) c.textContent=String(count||0);
  }catch(e){ console.error(e); if(note) note.textContent='تعذر تحديث المتابعة حاليًا.'; }
  finally{btn.disabled=false;}
}

async function load(){
  currentProfileId=profileId;
  if(!profileId){
    document.getElementById('app').innerHTML='<div class="error">❌ رابط الملف الشخصي غير صحيح.</div>';
    return;
  }

  const {data:profile,error:profileError}=await db
    .from('profiles')
    .select('id,full_name,phone,city,avatar_url')
    .eq('id',profileId)
    .maybeSingle();

  if(profileError){
    console.error(profileError);
    document.getElementById('app').innerHTML='<div class="error">❌ حدث خطأ أثناء تحميل الملف الشخصي.</div>';
    return;
  }

  const {data:ads,error:adsError}=await db
    .from('ads')
    .select('id,title,category,description,price,city,image_urls,created_at,status')
    .eq('user_id',profileId)
    .order('created_at',{ascending:false});

  if(adsError){
    console.error(adsError);
    document.getElementById('app').innerHTML='<div class="error">❌ حدث خطأ أثناء تحميل إعلانات المستخدم.</div>';
    return;
  }

  render(profile,ads||[]);
  setupTabs(ads||[]);
  await loadFollowState();
}

load();
</script>
<script src="app-ui.js" defer></script>
</body>
</html>
