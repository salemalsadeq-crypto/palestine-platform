<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>حساب المستخدم - فلسطين بلاتفورم</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:#f5f7fa;
    color:#222;
}

/* =========================
   HEADER
========================= */

header{
    background:#fff;
    border-bottom:1px solid #ddd;
    padding:15px 20px;
}

.header-container{
    max-width:1100px;
    margin:auto;

    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:15px;
}

.logo{
    font-size:23px;
    font-weight:bold;
    color:#087443;
    text-decoration:none;
}

.back{
    color:#087443;
    text-decoration:none;
    font-weight:bold;
}

/* =========================
   CONTAINER
========================= */

.container{
    max-width:1000px;
    margin:30px auto;
    padding:0 15px;
}

/* =========================
   PROFILE
========================= */

.profile-card{
    background:#fff;
    border-radius:18px;
    padding:30px 20px;
    text-align:center;

    box-shadow:
        0 3px 15px rgba(0,0,0,.08);

    margin-bottom:25px;
}

.avatar{
    width:130px;
    height:130px;

    border-radius:50%;

    background:#087443;
    color:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    margin:0 auto 15px;

    font-size:48px;
    font-weight:bold;

    overflow:hidden;

    border:4px solid #fff;

    box-shadow:
        0 3px 15px rgba(0,0,0,.15);
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.profile-name{
    margin:10px 0;
    font-size:25px;
}

.profile-info{
    color:#666;
    margin:7px 0;
    font-size:15px;
}

.profile-phone{
    display:inline-block;

    margin-top:10px;

    padding:10px 18px;

    border-radius:9px;

    background:#e8f5e9;

    color:#087443;

    text-decoration:none;

    font-weight:bold;
}

/* =========================
   ADS HEADER
========================= */

.ads-header{
    background:#fff;

    border-radius:15px;

    padding:20px;

    margin-bottom:15px;

    box-shadow:
        0 3px 12px rgba(0,0,0,.07);
}

.ads-header h2{
    margin:0 0 7px;
}

.ads-count{
    color:#777;
    font-size:14px;
}

/* =========================
   ADS GRID
========================= */

.ads-grid{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:18px;
}

/* =========================
   AD CARD
========================= */

.ad-card{
    background:#fff;

    border-radius:14px;

    overflow:hidden;

    box-shadow:
        0 3px 12px rgba(0,0,0,.07);

    cursor:pointer;

    transition:
        transform .2s,
        box-shadow .2s;
}

.ad-card:hover{
    transform:translateY(-3px);

    box-shadow:
        0 6px 18px rgba(0,0,0,.12);
}

.ad-image{
    width:100%;
    height:190px;

    background:#eee;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;
}

.ad-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.no-image{
    font-size:45px;
    color:#aaa;
}

.ad-content{
    padding:15px;
}

.ad-title{
    font-size:18px;
    font-weight:bold;

    margin-bottom:8px;

    line-height:1.5;
}

.ad-category{
    display:inline-block;

    background:#e8f5e9;

    color:#087443;

    padding:5px 9px;

    border-radius:7px;

    font-size:12px;

    margin-bottom:10px;
}

.ad-description{
    color:#666;

    font-size:13px;

    line-height:1.6;

    margin-bottom:10px;

    display:-webkit-box;

    -webkit-line-clamp:3;

    -webkit-box-orient:vertical;

    overflow:hidden;
}

.ad-price{
    font-weight:bold;

    color:#087443;

    font-size:17px;

    margin-bottom:7px;
}

.ad-city{
    color:#777;

    font-size:13px;
}

.ad-date{
    color:#999;

    font-size:12px;

    margin-top:7px;
}

/* =========================
   STATES
========================= */

.loading{
    text-align:center;

    padding:50px 20px;

    color:#777;
}

.error{
    background:#ffebee;

    color:#c62828;

    padding:20px;

    border-radius:12px;

    text-align:center;
}

.empty{
    background:#fff;

    border-radius:15px;

    padding:40px 20px;

    text-align:center;

    color:#777;

    box-shadow:
        0 3px 12px rgba(0,0,0,.06);
}

/* =========================
   MOBILE
========================= */

@media(max-width:800px){

    .ads-grid{
        grid-template-columns:
            repeat(2,1fr);
    }

}

@media(max-width:600px){

    .header-container{
        flex-direction:column;
    }

    .container{
        margin-top:20px;
    }

    .profile-card{
        padding:25px 15px;
    }

    .avatar{
        width:110px;
        height:110px;
    }

    .profile-name{
        font-size:22px;
    }

    .ads-grid{
        grid-template-columns:1fr;
    }

    .ad-image{
        height:210px;
    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

<div class="header-container">

<a href="index.html"
class="logo">

فلسطين بلاتفورم

</a>


<a href="index.html"
class="back">

← الرئيسية

</a>

</div>

</header>


<!-- =========================
     MAIN
========================= -->

<div class="container">


<!-- تحميل -->

<div id="loading"
class="loading">

جاري تحميل الحساب...

</div>


<!-- المحتوى -->

<div id="content"
style="display:none;">


<!-- =========================
     PROFILE CARD
========================= -->

<div class="profile-card">


<div class="avatar"
id="avatar">

?

</div>


<h1
class="profile-name"
id="profileName">

المستخدم

</h1>


<div
class="profile-info"
id="profileCity">

</div>


<div
class="profile-info"
id="profileAds">

📢 عدد الإعلانات: 0

</div>


<a
id="profilePhone"
class="profile-phone"
href="#"
style="display:none;">

📞 الاتصال بصاحب الحساب

</a>


</div>


<!-- =========================
     ADS HEADER
========================= -->

<div class="ads-header">

<h2>
📢 إعلانات صاحب الحساب
</h2>


<div
class="ads-count"
id="adsCount">

جاري تحميل الإعلانات...

</div>

</div>


<!-- =========================
     ADS
========================= -->

<div
id="adsGrid"
class="ads-grid">

</div>


</div>


<!-- =========================
     ERROR
========================= -->

<div
id="errorBox"
class="error"
style="display:none;">

حدث خطأ أثناء تحميل الحساب.

</div>


</div>


<!-- SUPABASE -->

<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://sesbumfedusbjevbsyzl.supabase.co";


const SUPABASE_KEY =
"sb_publishable_0sJrbh73jLip3O5OtJkc_A_9F6OPWqR";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
        auth:{
            persistSession:true,
            autoRefreshToken:true,
            detectSessionInUrl:true
        }
    }
);


/* =========================
   USER ID
========================= */

const params =
new URLSearchParams(
    window.location.search
);


const userId =
params.get("id");


/* =========================
   تحميل الصفحة
========================= */

async function loadProfile(){

    if(!userId){

        showError(
            "رابط الحساب غير صحيح."
        );

        return;
    }


    try{

        /* =========================
           جلب الملف الشخصي
        ========================= */

        const {
            data:profile,
            error:profileError
        } = await supabaseClient

            .from("profiles")

            .select(
                "id,full_name,phone,city,avatar_url,created_at"
            )

            .eq(
                "id",
                userId
            )

            .maybeSingle();


        if(profileError){

            console.error(
                "Profile error:",
                profileError
            );

            showError(
                "تعذر تحميل معلومات الحساب."
            );

            return;
        }


        /* =========================
           عرض الملف
        ========================= */

        displayProfile(
            profile
        );


        /* =========================
           جلب الإعلانات
        ========================= */

        const {
            data:ads,
            error:adsError
        } = await supabaseClient

            .from("ads")

            .select(
                "id,user_id,title,category,description,price,city,phone,image_urls,created_at"
            )

            .eq(
                "user_id",
                userId
            )

            .order(
                "created_at",
                {
                    ascending:false
                }
            );


        if(adsError){

            console.error(
                "Ads error:",
                adsError
            );

            showError(
                "تم تحميل الحساب ولكن تعذر تحميل الإعلانات."
            );

            return;
        }


        displayAds(
            ads || []
        );


        /* =========================
           إظهار المحتوى
        ========================= */

        document.getElementById(
            "loading"
        ).style.display =
            "none";


        document.getElementById(
            "content"
        ).style.display =
            "block";


    }catch(error){

        console.error(error);

        showError(
            "حدث خطأ غير متوقع."
        );

    }

}


/* =========================
   عرض الملف الشخصي
========================= */

function displayProfile(profile){

    const name =
        profile &&
        profile.full_name &&
        profile.full_name.trim()

        ? profile.full_name.trim()

        : "المستخدم";


    document.getElementById(
        "profileName"
    ).textContent =
        name;


    /* =========================
       المدينة
    ========================= */

    const cityElement =
        document.getElementById(
            "profileCity"
        );


    if(
        profile &&
        profile.city &&
        profile.city.trim()
    ){

        cityElement.textContent =
            "📍 " +
            profile.city.trim();

    }else{

        cityElement.textContent =
            "📍 المدينة غير محددة";

    }


    /* =========================
       الهاتف
    ========================= */

    const phoneElement =
        document.getElementById(
            "profilePhone"
        );


    if(
        profile &&
        profile.phone &&
        profile.phone.trim()
    ){

        const phone =
            profile.phone.trim();


        phoneElement.href =
            "tel:" +
            phone;


        phoneElement.textContent =
            "📞 الاتصال بصاحب الحساب";


        phoneElement.style.display =
            "inline-block";

    }else{

        phoneElement.style.display =
            "none";

    }


    /* =========================
       الصورة
    ========================= */

    const avatar =
        document.getElementById(
            "avatar"
        );


    avatar.innerHTML =
        "";


    if(
        profile &&
        profile.avatar_url
    ){

        const img =
            document.createElement(
                "img"
            );


        img.src =
            profile.avatar_url;


        img.alt =
            "الصورة الشخصية";


        img.onerror =
            function(){

                showAvatarLetter(
                    name
                );

            };


        avatar.appendChild(
            img
        );

    }else{

        showAvatarLetter(
            name
        );

    }

}


/* =========================
   صورة افتراضية
========================= */

function showAvatarLetter(name){

    const avatar =
        document.getElementById(
            "avatar"
        );


    avatar.innerHTML =
        "";


    avatar.textContent =
        name &&
        name.trim()

        ? name.trim().charAt(0)

        : "?";

}


/* =========================
   عرض الإعلانات
========================= */

function displayAds(ads){

    const grid =
        document.getElementById(
            "adsGrid"
        );


    const count =
        document.getElementById(
            "adsCount"
        );


    const profileAds =
        document.getElementById(
            "profileAds"
        );


    count.textContent =
        "عدد الإعلانات: " +
        ads.length;


    profileAds.textContent =
        "📢 عدد الإعلانات: " +
        ads.length;


    grid.innerHTML =
        "";


    if(!ads.length){

        grid.innerHTML = `

            <div
                class="empty"
                style="grid-column:1/-1;">

                <div
                    style="font-size:45px;margin-bottom:10px;">

                    📢

                </div>

                <h3>
                    لا توجد إعلانات حالياً
                </h3>

                <p>
                    لم يقم صاحب الحساب بنشر أي إعلانات بعد.
                </p>

            </div>

        `;

        return;
    }


    ads.forEach(
        function(ad){

            grid.appendChild(
                createAdCard(ad)
            );

        }
    );

}


/* =========================
   إنشاء بطاقة الإعلان
========================= */

function createAdCard(ad){

    const card =
        document.createElement(
            "div"
        );


    card.className =
        "ad-card";


    card.addEventListener(
        "click",
        function(){

            window.location.href =
                "ad-details.html?id=" +
                encodeURIComponent(
                    ad.id
                );

        }
    );


    /* =========================
       الصورة
    ========================= */

    const imageContainer =
        document.createElement(
            "div"
        );


    imageContainer.className =
        "ad-image";


    if(
        ad.image_urls &&
        Array.isArray(ad.image_urls) &&
        ad.image_urls.length > 0
    ){

        const img =
            document.createElement(
                "img"
            );


        img.src =
            ad.image_urls[0];


        img.alt =
            ad.title || "صورة الإعلان";


        img.onerror =
            function(){

                imageContainer.innerHTML =
                    '<div class="no-image">📷</div>';

            };


        imageContainer.appendChild(
            img
        );

    }else{

        imageContainer.innerHTML =
            '<div class="no-image">📷</div>';

    }


    card.appendChild(
        imageContainer
    );


    /* =========================
       المحتوى
    ========================= */

    const content =
        document.createElement(
            "div"
        );


    content.className =
        "ad-content";


    /* العنوان */

    const title =
        document.createElement(
            "div"
        );


    title.className =
        "ad-title";


    title.textContent =
        ad.title || "بدون عنوان";


    content.appendChild(
        title
    );


    /* التصنيف */

    if(ad.category){

        const category =
            document.createElement(
                "span"
            );


        category.className =
            "ad-category";


        category.textContent =
            ad.category;


        content.appendChild(
            category
        );

    }


    /* الوصف */

    if(ad.description){

        const description =
            document.createElement(
                "div"
            );


        description.className =
            "ad-description";


        description.textContent =
            ad.description;


        content.appendChild(
            description
        );

    }


    /* السعر */

    if(
        ad.price !== null &&
        ad.price !== undefined &&
        ad.price !== ""
    ){

        const price =
            document.createElement(
                "div"
            );


        price.className =
            "ad-price";


        price.textContent =
            formatPrice(
                ad.price
            );


        content.appendChild(
            price
        );

    }


    /* المدينة */

    if(ad.city){

        const city =
            document.createElement(
                "div"
            );


        city.className =
            "ad-city";


        city.textContent =
            "📍 " +
            ad.city;


        content.appendChild(
            city
        );

    }


    /* التاريخ */

    if(ad.created_at){

        const date =
            document.createElement(
                "div"
            );


        date.className =
            "ad-date";


        date.textContent =
            formatDate(
                ad.created_at
            );


        content.appendChild(
            date
        );

    }


    card.appendChild(
        content
    );


    return card;

}


/* =========================
   تنسيق السعر
========================= */

function formatPrice(price){

    const number =
        Number(price);


    if(
        Number.isNaN(number)
    ){

        return price + " ₪";

    }


    return number.toLocaleString(
        "ar-EG"
    ) + " ₪";

}


/* =========================
   تنسيق التاريخ
========================= */

function formatDate(dateString){

    try{

        const date =
            new Date(
                dateString
            );


        return date.toLocaleDateString(
            "ar-PS",
            {
                year:"numeric",
                month:"long",
                day:"numeric"
            }
        );

    }catch(error){

        return "";

    }

}


/* =========================
   عرض الخطأ
========================= */

function showError(message){

    document.getElementById(
        "loading"
    ).style.display =
        "none";


    const errorBox =
        document.getElementById(
            "errorBox"
        );


    errorBox.textContent =
        message;


    errorBox.style.display =
        "block";

}


/* =========================
   تشغيل
========================= */

loadProfile();

</script>


</body>

     </html>
