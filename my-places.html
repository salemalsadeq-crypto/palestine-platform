<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أماكني | فلسطين بلاتفورم</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><script src="platform.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f3f6fa;color:#172033}.wrap{max-width:1050px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:15px}.back,.add{color:#173b68;text-decoration:none;font-weight:bold}.add{background:#173b68;color:#fff;padding:11px 14px;border-radius:10px}.title{background:#fff;border-radius:18px;padding:18px;box-shadow:0 5px 20px #0000000a}.title h1{margin:0 0 6px}.muted{color:#667085}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:15px}.card{background:#fff;border:1px solid #e5eaf0;border-radius:16px;padding:16px;box-shadow:0 3px 12px #00000008}.badge{display:inline-block;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:bold}.pending{background:#fff4d6;color:#8a5b00}.published{background:#e2f7ea;color:#13733b}.rejected{background:#ffe8e8;color:#a51d2a}.hidden{background:#eef2f6;color:#667085}.card h3{margin:10px 0 6px}.line{color:#667085;margin:5px 0;font-size:13px}.actions{display:flex;gap:8px;margin-top:13px}.btn{flex:1;text-align:center;text-decoration:none;padding:10px;border-radius:9px;background:#173b68;color:#fff;font-weight:bold;font-size:13px}.btn.secondary{background:#eef2f6;color:#173b68}.empty,.error{background:#fff;border-radius:16px;padding:45px;text-align:center;margin-top:15px}.error{color:#a51d2a}@media(max-width:650px){.grid{grid-template-columns:1fr}.wrap{padding:11px}}</style><link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="theme-v60.css">
</head><body><main class="wrap"><div class="top"><a class="back" href="places.html">← دليل الأماكن</a><a class="add" href="add-place.html">➕ إضافة مكان</a></div><section class="title"><h1>📍 أماكني</h1><div class="muted">تابع حالة الأماكن التي أرسلتها، وافتحها أو عدّل بياناتها.</div></section><div id="app" class="empty">جاري التحميل...</div></main><script>const db=ppClient,app=document.getElementById('app'),esc=ppEsc;const labels={pending:'قيد المراجعة',published:'منشور',rejected:'مرفوض',hidden:'مخفي'};const cls={pending:'pending',published:'published',rejected:'rejected',hidden:'hidden'};async function load(){const u=await ppUser();if(!u){location.href='login.html';return}const {data,error}=await db.from('places').select('*').eq('user_id',u.id).order('created_at',{ascending:false});if(error){app.className='error';app.textContent='❌ '+error.message;return}if(!data?.length){app.className='empty';app.innerHTML='لا توجد أماكن مضافة بعد.<br><br><a class="add" href="add-place.html">إضافة أول مكان</a>';return}app.className='grid';app.innerHTML=data.map(p=>'<article class="card"><span class="badge '+(cls[p.status]||'hidden')+'">'+esc(labels[p.status]||p.status||'غير معروف')+'</span><h3>📍 '+esc(p.name)+'</h3><div class="line">🏷️ '+esc(p.category||'أخرى')+'</div><div class="line">🏙️ '+esc(p.city||'غير محددة')+'</div><div class="line">📌 '+(p.latitude!=null?esc(Number(p.latitude).toFixed(5)+', '+Number(p.longitude).toFixed(5)):'الموقع غير محدد')+'</div><div class="actions">'+(p.status==='published'?'<a class="btn" href="place-details.html?id='+encodeURIComponent(p.id)+'">عرض المكان</a>':'')+'<a class="btn secondary" href="edit-place.html?id='+encodeURIComponent(p.id)+'">✏️ تعديل</a></div></article>').join('')}load();</script><script src="app-ui.js" defer></script>
</body></html>
