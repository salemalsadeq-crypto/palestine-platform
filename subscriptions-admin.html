<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة الاشتراكات | فلسطين بلاتفورم</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><link rel="stylesheet" href="app.css"><style>body{background:#f4f7fa;font-family:Tahoma,Arial;color:#17324d}.wrap{max-width:1050px;margin:auto;padding:20px 14px}.head{background:#173b68;color:#fff;border-radius:20px;padding:20px}.head h1{margin:0 0 7px}.head p{margin:0;color:#dbe8f4;font-size:12px}.order{background:#fff;border:1px solid #dfe7ef;border-radius:16px;padding:16px;margin-top:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.muted{color:#718094;font-size:11px}.name{font-weight:900;font-size:16px}.btn{border:0;border-radius:10px;background:#08745f;color:#fff;padding:10px 14px;font-weight:900;cursor:pointer}.btn:disabled{opacity:.5}@media(max-width:650px){.row{grid-template-columns:1fr}}</style><link rel="stylesheet" href="theme-v61.css">
</head><body><main class="wrap"><div class="head"><h1>👑 إدارة الاشتراكات</h1><p>مراجعة الطلبات المعلقة وتفعيل الاشتراكات بعد التحقق من الدفع.</p></div><div id="list">جاري التحميل...</div></main><script src="platform.js"></script><script>const c=window.ppClient;async function load(){const u=await window.ppRequire();if(!u)return;const {data:p}=await c.from('profiles').select('role,status').eq('id',u.id).maybeSingle();if(!p||p.status!=='active'||!['admin','manager'].includes(p.role)){document.getElementById('list').textContent='لا تملك صلاحية الوصول.';return}const {data,error}=await c.from('subscription_orders').select('id,user_id,plan_id,amount,currency,status,created_at,subscription_plans(name,audience,billing_period)').eq('status','pending').order('created_at',{ascending:false});if(error){document.getElementById('list').textContent=error.message;return}const root=document.getElementById('list');root.innerHTML='';if(!data?.length){root.innerHTML='<div class="order">لا توجد طلبات معلقة حاليًا.</div>';return}data.forEach(o=>{const d=document.createElement('div');d.className='order';d.innerHTML='<div class="row"><div><div class="muted">الخطة</div><div class="name">'+(o.subscription_plans?.name||o.plan_id)+'</div><div class="muted">المبلغ: '+o.amount+' '+o.currency+' • '+new Date(o.created_at).toLocaleString('ar-PS')+'</div></div><div><div class="muted">معرّف المستخدم</div><div style="font-size:11px;word-break:break-all">'+o.user_id+'</div><button class="btn" data-id="'+o.id+'">تفعيل بعد التحقق من الدفع</button></div></div>';root.appendChild(d)});root.querySelectorAll('.btn').forEach(b=>b.onclick=async()=>{if(!confirm('تأكد أنك تحققت من استلام الدفع لهذا الطلب. هل تريد التفعيل؟'))return;b.disabled=true;b.textContent='جاري التفعيل...';const {error}=await c.rpc('admin_activate_subscription',{p_order_id:b.dataset.id,p_payment_method:'manual'});if(error){alert(error.message);b.disabled=false;b.textContent='تفعيل بعد التحقق من الدفع'}else{b.closest('.order').remove()}})}load();</script></body></html>
