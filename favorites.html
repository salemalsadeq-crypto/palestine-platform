<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المفضلة - فلسطين بلاتفورم</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0" crossorigin="anonymous"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma;background:#f5f7fa;color:#172033}header{background:#173b68;color:#fff;padding:14px 20px}.head{max-width:1100px;margin:auto;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.logo{font-size:22px;font-weight:bold}.logo span{color:#b51f2a}nav a{color:#fff;text-decoration:none;margin:3px;padding:8px 10px;background:#234d7e;border-radius:8px;font-size:13px}.wrap{max-width:1100px;margin:28px auto;padding:0 16px}.hero{background:#fff;border-radius:16px;padding:25px;text-align:center;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 3px 14px #0001}.pic,.nop{width:100%;height:190px;object-fit:cover}.nop{display:flex;align-items:center;justify-content:center;background:#e9edf2;font-size:50px}.body{padding:15px}.title{font-size:19px;font-weight:bold;margin-bottom:8px}.meta{color:#667085;margin:7px 0}.price{color:#b51f2a;font-weight:bold;font-size:18px}.actions{display:flex;gap:8px;margin-top:14px}.btn{flex:1;padding:10px;border:0;border-radius:8px;text-decoration:none;text-align:center;cursor:pointer;font-weight:bold}.view{background:#173b68;color:#fff}.remove{background:#b51f2a;color:#fff}.empty,.error{background:#fff;padding:45px;text-align:center;border-radius:14px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style><script src="platform.js"></script><link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="theme-v47.css"><link rel="stylesheet" href="theme-v48.css"></head><body><header><div class="head"><div class="logo">فلسطين <span>بلاتفورم</span></div><nav><a href="index.html">الرئيسية</a><a href="ads.html">الإعلانات</a><a href="my-ads.html">إعلاناتي</a><a href="account.html">حسابي</a></nav></div></header><main class="wrap"><section class="hero"><h1>❤️ المفضلة</h1><p>الإعلانات التي حفظتها</p></section><div id="content">جاري التحميل...</div></main><script>
window.onerror=function(m){var c=document.getElementById('content');if(c)c.innerHTML='<div class="error">❌ خطأ بالكود: '+m+'</div>';return false};
window.addEventListener('unhandledrejection',function(e){var c=document.getElementById('content');if(c)c.innerHTML='<div class="error">❌ خطأ غير متوقع: '+(e.reason&&e.reason.message||e.reason)+'</div>'});
if(typeof supabase==='undefined'){
document.getElementById('content').innerHTML='<div class="error">❌ لم يتم تحميل مكتبة Supabase — تحقق من اتصال الإنترنت</div>';
}else{
const db=window.ppClient;const $=id=>document.getElementById(id);function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
async function load(){
try{
const {data:u,error:ue}=await db.auth.getUser();
if(ue){$('content').innerHTML='<div class="error">❌ خطأ بجلسة الدخول: '+esc(ue.message)+'</div>';return}
if(!u.user){location.href='login.html';return}
const {data,error}=await db.from('favorites').select('id,ad_id,created_at,ads(id,title,category,description,price,city,image_urls,created_at)').eq('user_id',u.user.id).order('created_at',{ascending:false});
if(error){$('content').innerHTML='<div class="error">❌ '+esc(error.message)+'</div>';return}
if(!data?.length){$('content').innerHTML='<div class="empty">❤️ لا توجد إعلانات محفوظة حتى الآن.<br><br><a class="btn view" href="ads.html">تصفح الإعلانات</a></div>';return}
$('content').innerHTML='<div class="grid">'+data.map(f=>{const a=f.ads||{},im=Array.isArray(a.image_urls)&&a.image_urls.length?a.image_urls[0]:'';return `<article class="card">${im?`<img class="pic" src="${esc(im)}" alt="${esc(a.title)}">`:'<div class="nop">📦</div>'}<div class="body"><div class="title">${esc(a.title||'إعلان')}</div><div class="meta">${esc(a.category||'')} ${a.city?' • '+esc(a.city):''}</div><div class="price">${a.price!=null?Number(a.price).toLocaleString('ar-PS')+' شيكل':'السعر عند التواصل'}</div><div class="actions"><a class="btn view" href="ad-details.html?id=${encodeURIComponent(a.id)}">عرض الإعلان</a><button class="btn remove" onclick="removeFav('${f.id}')">حذف</button></div></div></article>`}).join('')+'</div>'
}catch(e){
$('content').innerHTML='<div class="error">❌ حدث خطأ غير متوقع: '+esc(e.message||String(e))+'</div>';
}
}
async function removeFav(id){const {error}=await db.from('favorites').delete().eq('id',id);if(error)alert(error.message);else load()}
window.removeFav=removeFav;
load();
}
</script><script src="app-ui.js" defer></script>
</body></html>
