<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الرسائل - فلسطين بلاتفورم</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma;background:#f5f7fa;color:#172033}header{background:#173b68;color:#fff;padding:14px 20px}.head{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.logo{font-size:22px;font-weight:bold}.logo span{color:#b51f2a}nav a{color:#fff;text-decoration:none;margin:3px;padding:8px 10px;background:#234d7e;border-radius:8px;font-size:13px}.wrap{max-width:1050px;margin:25px auto;padding:0 14px}.box{background:#fff;border-radius:16px;box-shadow:0 3px 14px #0001;overflow:hidden}.layout{display:grid;grid-template-columns:330px 1fr;min-height:650px}.list{border-left:1px solid #eee;background:#fafbfc}.list h2{font-size:19px;margin:0;padding:20px}.totalUnread{float:left;background:#b51f2a;color:#fff;border-radius:20px;padding:3px 8px;font-size:11px}.conv{padding:15px;border-bottom:1px solid #eee;cursor:pointer}.conv:hover,.conv.active{background:#eef3f8}.conv b{display:block;margin-bottom:5px}.conv small{color:#667085}.unread{display:inline-block;background:#b51f2a;color:#fff;border-radius:20px;padding:2px 7px;font-size:11px;float:left}.chat{display:flex;flex-direction:column;min-width:0}.chathead{padding:18px;border-bottom:1px solid #eee}.chathead b{font-size:18px}.chathead small{display:block;color:#667085;margin-top:5px}.msgs{flex:1;padding:20px;overflow:auto;max-height:510px;background:#f8fafc}.msg{max-width:75%;padding:11px 14px;border-radius:14px;margin:8px 0;line-height:1.6;white-space:pre-wrap;word-break:break-word}.mine{margin-right:auto;background:#173b68;color:#fff;border-bottom-left-radius:4px}.theirs{margin-left:auto;background:#fff;border:1px solid #e5e7eb;border-bottom-right-radius:4px}.time{font-size:10px;opacity:.7;margin-top:4px}.send{display:flex;gap:8px;padding:15px;border-top:1px solid #eee}.send textarea{flex:1;resize:none;border:1px solid #d0d5dd;border-radius:10px;padding:11px;font:inherit;min-height:48px}.send button{border:0;border-radius:10px;background:#173b68;color:#fff;padding:0 20px;font-weight:bold;cursor:pointer}.empty{text-align:center;color:#667085;padding:60px 20px}.login{text-align:center;padding:70px 20px}.login a{display:inline-block;margin-top:15px;background:#173b68;color:#fff;padding:11px 18px;border-radius:9px;text-decoration:none}.error{padding:30px;text-align:center;color:#b42318}@media(max-width:750px){.layout{grid-template-columns:1fr}.list{border-left:0;border-bottom:1px solid #eee;max-height:260px;overflow:auto}.chat{min-height:500px}.msgs{max-height:430px}.msg{max-width:88%}}</style></head><body><header><div class="head"><div class="logo">فلسطين <span>بلاتفورم</span></div><nav><a href="index.html">الرئيسية</a><a href="ads.html">الإعلانات</a><a href="favorites.html">❤️ المفضلة</a><a href="notifications.html">🔔 الإشعارات</a><a href="account.html">حسابي</a></nav></div></header><main class="wrap"><div id="app">جاري تحميل الرسائل...</div></main><script>
const SUPABASE_URL='https://sesbumfedusbjevbsyzl.supabase.co',KEY='sb_publishable_0sJrbh73jLip3O5OtJkc_A_9F6OPWqR',db=supabase.createClient(SUPABASE_URL,KEY);const $=id=>document.getElementById(id);let user=null,conversations=[],active=null,channel=null;
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function date(x){try{return new Date(x).toLocaleString('ar-PS',{dateStyle:'short',timeStyle:'short'})}catch(e){return ''}}
async function start(){const u=await db.auth.getUser();user=u.data.user;if(!user){$('app').innerHTML='<div class="box login"><h2>🔐 الرسائل</h2><p>يجب تسجيل الدخول لعرض الرسائل.</p><a href="login.html">تسجيل الدخول</a></div>';return}await loadConversations();await subscribe();}
async function attachUnreadCounts(){
  conversations.forEach(c=>c.unread=0);
  if(!conversations.length)return;
  const ids=conversations.map(c=>c.id);
  const r=await db.from('messages').select('conversation_id',{count:'exact',head:true}).in('conversation_id',ids).neq('sender_id',user.id).eq('is_read',false);
  // Supabase head count is global, so fetch rows to calculate per-conversation counts.
  const q=await db.from('messages').select('conversation_id').in('conversation_id',ids).neq('sender_id',user.id).eq('is_read',false);
  if(!q.error)(q.data||[]).forEach(m=>{const c=conversations.find(x=>x.id===m.conversation_id);if(c)c.unread++;});
}
async function loadConversations(){const r=await db.from('conversations').select('id,ad_id,buyer_id,seller_id,last_message,last_message_at,created_at').or(`buyer_id.eq.${user.id},seller_id.eq.${user.id}`).order('last_message_at',{ascending:false,nullsLast:true});if(r.error){$('app').innerHTML='<div class="box error">❌ '+esc(r.error.message)+'</div>';return}conversations=r.data||[];const adIds=[...new Set(conversations.map(x=>x.ad_id).filter(Boolean))],otherIds=[...new Set(conversations.map(x=>x.buyer_id===user.id?x.seller_id:x.buyer_id))];let ads=[],profiles=[];if(adIds.length){const a=await db.from('ads').select('id,title').in('id',adIds);ads=a.data||[]}if(otherIds.length){const p=await db.from('profiles').select('id,full_name').in('id',otherIds);profiles=p.data||[]}conversations=conversations.map(c=>({...c,ad:ads.find(a=>a.id===c.ad_id),other:profiles.find(p=>p.id===(c.buyer_id===user.id?c.seller_id:c.buyer_id))}));await attachUnreadCounts();render();if(conversations.length&&!active){selectConversation(conversations[0].id)}else if(active){const still=conversations.find(c=>c.id===active.id);if(still)selectConversation(still.id)}}
function render(){if(!conversations.length){$('app').innerHTML='<div class="box empty"><h2>💬 لا توجد محادثات</h2><p>ابدأ محادثة من صفحة أي إعلان.</p></div>';return}$('app').innerHTML='<div class="box layout"><aside class="list"><h2>💬 المحادثات <span id="totalUnread" class="totalUnread" style="display:none">0</span></h2><div id="convList"></div></aside><section class="chat"><div id="chatHead" class="chathead"><b>اختر محادثة</b></div><div id="msgs" class="msgs"><div class="empty">اختر محادثة لعرض الرسائل.</div></div><div class="send"><textarea id="text" placeholder="اكتب رسالتك..."></textarea><button id="sendBtn">إرسال</button></div></section></div>';$('sendBtn').onclick=sendMessage;$('text').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});renderList()}
function renderList(){const total=conversations.reduce((n,c)=>n+(c.unread||0),0);const badge=$('totalUnread');if(badge){badge.textContent=total;badge.style.display=total?'inline-block':'none'}$('convList').innerHTML=conversations.map(c=>`<div class="conv ${active&&active.id===c.id?'active':''}" onclick="selectConversation('${c.id}')"><b>${esc(c.other?.full_name||'مستخدم')}${c.unread?'<span class="unread">'+c.unread+'</span>':''}</b><small>${esc(c.ad?.title||'إعلان')}</small><small>${esc(c.last_message||'لا توجد رسائل')}</small></div>`).join('')}
async function selectConversation(id){active=conversations.find(c=>c.id===id);if(!active)return;renderList();$('chatHead').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div><b>${esc(active.other?.full_name||'مستخدم')}</b><small>📌 ${esc(active.ad?.title||'إعلان')}</small></div><button onclick="deleteConversation()" style="border:0;background:#fff0f0;color:#b42318;border:1px solid #f2c5c5;border-radius:8px;padding:7px 10px;cursor:pointer">🗑️ حذف المحادثة</button></div>`;await loadMessages();await markRead();}
async function loadMessages(){const r=await db.from('messages').select('id,conversation_id,sender_id,body,created_at,is_read').eq('conversation_id',active.id).order('created_at',{ascending:true});if(r.error){$('msgs').innerHTML='<div class="error">❌ '+esc(r.error.message)+'</div>';return}const list=r.data||[];$('msgs').innerHTML=list.length?list.map(m=>`<div class="msg ${m.sender_id===user.id?'mine':'theirs'}">${esc(m.body)}<div class="time">${date(m.created_at)}</div></div>`).join(''):'<div class="empty">لا توجد رسائل بعد. ابدأ المحادثة الآن.</div>';$('msgs').scrollTop=$('msgs').scrollHeight}
async function markRead(){await db.from('messages').update({is_read:true}).eq('conversation_id',active.id).neq('sender_id',user.id).eq('is_read',false);const c=conversations.find(x=>x.id===active.id);if(c)c.unread=0;renderList()}
async function sendMessage(){if(!active)return;const body=$('text').value.trim();if(!body)return;const b=$('sendBtn');b.disabled=true;const r=await db.from('messages').insert({conversation_id:active.id,sender_id:user.id,body,is_read:false});b.disabled=false;if(r.error){alert('تعذر إرسال الرسالة: '+r.error.message);return}$('text').value='';await loadMessages();await loadConversations()}
async function deleteConversation(){
  if(!active)return;
  if(!confirm('هل تريد حذف هذه المحادثة؟ سيتم حذف رسائلها أيضاً إذا سمحت صلاحيات قاعدة البيانات.'))return;
  const id=active.id;
  const r=await db.from('conversations').delete().eq('id',id).or(`buyer_id.eq.${user.id},seller_id.eq.${user.id}`);
  if(r.error){alert('تعذر حذف المحادثة: '+r.error.message);return}
  active=null;
  await loadConversations();
}

async function subscribe(){channel=db.channel('messages-page-'+user.id).on('postgres_changes',{event:'*',schema:'public',table:'messages'},async payload=>{if(active&&payload.new?.conversation_id===active.id)await loadMessages();await loadConversations()}).on('postgres_changes',{event:'*',schema:'public',table:'conversations'},async()=>{await loadConversations()}).subscribe()}
window.selectConversation=selectConversation;start();
</script></body></html>
