<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>الإشعارات | فلسطين بلاتفورم</title>
<style>body{font-family:Arial,sans-serif;background:#f5f7fa;margin:0;color:#173b68}.wrap{max-width:850px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.btn{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;background:#173b68;color:#fff}.card{background:#fff;margin:12px 0;padding:16px;border-radius:14px;box-shadow:0 2px 10px #0001}.unread{border-right:5px solid #b51f2a}.date{font-size:12px;color:#777;margin-top:8px}.empty{text-align:center;background:#fff;padding:40px;border-radius:14px}</style></head>
<body><div class="wrap"><div class="top"><h1>🔔 الإشعارات</h1><button class="btn" id="allRead">تحديد الكل كمقروء</button></div><p id="status">جاري التحميل...</p><div id="list"></div><p><a href="index.html">← الرئيسية</a></p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient('https://sesbumfedusbjevbsyzl.supabase.co','sb_publishable_0sJrbh73jLip3O5OtJkc_A_9F6OPWqR');const $=id=>document.getElementById(id);
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
async function load(){const {data:{user}}=await db.auth.getUser();if(!user){location.href='login.html';return}const {data,error}=await db.from('notifications').select('*').eq('user_id',user.id).order('created_at',{ascending:false});if(error){$('status').textContent='❌ '+error.message;return} $('status').textContent='';if(!data.length){$('list').innerHTML='<div class="empty">لا توجد إشعارات حاليًا 🔔</div>';return} $('list').innerHTML=data.map(n=>`<div class="card ${n.is_read?'':'unread'}"><strong>${esc(n.title)}</strong><div>${esc(n.message||'')}</div><div class="date">${new Date(n.created_at).toLocaleString('ar-PS')}</div>${n.related_ad_id?`<p><a href="ad-details.html?id=${encodeURIComponent(n.related_ad_id)}">عرض الإعلان</a></p>`:''}${!n.is_read?`<button class="btn" onclick="readOne('${n.id}')">تحديد كمقروء</button>`:''}</div>`).join('')}
async function readOne(id){const {data:{user}}=await db.auth.getUser();await db.from('notifications').update({is_read:true}).eq('id',id).eq('user_id',user.id);load()}
$('allRead').onclick=async()=>{const {data:{user}}=await db.auth.getUser();await db.from('notifications').update({is_read:true}).eq('user_id',user.id).eq('is_read',false);load()};load();
</script></body></html>
