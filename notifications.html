<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الإشعارات | فلسطين بلاتفورم</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma;background:#f5f7fa;color:#172033}.wrap{max-width:850px;margin:auto;padding:18px}.top{background:#173b68;color:#fff;border-radius:16px;padding:18px;display:flex;justify-content:space-between;align-items:center;gap:10px}.top h1{margin:0;font-size:24px}.btn{border:0;border-radius:9px;padding:10px 14px;cursor:pointer;font-weight:bold}.readall{background:#b51f2a;color:#fff}.back{display:inline-block;margin:14px 0;color:#173b68;font-weight:bold}.card{background:#fff;margin:10px 0;padding:16px;border-radius:14px;box-shadow:0 2px 12px #0001;border-right:4px solid transparent}.card.unread{border-right-color:#b51f2a;background:#fff}.title{font-size:17px;color:#173b68}.date{font-size:12px;color:#777;margin-top:8px}.adlink{display:inline-block;margin-top:9px;color:#b51f2a;font-weight:bold}.empty{text-align:center;background:#fff;padding:45px;border-radius:14px}.status{text-align:center;color:#777}.mini{font-size:12px;color:#777} </style></head><body><main class="wrap"><div class="top"><h1>🔔 الإشعارات</h1><button id="allRead" class="btn readall">تحديد الكل كمقروء</button></div><a class="back" href="index.html">← العودة للرئيسية</a><p id="status" class="status">جاري التحميل...</p><div id="list"></div></main><script>const db=supabase.createClient('https://sesbumfedusbjevbsyzl.supabase.co','sb_publishable_0sJrbh73jLip3O5OtJkc_A_9F6OPWqR');const $=x=>document.getElementById(x);function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}async function load(){const {data:{user}}=await db.auth.getUser();if(!user){location.href='login.html';return}const {data,error}=await db.from('notifications').select('*').eq('user_id',user.id).order('created_at',{ascending:false});if(error){$('status').textContent='❌ '+error.message;return}$('status').textContent='';if(!data?.length){$('list').innerHTML='<div class="empty">لا توجد إشعارات حاليًا 🔔</div>';return}$('list').innerHTML=data.map(n=>`<article class="card ${n.is_read?'':'unread'}"><div class="title">${esc(n.title)}</div><div>${esc(n.message||'')}</div><div class="date">${new Date(n.created_at).toLocaleString('ar-PS')}</div>${n.related_ad_id?`<a class="adlink" href="ad-details.html?id=${encodeURIComponent(n.related_ad_id)}">عرض الإعلان ←</a>`:''}${!n.is_read?`<div><button class="btn" style="margin-top:10px;background:#173b68;color:#fff" onclick="readOne('${n.id}')">تحديد كمقروء</button></div>`:''}</article>`).join('')}async function readOne(id){const {data:{user}}=await db.auth.getUser();await db.from('notifications').update({is_read:true}).eq('id',id).eq('user_id',user.id);load()}$('allRead').onclick=async()=>{const {data:{user}}=await db.auth.getUser();await db.from('notifications').update({is_read:true}).eq('user_id',user.id).eq('is_read',false);load()};load();</script></body></html>
