<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الإشعارات | فلسطين بلاتفورم</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f3f6fa;color:#172033}
.wrap{max-width:850px;margin:auto;padding:18px}.top{background:linear-gradient(135deg,#173b68,#245789);color:#fff;border-radius:20px;padding:20px;display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:0 8px 25px #173b6830}.heading{display:flex;align-items:center;gap:12px}.bell{width:48px;height:48px;border-radius:50%;background:#ffffff20;display:grid;place-items:center;font-size:25px}.top h1{margin:0;font-size:25px}.count{margin-top:5px;font-size:13px;opacity:.9}.btn{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:bold}.readall{background:#b51f2a;color:#fff}.readall:disabled{opacity:.55;cursor:not-allowed}.back{display:inline-block;margin:16px 2px;color:#173b68;font-weight:bold;text-decoration:none}.toolbar{display:flex;justify-content:space-between;align-items:center;margin:4px 0 12px}.mini{font-size:13px;color:#6d7685}.card{background:#fff;margin:11px 0;padding:17px;border-radius:16px;box-shadow:0 3px 14px #0000000c;border:1px solid #e9edf2;border-right:5px solid #dfe5ec;transition:.15s}.card.unread{border-right-color:#b51f2a;background:#fffdfd}.card:hover{transform:translateY(-1px);box-shadow:0 6px 18px #00000012}.row{display:flex;align-items:flex-start;gap:12px}.icon{width:42px;height:42px;flex:0 0 42px;border-radius:12px;background:#eef3f8;display:grid;place-items:center;font-size:20px}.card.unread .icon{background:#fdebed}.title{font-size:17px;font-weight:bold;color:#173b68;margin-bottom:6px}.message{line-height:1.7;color:#374151}.date{font-size:12px;color:#7b8491;margin-top:9px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.adlink{display:inline-block;background:#173b68;color:#fff;text-decoration:none;border-radius:9px;padding:9px 12px;font-weight:bold;font-size:13px}.mark{background:#eef2f6;color:#173b68}.empty{text-align:center;background:#fff;padding:55px 20px;border-radius:16px;border:1px solid #e9edf2}.empty .big{font-size:45px;margin-bottom:8px}.status{text-align:center;color:#777;padding:12px}.error{color:#b51f2a;background:#fff1f2;border-radius:12px;padding:14px}.newdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#b51f2a;margin-left:6px}.loading{opacity:.6}
@media(max-width:600px){.wrap{padding:12px}.top{padding:16px;border-radius:16px}.top h1{font-size:21px}.bell{width:42px;height:42px}.readall{padding:9px 10px;font-size:12px}.card{padding:14px}.title{font-size:16px}}
</style>
<script src="platform.js"></script><link rel="stylesheet" href="app.css">
</head>
<body>
<main class="wrap">
<section class="top">
  <div class="heading"><div class="bell">🔔</div><div><h1>الإشعارات</h1><div id="count" class="count">جاري التحقق...</div></div></div>
  <button id="allRead" class="btn readall" disabled>تحديد الكل كمقروء</button>
</section>
<a class="back" href="index.html">← العودة للرئيسية</a>
<div class="toolbar"><span id="status" class="mini">جاري تحميل الإشعارات...</span><span class="mini">تتحدث تلقائيًا</span></div>
<div id="list"></div>
</main>
<script>
const db=supabase.createClient('https://sesbumfedusbjevbsyzl.supabase.co','sb_publishable_0sJrbh73jLip3O5OtJkc_A_9F6OPWqR');
const $=x=>document.getElementById(x);
let currentUser=null;
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function iconFor(n){if(n.type==='favorite')return '❤️';if(n.type==='message')return '💬';if(n.type==='report')return '⚠️';return '🔔'}
function dateText(v){try{return new Date(v).toLocaleString('ar-PS',{dateStyle:'medium',timeStyle:'short'})}catch(e){return ''}}
async function load(){
  if(!currentUser){const {data:{user}}=await db.auth.getUser();currentUser=user}
  if(!currentUser){location.href='login.html';return}
  $('status').textContent='جاري التحديث...';$('status').classList.add('loading');
  const {data,error}=await db.from('notifications').select('*').eq('user_id',currentUser.id).order('created_at',{ascending:false});
  $('status').classList.remove('loading');
  if(error){$('status').className='error';$('status').textContent='❌ تعذر تحميل الإشعارات: '+error.message;return}
  const list=data||[], unread=list.filter(n=>!n.is_read).length;
  $('count').innerHTML=unread?`<span class="newdot"></span>${unread} إشعار غير مقروء`:`لا توجد إشعارات غير مقروءة`;
  $('allRead').disabled=unread===0;
  if(!list.length){$('list').innerHTML='<div class="empty"><div class="big">🔔</div><strong>لا توجد إشعارات حاليًا</strong><div class="mini" style="margin-top:8px">ستظهر هنا الإشعارات الجديدة المتعلقة بحسابك وإعلاناتك.</div></div>';return}
  $('list').innerHTML=list.map(n=>`<article class="card ${n.is_read?'':'unread'}">
    <div class="row"><div class="icon">${iconFor(n)}</div><div style="flex:1;min-width:0">
      <div class="title">${esc(n.title)}${n.is_read?'':' <span style="font-size:11px;color:#b51f2a">جديد</span>'}</div>
      <div class="message">${esc(n.message||'')}</div>
      <div class="date">🕒 ${esc(dateText(n.created_at))}</div>
      <div class="actions">
        ${n.related_ad_id?`<a class="adlink" href="ad-details.html?id=${encodeURIComponent(n.related_ad_id)}">عرض الإعلان ←</a>`:''}
        ${!n.is_read?`<button class="btn mark" onclick="readOne('${n.id}')">✓ تحديد كمقروء</button>`:''}
      </div>
    </div></div>
  </article>`).join('');
}
async function readOne(id){
  if(!currentUser)return;
  const {error}=await db.from('notifications').update({is_read:true}).eq('id',id).eq('user_id',currentUser.id);
  if(error){alert('تعذر تحديث الإشعار');return} await load();
}
$('allRead').onclick=async()=>{
  if(!currentUser)return;
  $('allRead').disabled=true;
  const {error}=await db.from('notifications').update({is_read:true}).eq('user_id',currentUser.id).eq('is_read',false);
  if(error){alert('تعذر تحديث الإشعارات');$('allRead').disabled=false;return} await load();
};
(async()=>{await load();setInterval(load,20000)})();
</script>
<script src="app-ui.js" defer></script>
</body>
</html>
