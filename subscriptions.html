<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اشتراكاتي | فلسطين بلاتفورم</title><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="theme-v47.css"><link rel="stylesheet" href="theme-v48.css"><style>
:root{--p:#174f86;--p2:#2b79bd;--g:#0b986d;--bg:#f4f8fc;--line:#e2eaf2;--text:#172033;--muted:#6d7d90;--danger:#c62838}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Tahoma,sans-serif}.wrap{max-width:1050px;margin:auto;padding:0 14px}.top{padding:14px 0}.top a{color:var(--p);text-decoration:none;font-weight:900}.hero{background:linear-gradient(135deg,#123b68,#2878bc);color:#fff;padding:28px 0}.hero h1{margin:0 0 7px;font-size:26px}.hero p{margin:0;color:#dbeaf7}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 8px 28px #123b680b}.active{border-color:#bfe8d9;background:linear-gradient(145deg,#fff,#f1fbf7)}.price{font-size:27px;font-weight:900;color:var(--p);margin:12px 0}.muted{color:var(--muted);font-size:12px;line-height:1.8}.btn{border:0;border-radius:13px;padding:11px 15px;font:inherit;font-weight:900;cursor:pointer;background:var(--p);color:#fff}.btn.green{background:var(--g)}.btn.danger{background:var(--danger)}.btn.soft{background:#edf5fb;color:var(--p)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.badge{display:inline-block;padding:6px 10px;border-radius:10px;background:#e9f8f2;color:#087957;font-weight:900;font-size:11px}.notice{padding:12px;border-radius:13px;margin:14px 0;font-size:13px}.ok{background:#e9f8f2;color:#087957}.err{background:#fff0f1;color:#a51f2b}.center{text-align:center}.history{display:grid;gap:9px}.row{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;justify-content:space-between;gap:10px;align-items:center}@media(max-width:760px){.grid{grid-template-columns:1fr}.row{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="wrap top"><a href="account.html">← حسابي</a></div><section class="hero"><div class="wrap"><h1>💳 إدارة الاشتراكات</h1><p>تابع اشتراكك، التجديد، وطلبات الإلغاء من مكان واحد.</p></div></section><main class="wrap"><div id="notice"></div><section class="card" id="current"><h2>الاشتراك الحالي</h2><div id="currentBody">جاري التحميل...</div></section><h2>الباقات المتاحة</h2><section class="grid" id="plans"></section><section class="card"><h2>سجل الطلبات</h2><div id="history" class="history">جاري التحميل...</div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><script src="platform.js"></script><script>
const db=ppClient,$=id=>document.getElementById(id),esc=ppEsc;let active=null,pendingCancel=false;function note(t,ok=false){$('notice').innerHTML='<div class="notice '+(ok?'ok':'err')+'">'+esc(t)+'</div>';setTimeout(()=>{$('notice').innerHTML=''},4500)}
async function load(){const u=await ppUser();if(!u){location.href='login.html?next='+encodeURIComponent(location.href);return}const a=await db.rpc('get_my_active_subscription');if(a.error){$('currentBody').innerHTML='<div class="err notice">'+esc(a.error.message)+'</div>'}else{active=a.data?.[0]||null;renderCurrent()}const p=await db.from('subscription_plans').select('*').eq('is_active',true).order('price');if(p.error){$('plans').innerHTML='<div class="notice err">'+esc(p.error.message)+'</div>'}else renderPlans(p.data||[]);const h=await db.from('subscription_orders').select('id,plan_id,status,created_at,paid_at,subscription_plans(name,price,billing_period)').eq('user_id',u.id).order('created_at',{ascending:false}).limit(30);if(h.error)$('history').innerHTML='<div class="notice err">'+esc(h.error.message)+'</div>';else renderHistory(h.data||[]);const c=active?await db.from('subscription_cancellation_requests').select('id,status,reason,created_at').eq('subscription_id',active.subscription_id).order('created_at',{ascending:false}).limit(1):null;if(c?.data?.[0]?.status==='pending')pendingCancel=true;renderCurrent()}
function renderCurrent(){if(!active){$('currentBody').innerHTML='<div class="muted">لا يوجد اشتراك فعال حاليًا.</div>';return}$('currentBody').innerHTML='<div><span class="badge">فعال</span><h3>'+esc(active.plan_name||active.plan_id)+'</h3><div class="muted">من '+new Date(active.starts_at).toLocaleDateString('ar-PS')+' إلى '+new Date(active.ends_at).toLocaleDateString('ar-PS')+' · متبقي '+active.days_left+' يوم</div></div><div class="actions"><a class="btn soft" href="profile.html?id='+encodeURIComponent((awaitUserId||''))+'">الملف</a><button class="btn danger" onclick="requestCancel()" '+(pendingCancel?'disabled':'')+'>'+ (pendingCancel?'طلب الإلغاء قيد المراجعة':'طلب إلغاء الاشتراك')+'</button></div>'}
let awaitUserId='';async function requestCancel(){if(!active)return;const reason=prompt('سبب طلب الإلغاء (اختياري):')??'';const r=await db.rpc('request_subscription_cancellation',{p_subscription_id:active.subscription_id,p_reason:reason});if(r.error){note(r.error.message);return}pendingCancel=true;note('تم إرسال طلب الإلغاء إلى الإدارة. لن يتم إلغاء الاشتراك مباشرة.',true);renderCurrent()}
function renderPlans(rows){$('plans').innerHTML=rows.map(p=>'<article class="card"><div class="muted">'+esc(p.audience||'premium')+'</div><h3>'+esc(p.name)+'</h3><div class="price">'+esc(p.price)+' ₪</div><div class="muted">'+(p.billing_period==='yearly'?'سنوي':'شهري')+'</div><button class="btn green" onclick="buy(\''+esc(p.id)+'\')">اختيار الباقة</button></article>').join('')||'<div class="muted">لا توجد باقات متاحة.</div>'}
async function buy(id){const r=await db.rpc('request_subscription',{p_plan_id:id});if(r.error){note(r.error.message);return}note('تم إنشاء طلب الاشتراك. أكمل إجراءات الدفع/التفعيل مع الإدارة.',true);load()}
function renderHistory(rows){$('history').innerHTML=rows.length?rows.map(x=>'<div class="row"><div><b>'+esc(x.subscription_plans?.name||x.plan_id)+'</b><div class="muted">'+new Date(x.created_at).toLocaleString('ar-PS')+'</div></div><span class="badge">'+esc(x.status||'')+'</span></div>').join(''):'<div class="muted">لا يوجد سجل حتى الآن.</div>'}
async function boot(){const u=await ppUser();if(u)awaitUserId=u.id;await load()}boot();
</script></body></html>
